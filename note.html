li><strong>प्रशासनिक सुधार:</strong> <strong>उत्तरमेरुर अभिलेख (919 ई. एवं 921 ई.)</strong> से उसके काल में चोल स्थानीय स्वशासन की महत्वपूर्ण जानकारी प्राप्त होती है।</li>\n<li><strong>सांस्कृतिक योगदान:</strong> ऋग्वेद के प्रसिद्ध टीकाकार <strong>वेंकटमाधव</strong> उसके समकालीन थे। उसने 'हेमगर्भ' एवं 'तुलाभार' नामक यज्ञों का संपादन किया।</li>\n<li><strong>उपाधियाँ:</strong> 'मदुरैकोंड' और 'उत्तम चोल'।</li>\n</ul>\n<h3>अल्पकालिक उत्तराधिकारी</h3>\n<ul>\n<li><strong>गंडरादित्य (955-957 ईस्वी)</strong></li>\n<li><strong>अरिंजय (957 ईस्वी)</strong></li>\n</ul>\n<h2>3. पुनरुत्थान और सुदृढ़ीकरण</h2>\n<h3>परान्तक द्वितीय या सुंदर चोल (957-973 ईस्वी)</h3>\n<ul>\n<li>उसने पाण्ड्य राजा <strong>वीर पाण्ड्य</strong> को युद्ध में परास्त किया।</li>\n<li>उसने श्रीलंका के शासक <strong>महिन्द चतुर्थ</strong> पर आक्रमण किया, जो असफल रहा।</li>\n</ul>\n<h3>उत्तमचोल (973-985 ईस्वी)</h3>\n<ul>\n<li>उसने चोल राजवंश में सर्वप्रथम <strong>सोने के सिक्के</strong> जारी करने का गौरव प्राप्त किया।</li>\n<li>उसने राष्ट्रकूटों के कब्जे से <strong>तोंडमंडलम</strong> को पुनः जीत लिया।</li>\n</ul>\n<h2>4. राजराज प्रथम (985-1014 ईस्वी): चोल शक्ति का चरमोत्कर्ष</h2>\n<p>राजराज प्रथम (वास्तविक नाम: <strong>अरुमोळिवर्मन</strong>) के राज्यारोहण के साथ चोलों के वास्तविक उत्कर्ष का युग प्रारंभ हुआ।</p>\n<h3>सैन्य अभियान और विजय</h3>\n<p>राजराज प्रथम के सैन्य अभियानों का क्रमबद्ध विवरण <strong>तंजौर अभिलेख</strong> में सुरक्षित है:</p>\n<ol>\n<li><strong>पाण्ड्य विजय:</strong> पाण्ड्य शासक अमरभुजंग को पराजित किया।</li>\n<li><strong>चेर विजय:</strong> <strong>कांडलूर (कंडलर)</strong> के नौसैनिक युद्ध में चेर शासक <strong>रविशर्मा</strong> को पराजित किया और 'कांडलूरशालै कलमरुत्त' की उपाधि धारण की।</li>\n<li><strong>श्रीलंका अभियान:</strong> श्रीलंका के शासक <strong>महिन्द पंचम</strong> को पराजित कर श्रीलंका के उत्तरी भाग को चोल प्रांत बनाया, जिसका नाम <strong>'मुम्मिडिचोलमंडलम'</strong> रखा।<ul>\n<li>प्राचीन राजधानी <strong>अनुराधापुर</strong> को नष्ट कर <strong>पोलन्नरुवा</strong> को नई राजधानी बनाया और इसका नाम <strong>'जननाथ मंगलम' (जयनाथ मंडलम)</strong> रखा।</li>\n<li>वहाँ एक भव्य शिव मंदिर का निर्माण करवाया।</li>\n</ul>\n</li>\n<li><strong>मालदीव विजय:</strong> उसने अपनी शक्तिशाली नौसेना की सहायता से मालदीव समूह को जीतकर अपने सैन्य अभियानों का समापन किया।</li>\n</ol>\n<h3>कूटनीति और वैदेशिक संबंध</h3>\n<ul>\n<li><strong>वेंगी के चालुक्य:</strong> उसने वेंगी के चालुक्य राजकुमारों (<strong>शक्तिवर्मन</strong> और <strong>विमलादित्य</strong>) को जटाचोड भीम के विरुद्ध शरण और सैन्य सहायता दी। उसने अपनी पुत्री का विवाह <strong>विमलादित्य</strong> के साथ किया।</li>\n<li><strong>चीन:</strong> राजराज प्रथम ने अपना एक दूत मंडल चीन भेजा।</li>\n<li><strong>श्रीविजय (इंडोनेशिया):</strong> शैलेंद्र शासक <strong>श्रीमारविजयोत्तुंगवर्मन</strong> को नागपट्टिनम में <strong>'चूड़ामणि बौद्ध विहार'</strong> बनाने की अनुमति प्रदान की।</li>\n</ul>\n<h2>5. प्रशासनिक, सामाजिक एवं सांस्कृतिक सुधार</h2>\n<p>राजराज प्रथम ने न केवल युद्ध किए, बल्कि प्रशासन को आधुनिक और पारदर्शी भी बनाया:</p>\n<ul>\n<li><strong>भू-राजस्व:</strong> 1000 ईस्वी में भू-राजस्व के सटीक निर्धारण हेतु संपूर्ण भूमि का व्यापक सर्वेक्षण करवाया।</li>\n<li><strong>सैन्य संगठन:</strong> चोलों में सर्वप्रथम <strong>स्थायी सेना</strong> और <strong>नौसेना</strong> का गठन किया।</li>\n<li><strong>स्थानीय स्वशासन:</strong> ग्राम सभाओं और निगमों में सार्वजनिक धन के दुरुपयोग को रोकने के लिए <strong>खातों की जांच (ऑडिट)</strong> की अनिवार्य व्यवस्था की।</li>\n<li><strong>मुद्रा प्रणाली:</strong> दक्षिण भारत में सर्वप्रथम <strong>खड़ी या आसीन आकृति</strong> वाले सिक्कों का प्रचलन शुरू किया।</li>\n<li><strong>अभिलेखों की शैली:</strong> उसने अभिलेखों को ऐतिहासिक प्राक्कथन (प्रशस्ति) के साथ प्रारंभ करने की नई प्रथा की शुरुआत की।</li>\n<li><strong>स्थापत्य:</strong> तंजौर में विश्व प्रसिद्ध <strong>वृहदेश्वर मंदिर (राजराजेश्वर मंदिर)</strong> का निर्माण करवाया, जो भगवान शिव को समर्पित है।</li>\n<li><strong>धार्मिक कार्य:</strong> यद्यपि वह स्वयं कट्टर <strong>शैव</strong> था, लेकिन अन्य धर्मों के प्रति सहिष्णु था। उसने रानी <strong>लोक महादेवी</strong> के साथ तिरुवल्जीली मंदिर में 'तुलाभार' एवं 'हिरण्यगर्भ' यज्ञ किए।</li>\n</ul>\n<h2>6. तुलनात्मक विश्लेषण (तालिकाएँ)</h2>\n<h3>प्रमुख चोल शासक और उनकी उपाधियाँ</h3>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>शासक</td>\n  <td>उपाधियाँ</td>\n</tr>\n<tr>\n  <td><strong>विजयालय</strong></td>\n  <td>नरकेसरी, तंजैकोंड</td>\n</tr>\n<tr>\n  <td><strong>आदित्य प्रथम</strong></td>\n  <td>तोंडेनाडू, नरकेसरी, कोदंडराम</td>\n</tr>\n<tr>\n  <td><strong>परान्तक प्रथम</strong></td>\n  <td>मदुरैकोंड, उत्तम चोल</td>\n</tr>\n<tr>\n  <td><strong>राजराज प्रथम</strong></td>\n  <td>मुम्मिडिचोल देव, जयगोंड, चोलमार्तण्ड, शिवपादशेखर, कांडलूरशालै कलमरुत्त</td>\n</tr>\n</tbody>\n</table>\n<h3>महत्वपूर्ण युद्ध और उनके परिणाम</h3>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>युद्ध</td>\n  <td>वर्ष</td>\n  <td>विजेता</td>\n  <td>पराजित</td>\n  <td>महत्व/परिणाम</td>\n</tr>\n<tr>\n  <td><strong>वेल्लूर का युद्ध</strong></td>\n  <td>915 ई.</td>\n  <td>परान्तक प्रथम</td>\n  <td>पाण्ड्य और श्रीलंका</td>\n  <td>पाण्ड्य शक्ति का दमन</td>\n</tr>\n<tr>\n  <td><strong>तक्कोलम का युद्ध</strong></td>\n  <td>949 ई.</td>\n  <td>राष्ट्रकूट (कृष्ण III)</td>\n  <td>परान्तक प्रथम</td>\n  <td>चोलों की अस्थायी पराजय</td>\n</tr>\n<tr>\n  <td><strong>कांडलूर का युद्ध</strong></td>\n  <td>-</td>\n  <td>राजराज प्रथम</td>\n  <td>चेर (रविशर्मा)</td>\n  <td>चोल नौसैनिक सर्वोच्चता</td>\n</tr>\n</tbody>\n</table>\n<h3>प्रमुख अभिलेख और विषय-वस्तु</h3>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>अभिलेख</td>\n  <td>संबद्ध शासक</td>\n  <td>मुख्य विषय</td>\n</tr>\n<tr>\n  <td><strong>तिरुकोयिलूर लेख</strong></td>\n  <td>विजयालय</td>\n  <td>तंजौर विजय का उल्लेख</td>\n</tr>\n<tr>\n  <td><strong>उत्तरमेरुर अभिलेख</strong></td>\n  <td>परान्तक प्रथम</td>\n  <td>चोल स्थानीय स्वशासन की विस्तृत जानकारी</td>\n</tr>\n<tr>\n  <td><strong>तंजौर अभिलेख</strong></td>\n  <td>राजराज प्रथम</td>\n  <td>सैन्य अभियानों का क्रमिक विवरण</td>\n</tr>\n<tr>\n  <td><strong>तिरुवलंगाडु ताम्रपत्र</strong></td>\n  <td>राजराज प्रथम</td>\n  <td>चेर, पाण्ड्य और श्रीलंका विजय का वर्णन</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>राजेंद्र प्रथम से अधिराजेंद्र तक चोल साम्राज्य का इतिहास</h2>\n<h3>1. राजेंद्र प्रथम (1014-1044 ईस्वी)</h3>\n<p>राजेंद्र प्रथम चोल वंश के सबसे महान शासकों में से एक थे। उनके शासनकाल को चोल शक्ति के चरमोत्कर्ष के रूप में देखा जाता है।</p>\n<h4><strong>प्रमुख सैन्य उपलब्धियाँ और विजय अभियान</strong></h4>\n<ul>\n<li><strong>दक्षिण का नेपोलियन:</strong> इतिहासकार <strong>स्मिथ</strong> ने राजेंद्र प्रथम को उनकी सैन्य सफलताओं के कारण 'दक्षिण का नेपोलियन' की संज्ञा दी है।</li>\n<li><strong>नौसेना का विकास:</strong> राजेंद्र प्रथम के काल में चोल नौसेना का सर्वाधिक विकास हुआ, जिससे बंगाल की खाड़ी <strong>'चोलों की झील'</strong> में परिवर्तित हो गई।</li>\n<li><strong>संपूर्ण सिंहल (श्रीलंका) विजय:</strong> राजराज प्रथम ने केवल उत्तरी श्रीलंका जीता था, लेकिन राजेंद्र प्रथम ने संपूर्ण श्रीलंका को विजित किया। उन्होंने लंका नरेश <strong>महिन्द पंचम</strong> को पराजित कर बंदी बनाया। हालांकि, बाद में महिन्द पंचम के पुत्र <strong>कस्यप</strong> ने दक्षिणी लंका पर पुनः अधिकार कर <strong>विक्रमबाहु प्रथम</strong> के नाम से शासन किया।<ul>\n<li><em>साक्ष्य:</em> इस विजय का उल्लेख <strong>करंदै ताम्रपत्र</strong> और <strong>महावंश</strong> में मिलता है।</li>\n</ul>\n</li>\n<li><strong>गंगाघाटी/बंगाल अभियान:</strong> उन्होंने बंगाल के पाल शासक <strong>महीपाल प्रथम</strong> को पराजित किया। इस सफल अभियान का नेतृत्व उनके पुत्र <strong>विक्रम चोल</strong> ने किया था।</li>\n<li><strong>अरब सागर पर प्रभुता:</strong> राजेंद्र प्रथम पहले भारतीय चोल शासक थे जिन्होंने अरब सागर पर अपना प्रभुत्व स्थापित किया और <strong>'सदिमन्तीब'</strong> द्वीप पर अधिकार किया।</li>\n</ul>\n<h4><strong>श्रीविजय अभियान (1025 ईस्वी)</strong></h4>\n<ul>\n<li><strong>उद्देश्य:</strong> चीनी व्यापार के मार्ग में आने वाली बाधाओं को दूर करना और भारतीय व्यापारियों के हितों की रक्षा करना।</li>\n<li><strong>संघर्ष:</strong> चोल जहाजी बेड़े ने बंगाल की खाड़ी पार कर श्रीविजय साम्राज्य (जावा, सुमात्रा, मलाया) के शासक <strong>संग्रामकुलोत्तुंगवर्मन</strong> को पराजित किया।</li>\n<li><strong>परिणाम:</strong> कडारम सहित दक्षिण-पूर्व एशिया के <strong>12 द्वीपों</strong> पर चोलों का अधिकार हो गया। इसके बाद चीन के साथ व्यापारिक संबंध सुगम हो गए।</li>\n<li><strong>कूटनीति:</strong> कम्बोडिया (कम्बुज) के <strong>खमेर राजा</strong> ने राजेंद्र प्रथम को उपहार भेजकर मित्रता स्थापित की।</li>\n</ul>\n<h4><strong>सांस्कृतिक और प्रशासनिक कार्य</strong></h4>\n<ul>\n<li><strong>नई राजधानी:</strong> गंगाघाटी विजय की स्मृति में उन्होंने <strong>'गंगैकोंडचोलपुरम'</strong> (वर्तमान त्रिचनापल्ली में) नामक नई राजधानी की स्थापना की।</li>\n<li><strong>सिंचाई कार्य:</strong> नवीन राजधानी के पास <strong>'चोलगंगम'</strong> नामक विशाल तालाब का निर्माण करवाया।</li>\n<li><strong>शिक्षा और धर्म:</strong> उन्होंने एक <strong>वैदिक कॉलेज</strong> की स्थापना की। इसके अतिरिक्त, गंगैकोंडचोलपुरम में एक भव्य मंदिर बनवाया जिसे <strong>वृहदेश्वर मंदिर</strong> के नाम से भी जाना जाता है।</li>\n<li><strong>पाण्ड्य क्षेत्र का प्रशासन:</strong> उन्होंने अपने पुत्र राजाधिराज प्रथम को पाण्ड्य प्रदेश का वायसराय (महामण्डलेश्वर) नियुक्त किया।</li>\n</ul>\n<h4><strong>राजेंद्र प्रथम की प्रमुख उपाधियाँ</strong></h4>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>उपाधि</td>\n  <td>कारण / संदर्भ</td>\n</tr>\n<tr>\n  <td><strong>गंगैकोंडचोल</strong></td>\n  <td>बंगाल (पाल शासक महीपाल) पर विजय के उपलक्ष्य में</td>\n</tr>\n<tr>\n  <td><strong>कडारकौंड</strong></td>\n  <td>श्रीविजय (कडारम) अभियान की सफलता पर</td>\n</tr>\n<tr>\n  <td><strong>कटाहाधिपति</strong></td>\n  <td>दक्षिण-पूर्व एशियाई क्षेत्रों पर आधिपत्य हेतु</td>\n</tr>\n<tr>\n  <td><strong>पंडित चोल</strong></td>\n  <td>वैदिक शिक्षा को प्रोत्साहन और वैदिक कॉलेज की स्थापना हेतु</td>\n</tr>\n</tbody>\n</table>\n<h3>2. राजाधिराज प्रथम (1044-1052 ईस्वी)</h3>\n<p>राजेंद्र प्रथम के उत्तराधिकारी के रूप में उन्होंने चोल साम्राज्य की सीमाओं की रक्षा की।</p>\n<ul>\n<li><strong>त्रिकूट गठबंधन का अंत:</strong> उन्होंने चेर, पाण्ड्य और लंका के संयुक्त गठबंधन को सफलतापूर्वक तोड़ा।</li>\n<li><strong>चालुक्य संघर्ष:</strong> उन्होंने चालुक्य नरेश <strong>सोमेश्वर प्रथम</strong> को <strong>धान्यकटक</strong> और <strong>पुण्डूर</strong> के युद्ध में पराजित किया। उन्होंने चालुक्यों की राजधानी <strong>कल्याणी</strong> पर विजय प्राप्त की और वहीं अपना राज्याभिषेक करवाया।</li>\n<li><strong>धार्मिक कार्य:</strong> उन्होंने <strong>अश्वमेध यज्ञ</strong> संपन्न किया, जिसका उल्लेख <strong>मणिमंगळम लेख</strong> में मिलता है।</li>\n<li><strong>मृत्यु:</strong> 1052 ईस्वी में <strong>कोप्पम के युद्ध</strong> में सोमेश्वर प्रथम के विरुद्ध लड़ते हुए वे वीरगति को प्राप्त हुए।</li>\n<li><strong>उपाधियाँ:</strong><ul>\n<li><strong>अनेमिरुथजिन:</strong> 'हाथी की पीठ पर मृत्यु प्राप्त करने वाला'।</li>\n<li><strong>भूपेंद्र चोल:</strong> उनकी एक अन्य प्रमुख उपाधि।</li>\n<li><strong>चोल पाण्ड्य:</strong> पिता द्वारा पाण्ड्य प्रदेश का वायसराय बनाए जाने पर दी गई उपाधि।</li>\n</ul>\n</li>\n</ul>\n<h3>3. राजेंद्र द्वितीय (1052-1064 ईस्वी)</h3>\n<p>राजाधिराज प्रथम की मृत्यु के बाद उनके भाई राजेंद्र द्वितीय ने कमान संभाली।</p>\n<ul>\n<li><strong>रणक्षेत्र में राज्याभिषेक:</strong> कोप्पम के युद्धक्षेत्र में ही, जहाँ उनके भाई की मृत्यु हुई थी, उन्होंने अपना राज्याभिषेक करवाया।</li>\n<li><strong>चालुक्य विजय:</strong> उन्होंने कल्याणी के चालुक्यों को पराजित किया और अपनी विजय की स्मृति में <strong>कोल्हापुर में विजयस्तंभ</strong> स्थापित किया।</li>\n<li><strong>कुडलसंगम का युद्ध (1062 ईस्वी):</strong> उन्होंने सोमेश्वर प्रथम को पुनः पराजित किया।</li>\n<li><strong>उपाधि:</strong> उन्होंने <strong>'प्रकेसरी'</strong> की उपाधि धारण की।</li>\n</ul>\n<h3>4. वीर राजेंद्र (1064-1070 ईस्वी)</h3>\n<ul>\n<li><strong>तुंगभद्रा विजय:</strong> चालुक्य सोमेश्वर प्रथम पर अपनी विजय की स्मृति में उन्होंने <strong>तुंगभद्रा नदी के तट पर विजय स्तंभ</strong> की स्थापना की।</li>\n<li><strong>द्वितीय कुडल संगम का युद्ध (1068 ईस्वी):</strong> इस युद्ध के लिए सोमेश्वर प्रथम को आमंत्रित किया गया था, लेकिन अस्वस्थता के कारण वह नहीं आ सका। पराजय के अपमान और बीमारी से त्रस्त होकर सोमेश्वर प्रथम ने तुंगभद्रा नदी में डूबकर आत्महत्या कर ली।</li>\n<li><strong>उपाधि:</strong> उन्होंने <strong>'राजकेसरी'</strong> की उपाधि धारण की।</li>\n</ul>\n<h3>5. अधिराजेंद्र (1070 ईस्वी)</h3>\n<ul>\n<li><strong>अंत:</strong> अधिराजेंद्र का शासनकाल अत्यंत संक्षिप्त रहा। 1070 ईस्वी में एक <strong>क्रुद्ध भीड़</strong> द्वारा उनकी हत्या कर दी गई, जिसके साथ ही चोल वंश की मुख्य शाखा का एक चरण समाप्त हुआ।</li>\n</ul>\n<h3>महत्वपूर्ण ऐतिहासिक साक्ष्य एवं अभिलेख (त्वरित संदर्भ)</h3>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>अभिलेख / स्रोत</td>\n  <td>संबंधित तथ्य</td>\n</tr>\n<tr>\n  <td><strong>करंदै ताम्रपत्र</strong></td>\n  <td>राजेंद्र प्रथम की सिंहल (श्रीलंका) विजय का उल्लेख</td>\n</tr>\n<tr>\n  <td><strong>महावंश</strong></td>\n  <td>सिंहल विजय और महिन्द पंचम का विवरण</td>\n</tr>\n<tr>\n  <td><strong>तिरुवालंगाडु लेख</strong></td>\n  <td>राजेंद्र प्रथम की उपलब्धियों का विस्तृत विवरण</td>\n</tr>\n<tr>\n  <td><strong>करंदै (तंजौर) अभिलेख</strong></td>\n  <td>राजेंद्र प्रथम के शासनकाल की जानकारी</td>\n</tr>\n<tr>\n  <td><strong>मणिमंगळम लेख</strong></td>\n  <td>राजाधिराज प्रथम द्वारा अश्वमेध यज्ञ का उल्लेख</td>\n</tr>\n</tbody>\n</table>\n<h3>प्रमुख युद्धों का सारांश</h3>\n<ol>\n<li><strong>कोप्पम का युद्ध (1052 ई.):</strong> राजाधिराज प्रथम बनाम सोमेश्वर प्रथम (राजाधिराज की मृत्यु)।</li>\n<li><strong>कुडलसंगम का युद्ध (1062 ई.):</strong> राजेंद्र द्वितीय द्वारा सोमेश्वर प्रथम की पराजय।</li>\n<li><strong>द्वितीय कुडल संगम का युद्ध (1068 ई.):</strong> वीर राजेंद्र का काल; सोमेश्वर प्रथम की अनुपस्थिति और जल-समाधि।</li>\n</ol>\n<hr />\n<h2>उत्तरकालीन चोल साम्राज्य: शासक, प्रशासन एवं सांस्कृतिक उपलब्धियां</h2>\n<h2>1. कुलोत्तुंग प्रथम (1070-1120 ई.)</h2>\n<p>कुलोत्तुंग प्रथम उत्तरकालीन चोल वंश का एक अत्यंत शक्तिशाली और प्रभावशाली शासक था। वह मूलतः वेंगी के चालुक्य वंश से संबंधित था।</p>\n<h3><strong>उत्पत्ति एवं पारिवारिक पृष्ठभूमि</strong></h3>\n<ul>\n<li><strong>मूल नाम एवं वंश:</strong> कुलोत्तुंग प्रथम का मूल नाम <strong>राजेंद्र द्वितीय</strong> था और वह वेंगी का चालुक्य वंशीय राजकुमार था।</li>\n<li><strong>चोल संबंध:</strong> चोल शासक <strong>राजेंद्र प्रथम</strong> उसके नाना थे। वह कुलोत्तुंग प्रथम के नाम से चोल सिंहासन पर बैठा।</li>\n<li><strong>विवाह:</strong> उसने चोल शासक राजेंद्र द्वितीय की पुत्री <strong>मधुरांतकी</strong> से विवाह किया।</li>\n<li><strong>शासन अवधि:</strong> वह सर्वाधिक समय तक शासन करने वाला चोल शासक माना जाता है।</li>\n</ul>\n<h3><strong>सैन्य अभियान एवं विदेशी संबंध</strong></h3>\n<ul>\n<li><strong>पश्चिमी चालुक्य संघर्ष:</strong> कुलोत्तुंग प्रथम ने पश्चिमी चालुक्य शासक <strong>विक्रमादित्य षष्ठ</strong> के आक्रमण को विफल किया और उसे युद्ध में पराजित किया।</li>\n<li><strong>कडारम (जावा) अभियान:</strong> उसने जावा की राजधानी <strong>कडारम</strong> को नष्ट किया।</li>\n<li><strong>कूटनीतिक संबंध (1090 ई.):</strong> कडारम के नरेश ने 1090 ई. में अपना दूत कुलोत्तुंग के पास भेजा। इसके परिणामस्वरूप, <strong>नागपट्टम</strong> स्थित <strong>चूड़ामणि बौद्ध विहार</strong> को दान में दी गई भूमि को करमुक्त (Tax-free) कर दिया गया।</li>\n<li><strong>श्रीलंका नीति:</strong> श्रीलंका के राजा <strong>विजयबाहु</strong> ने कुलोत्तुंग के समय में अपनी स्वतंत्रता की घोषणा की। सैन्य संघर्ष के बजाय कुलोत्तुंग ने वैवाहिक कूटनीति अपनाई और अपनी पुत्री का विवाह श्रीलंका के राजकुमार <strong>वीरपेरुमाल</strong> से कर दिया।</li>\n<li><strong>कलिंग अभियान:</strong> शासन के अंतिम वर्षों में उसने कलिंग के विरुद्ध दो बार अभियान किया। उसके <strong>द्वितीय कलिंग अभियान</strong> का विवरण <strong>जयंगोंदार</strong> द्वारा रचित महाकाव्य <strong>'कलिंगत्तुपर्णी'</strong> में मिलता है।</li>\n</ul>\n<h2>2. आर्थिक सुधार एवं व्यापारिक नीतियां</h2>\n<p>कुलोत्तुंग प्रथम ने साम्राज्य की आर्थिक स्थिति सुदृढ़ करने के लिए व्यापक सुधार किए।</p>\n<h3><strong>भूमि सर्वेक्षण एवं कर सुधार</strong></h3>\n<ul>\n<li>उसने राजराज प्रथम की पद्धति का अनुसरण करते हुए <strong>भूमि का दो बार पुनः सर्वेक्षण</strong> करवाया।</li>\n<li><strong>तटकर एवं चुंगी उन्मूलन:</strong> व्यापार को बढ़ावा देने के लिए उसने मार्ग में बाधक चुंगियों और तटकरों को समाप्त कर दिया।</li>\n<li><strong>उपाधि:</strong> करों को हटाने के कारण उसे <strong>'शुंगन्तविर्तचोल'</strong> (करों को हटाने वाला) की उपाधि दी गई।</li>\n</ul>\n<h3><strong>अंतर्राष्ट्रीय व्यापार</strong></h3>\n<ul>\n<li><strong>चीन शिष्टमंडल (1077 ई.):</strong> व्यापारिक संबंधों को प्रगाढ़ करने हेतु उसने 1077 ई. में <strong>72 व्यापारियों</strong> का एक प्रतिनिधिमंडल चीन भेजा।</li>\n<li><strong>मलय प्रायद्वीप:</strong> उसके शासनकाल में मलय प्रायद्वीप के साथ चोलों के सुदृढ़ व्यापारिक एवं सांस्कृतिक संबंध स्थापित रहे।</li>\n</ul>\n<h3><strong>मुद्रा एवं उपाधियां</strong></h3>\n<p>कुलोत्तुंग प्रथम के स्वर्ण सिक्कों पर उसकी प्रमुख उपाधियां अंकित हैं:</p>\n<ol>\n<li><strong>कटैकोंडचोलन</strong></li>\n<li><strong>मलैनाडुकोंडचोलन</strong></li>\n</ol>\n<h2>3. धार्मिक नीतियां एवं संघर्ष</h2>\n<h3><strong>वैष्णव धर्म के साथ संघर्ष</strong></h3>\n<ul>\n<li>कुलोत्तुंग प्रथम कट्टर <strong>शैव मतावलम्बी</strong> था।</li>\n<li>उसके धार्मिक उत्पीड़न के कारण प्रसिद्ध वैष्णव सुधारक <strong>रामानुज</strong> को श्रीरंगम छोड़ना पड़ा। उन्होंने मैसूर के होयसल शासक <strong>बिट्टिग विष्णुवर्धन</strong> के यहाँ शरण ली।</li>\n</ul>\n<h3><strong>सांस्कृतिक एवं राजनीतिक समन्वय</strong></h3>\n<ul>\n<li><strong>गहड़वाल संबंध:</strong> कुलोत्तुंग के गहड़वाल शासक <strong>गोविंदचंद्र</strong> के साथ घनिष्ठ राजनीतिक संबंध थे।</li>\n<li><strong>सूर्य पूजा का प्रसार:</strong> गहड़वाल राज्य में सूर्य पूजा का प्रचलन था, जिससे प्रभावित होकर कुलोत्तुंग ने चोल राज्य में भी सूर्य पूजा का व्यापक प्रचार-प्रसार करवाया।</li>\n<li><strong>निर्माण कार्य:</strong> उसने <strong>चिदंबरम मंदिर</strong> और <strong>श्रीरंगम</strong> के मंदिर की संरचनाओं का संवर्द्धन और विस्तार करवाया।</li>\n<li><strong>प्रमुख उपाधि:</strong> उसने <strong>'त्रिभुवनचक्रवर्तिन'</strong> (तीनों लोकों का राजा) की उपाधि धारण की।</li>\n</ul>\n<h2>4. विक्रम चोल (1118-1135 ई.)</h2>\n<p>कुलोत्तुंग प्रथम के पश्चात उसका पुत्र विक्रम चोल शासक बना।</p>\n<ul>\n<li><strong>धार्मिक दान:</strong> उसने <strong>चिदंबरम के नटराज मंदिर</strong> को अत्यधिक दान दिया और उसका जीर्णोद्धार व विस्तार करवाया।</li>\n<li><strong>उपाधियां:</strong> उसने <strong>'त्यागसमुद्र'</strong> एवं <strong>'अकलंक'</strong> की उपाधियां धारण कीं।</li>\n<li><strong>शिक्षा एवं चिकित्सा:</strong> उसने <strong>तिरुवाडुतुरै</strong> में एक <strong>चिकित्सा विद्यालय (चिकित्सालय)</strong> स्थापित किया, जहाँ <strong>चरक संहिता</strong> एवं <strong>अष्टांग हृदय</strong> जैसे प्राचीन आयुर्वेद ग्रंथों का अध्ययन किया जाता था।</li>\n</ul>\n<h2>5. कुलोत्तुंग द्वितीय (1135-1150 ई.) एवं मूर्ति विवाद</h2>\n<p>विक्रम चोल का पुत्र कुलोत्तुंग द्वितीय एक कट्टर शैव शासक था, जिसके समय में धार्मिक असहिष्णुता की घटना घटी।</p>\n<ul>\n<li><strong>गोविंदराज मूर्ति विवाद:</strong> उसने चिदंबरम के नटराज (शिव) मंदिर के प्रांगण में स्थित <strong>गोविंदराज (भगवान विष्णु)</strong> की प्राचीन प्रतिमा को उखाड़कर <strong>समुद्र में फिंकवा दिया</strong>।</li>\n<li><strong>पुनर्स्थापना:</strong> बाद में <strong>रामानुज</strong> ने उस मूर्ति को समुद्र से निकलवा कर <strong>तिरुपति</strong> में स्थापित किया। सदियों बाद, विजयनगर साम्राज्य के शासक <strong>रामराय</strong> ने इस मूर्ति को पुनः इसके मूल स्थान चिदंबरम मंदिर में स्थापित करवाया।</li>\n<li><strong>स्थापत्य:</strong> उसने नटराज मंदिर के निर्माण कार्य को पूर्ण करवाया।</li>\n</ul>\n<h2>6. उत्तरवर्ती चोल शासक (1150-1182 ई.)</h2>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>शासक</td>\n  <td>शासन काल</td>\n  <td>महत्वपूर्ण तथ्य</td>\n</tr>\n<tr>\n  <td><strong>राजराज द्वितीय</strong></td>\n  <td>1150-1173 ई.</td>\n  <td>चोल साहित्य में इन्हें <strong>'मुत्तमिळ कुत्ततुलैयान'</strong> (तमिल संरक्षक) कहा गया है।</td>\n</tr>\n<tr>\n  <td><strong>राजाधिराज द्वितीय</strong></td>\n  <td>1173-1182 ई.</td>\n  <td>राजराज द्वितीय के उत्तराधिकारी।</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>विशेष टिप्पणी:</strong> राजराज द्वितीय और कुलोत्तुंग द्वितीय दोनों की प्रशंसा <strong>'तमिल देव'</strong> के रूप में की जाती है।</li>\n</ul>\n<h2>7. कुलोत्तुंग तृतीय (1182-1216 ई.)</h2>\n<ul>\n<li><strong>मंदिर निर्माण:</strong> उसने <strong>त्रिभुवन</strong> में <strong>कम्पा हरेश्वर मंदिर</strong> का निर्माण करवाया।</li>\n<li><strong>विजय प्रतीक:</strong> मदुरै विजय के उपलक्ष्य में वहाँ एक <strong>विजयस्तंभ</strong> स्थापित किया।</li>\n<li><strong>ऐतिहासिक साक्ष्य:</strong> <strong>तंजौर अभिलेख</strong> से ज्ञात होता है कि उसके शासनकाल के दौरान राज्य में भीषण <strong>अकाल</strong> पड़ा था।</li>\n</ul>\n<h2>8. चोल साम्राज्य का पतन</h2>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>शासक</td>\n  <td>शासन काल</td>\n  <td>मुख्य विशेषता</td>\n</tr>\n<tr>\n  <td><strong>राजराज तृतीय</strong></td>\n  <td>1216-1250 ई.</td>\n  <td>इनके समय का <strong>'तिरुवेन्दीपुरम'</strong> लेख चोल काल का सर्वाधिक महत्वपूर्ण लेख माना जाता है।</td>\n</tr>\n<tr>\n  <td><strong>राजेंद्र तृतीय</strong></td>\n  <td>1250-1279 ई.</td>\n  <td>यह <strong>चोल वंश का अंतिम शासक</strong> था।</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>पतन का कारण:</strong> राजेंद्र तृतीय के शासन के पश्चात चोल शक्ति क्षीण हो गई और वे <strong>पाण्ड्यों</strong> के अधीन हो गए। अंततः चोल राज्य का विभाजन <strong>होयसल</strong> और <strong>पाण्ड्य</strong> राज्यों के मध्य हो गया।</li>\n</ul>\n<h2>9. प्रशासनिक, भौगोलिक एवं विविध तथ्य</h2>\n<ul>\n<li><strong>भौगोलिक सीमा:</strong> चोल राज्य मुख्य रूप से <strong>पेन्नार</strong> और <strong>वेल्लारू</strong> नदियों के मध्य स्थित था।</li>\n<li><strong>अभिलेखीय साक्ष्य:</strong> चोल काल का सबसे विशाल और महत्वपूर्ण दान पत्र राजेंद्र प्रथम का <strong>'करंदै दानपत्र'</strong> है।</li>\n<li><strong>ग्रामीण प्रशासन एवं सिंचाई:</strong> चोल शासन प्रणाली में <strong>कावेरी नदी</strong> पर बाँध बनवाने और नहरों के निर्माण व रखरखाव का उत्तरदायित्व <strong>ग्राम सभा</strong> का होता था।</li>\n<li><strong>कलिंग विजेता चोल शासक:</strong> चोल इतिहास में तीन प्रमुख शासक कलिंग विजय से संबंधित रहे हैं:<ol>\n<li><strong>राजराज प्रथम</strong></li>\n<li><strong>राजेंद्र प्रथम</strong></li>\n<li><strong>कुलोत्तुंग प्रथम</strong></li>\n</ol>\n</li>\n<li><strong>साहित्यिक योगदान:</strong> कुलोत्तुंग प्रथम के काल में <strong>अडियार्कुबल्लार</strong> ने प्रसिद्ध तमिल ग्रंथ <strong>'शिलप्पादिकारम'</strong> पर अपनी महत्वपूर्ण टीका लिखी।</li>\n</ul>\n"}];const id=location.hash.slice(1);const item=NOTES.find(x=>x.id===id);const box=document.getElementById('reader');if(item){box.innerHTML=item.html;document.title=item.title+' — StudyGaurav'}else{box.innerHTML='<h1>Chapter नहीं मिला</h1><p class="muted">History chapters पर वापस जाएँ.</p>'}</script></body></html>
