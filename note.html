<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes — StudyGaurav</title><style>
:root{--bg:#f6f8fc;--surface:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--blue2:#7c3aed;--soft:#eff6ff;--max:1180px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{text-decoration:none;color:inherit}.wrap{width:min(var(--max),calc(100% - 28px));margin:auto}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}
.logo{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 8px 20px #2563eb2e}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:800}.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.hero{padding:52px 0 30px}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--blue);border:1px solid #dbeafe;font-size:12px;font-weight:850}
h1{font-size:clamp(36px,6vw,58px);line-height:1.05;letter-spacing:-2px;margin:16px 0 10px}.sub{color:var(--muted);font-size:17px;max-width:700px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:25px 0 65px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 7px 25px #10182808;transition:.18s transform,.18s box-shadow}.card:hover{transform:translateY(-3px);box-shadow:0 14px 35px #10182812}
.card .ico{font-size:32px}.card h2{margin:12px 0 6px;font-size:22px}.card p{color:var(--muted);font-size:14px;line-height:1.6}.arrow{color:var(--blue);font-weight:850}
.note-list{display:grid;gap:12px;padding:15px 0 60px}.chapter{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.chapter:hover{border-color:#93c5fd;background:#fbfdff}.chapter small{display:block;color:var(--muted);margin-top:3px}
.reader{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,44px);margin:25px 0 65px;box-shadow:0 8px 30px #10182808}.reader h1{font-size:34px}.reader h2{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:7px;margin-top:34px}.reader h3{font-size:19px;margin-top:25px}.reader table{width:100%;border-collapse:collapse;display:block;overflow-x:auto;margin:18px 0}.reader th,.reader td{border:1px solid #dfe3e8;padding:9px 11px;text-align:left;font-size:13px;white-space:nowrap}.reader th{background:#f8fafc}.reader blockquote{border-left:4px solid var(--blue);background:#f8fafc;margin:18px 0;padding:12px 16px;color:#475467}.reader li,.reader p{font-size:15px}.muted{color:var(--muted)}
footer{border-top:1px solid var(--line);background:#fff;padding:28px 0;color:var(--muted);font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.nav{height:60px}.hero{padding:38px 0 20px}.reader{padding:18px}.reader h1{font-size:28px}.reader p,.reader li{font-size:14px}}

<script>const NOTES=[{"id": "0-1", "title": "गुप्त साम्राज्य", "file": "history-gupta.md", "html": "<h1>गुप्त साम्राज्य</h1>\n<ul>\n<li><strong>राजनीतिक एकता का पतन</strong>: मौर्य साम्राज्य के पतन के पश्चात् भारत की राजनीतिक एकता पूर्णतः समाप्त हो गई थी ।</li>\n<li><strong>स्थिरता के प्रयास</strong>: मौर्योत्तर काल में <strong>कुषाण वंश</strong> (उत्तर भारत में) तथा <strong>सातवाहन वंश</strong> (दक्षिण भारत में) ने क्रमशः स्थिरता लाने का प्रयास किया, किन्तु वे अपने-अपने क्षेत्रों तक ही सीमित रहे ।</li>\n<li><strong>गुप्त राजवंश का उदय</strong>: <strong>चौथी शताब्दी के प्रारम्भ में</strong> पूर्वी भारत में एक नए राजवंश का उदय हुआ, जिसे <strong>&quot;गुप्त वंश&quot;</strong> के नाम से जाना जाता है ।</li>\n<li><strong>कुषाणों के सामंत</strong>: ऐतिहासिक साक्ष्यों के अनुसार, गुप्त संभवतः <strong>कुषाणों के सामंत</strong> थे ।</li>\n<li><strong>पेरीक्लीज युग (Pericles age)</strong>: गुप्तकाल को भारतीय इतिहास का <strong>पेरीक्लीज युग</strong> कहा जाता है ।</li>\n<li><strong>स्वर्ण युग का नामकरण</strong>: सर्वप्रथम <strong>के. एम. मुंशी</strong> ने गुप्तकाल को <strong>&quot;स्वर्ण युग&quot;</strong> कहा है ।</li>\n<li><strong>मागध गुप्त</strong>: <strong>पुराणों</strong> में गुप्त वंश के शासकों को <strong>&quot;मागध गुप्त&quot;</strong> कहकर संबोधित किया गया है ।</li>\n<li><strong>साहित्य एवं कला पर विद्वानों के विचार</strong>:<ul>\n<li><strong>मैक्समूलर</strong> ने गुप्तकालीन साहित्य को <strong>&quot;पुनर्जागरण काल&quot;</strong> कहा है ।</li>\n<li><strong>आर. डी. बनर्जी</strong> ने इस काल को <strong>&quot;पुनर्जागरण कला&quot;</strong> की संज्ञा दी है ।</li>\n</ul>\n</li>\n</ul>\n<h2>गुप्तों की उत्पत्ति एवं विभिन्न विद्वानों के मत</h2>\n<p>गुप्तों की वर्णगत उत्पत्ति का प्रश्न इतिहासकारों के बीच अत्यंत विवादास्पद रहा है । इसके संबंध में विभिन्न मत एवं साक्ष्य निम्नलिखित हैं:</p>\n<h3>उत्पत्ति से संबंधित प्रमुख साहित्यिक एवं व्याकरणिक साक्ष्य:</h3>\n<ol>\n<li><strong>कीर्तिकौमुदी नाटक (लेखिका: वज्जिका)</strong>:<ul>\n<li>इस नाटक में लिच्छवियों को <strong>'म्लेच्छ'</strong> तथा चंद्रगुप्त प्रथम को <strong>'कारस्कर'</strong> कहा गया है ।</li>\n<li>इसी ग्रंथ के आधार पर प्रसिद्ध इतिहासकार <strong>के. पी. जायसवाल</strong> ने गुप्तों को <strong>'शूद्र'</strong> माना है ।</li>\n</ul>\n</li>\n<li><strong>चंद्रगोमिन का व्याकरण</strong>:<ul>\n<li>इस व्याकरण ग्रंथ में गुप्तों को <strong>'जाट' (जर्ट)</strong> कहा गया है ।</li>\n<li>इसी के आधार पर <strong>के. पी. जायसवाल</strong> गुप्तों को जाट भी स्वीकार करते हैं 。</li>\n</ul>\n</li>\n</ol>\n<h3>गुप्तों की उत्पत्ति पर विभिन्न विद्वानों के मतों की तुलनात्मक तालिका:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\">क्र. सं.</th>\n  <th style=\"text-align:left\">इतिहासकार / विद्वान</th>\n  <th style=\"text-align:left\">गुप्तों की उत्पत्ति का मत (वर्ण)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">1</td>\n  <td style=\"text-align:left\"><strong>के. पी. जायसवाल</strong></td>\n  <td style=\"text-align:left\"><strong>शूद्र / जाट</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\"><strong>एलन, अल्तेकर, रोमिला थापर, आयंगर, रामशरण शर्मा</strong></td>\n  <td style=\"text-align:left\"><strong>वैश्य</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">3</td>\n  <td style=\"text-align:left\"><strong>हेमचंद्र रायचौधरी, दशरथ शर्मा</strong></td>\n  <td style=\"text-align:left\"><strong>ब्राह्मण</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">4</td>\n  <td style=\"text-align:left\"><strong>रमेशचंद्र मजूमदार, ओझा, चट्टोपाध्याय, वासुदेव उपाध्याय</strong></td>\n  <td style=\"text-align:left\"><strong>क्षत्रिय</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>ब्राह्मण मत का पुख्ता आधार (धारण गोत्र):</h3>\n<ul>\n<li><strong>प्रभावती गुप्ता का पूना ताम्रपत्र</strong>: चंद्रगुप्त द्वितीय की पुत्री <strong>प्रभावती गुप्ता</strong> ने अपने पूना ताम्रपत्र में अपने गोत्र का उल्लेख <strong>'धारण गोत्र'</strong> के रूप में किया है ।</li>\n<li><strong>गोत्र का विश्लेषण</strong>: यह धारण गोत्र प्रभावती गुप्ता के पिता (चंद्रगुप्त द्वितीय) का ही था, क्योंकि उनके पति वाकाटक नरेश <strong>रुद्रसेन द्वितीय</strong> 'विष्णु वृद्ध' गोत्र के ब्राह्मण थे ।</li>\n<li><strong>निष्कर्ष</strong>: इस आधार पर सिद्ध होता है कि गुप्त <strong>धारण गोत्र के ब्राह्मण</strong> थे ।</li>\n</ul>\n<hr />\n"}, {"id": "0-2", "title": "गुप्त वंश के आदिपुरुष (प्रारम्भिक शासक)", "file": "history-gupta.md", "html": "<h1>गुप्त वंश के आदिपुरुष (प्रारम्भिक शासक)</h1>\n<ul>\n<li><strong>श्रीगुप्त</strong>: गुप्तों का आदिपुरुष <strong>श्रीगुप्त</strong> था । उसने <strong>'महाराज'</strong> की उपाधि धारण की थी ।</li>\n<li><strong>घटोत्कच</strong>: श्रीगुप्त का पुत्र <strong>घटोत्कच</strong> था ।</li>\n<li><strong>घटोत्कच के आदिपुरुष होने के साक्ष्य</strong>:<ul>\n<li><strong>ताम्रपत्र साक्ष्य</strong>: प्रभावती गुप्ता के <strong>पूना एवं ऋद्धपुर ताम्रपत्रों</strong> में घटोत्कच को गुप्तों का <strong>&quot;आदिपुरुष&quot;</strong> या <strong>&quot;आदिराज&quot;</strong> कहा गया है ।</li>\n<li><strong>सुपिया का लेख</strong>: स्कन्दगुप्त के <strong>सुपिया (रीवा, मध्य प्रदेश) के लेख</strong> में गुप्त वंश को <strong>&quot;घटोत्कच वंश&quot;</strong> कहा गया है ।</li>\n</ul>\n</li>\n</ul>\n<hr />\n"}, {"id": "0-3", "title": "चन्द्रगुप्त प्रथम (319 ई. - 350 ई.)", "file": "history-gupta.md", "html": "<h1>चन्द्रगुप्त प्रथम (319 ई. - 350 ई.)</h1>\n<ul>\n<li><strong>वास्तविक संस्थापक</strong>: चंद्रगुप्त प्रथम को गुप्त वंश का <strong>वास्तविक संस्थापक</strong> माना जाता है ।</li>\n<li><strong>द्वितीय मगध साम्राज्य का संस्थापक</strong>: प्रसिद्ध इतिहासकार <strong>हेमचंद्र रायचौधरी</strong> ने इसे <strong>&quot;द्वितीय मगध साम्राज्य का संस्थापक&quot;</strong> कहा है ।</li>\n<li><strong>राजधानी</strong>: चंद्रगुप्त प्रथम की राजधानी <strong>पाटलिपुत्र</strong> थी ।</li>\n<li><strong>वैशाली की प्रारम्भिक स्थिति</strong>: यद्यपि साम्राज्य के प्रारम्भिक काल में <strong>वैशाली</strong> चंद्रगुप्त प्रथम के साम्राज्य में सम्मिलित नहीं था ।</li>\n<li><strong>शाही उपाधि</strong>: गुप्त वंशावली में चंद्रगुप्त प्रथम पहला शासक था जिसने <strong>'महाराजाधिराज'</strong> की भव्य उपाधि धारण की (जबकि उनके पूर्वज श्रीगुप्त ने केवल 'महाराज' की उपाधि धारण की थी) ।</li>\n<li><strong>गुप्त संवत् की स्थापना</strong>: चंद्रगुप्त प्रथम ने <strong>319-320 ई.</strong> में एक नए संवत् <strong>&quot;गुप्त संवत्&quot;</strong> का प्रचलन किया ।</li>\n<li><strong>वल्लभी संवत्</strong>: यही तिथि (319-320 ई.) <strong>वल्लभी संवत्</strong> की भी है ।</li>\n<li><strong>अलबरूनी का विवरण</strong>: अलबरूनी के अनुसार, गुप्त संवत् का प्रारम्भ <strong>शक संवत् के 241 वर्ष बाद</strong> (अर्थात् 319 ई. में) हुआ था ।</li>\n<li><strong>कुमारदेवी से विवाह</strong>: चंद्रगुप्त प्रथम ने लिच्छवि राजकुमारी <strong>कुमारदेवी</strong> से विवाह किया ।</li>\n<li><strong>वैशाली की प्राप्ति</strong>: इस वैवाहिक संबंध के परिणामस्वरूप <strong>वैशाली</strong> का संपूर्ण क्षेत्र चंद्रगुप्त प्रथम के अधिकार (साम्राज्य) में आ गया ।</li>\n<li><strong>मुद्राओं की शुरुआत</strong>: गुप्त शासकों में सर्वप्रथम सिक्के (विशेषकर <strong>सोने के सिक्के</strong>) चलाने का श्रेय <strong>चंद्रगुप्त प्रथम</strong> को ही जाता है ।</li>\n<li><strong>विवाह की ऐतिहासिक पुष्टि</strong>: इन सोने के सिक्कों के अग्रभाग व पृष्ठभाग के अंकन से चंद्रगुप्त प्रथम तथा लिच्छवि राजकुमारी कुमारदेवी के विवाह की ऐतिहासिक पुष्टि होती है ।</li>\n<li><strong>सिक्कों के विविध नाम (प्रकार)</strong>: इन सिक्कों को निम्नलिखित श्रेणियों में वर्गीकृत किया गया है :<ol>\n<li><strong>राजा-रानी प्रकार</strong></li>\n<li><strong>लिच्छवि प्रकार</strong></li>\n<li><strong>विवाह प्रकार</strong></li>\n<li><strong>राज दंपति प्रकार</strong></li>\n<li><strong>देवी प्रकार</strong></li>\n</ol>\n</li>\n</ul>\n<hr />\n"}, {"id": "0-4", "title": "समुद्रगुप्त", "file": "history-gupta.md", "html": "<h1>समुद्रगुप्त</h1>\n<hr />\n<ul>\n<li><strong>सर्वाधिक विस्तार</strong>: <strong>समुद्रगुप्त (350-375 ई.)</strong> के शासनकाल में गुप्त साम्राज्य का सर्वाधिक भौगोलिक एवं राजनीतिक विस्तार हुआ।</li>\n<li><strong>भारत का नेपोलियन</strong>: प्रसिद्ध इतिहासकार <strong>विन्सेंट स्मिथ</strong> ने समुद्रगुप्त के अपराजित सैन्य अभियानों और असाधारण नेतृत्व क्षमता के कारण उसे <strong>&quot;भारत का नेपोलियन&quot;</strong> कहकर संबोधित किया है।</li>\n<li><strong>काच के विरुद्ध युद्ध (फ़ादर हेरास का मत)</strong>: <strong>फ़ादर हेरास</strong> ने सर्वप्रथम यह मत प्रतिपादित किया था कि समुद्रगुप्त को सिंहासन प्राप्त करने के लिए अपने सगे भाई <strong>काच</strong> के विरुद्ध उत्तराधिकार का युद्ध लड़ना पड़ा था।</li>\n<li><strong>काच और समुद्रगुप्त की समरूपता</strong>: कुछ आधुनिक विद्वानों का यह भी मानना है कि <strong>'काच'</strong> नामक शासक और कोई नहीं, बल्कि स्वयं <strong>समुद्रगुप्त</strong> ही था (दोनों का समीकरण किया गया है)।</li>\n<li><strong>मुद्रा साक्ष्य (फ्लीट का मत)</strong>: इतिहासकार <strong>फ़्लीट</strong> ने सर्वप्रथम वैज्ञानिक रूप से यह प्रतिपादित किया कि <strong>'काच'</strong> के नाम से अंकित स्वर्ण मुद्राएँ वास्तव में स्वयं <strong>समुद्रगुप्त</strong> की ही मुद्राएँ हैं।</li>\n<li><strong>तुल्यकुलज से संघर्ष</strong>: <strong>प्रयाग प्रशस्ति</strong> के अनुसार, समुद्रगुप्त को सत्ता प्राप्त करने के लिए अपने भाइयों एवं <strong>तुल्यकुलज</strong> (कुल के समान सदस्यों) से उत्तराधिकार का भीषण युद्ध लड़ना पड़ा था।</li>\n<li><strong>चन्द्रगुप्त प्रथम द्वारा स्वेच्छा से राज्य त्याग</strong>: इसके विपरीत, स्कन्दगुप्त कालीन <strong>ऋद्धपुर लेख</strong> में समुद्रगुप्त को <strong>&quot;तत्पादपरिगृहीत&quot;</strong> कहा गया है। इस शब्द का तात्पर्य है कि पिता <strong>चन्द्रगुप्त प्रथम</strong> ने स्वयं अपना राज्य त्याग कर स्वेच्छा से समुद्रगुप्त को अपना उत्तराधिकारी घोषित कर राजा बनाया था।</li>\n</ul>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\">क्र. सं.</th>\n  <th style=\"text-align:left\">उपाधि / विरुद</th>\n  <th style=\"text-align:left\">विवरण एवं ऐतिहासिक स्रोत</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">1</td>\n  <td style=\"text-align:left\"><strong>कविराज</strong></td>\n  <td style=\"text-align:left\">काव्य और संगीत कला में सर्वोत्कृष्ट निपुणता के कारण (<strong>प्रयाग प्रशस्ति</strong> एवं सिक्कों में उल्लेख)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\"><strong>पृथिव्यामप्रतिरथ</strong></td>\n  <td style=\"text-align:left\">संपूर्ण पृथ्वी पर जिसका कोई सानी या मुकाबला करने वाला रथ न हो (<strong>प्रयाग प्रशस्ति</strong>)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">3</td>\n  <td style=\"text-align:left\"><strong>धर्म प्राचीर बन्ध</strong></td>\n  <td style=\"text-align:left\">धर्म की मर्यादाओं की रक्षा करने वाली प्राचीर (सुरक्षा दीवार) को बांधने वाला (<strong>प्रयाग प्रशस्ति</strong>)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">4</td>\n  <td style=\"text-align:left\"><strong>सर्वराजोच्छेत्ता</strong></td>\n  <td style=\"text-align:left\">सभी तत्कालीन राजाओं का समूल नाश/उच्छेदन करने वाला (गुप्त अभिलेखों में प्रयुक्त विशेष विरुद)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">5</td>\n  <td style=\"text-align:left\"><strong>लिच्छवि दौहित्र</strong></td>\n  <td style=\"text-align:left\">लिच्छवि राजकुमारी कुमारदेवी का पुत्र होने के कारण (<strong>प्रयाग प्रशस्ति</strong> में गर्व से उल्लिखित)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">6</td>\n  <td style=\"text-align:left\"><strong>विक्रमांक</strong></td>\n  <td style=\"text-align:left\">समुद्रगुप्त के पराक्रम और अदम्य साहस को प्रदर्शित करने वाली प्रमुख उपाधि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">7</td>\n  <td style=\"text-align:left\"><strong>पराक्रमांक</strong></td>\n  <td style=\"text-align:left\">अपार सैन्य बल और युद्ध कौशल का परिचायक नाम।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">8</td>\n  <td style=\"text-align:left\"><strong>परमभागवत</strong></td>\n  <td style=\"text-align:left\">वैष्णव धर्म के अनुयायी होने के कारण (<strong>गया एवं नालंदा ताम्रपत्र लेख</strong> में प्रयुक्त, हालांकि फ्लीट और डी.सी. सरकार इसे संदिग्ध मानते हैं)।</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p>मध्य प्रदेश के एरण से प्राप्त अभिलेख समुद्रगुप्त के व्यक्तिगत चरित्र, पारिवारिक जीवन और स्थानीय प्रशासन पर अमूल्य प्रकाश डालता है:</p>\n<ul>\n<li><strong>कुबेर और यमराज से तुलना</strong>: एरण अभिलेख में वर्णित है कि समुद्रगुप्त यदि <strong>प्रसन्न (कृपालु) हो तो कुबेर</strong> (धन के देवता) के समान उदार था, किन्तु यदि वह <strong>रुष्ट (क्रोधित) हो जाए तो यमराज</strong> (मृत्यु के देवता) के समान विनाशकारी साबित होता था।</li>\n<li><strong>रानी का नाम</strong>: इस ऐतिहासिक लेख में समुद्रगुप्त की मुख्य रानी (पटरानी) का नाम <strong>'दत्तदेवी'</strong> अंकित है।</li>\n<li><strong>स्वभोग नगर</strong>: एरण क्षेत्र समुद्रगुप्त का <strong>'भोग नगर'</strong> (व्यक्तिगत उपभोग का विशेष प्रशासनिक नगर या स्वभोग नगर) था।</li>\n<li><strong>दानवीरता की पौराणिक तुलना</strong>: समुद्रगुप्त की दानशीलता और उदारता की तुलना इस अभिलेख में पौराणिक काल के परम दानी राजा <strong>पृथु</strong> तथा मर्यादा पुरुषोत्तम <strong>राघव</strong> (श्रीराम) से की गई है।</li>\n</ul>\n<hr />\n<p>समुद्रगुप्त केवल एक कुशल योद्धा ही नहीं, बल्कि विद्या और कला का महान संरक्षक एवं स्वयं एक उच्च कोटि का कलाकार था:</p>\n<ul>\n<li><p><strong>गन्धर्व विद्या में प्रवीणता</strong>: <strong>प्रयाग प्रशस्ति</strong> के अनुसार, संगीत (गन्धर्व विद्या) में अपनी असाधारण प्रवीणता के कारण समुद्रगुप्त ने देवराज इन्द्र के मुख्य संगीत आचार्यों - <strong>कश्यप</strong>, <strong>नारद</strong> और <strong>तुम्बुरु</strong> को भी लज्जित (पराजित) कर दिया था।</p>\n</li>\n<li><p><strong>वीणा वादन का साक्ष्य</strong>: समुद्रगुप्त के संगीत अनुराग का सबसे ठोस साक्ष्य उसके कुछ <strong>स्वर्ण सिक्कों</strong> से मिलता है, जिन पर उसे स्वयं <strong>वीणा बजाते हुए (वीणा वादन मुद्रा में)</strong> चित्रित किया गया है।</p>\n</li>\n<li><p><strong>काव्य ग्रन्थ की रचना</strong>: समुद्रगुप्त स्वयं एक उत्कृष्ट कवि और लेखक था। उसने प्रसिद्ध काव्य ग्रन्थ <strong>'कृष्णचरित्र'</strong> (कृष्णचरित) की रचना की थी।</p>\n</li>\n<li><p><strong>'चन्द्रप्रकाश' नाम का रहस्य</strong>: आचार्य <strong>वामन</strong> के प्रसिद्ध काव्यशास्त्र ग्रन्थ <strong>'काव्यालंकारसूत्र'</strong> (काव्यालंकारसूत्रवृत्ति) में समुद्रगुप्त का एक अन्य नाम <strong>'चन्द्रप्रकाश'</strong> भी प्राप्त होता है।</p>\n</li>\n<li><p><strong>श्रीलंका (सिंहल) के साथ मैत्री संबंध</strong>: चीनी ऐतिहासिक स्रोतों से ज्ञात होता है कि श्रीलंका के बौद्ध शासक <strong>मेघवर्मन</strong> ने समुद्रगुप्त के पास बहुमूल्य उपहारों के साथ अपना एक दूत मंडल भेजा था।</p>\n</li>\n<li><p><strong>बोधगया में बौद्ध विहार का निर्माण</strong>: इस दूत मंडल को भेजने का मुख्य उद्देश्य श्रीलंका के बौद्ध भिक्षुओं की सुविधा के लिए <strong>&quot;गया&quot; (बोधगया)</strong> में एक भव्य <strong>बौद्ध मंदिर/विहार</strong> के निर्माण की अनुमति प्राप्त करना था, जिसे समुद्रगुप्त ने सहर्ष स्वीकार कर अनुमति प्रदान की।</p>\n</li>\n<li><p><strong>परमभागवत उपाधि</strong>: समुद्रगुप्त के <strong>गया</strong> और <strong>नालंदा</strong> से प्राप्त <strong>ताम्रपत्र अभिलेखों</strong> में उसे परम वैष्णव या <strong>'परम + भागवत' (परमभागवत)</strong> के रूप में वर्णित किया गया है।</p>\n</li>\n<li><p><strong>ताम्रपत्रों की प्रामाणिकता पर प्रश्न</strong>: महान इतिहासकार <strong>फ़्लीट</strong> एवं <strong>डी. सी. सरकार</strong> ने गहराई से विश्लेषण करने के पश्चात् गया और नालंदा के इन दोनों ताम्रपत्र लेखों को पूर्णतः <strong>प्रामाणिक स्वीकार नहीं किया है</strong> (इन्हें बाद के काल का जाली या जाली ताम्रपत्र माना है)।</p>\n</li>\n</ul>\n<hr />\n<p><strong>राजदरबार के बौद्ध विद्वान एवं प्रशासनिक अधिकारी</strong>\nसमुद्रगुप्त का राजदरबार तत्कालीन भारत के महानतम विद्वानों और दार्शनिकों से सुशोभित था:</p>\n<ul>\n<li><strong>बौद्ध दार्शनिक वसुबन्धु और असंग</strong>: समुद्रगुप्त के दरबार में दो महान बौद्ध आचार्य एवं विद्वान <strong>वसुबन्धु</strong> तथा उनके भाई <strong>असंग</strong> को संरक्षण प्राप्त था।</li>\n<li><strong>प्रसिद्ध दार्शनिक रचनाएँ</strong>:<ul>\n<li><strong>वसुबन्धु</strong> ने बौद्ध धर्म के सुप्रसिद्ध ग्रन्थ <strong>'अभिधर्मकोश'</strong> की रचना की थी।</li>\n<li><strong>असंग</strong> ने बौद्ध दर्शन की विज्ञानवाद/योगाचार शाखा के महत्वपूर्ण ग्रन्थ <strong>'योगाचार'</strong> की रचना की थी।</li>\n</ul>\n</li>\n<li><strong>ध्रुवभूति (खाद्यटपाकिक)</strong>: समुद्रगुप्त के राजदरबार का एक महत्वपूर्ण अधिकारी <strong>ध्रुवभूति</strong> था, जो <strong>'खाद्यटपाकिक'</strong> (अर्थात् शाही/राजकीय भोजनालय का मुख्य अध्यक्ष या रसोईघर प्रमुख) के सम्मानित पद पर कार्यरत था।</li>\n</ul>\n<hr />\n<h2>सैन्य विजय, मुद्राएँ एवं वैदेशिक संबंध</h2>\n<ul>\n<li><strong>सौ युद्धों का विजेता</strong>: समुद्रगुप्त की <strong>गरुड़ अंकित स्वर्ण मुद्राओं</strong> पर उसे <strong>&quot;सौ युद्धों का विजेता&quot;</strong> घोषित किया गया है, जो उसकी अपराजित सैन्य यात्रा को दर्शाता है।\n<strong>ऐतिहासिक स्रोत एवं दिग्विजय का उद्देश्य</strong></li>\n<li><strong>ऐतिहासिक स्रोत</strong>: समुद्रगुप्त की सभी प्रमुख विजयों का विस्तृत एवं प्रामाणिक विवरण उसके दरबारी कवि <strong>हरिषेण</strong> द्वारा रचित <strong>प्रयाग प्रशस्ति</strong> से प्राप्त होता है।</li>\n<li><strong>दिग्विजय का चरम उद्देश्य</strong>: प्रयाग प्रशस्ति के अनुसार, समुद्रगुप्त की दिग्विजयों का मुख्य उद्देश्य <strong>'धरणिबंध'</strong> (संपूर्ण पृथ्वी को एक सूत्र में बांधना या संपूर्ण पृथ्वी पर आधिपत्य स्थापित करना) था।</li>\n</ul>\n<hr />\n<h3>1. आर्यावर्त का प्रथम युद्ध (First Aryavarta War)</h3>\n<p>उत्तर भारत के प्रथम सैन्य अभियान के दौरान समुद्रगुप्त ने तीव्र प्रहार करके विरोधी शक्तियों का उन्मूलन किया:</p>\n<ul>\n<li><strong>उन्मूलन (समूल विनाश)</strong>: समुद्रगुप्त ने आर्यावर्त के इस प्रथम युद्ध में तीन प्रमुख राजाओं को समूल नष्ट (उन्मूलन) कर दिया:<ol>\n<li><strong>अच्युत</strong></li>\n<li><strong>नागसेन</strong></li>\n<li><strong>गणपतिनाग</strong></li>\n</ol>\n</li>\n<li><strong>कोतकुलज नरेश की पराजय</strong>: इसके साथ ही उसने <strong>कोतकुल</strong> में उत्पन्न हुए राजा (<strong>कोतकुलज</strong>) को बंदी बना लिया।</li>\n<li><strong>पुष्प नगर में आमोद-प्रमोद</strong>: इस सैन्य विजय के पश्चात् उसने <strong>पुष्प नामक नगर</strong> (पुष्पपुर/पाटलिपुत्र) में क्रीड़ा और आमोद-प्रमोद किया।</li>\n<li><strong>अभिलेखीय साक्ष्य</strong>: इन विजयों एवं घटनाओं का उल्लेख प्रयाग प्रशस्ति की <strong>13वीं एवं 14वीं पंक्ति</strong> में मिलता है (जो प्रशस्ति का <strong>7वां श्लोक</strong> है)।</li>\n<li><strong>मूल संस्कृत उद्धरण</strong>: इस विजय के विषय में प्रशस्ति में कहा गया है—<blockquote>\n<p><em>&quot;उन्मूल्याच्युतनागसेन.........गा........दण्डग्राह्स्तैवल कोतकुलजं पुष्पाह्वये क्रीडिता।&quot;</em></p>\n</blockquote>\n</li>\n<li><strong>सामरिक महत्व</strong>: प्रयाग प्रशस्ति का <strong>7वां श्लोक</strong> विशेष रूप से समुद्रगुप्त की सैन्य विजयों तथा नाग राजवंशों के विरुद्ध लड़े गए युद्धों के सजीव चित्रण के लिए महत्वपूर्ण है।</li>\n</ul>\n<h3>2. दक्षिणापथ का युद्ध (Southern Expedition)</h3>\n<p>दक्षिण भारत की विजय यात्रा के दौरान समुद्रगुप्त ने अत्यंत व्यावहारिक और कूटनीतिक नीति का पालन किया:</p>\n<ul>\n<li><strong>12 राजाओं की पराजय</strong>: समुद्रगुप्त ने दक्षिणापथ के अभियान में कुल <strong>12 राजाओं</strong> एवं उनके राज्यों को पराजित किया।</li>\n<li><strong>अभिलेखीय साक्ष्य</strong>: इन 12 राज्यों और उनके तत्कालीन शासकों का नामशः उल्लेख प्रयाग प्रशस्ति की <strong>19वीं व 20वीं पंक्ति</strong> में अंकित है।</li>\n</ul>\n<h4>दक्षिणापथ के 12 राज्यों एवं उनके राजाओं की तुलनात्मक तालिका:</h4>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\">क्र. सं.</th>\n  <th style=\"text-align:left\">पराजित राज्य</th>\n  <th style=\"text-align:left\">तत्कालीन शासक/राजा का नाम</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">1</td>\n  <td style=\"text-align:left\"><strong>कोसल</strong></td>\n  <td style=\"text-align:left\"><strong>महेन्द्र</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\"><strong>महाकांतार</strong></td>\n  <td style=\"text-align:left\"><strong>व्याघ्रराज</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">3</td>\n  <td style=\"text-align:left\"><strong>कौराल</strong></td>\n  <td style=\"text-align:left\"><strong>मंतराज</strong> (मण्टराज)</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">4</td>\n  <td style=\"text-align:left\"><strong>पिष्टपुर</strong></td>\n  <td style=\"text-align:left\"><strong>महेन्द्रगिरि</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">5</td>\n  <td style=\"text-align:left\"><strong>कोट्टूर</strong></td>\n  <td style=\"text-align:left\"><strong>स्वामिदत्त</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">6</td>\n  <td style=\"text-align:left\"><strong>ऐरण्डपल्ल</strong></td>\n  <td style=\"text-align:left\"><strong>दमन</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">7</td>\n  <td style=\"text-align:left\"><strong>कांची</strong></td>\n  <td style=\"text-align:left\"><strong>विष्णुगोप</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">8</td>\n  <td style=\"text-align:left\"><strong>अवमुक्त</strong></td>\n  <td style=\"text-align:left\"><strong>नीलराज</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">9</td>\n  <td style=\"text-align:left\"><strong>वेंगी</strong></td>\n  <td style=\"text-align:left\"><strong>हस्तिवर्मा</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">10</td>\n  <td style=\"text-align:left\"><strong>पालक्क</strong></td>\n  <td style=\"text-align:left\"><strong>उग्रसेन</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">11</td>\n  <td style=\"text-align:left\"><strong>देवराष्ट्र</strong></td>\n  <td style=\"text-align:left\"><strong>कुबेर</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">12</td>\n  <td style=\"text-align:left\"><strong>कुस्थलपुर</strong></td>\n  <td style=\"text-align:left\"><strong>धनंजय</strong></td>\n</tr>\n</tbody>\n</table>\n<h4>दक्षिणापथ नीति: 'ग्रहण मोक्षानुग्रह' (Grahanamokshanugraha)</h4>\n<p>दक्षिणी राज्यों के भौगोलिक अलगाव को समझते हुए समुद्रगुप्त ने वहाँ प्रत्यक्ष शासन स्थापित न करके करद राज्य बनाने की श्रेष्ठ नीति अपनाई:</p>\n<ol>\n<li><strong>ग्रहण</strong>: शत्रु पर विजय प्राप्त करना (उस पर अधिकार करना)।</li>\n<li><strong>मोक्ष</strong>: पराजित राजा को मुक्त (बंधनमुक्त) करना।</li>\n<li><strong>अनुग्रह</strong>: पराजित राजा का राज्य दयापूर्वक उसे वापस लौटा देना।</li>\n</ol>\n<ul>\n<li><strong>नीति का परिणाम</strong>: उसने दक्षिणी शासकों को जीतकर पुनः उनका राज्य लौटा दिया तथा बदले में उनसे वार्षिक कर, उपहार एवं निष्ठा की भेंट प्राप्त की।</li>\n<li><strong>अंतिम सीमा</strong>: कांची का पल्लव शासक <strong>विष्णुगोप</strong> समुद्रगुप्त के इस दक्षिणी अभियान का <strong>दक्षिणतम एवं अंतिम शासक</strong> था।</li>\n<li><strong>'धर्म विजय' का नामकरण</strong>:<ul>\n<li>महाकवि <strong>कालिदास</strong> ने अपने सुप्रसिद्ध नाटक <strong>'रघुवंश'</strong> में इस प्रकार की विजय (जीतकर राज्य लौटाने) को <strong>&quot;धर्म विजय&quot;</strong> कहा है।</li>\n<li>सुप्रसिद्ध इतिहासकार <strong>हेमचंद्र रायचौधरी</strong> ने भी समुद्रगुप्त की इस दक्षिणापथ विजय को <strong>&quot;धर्म विजय&quot;</strong> की संज्ञा दी है।</li>\n</ul>\n</li>\n</ul>\n<h3>3. आर्यावर्त का द्वितीय युद्ध (Second Aryavarta War)</h3>\n<p>उत्तर भारत में पूर्ण एकाधिकार स्थापित करने के उद्देश्य से समुद्रगुप्त ने दूसरा आक्रामक अभियान चलाया:</p>\n<ul>\n<li><strong>9 राजाओं का दमन</strong>: समुद्रगुप्त ने आर्यावर्त के इस दूसरे युद्ध में उत्तर भारत के कुल <strong>9 राजाओं</strong> को पराजित किया।</li>\n<li><strong>अभिलेखीय साक्ष्य</strong>: इन नौ राजाओं के स्पष्ट नाम प्रयाग प्रशस्ति की <strong>21वीं पंक्ति</strong> में प्रयुक्त हुए हैं।</li>\n<li><strong>पराजित राजाओं की सूची</strong>:<ol>\n<li><strong>रुद्रदेव</strong></li>\n<li><strong>मतिल</strong></li>\n<li><strong>नागदत्त</strong></li>\n<li><strong>चंद्रवर्मा</strong></li>\n<li><strong>गणपतिनाग</strong></li>\n<li><strong>नागसेन</strong></li>\n<li><strong>अच्युत</strong></li>\n<li><strong>नन्दि</strong></li>\n<li><strong>बलवर्मा</strong></li>\n</ol>\n</li>\n<li><strong>आर्यावर्त नीति: 'प्रसभोद्धरण' (Prasabhoddharana)</strong>:<ul>\n<li>आर्यावर्त के राजाओं के प्रति समुद्रगुप्त ने <strong>'प्रसभोद्धरण'</strong> की नीति अपनाई।</li>\n<li>इस नीति का अर्थ है— <strong>&quot;जड़-मूल से उखाड़ फेंकना&quot;</strong> (अर्थात साम्राज्य का पूर्ण विनाश कर उसे गुप्त साम्राज्य में सीधे मिला लेना)।</li>\n</ul>\n</li>\n<li><strong>ऐरण की अंतिम विजय</strong>: आर्यावर्त के इस द्वितीय सफल अभियान के पश्चात् उसने मध्य प्रदेश स्थित <strong>ऐरण</strong> क्षेत्र की विजय की, जो उसके उत्तर भारतीय अभियानों की <strong>अंतिम विजय</strong> थी।</li>\n</ul>\n<h3>4. आटविक राज्यों की विजय (Conquest of Forest States)</h3>\n<ul>\n<li><strong>अभिलेखीय साक्ष्य</strong>: प्रयाग प्रशस्ति की <strong>21वीं पंक्ति</strong> में आटविक (जंगली/वन्य) राज्यों पर विजय का विवरण है।</li>\n<li><strong>संख्या एवं विस्तार</strong>: ये आटविक राज्य उत्तर प्रदेश के <strong>गाजीपुर से लेकर मध्य प्रदेश के जबलपुर</strong> तक विस्तृत घने जंगलों में स्थित कुल <strong>18 राज्य</strong> थे।</li>\n<li><strong>अपनाई गई नीति: 'परिचारकीकृत'</strong>:<ul>\n<li>समुद्रगुप्त ने इन वन्य राजाओं के प्रति <strong>'परिचारकीकृत नीति'</strong> का पालन किया।</li>\n<li>इस नीति का अर्थ है— <strong>&quot;दास बनाने की नीति&quot;</strong> (अर्थात उन्हें सेवक बनाकर गुप्त साम्राज्य की सेवा में लगाना)।</li>\n</ul>\n</li>\n</ul>\n<h3>5. सीमावर्ती (प्रत्यन्त) राज्यों एवं गणराज्यों की विजय</h3>\n<ul>\n<li><strong>अभिलेखीय साक्ष्य</strong>: प्रयाग प्रशस्ति की <strong>22वीं पंक्ति</strong> में सम्राट समुद्रगुप्त की उत्तर-पश्चिम एवं उत्तर-पूर्व सीमाओं पर स्थित राज्यों तथा गणराज्यों की अधीनता स्वीकार करने का वर्णन है।</li>\n<li><strong>अधीनता की तीन प्रमुख विधियाँ</strong>:\nइन सीमावर्ती शक्तियों ने निम्नलिखित तीन समर्पणकारी नीतियों को अपनाकर गुप्त सम्राट की अधीनता स्वीकार की:<ol>\n<li><strong>सर्वकरदान</strong>: सभी प्रकार के कर सम्राट को अर्पित करना।</li>\n<li><strong>आज्ञाकरण</strong>: सम्राट के प्रत्येक आदेश का बिना संकोच पालन करना।</li>\n<li><strong>प्रणामागमन</strong>: गुप्त दरबार में स्वयं उपस्थित होकर सम्राट को नतमस्तक होकर प्रणाम करना।</li>\n</ol>\n</li>\n</ul>\n<h3>6. प्रत्यन्त (सीमावर्ती) राजतंत्रात्मक राज्य (5 राज्य):</h3>\n<p>ये समुद्रगुप्त की उत्तरी और पूर्वी सीमा पर स्थित पाँच प्रमुख राजतंत्रात्मक राज्य थे जिन्होंने आत्मसमर्पण किया:</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\">क्र. सं.</th>\n  <th style=\"text-align:left\">राज्य का नाम</th>\n  <th style=\"text-align:left\">वर्तमान भौगोलिक पहचान/स्थिति</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\">1</td>\n  <td style=\"text-align:left\"><strong>समतट</strong></td>\n  <td style=\"text-align:left\">पूर्वी बंगाल (बांग्लादेश) का समुद्रतटीय प्रदेश</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">2</td>\n  <td style=\"text-align:left\"><strong>डवाक</strong></td>\n  <td style=\"text-align:left\">असम में स्थित 'डबोक' नामक स्थान अथवा ढाका व चटगाँव का क्षेत्र</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">3</td>\n  <td style=\"text-align:left\"><strong>कामरूप</strong></td>\n  <td style=\"text-align:left\">वर्तमान असम का क्षेत्र</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">4</td>\n  <td style=\"text-align:left\"><strong>कर्तृपुर</strong></td>\n  <td style=\"text-align:left\">कुमाऊँ, गढ़वाल और रुहेलखंड का संयुक्त पर्वतीय क्षेत्र</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\">5</td>\n  <td style=\"text-align:left\"><strong>नेपाल</strong></td>\n  <td style=\"text-align:left\">आधुनिक नेपाल देश का भू-भाग</td>\n</tr>\n</tbody>\n</table>\n<h3>7. पश्चिमी एवं उत्तर-पश्चिमी सीमा के गणराज्य (9 गणराज्य):</h3>\n<p>समुद्रगुप्त की साम्राज्यवादी नीतियों के भय से पश्चिमी और उत्तर-पश्चिमी सीमा पर स्थित कुल <strong>9 गणराज्यों</strong> ने स्वेच्छा से आत्मसमर्पण किया और सीमावर्ती राज्यों की भांति ही <strong>सर्वकरदान-आज्ञाकरण-प्रणामागमन</strong> की नीति का अनुसरण किया:</p>\n<ol>\n<li><strong>मालव</strong></li>\n<li><strong>अर्जुन्यायन</strong></li>\n<li><strong>यौधेय</strong></li>\n<li><strong>मद्रक</strong></li>\n<li><strong>आभीर</strong></li>\n<li><strong>प्रार्जुन</strong></li>\n<li><strong>सनकानीक</strong></li>\n<li><strong>काक</strong></li>\n<li><strong>खरपरिक</strong></li>\n</ol>\n<h3>8. विदेशी शक्तियों पर विजय एवं वैदेशिक नीतियां</h3>\n<p>समुद्रगुप्त की बढ़ती सैन्य प्रतिष्ठा को देखकर भारत की बाह्य सीमा एवं विदेशों में शासन करने वाली शक्तियों ने भी उससे संधि कर ली।</p>\n<ul>\n<li><strong>समकालीन विदेशी शासक</strong>:<ul>\n<li><strong>केदार कुषाण</strong> (पेशावर का कुषाण शासक)</li>\n<li><strong>रुद्रसिंह तृतीय</strong> (शक शासक)</li>\n<li><strong>मुरुण्ड</strong> (पूर्वी भारत/सीमांत क्षेत्र का विदेशी शासक)</li>\n</ul>\n</li>\n<li><strong>विदेशी शक्तियों की अधीनता की तीन विधियाँ</strong>:\nप्रयाग प्रशस्ति की <strong>23वीं व 24वीं पंक्ति</strong> के अनुसार, इन बाह्य एवं विदेशी शक्तियों ने स्वयं की रक्षा हेतु निम्नलिखित तीन संधिकर्ता नीतियों के द्वारा समुद्रगुप्त की प्रभुसत्ता स्वीकार की:<ol>\n<li><strong>आत्मनिवेदन</strong>: स्वयं गुप्त दरबार में उपस्थित होकर राजा के सम्मुख समर्पण करना।</li>\n<li><strong>कन्योपायन</strong>: अपनी पुत्रियों का गुप्त राजघराने के राजकुमारों के साथ विवाह करना।</li>\n<li><strong>गरुत्मदंक स्वविषयभुक्तिशासनयाचना</strong>: अपने-अपने प्रशासनिक क्षेत्रों (विषय/जिले या भुक्ति/प्रांत) में निर्बाध शासन संचालित करने के लिए गुप्त राजवंश के राजचिह्न <strong>'गरुड़'</strong> से अंकित राजकीय पट्ट/शासनादेश (सनद) प्राप्त करने की याचना करना।</li>\n</ol>\n</li>\n</ul>\n<h2>समुद्रगुप्त: अश्वमेध यज्ञ, स्वर्ण मुद्राएँ एवं प्रयाग प्रशस्ति</h2>\n<h3>1. समुद्रगुप्त का अश्वमेध यज्ञ (Ashvamedha Yajna)</h3>\n<p>समुद्रगुप्त ने अपने महान विजय अभियानों और दिग्विजय के उपरांत अपनी संप्रभुता को स्थापित करने हेतु अश्वमेध यज्ञ का भव्य आयोजन किया।</p>\n<ul>\n<li><strong>अश्वमेध यज्ञ का अवसर</strong>: समुद्रगुप्त ने अपनी <strong>विजयों के उपलक्ष्य में</strong> अश्वमेध यज्ञ का संपादन किया ।</li>\n<li><strong>प्रयाग प्रशस्ति में उल्लेख न होने का कारण</strong>: यह यज्ञ <strong>प्रयाग प्रशस्ति लिखे जाने के बाद</strong> आयोजित किया गया था, यही कारण है कि हरिषेण द्वारा रचित प्रयाग प्रशस्ति में इस यज्ञ का <strong>कोई उल्लेख नहीं मिलता है</strong> ।</li>\n<li><strong>जानकारी के ऐतिहासिक स्रोत</strong>: समुद्रगुप्त द्वारा किए गए अश्वमेध यज्ञ की प्रामाणिक जानकारी मुख्य रूप से दो स्रोतों से प्राप्त होती है:<ol>\n<li>उसकी <strong>अश्वमेध प्रकार की स्वर्ण मुद्राएँ</strong> ।</li>\n<li><strong>स्कन्दगुप्त का भीभीतर (Bhitori) स्तंभ लेख</strong> ।</li>\n</ol>\n</li>\n<li><strong>अश्वमेध करने वाले गुप्त शासक</strong>: गुप्त राजवंश के इतिहास में केवल दो ही शासकों द्वारा अश्वमेध यज्ञ किए जाने के प्रामाणिक साक्ष्य मिलते हैं:<ul>\n<li><strong>समुद्रगुप्त</strong></li>\n<li><strong>कुमारगुप्त प्रथम</strong></li>\n</ul>\n</li>\n<li><strong>पूना ताम्रपत्र का साक्ष्य</strong>: चंद्रगुप्त द्वितीय की पुत्री प्रभावती गुप्ता के <strong>पूना ताम्रपत्र</strong> में समुद्रगुप्त को <strong>&quot;चिरकाल से छोड़े गए अश्वमेध यज्ञ को करने वाला&quot;</strong> (चिरकालोत्सन्नाश्वमेधाहर्ता) कहकर संबोधित किया गया है ।</li>\n</ul>\n<h3>2. समुद्रगुप्त की स्वर्ण मुद्राएँ (Six Types of Gold Coins)</h3>\n<p>स्रोत के अनुसार, समुद्रगुप्त के शासनकाल की कुल <strong>छह प्रकार की स्वर्ण मुद्राएँ</strong> (सिक्के) प्राप्त होती हैं, जिनका विवरण निम्नलिखित है :</p>\n<h4>स्वर्ण मुद्राओं का तुलनात्मक एवं विस्तृत विवरण:</h4>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">मुद्रा (सिक्के) का प्रकार</th>\n  <th style=\"text-align:left\">मुख्य भाग (Obverse) का अंकन व उपाधि</th>\n  <th style=\"text-align:left\">पृष्ठ भाग (Reverse) का अंकन व उपाधि</th>\n  <th style=\"text-align:left\">विशेष ऐतिहासिक तथ्य</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>गरुड़ / ध्वज / पताका / दंडधारी प्रकार</strong></td>\n  <td style=\"text-align:left\">राजा की आकृति एवं राजचिह्न गरुड़ अंकित है।</td>\n  <td style=\"text-align:left\">-</td>\n  <td style=\"text-align:left\">समुद्रगुप्त के प्रारंभिक सैन्य अभियानों और विजयों का परिचायक है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>धनुर्धारी प्रकार</strong></td>\n  <td style=\"text-align:left\">इसके मुख्य भाग पर <strong>&quot;अप्रतिरथ&quot;</strong> उपाधि अंकित है ।</td>\n  <td style=\"text-align:left\">-</td>\n  <td style=\"text-align:left\">धनुष-बाण धारण किए हुए राजा का सजीव चित्रण।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>परशु प्रकार</strong></td>\n  <td style=\"text-align:left\">युद्ध-परशु धारण किए राजा की आकृति।</td>\n  <td style=\"text-align:left\">इसके पृष्ठ भाग पर समुद्रगुप्त की <strong>&quot;कृतांत परशु&quot;</strong> (यमराज के परशु के समान) नामक उपाधि अंकित है ।</td>\n  <td style=\"text-align:left\">यह सिक्का समुद्रगुप्त की संहारक युद्ध क्षमता को दर्शाता है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>अश्वमेध प्रकार</strong></td>\n  <td style=\"text-align:left\">यूप (यज्ञ स्तंभ) से बंधे हुए अश्व (घोड़े) का अंकन है।</td>\n  <td style=\"text-align:left\">इसके पृष्ठ भाग पर राजमहिषी <strong>दत्तदेवी</strong> की आकृति के साथ <strong>&quot;अश्वमेध पराक्रमः&quot;</strong> अंकित है ।</td>\n  <td style=\"text-align:left\"><strong>विशेष तथ्य</strong>: इस अश्वमेध मुद्रा के मुख्य भाग पर <strong>समुद्रगुप्त का अंकन नहीं है</strong> ।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>व्याघ्रहनन प्रकार</strong></td>\n  <td style=\"text-align:left\">इसके मुख्य भाग पर <strong>&quot;व्याघ्र पराक्रमः&quot;</strong> की उपाधि अंकित है ।</td>\n  <td style=\"text-align:left\">इसके पृष्ठ भाग पर मकरवाहिनी देवी <strong>गंगा</strong> की आकृति के साथ <strong>&quot;राजा समुद्रगुप्त&quot;</strong> अंकित है ।</td>\n  <td style=\"text-align:left\"><strong>विदेशी प्रभाव से सर्वथा मुक्त</strong> (पूर्णतः स्वदेशी शैली) ।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>वीणावादन प्रकार</strong></td>\n  <td style=\"text-align:left\">राजा को वीणा बजाते हुए (वीणा वादन करते हुए) आसन पर बैठे चित्रित किया गया है।</td>\n  <td style=\"text-align:left\">इसके पृष्ठ भाग पर हाथ में <strong>कॉर्नुकोपिया</strong> (Cornucopia/समृद्धि का शृंग) तथा <strong>पाश</strong> लिए देवी <strong>लक्ष्मी</strong> का सुंदर अंकन है ।</td>\n  <td style=\"text-align:left\"><strong>विदेशी प्रभाव से सर्वथा मुक्त</strong> (पूर्णतः स्वदेशी शैली) ।</td>\n</tr>\n</tbody>\n</table>\n<p><strong>मुद्राओं से संबंधित विशेष निष्कर्ष:</strong></p>\n<ul>\n<li><strong>विदेशी प्रभाव का अभाव</strong>: समुद्रगुप्त की <strong>व्याघ्रहनन प्रकार</strong> एवं <strong>वीणावादन प्रकार</strong> की मुद्राओं पर किसी भी प्रकार का <strong>विदेशी प्रभाव नहीं दिखाई देता है</strong> (ये विशुद्ध भारतीय कला शैली का प्रतिनिधित्व करती हैं) ।</li>\n</ul>\n<hr />\n<h3>3. प्रयाग प्रशस्ति: इलाहाबाद स्तंभ लेख (Prayag Prashasti)</h3>\n<p>प्रयाग प्रशस्ति गुप्त साम्राज्य के इतिहास, विशेषकर समुद्रगुप्त के जीवन और उसकी दिग्विजयों को जानने का सबसे प्रामाणिक पाषाण दस्तावेज है।</p>\n<h4>1. सामान्य परिचय एवं अवस्थिति:</h4>\n<ul>\n<li><strong>रचनाकार (लेखक)</strong>: प्रयाग प्रशस्ति के मूल रचनाकार समुद्रगुप्त के दरबारी कवि व सचिव <strong>हरिषेण</strong> थे ।</li>\n<li><strong>उत्कीर्णकर्ता</strong>: इस प्रशस्ति को पाषाण स्तंभ पर उत्कीर्ण करने (खोदने) का कार्य <strong>तिलभट्ट</strong> ने किया था ।</li>\n<li><strong>मूल अवस्थिति</strong>: प्रयाग प्रशस्ति मूल रूप से मौर्य सम्राट <strong>अशोक के कौशाम्बी अभिलेख</strong> पर ही उत्कीर्ण की गई है ।</li>\n<li><strong>बौद्ध संघ विभेद का आदेश</strong>: इस स्तंभ पर अशोक का वह मूल आदेश भी अंकित है जिसमें बौद्ध संघ में विभेद (फूट) को रोकने के लिए <strong>कौशाम्बी के महामात्रों</strong> को कड़ा आदेश दिया गया है ।</li>\n<li><strong>मध्यकाल में स्थानांतरण</strong>: मध्यकाल में मुगल सम्राट <strong>अकबर</strong> ने इस स्तंभ को कौशाम्बी से मंगवाकर <strong>इलाहाबाद (प्रयाग) के किले</strong> में सुरक्षित स्थापित करवा दिया था ।</li>\n<li><strong>खोज/प्रकाश में लाने का श्रेय</strong>: इस महत्वपूर्ण ऐतिहासिक प्रशस्ति को सर्वप्रथम प्रकाश में लाने का श्रेय <strong>ए. ट्रायर (A. Troyer)</strong> को जाता ।</li>\n</ul>\n<h4>2. साहित्यिक, व्याकरणिक एवं संरचनात्मक विशेषताएँ:</h4>\n<ul>\n<li><strong>भाषा</strong>: यह प्रशस्ति <strong>विशुद्ध संस्कृत</strong> भाषा में रचित है ।</li>\n<li><strong>लिपि</strong>: इसमें प्रयुक्त लिपि <strong>ब्राह्मी लिपि</strong> है ।</li>\n<li><strong>शैली</strong>: यह <strong>गद्य एवं पद्य दोनों</strong> विधाओं में लिखी गई है, जिसे संस्कृत साहित्य में <strong>&quot;चम्पू शैली&quot;</strong> कहा जाता है ।</li>\n<li><strong>कुल पंक्तियाँ</strong>: इस अभिलेख में कुल <strong>33 पंक्तियाँ</strong> उत्कीर्ण हैं ।</li>\n<li><strong>तिथि का अभाव</strong>: प्रयाग प्रशस्ति एक <strong>बिना तिथि का लेख</strong> है (अर्थात इस पर कोई तिथि अंकित नहीं है) ।</li>\n<li><strong>अश्वमेध का उल्लेख न होना</strong>: इसमें समुद्रगुप्त के <strong>अश्वमेध यज्ञ का कोई विवरण प्राप्त नहीं होता है</strong> ।</li>\n</ul>\n<h4>3. आधुनिक विद्वानों के ऐतिहासिक मत:</h4>\n<ul>\n<li><strong>स्वयं की आत्मकथा</strong>: अनेक विद्वान इसे पाषाण खंड पर खुदी हुई स्वयं <strong>समुद्रगुप्त की आत्मकथा</strong> के रूप में स्वीकार करते हैं ।</li>\n<li><strong>मरणोत्तर अभिलेख का मत</strong>: प्रसिद्ध इतिहासकार <strong>फ्लीट</strong> ने वैज्ञानिक विश्लेषण के आधार पर इसे समुद्रगुप्त का <strong>&quot;मरणोत्तर अभिलेख&quot;</strong> (मृत्यु के बाद उत्कीर्ण लेख) माना है ।</li>\n<li><strong>ऐतिहासिक पुनरांकन का मत</strong>: सुप्रसिद्ध आधुनिक इतिहासकार <strong>रोमिला थापर</strong> ने इस प्रशस्ति को <strong>&quot;ऐतिहासिक पुनरांकन&quot;</strong> की संज्ञा दी है ।</li>\n</ul>\n<h4>4. प्रयाग प्रशस्ति में वर्णित समुद्रगुप्त के व्यक्तित्व के विशेष पहलू:</h4>\n<ul>\n<li><strong>धार्मिक उपाधि</strong>: इस प्रशस्ति में समुद्रगुप्त को <strong>&quot;धर्मप्रचारबन्धु&quot;</strong> (धर्म का प्रचार करने वाला मित्र/रक्षक) की उपाधि से विभूषित किया गया है ।</li>\n<li><strong>दैवीय स्वरूप</strong>: प्रयाग प्रशस्ति में समुद्रगुप्त को साधारण मानव न मानकर <strong>&quot;पृथ्वी पर निवास करने वाला देवता&quot;</strong> (लोकाधाम देव) कहा गया है ।</li>\n<li><strong>कुमारदेवी का सर्वप्रथम उल्लेख</strong>: गुप्त अभिलेखों में लिच्छवि राजकुमारी और चंद्रगुप्त प्रथम की पत्नी <strong>कुमारदेवी का सर्वप्रथम उल्लेख</strong> इसी प्रयाग प्रशस्ति में ही प्राप्त होता है ।</li>\n</ul>\n<h4>5. स्तंभ पर अंकित उत्तरकालीन ऐतिहासिक लेख:</h4>\n<p>इस ऐतिहासिक स्तंभ पर समुद्रगुप्त के अतिरिक्त बाद के काल के महत्वपूर्ण शासकों के भी लेख उत्कीर्ण हैं:</p>\n<ol>\n<li><strong>बीरबल का लेख</strong>: अकबर के नवरत्नों में से एक दरबारी <strong>बीरबल</strong> का संक्षिप्त लेख इस पर अंकित है ।</li>\n<li><strong>जहांगीर का लेख</strong>: मुगल सम्राट <strong>जहांगीर</strong> का एक विस्तृत लेख भी इस स्तंभ पर उत्कीर्ण है ।<ul>\n<li><strong>जहांगीर के लेख के लेखक</strong>: जहांगीर के इस लेख को सुप्रसिद्ध मुगल कैलीग्राफर (लेखक) <strong>अब्दुल्ला मुश्किन कलम</strong> ने अत्यंत सुंदर ढंग से लिखा था ।</li>\n</ul>\n</li>\n</ol>\n"}, {"id": "0-5", "title": "चन्द्रगुप्त द्वितीय विक्रमादित्य (375-415 ई.)", "file": "history-gupta.md", "html": "<h1>चन्द्रगुप्त द्वितीय विक्रमादित्य (375-415 ई.)</h1>\n<p><strong>ऐतिहासिक पृष्ठभूमि एवं रामगुप्त का प्रसंग</strong>\nसमुद्रगुप्त की मृत्यु के पश्चात् तथा चन्द्रगुप्त द्वितीय के सिंहासनारोहण के बीच की अवधि में रामगुप्त नामक एक निर्बल शासक का ऐतिहासिक प्रसंग आता है।</p>\n<h4>रामगुप्त की ऐतिहासिकता:</h4>\n<ul>\n<li><strong>वंशावली में अनुपस्थिति</strong>: गुप्त अभिलेखों की आधिकारिक वंशावली में <strong>रामगुप्त</strong> का उल्लेख नहीं मिलता है।</li>\n<li><strong>राखालदास बनर्जी का प्रयास</strong>: सर्वप्रथम <strong>1923 ई.</strong> में <strong>राखालदास बनर्जी</strong> ने रामगुप्त की ऐतिहासिकता को सिद्ध करने का महत्वपूर्ण प्रयास किया था।</li>\n<li><strong>साहित्यिक साक्ष्य</strong>:<ul>\n<li><strong>देवीचन्द्रगुप्तम् (विशाखदत्त)</strong>: विशाखदत्त द्वारा रचित नाटक <strong>'देवीचन्द्रगुप्तम्'</strong> में रामगुप्त की पूरी कथा का सविस्तार वर्णन है। यद्यपि यह नाटक मूल रूप में उपलब्ध नहीं है, परन्तु महाराज <strong>भोज</strong> कृत <strong>'शृंगार प्रकाश'</strong> से इसके कुछ उद्धरण प्राप्त होते हैं।</li>\n<li><strong>अन्य साहित्यिक स्रोत</strong>: रामगुप्त का उल्लेख निम्नलिखित ग्रंथों और टीकाओं में भी मिलता है:<ul>\n<li><strong>बाणभट्ट</strong> कृत <strong>'हर्षचरित'</strong>।</li>\n<li><strong>भोज</strong> की <strong>'शृंगार प्रकाश'</strong>।</li>\n<li><strong>शंकराचार्य</strong> द्वारा रचित <strong>'हर्षचरित की टीका'</strong>।</li>\n<li><strong>राजशेखर</strong> की <strong>'काव्यमीमांसा'</strong>।</li>\n<li>अरबी लेखक <strong>अबुल हसन अली</strong> कृत <strong>'मुजमल-उत-तवारीख'</strong> (Mujmal-ut-Tawarikh)।</li>\n</ul>\n</li>\n<li><strong>ऐतिहासिक घटनाक्रम</strong>: इन स्रोतों के अनुसार, <strong>चन्द्रगुप्त द्वितीय</strong> ने अपने निर्बल भाई <strong>रामगुप्त</strong> को सिंहासन से हटाकर सत्ता पर अधिकार किया और रामगुप्त की विधवा पत्नी <strong>ध्रुवदेवी</strong> (या <strong>ध्रुवस्वामिनी</strong>) से विवाह किया।</li>\n</ul>\n</li>\n<li><strong>अभिलेखीय एवं पुरातात्विक साक्ष्य</strong>:<ul>\n<li><strong>राष्ट्रकूट अभिलेख</strong>: राष्ट्रकूट वंश के <strong>'काम्बे'</strong> एवं <strong>'संजन'</strong> अभिलेखों में रामगुप्त की ऐतिहासिकता के अकाट्य अभिलेखीय साक्ष्य प्राप्त होते हैं।</li>\n<li><strong>जैन मूर्तियां (दुर्जनपुर)</strong>: मध्य प्रदेश के <strong>दुर्जनपुर (बेसनगर)</strong> से तीन जैन मूर्तियां प्राप्त हुई हैं, जिन पर उत्कीर्ण लेखों में रामगुप्त को स्पष्ट रूप से <strong>&quot;महाराजाधिराज&quot;</strong> कहकर संबोधित किया गया है।</li>\n</ul>\n</li>\n</ul>\n<h4>तीरभुक्ति (वैशाली) का प्रशासनिक संदर्भ</h4>\n<ul>\n<li><strong>गोविंदगुप्त का संदर्भ</strong>: चन्द्रगुप्त द्वितीय के शासनकाल के दौरान <strong>तीरभुक्ति (बसाढ़-वैशाली)</strong> का गवर्नर (प्रांतीय शासक) <strong>गोविंदगुप्त</strong> था।</li>\n<li><strong>पारिवारिक संबंध</strong>: गोविंदगुप्त सम्राट चन्द्रगुप्त द्वितीय का पुत्र और भावी सम्राट <strong>कुमारगुप्त प्रथम</strong> का सगा भाई था।</li>\n</ul>\n<h2>चन्द्रगुप्त द्वितीय के अन्य नाम, उपाधियाँ एवं विरुद</h2>\n<p>अभिलेखों और मुद्राओं में चन्द्रगुप्त द्वितीय के बहुमुखी व्यक्तित्व और धार्मिक झुकाव को प्रदर्शित करने वाले अनेक नामों और भव्य उपाधियों का उल्लेख है।</p>\n<h3>चन्द्रगुप्त द्वितीय के अन्य नाम:</h3>\n<ol>\n<li><strong>देवश्री</strong></li>\n<li><strong>देवगुप्त</strong></li>\n<li><strong>देवराज</strong></li>\n</ol>\n<h3>धारण की गई भव्य उपाधियाँ (Titles):</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">उपाधि / विरुद</th>\n  <th style=\"text-align:left\">ऐतिहासिक महत्व एवं संदर्भ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>विक्रमांक</strong></td>\n  <td style=\"text-align:left\">सम्राट के अदम्य साहस और पराक्रम का सूचक।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>विक्रमादित्य</strong></td>\n  <td style=\"text-align:left\">शकों पर महान विजय के उपरांत धारण की गई सबसे प्रसिद्ध उपाधि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>नरेंद्रचंद्र</strong></td>\n  <td style=\"text-align:left\">राजाओं में चंद्रमा के समान प्रकाशमान शासक।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>श्रीविक्रम</strong></td>\n  <td style=\"text-align:left\">लक्ष्मी और पराक्रम का संयुक्त स्वरूप।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>सिंह विक्रम</strong></td>\n  <td style=\"text-align:left\">सिंह के समान पराक्रमी और साहसी।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>अजित विक्रम</strong></td>\n  <td style=\"text-align:left\">वह वीर जिसके पराक्रम को कभी पराजित न किया जा सके।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>7</strong></td>\n  <td style=\"text-align:left\"><strong>परमभागवत</strong></td>\n  <td style=\"text-align:left\">वैष्णव धर्म के प्रति अटूट निष्ठा का सूचक। <strong>गढ़वा अभिलेख</strong> में उन्हें इस उपाधि से विभूषित किया गया है। वह इस उपाधि को धारण करने वाले <strong>प्रथम गुप्त सम्राट</strong> थे।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>8</strong></td>\n  <td style=\"text-align:left\"><strong>राजाधिराजर्षि</strong></td>\n  <td style=\"text-align:left\"><strong>उदयगिरि गुहालेख</strong> में चन्द्रगुप्त द्वितीय को इस विशिष्ट सम्मान से अलंकृत किया गया है।</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>तत्परिगृहीत</strong>: सरकारी लेखों में चन्द्रगुप्त द्वितीय को <strong>&quot;तत्परिगृहीत&quot;</strong> कहा गया है, जिसका अर्थ है कि वे स्वयं पिता <strong>समुद्रगुप्त द्वारा चुने गए</strong> उत्तराधिकारी थे।</li>\n</ul>\n<h3>'परमभागवत' उपाधि धारण करने वाले अन्य गुप्त शासक:</h3>\n<p>वैष्णव धर्म की इस परम उपाधि को धारण करने वाले अन्य गुप्त सम्राट निम्नलिखित थे:</p>\n<ul>\n<li><strong>चन्द्रगुप्त द्वितीय</strong></li>\n<li><strong>कुमारगुप्त प्रथम</strong></li>\n<li><strong>स्कन्दगुप्त</strong></li>\n<li><strong>नरसिंहगुप्त बालादित्य</strong></li>\n</ul>\n<h2>शकों पर विजय (The Saka Conquest) और साम्राज्यिक प्रभाव</h2>\n<p>चन्द्रगुप्त द्वितीय की सैन्य सफलताओं में शकों पर विजय सबसे गौरवशाली अध्याय है, जिसने गुप्त साम्राज्य को पश्चिम भारत में अभूतपूर्व विस्तार दिया।</p>\n<ul>\n<li><strong>रुद्रसिंह तृतीय की पराजय</strong>: चन्द्रगुप्त द्वितीय ने पश्चिमी भारत के अंतिम शक शासक <strong>रुद्रसिंह तृतीय</strong> को युद्ध में करारी शिकस्त देकर पश्चिमी भारत से शकों का समूल <strong>उन्मूलन</strong> कर दिया।</li>\n<li><strong>'शकारि' विरुद</strong>: भारतीय अनुश्रुतियों में शकों के विनाशक के रूप में चन्द्रगुप्त द्वितीय को <strong>&quot;शकारि&quot;</strong> (शकों का शत्रु) भी कहा गया है।</li>\n<li><strong>चांदी के विशेष सिक्कों का प्रचलन</strong>: शक विजय की ऐतिहासिक स्मृति में सम्राट ने विशेष रूप से <strong>चांदी के व्याघ्र (सिंह निहंता) शैली के सिक्के</strong> जारी किए तथा औपचारिक रूप से <strong>'विक्रमादित्य'</strong> की उपाधि धारण की।<ul>\n<li><strong>सिक्कों का भार</strong>: इन विशिष्ट चांदी के सिक्कों का वजन <strong>32 से 36 ग्रेन</strong> के बीच है।</li>\n</ul>\n</li>\n<li><strong>व्यापारिक एवं आर्थिक लाभ</strong>:<ul>\n<li>शक विजय के फलस्वरूप <strong>गुजरात</strong> और <strong>काठियावाड़</strong> का संपूर्ण उपजाऊ क्षेत्र गुप्त साम्राज्य का अभिन्न अंग बन गया।</li>\n<li>इस विस्तार से प्रसिद्ध पश्चिमी बंदरगाह <strong>भड़ौच (Broach)</strong> पर गुप्तों का पूर्ण नियंत्रण स्थापित हो गया।</li>\n<li>इसके परिणामस्वरूप गुप्त साम्राज्य को <strong>अरब सागर</strong> और <strong>भूमध्य सागर</strong> के माध्यम से होने वाले अंतर्राष्ट्रीय व्यापारिक मार्गों में सीधा प्रवेश मिल गया।</li>\n</ul>\n</li>\n<li><strong>उज्जैन का उत्कर्ष</strong>:<ul>\n<li>शकों से विजित क्षेत्रों के कुशल प्रबंधन हेतु चन्द्रगुप्त द्वितीय ने <strong>उज्जयिनी (उज्जैन)</strong> को साम्राज्य की <strong>दूसरी राजधानी</strong> बनाया।</li>\n<li>यह शहर शीघ्र ही कला, साहित्य और उच्च शिक्षा (विद्या) का तत्कालीन भारत का सबसे बड़ा केंद्र बनकर उभरा।</li>\n</ul>\n</li>\n</ul>\n<h2>रणनीतिक वैवाहिक संबंध (Matrimonial Alliances)</h2>\n<p>चन्द्रगुप्त द्वितीय ने साम्राज्य की सुरक्षा और शकों के उन्मूलन हेतु कूटनीतिक वैवाहिक संबंधों का अत्यधिक बुद्धिमानी से उपयोग किया।</p>\n<ul>\n<li><strong>नागवंश के साथ संबंध</strong>:<ul>\n<li>पूना ताम्रपत्र के अनुसार, सम्राट ने नागवंश की राजकुमारी <strong>कुबेरनागा</strong> से विवाह किया।</li>\n<li>इस विवाह से उन्हें <strong>प्रभावती गुप्त</strong> नामक अत्यंत विदुषी पुत्री की प्राप्ति हुई।</li>\n</ul>\n</li>\n<li><strong>वाकाटक साम्राज्य के साथ गठबंधन</strong>:<ul>\n<li>चन्द्रगुप्त द्वितीय ने अपनी पुत्री प्रभावती गुप्ता का विवाह वाकाटक राजवंश के प्रतापी नरेश <strong>रुद्रसेन द्वितीय</strong> से किया।</li>\n<li>इस सुदृढ़ <strong>गुप्त-वाकाटक गठबंधन</strong> के संयुक्त सैन्य बल ने ही पश्चिमी भारत से शकों को समूल उखाड़ फेंकने में निर्णायक भूमिका निभाई।</li>\n</ul>\n</li>\n<li><strong>कदम्ब वंश (कर्नाटक) के साथ संबंध</strong>:<ul>\n<li><strong>तालगुण्ड लेख</strong> के अनुसार, कर्नाटक के कुंतल राज्य में शासन करने वाले <strong>कदम्ब वंश</strong> के प्रतापी शासक <strong>काकुत्स्थवर्मन</strong> की पुत्री का विवाह चन्द्रगुप्त द्वितीय के पुत्र <strong>कुमारगुप्त प्रथम</strong> के साथ संपन्न हुआ था।</li>\n<li><strong>कालिदास का दूतकार्य</strong>: सुप्रसिद्ध विद्वानों <strong>भोज</strong> और <strong>क्षेमेंद्र</strong> के विवरणों से ज्ञात होता है कि चन्द्रगुप्त द्वितीय ने अपने राजकवि <strong>कालिदास</strong> को दूत बनाकर कुंतल नरेश के दरबार में भेजा था। कालिदास ने इसी प्रवास के दौरान अपने सुप्रसिद्ध ग्रन्थ <strong>'कुंतलेश्वरदौत्यम'</strong> की रचना की थी।</li>\n</ul>\n</li>\n</ul>\n<h2>मुद्रा प्रणाली एवं सिक्के (Numismatics)</h2>\n<p>चन्द्रगुप्त द्वितीय का शासनकाल मुद्रा निर्माण कला और विविधता की दृष्टि से स्वर्ण युग का प्रतीक है।</p>\n<ul>\n<li><strong>सर्वप्रथम चांदी के सिक्के</strong>: गुप्त सम्राटों में <strong>सर्वप्रथम चांदी के सिक्के (रजत मुद्राएं) चलाने का श्रेय</strong> चन्द्रगुप्त द्वितीय को ही जाता है। (यद्यपि हाल ही में चन्द्रगुप्त प्रथम का भी एक चांदी का सिक्का प्राप्त हुआ है, परन्तु व्यवस्थित रूप से इसे चन्द्रगुप्त द्वितीय ने ही शुरू किया था)।</li>\n<li><strong>आठ प्रकार की स्वर्ण मुद्राएँ</strong>: चन्द्रगुप्त द्वितीय ने कुल <strong>8 प्रकार की मुद्राएँ</strong> चलाई थीं, जिनका वर्गीकरण नीचे दी गई तालिका में किया गया है:</li>\n</ul>\n<h3>चन्द्रगुप्त द्वितीय की आठ प्रकार की मुद्राओं का विवरण:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">मुद्रा का प्रकार</th>\n  <th style=\"text-align:left\">प्रमुख कलात्मक अंकन एवं विशेषताएं</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>धनुर्धारी</strong></td>\n  <td style=\"text-align:left\">राजा को हाथ में धनुष-बाण धारण किए हुए चित्रित किया गया है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>सिंह निहंता</strong></td>\n  <td style=\"text-align:left\">सम्राट को सिंह का शिकार करते (सिंह का वध करते) हुए सजीव दर्शाया गया है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>अश्वारोही</strong></td>\n  <td style=\"text-align:left\">राजा को घोड़े पर सवार होकर युद्ध या क्रीड़ा के लिए जाते हुए अंकित किया गया है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>छत्रधारी</strong></td>\n  <td style=\"text-align:left\">राजा के पीछे एक सेवक को शाही छत्र पकड़े हुए दर्शाया गया है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>पर्यंक स्थित राजा-रानी</strong></td>\n  <td style=\"text-align:left\">राजा और रानी को एक साथ पलंग (पर्यंक) पर आसीन दर्शाया गया है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>ध्वजधारी</strong></td>\n  <td style=\"text-align:left\">राजा के हाथ में राजकीय ध्वज या पताका उत्कीर्ण है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>7</strong></td>\n  <td style=\"text-align:left\"><strong>चक्रविक्रम</strong></td>\n  <td style=\"text-align:left\"><strong>विशेष अंकन</strong>: इस अत्यंत दुर्लभ मुद्रा के अग्रभाग पर स्वयं भगवान विष्णु को राजा को <strong>3 गोल वस्तुएं</strong> प्रदान करते हुए दिखाया गया है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>8</strong></td>\n  <td style=\"text-align:left\"><strong>पर्यंक प्रकार</strong></td>\n  <td style=\"text-align:left\">राजा को अकेले पर्यंक (पलंग/आसन) पर सुखपूर्वक बैठे हुए दर्शाया गया है।</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>धार्मिक अंकन</strong>: चन्द्रगुप्त द्वितीय के सिक्कों पर <strong>चक्राधारी विष्णु</strong> (हाथ में चक्र धारण किए भगवान विष्णु) की सुंदर और स्पष्ट आकृति उत्कीर्ण मिलती है, जो उनके भागवत धर्म के अनुयायी होने का सशक्त प्रमाण है।</li>\n</ul>\n<h2>चन्द्रगुप्त द्वितीय विक्रमादित्य: प्रमुख अभिलेख</h2>\n<h3>1. चन्द्रगुप्त द्वितीय के प्रमुख अभिलेख (Major Inscriptions)</h3>\n<p><strong>चन्द्रगुप्त विक्रमादित्य</strong> के शासनकाल एवं उनकी महान सैन्य व धार्मिक उपलब्धियों को समझने के लिए निम्नलिखित चार अभिलेख सर्वप्रमुख माने जाते हैं [1]:</p>\n<ol>\n<li><strong>उदयगिरि गुहालेख</strong> (मध्य प्रदेश) [1]</li>\n<li><strong>गढ़वा अभिलेख</strong> (उत्तर प्रदेश) [1]</li>\n<li><strong>साँची अभिलेख</strong> (मध्य प्रदेश) [1]</li>\n<li><strong>मथुरा शिलालेख</strong> (उत्तर प्रदेश) [1]</li>\n</ol>\n<h3>2. उदयगिरि गुहालेखों का विस्तृत विवरण</h3>\n<p>उदयगिरि से चन्द्रगुप्त द्वितीय के दो अत्यंत महत्वपूर्ण गुहालेख प्राप्त होते हैं [1]:</p>\n<h4>क. प्रथम उदयगिरि गुहालेख:</h4>\n<ul>\n<li><strong>शाही उपाधि</strong>: इस लेख में सम्राट चन्द्रगुप्त द्वितीय को <strong>'राजाधिराजर्षि'</strong> कहकर संबोधित किया गया है [1]।</li>\n<li><strong>निर्माणकर्ता</strong>: इस गुहालेख का निर्माण चन्द्रगुप्त द्वितीय के <strong>सन्धिविग्रहिक वीरसेन</strong> (Sandhivigrahika Virasen) द्वारा करवाया गया था [1]।</li>\n<li><strong>धार्मिक कृत्य</strong>: वीरसेन ने यहाँ <strong>शिव शम्भु</strong> की उपासना हेतु एक <strong>शिवलिंग</strong> स्थापित करवाया था [1]।</li>\n</ul>\n<h4>ख. द्वितीय उदयगिरि गुहालेख:</h4>\n<ul>\n<li><strong>सम्बद्ध व्यक्तित्व</strong>: यह लेख चन्द्रगुप्त द्वितीय के एक <strong>सामन्त</strong> एवं <strong>मालवा के तत्कालीन गवर्नर सनकानीक महाराज</strong> का है [1]।</li>\n<li><strong>धार्मिक एवं कलात्मक साक्ष्य</strong>: इस स्थल पर <strong>भगवान विष्णु की भव्य चतुर्भुज प्रतिमा</strong> तथा उनके <strong>वराह अवतार की मूर्ति</strong> उत्कीर्ण की गई है [1]।</li>\n</ul>\n<h3>3. साँची अभिलेख (Sanchi Inscription)</h3>\n<ul>\n<li><strong>सम्बद्ध सेनापति</strong>: यह अभिलेख चन्द्रगुप्त द्वितीय के प्रसिद्ध सेनापति <strong>आम्रकार्दव</strong> (Amrakardava) से सम्बन्धित है [1]।</li>\n<li><strong>धार्मिक आस्था</strong>: सेनापति आम्रकार्दव <strong>बौद्ध धर्मानुयायी</strong> (Buddhist) थे [1]।</li>\n<li><strong>दान का उल्लेख</strong>: आम्रकार्दव ने <strong>साँची बौद्ध विहार</strong> को उदारतापूर्वक दान दिया था, जिसका विस्तृत उल्लेख इस लेख में मिलता है [1]।</li>\n<li><strong>प्रशासनिक निकाय</strong>: इस अभिलेख में स्थानीय प्रशासन से सम्बद्ध <strong>'पंच मण्डली'</strong> (Pancha Mandali) का ऐतिहासिक उल्लेख प्राप्त होता है [1]।</li>\n</ul>\n<h3>4. मथुरा शिलालेख (Mathura Inscriptions)</h3>\n<ul>\n<li><strong>ऐतिहासिक तिथि</strong>: यह चन्द्रगुप्त द्वितीय के शासनकाल के <strong>5वें वर्ष का प्रथम अभिलेख</strong> है [1]।</li>\n<li><strong>धार्मिक सम्प्रदाय</strong>: इस लेख में सुप्रसिद्ध <strong>पाशुपत शैव सम्प्रदाय</strong> के महान आचार्य <strong>उदिताचार्य</strong> (Uditacharya) का विवरण प्राप्त होता है [1]।</li>\n<li><strong>शिवलिंगों की स्थापना</strong>: आचार्य उदिताचार्य ने यहाँ <strong>कपिलेश्वर</strong> एवं <strong>उपमितेश्वर</strong> (उममितेश्वर) नामक दो शिवलिंगों की स्थापना करवाई थी [1]।</li>\n<li><strong>गुप्त संवत् का सर्वप्रथम प्रयोग</strong>:<ul>\n<li>सम्पूर्ण गुप्तकालीन इतिहास में <strong>सर्वप्रथम गुप्त संवत् का उपयोग</strong> इसी मथुरा अभिलेख में किया गया है [1]।</li>\n<li>यह चन्द्रगुप्त द्वितीय के शासनकाल का प्रथम तिथि-युक्त लेख है जो <strong>गुप्त संवत् 61 (380 ई.)</strong> का है [1]।</li>\n</ul>\n</li>\n</ul>\n<h3>5. मेहरौली लौह स्तम्भ लेख (Mehrauli Iron Pillar Inscription)</h3>\n<ul>\n<li><strong>भाषा शैली</strong>: यह लौह स्तम्भ लेख उत्कृष्ट <strong>संस्कृत भाषा</strong> में लिखा गया है [1]।</li>\n<li><strong>मरणोत्तर लेख</strong>: इतिहासकार इसे चन्द्रगुप्त द्वितीय का <strong>मरणोत्तर अभिलेख</strong> (Posthumous inscription) स्वीकार करते हैं [1]।</li>\n<li><strong>सैन्य अभियानों का साक्ष्य</strong>: इसमें सम्राट द्वारा <strong>सिन्धु नदी को पार कर वाह्लीकों (Bactrians) को पराजित करने</strong> के महान सैन्य अभियान का गौरवशाली विवरण अंकित है [1]।</li>\n<li><strong>धार्मिक कृत्य</strong>: इसमें चन्द्रगुप्त द्वितीय द्वारा <strong>विष्णुपद पर्वत</strong> पर भगवान विष्णु के सम्मान में <strong>विष्णुध्वज</strong> (Vishnudhvaja) की स्थापना का स्पष्ट उल्लेख है [1]।</li>\n<li><strong>ऐतिहासिक महत्त्व</strong>: यह लेख सम्राट चन्द्रगुप्त विक्रमादित्य के सैन्य पराक्रम, साम्राज्य विस्तार और असाधारण व्यक्तिगत उपलब्धियों की जानकारी प्रदान करने वाला सबसे प्रामाणिक पाषाण दस्तावेज है [1]।</li>\n</ul>\n<h3>6. करमदण्डा अभिलेख (Karamdanda Inscription)</h3>\n<ul>\n<li><strong>मन्त्री का उल्लेख</strong>: इस अभिलेख में चन्द्रगुप्त द्वितीय के प्रसिद्ध मन्त्री <strong>शिखर स्वामी</strong> (Shikhar Swami) का नामोल्लेख प्राप्त होता है [1]।</li>\n<li><strong>धार्मिक आस्था</strong>: मन्त्री शिखर स्वामी व्यक्तिगत रूप से <strong>शैव मत के अनुयायी</strong> थे [1]।</li>\n</ul>\n<h2>चन्द्रगुप्त द्वितीय के राजदरबार के 'नवरत्न' (The Nine Gems)</h2>\n<p>चन्द्रगुप्त द्वितीय का राजदरबार ज्ञान, विज्ञान, कला और साहित्य का महान केन्द्र था। उनके दरबार में नौ परम विद्वानों की एक विशिष्ट मण्डली निवास करती थी, जिसे <strong>'नवरत्न'</strong> कहा जाता था [1]।</p>\n<h3>नवरत्नों का क्षेत्रवार एवं विस्तृत विवरण:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">नवरत्न का नाम</th>\n  <th style=\"text-align:left\">ज्ञान / विशेषज्ञता का क्षेत्र</th>\n  <th style=\"text-align:left\">ऐतिहासिक महत्त्व एवं योगदान [1]</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>कालिदास</strong></td>\n  <td style=\"text-align:left\"><strong>महाकवि एवं नाटककार</strong></td>\n  <td style=\"text-align:left\">संस्कृत साहित्य के सर्वकालिक महानतम लेखक व कवि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>वेतालभट्ट</strong></td>\n  <td style=\"text-align:left\"><strong>जादूगर / तान्त्रिक</strong></td>\n  <td style=\"text-align:left\">अपनी तान्त्रिक विद्या और कौतुकपूर्ण चमत्कारों के लिए प्रसिद्ध।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>घटकर्पर</strong></td>\n  <td style=\"text-align:left\"><strong>कूटनीतिज्ञ</strong></td>\n  <td style=\"text-align:left\">राजनैतिक संधियों और कूटनीति के सिद्धहस्त ज्ञाता।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>शंकु</strong></td>\n  <td style=\"text-align:left\"><strong>वास्तुकार</strong></td>\n  <td style=\"text-align:left\">भवन निर्माण कला एवं शिल्प शास्त्र के प्रकांड विद्वान।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>क्षपणक</strong></td>\n  <td style=\"text-align:left\"><strong>फलित ज्योतिष</strong></td>\n  <td style=\"text-align:left\">ग्रहों व नक्षत्रों के प्रभाव के आधार पर भविष्यवक्ता।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>वररुचि</strong></td>\n  <td style=\"text-align:left\"><strong>व्याकरण शास्त्र</strong></td>\n  <td style=\"text-align:left\">व्याकरण के नियमों और भाषाशास्त्र के सिद्ध विद्वान।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>7</strong></td>\n  <td style=\"text-align:left\"><strong>अमरसिंह</strong></td>\n  <td style=\"text-align:left\"><strong>कोशकार</strong></td>\n  <td style=\"text-align:left\">प्रसिद्ध संस्कृत शब्दकोश <strong>'अमरकोश'</strong> के प्रणेता।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>8</strong></td>\n  <td style=\"text-align:left\"><strong>धन्वन्तरि</strong></td>\n  <td style=\"text-align:left\"><strong>चिकित्सक (आयुर्वेद)</strong></td>\n  <td style=\"text-align:left\">आयुर्वेद के महान विशेषज्ञ और शाही राजवैद्य।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>9</strong></td>\n  <td style=\"text-align:left\"><strong>वराहमिहिर</strong></td>\n  <td style=\"text-align:left\"><strong>फलित ज्योतिष एवं खगोलशास्त्र</strong></td>\n  <td style=\"text-align:left\">खगोलशास्त्र के महान प्रणेता, गणितज्ञ एवं ज्योतिषविद्।</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>चीनी बौद्ध यात्री फाह्यान (Faxian: 399 - 414 ई.)</h2>\n<ul>\n<li><strong>आगमन काल</strong>: सुप्रसिद्ध चीनी बौद्ध यात्री <strong>फाह्यान (399-414 ई.)</strong> चन्द्रगुप्त विक्रमादित्य के गौरवशाली शासनकाल में बौद्ध धर्म ग्रंथों के संकलन हेतु भारत आया था [1]।</li>\n<li><strong>अनोखा ऐतिहासिक तथ्य</strong>: यद्यपि फाह्यान ने पूरे गुप्त साम्राज्य का भ्रमण किया और वह चन्द्रगुप्त द्वितीय के शासनकाल का समकालीन था, लेकिन उसने अपने प्रसिद्ध <strong>यात्रा विवरण (यात्रा उल्लेख) में कहीं भी सम्राट चन्द्रगुप्त विक्रमादित्य के नाम का उल्लेख नहीं किया है</strong> [1]।</li>\n</ul>\n"}, {"id": "0-6", "title": "कुमारगुप्त प्रथम महेन्द्रादित्य (415 ई. - 455 ई.)", "file": "history-gupta.md", "html": "<h1>कुमारगुप्त प्रथम महेन्द्रादित्य (415 ई. - 455 ई.)</h1>\n<h2>सामान्य परिचय एवं पारिवारिक पृष्ठभूमि</h2>\n<ul>\n<li><strong>माता-पिता</strong>: कुमारगुप्त प्रथम गुप्त सम्राट <strong>चन्द्रगुप्त द्वितीय</strong> एवं महारानी <strong>ध्रुवदेवी</strong> की संतान थे।</li>\n<li><strong>शासन अवधि (सर्वाधिक समय)</strong>: उन्होंने गुप्त शासकों में सर्वाधिक लंबे समय तक शासन किया, जिसका समय <strong>40 वर्ष</strong> था।</li>\n<li><strong>मुख्य पटरानी (पत्नी)</strong>: कुमारगुप्त प्रथम का विवाह <strong>अनन्तदेवी</strong> से हुआ था।</li>\n</ul>\n<h2>शाही उपाधियाँ एवं विरुद (Imperial Titles)</h2>\n<p>कुमारगुप्त प्रथम ने अपनी संप्रभुता और धार्मिक निष्ठा को दर्शाने वाली कई भव्य उपाधियाँ धारण की थीं:</p>\n<ul>\n<li><strong>महेन्द्रादित्य</strong></li>\n<li><strong>श्रीमहेंद्र</strong></li>\n<li><strong>अश्वमहेंद्र</strong></li>\n<li><strong>परमभागवत</strong>: <strong>गढ़वा लेख (इलाहाबाद)</strong> में कुमारगुप्त प्रथम को 'परमभागवत' कहा गया है।</li>\n<li><strong>शक्रादित्य</strong>: चीनी यात्री ह्वेनसांग के यात्रा विवरण के अनुसार नालंदा विश्वविद्यालय के संस्थापक <strong>'शक्रादित्य'</strong> थे, जो वास्तव में कुमारगुप्त प्रथम की ही एक उपाधि थी।</li>\n</ul>\n<h2>प्रमुख अभिलेख एवं प्रशासनिक विवरण</h2>\n<p>गुप्त शासकों में सर्वाधिक <strong>18 अभिलेख</strong> कुमारगुप्त प्रथम के ही प्राप्त हुए हैं।  उनके महत्वपूर्ण अभिलेखों और प्रशासनिक तथ्यों का विस्तृत ब्योरा नीचे दिया गया है:</p>\n<h4>प्रमुख अभिलेखों का विवरण:</h4>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">अभिलेख का नाम</th>\n  <th style=\"text-align:left\">स्थान / जिला</th>\n  <th style=\"text-align:left\">विशेष ऐतिहासिक तथ्य एवं घटनाएँ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>बिलसड़ अभिलेख</strong></td>\n  <td style=\"text-align:left\">एटा जिला, उत्तर प्रदेश</td>\n  <td style=\"text-align:left\"><strong>1.</strong> कुमारगुप्त प्रथम के शासन की प्रथम तिथि (<strong>415 ई.</strong>) इसी से ज्ञात होती है। <br><strong>2.</strong> इसी अभिलेख से कुमारगुप्त प्रथम तक गुप्तों की पूरी <strong>वंशावली</strong> प्राप्त होती है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>मंदसौर प्रशस्ति</strong></td>\n  <td style=\"text-align:left\">मंदसौर (दशपुर), मालवा</td>\n  <td style=\"text-align:left\"><strong>1.</strong> इसके रचनाकार (लेखक) <strong>वत्सभट्टि</strong> थे और यह तिथि <strong>473 ई.</strong> की है (यद्यपि यह कुमारगुप्त द्वितीय के समय की है)।  <br><strong>2.</strong> इसके अनुसार मंदसौर (दशपुर) का राज्यपाल <strong>बंधुवर्मा</strong> था। <br><strong>3.</strong> इसमें बंधुवर्मा द्वारा <strong>सूर्य मंदिर के निर्माण</strong> का उल्लेख है।  <br><strong>4.</strong> इसमें गुप्त संवत् के स्थान पर <strong>विक्रम संवत्</strong> में तिथि दी गई है।  <br><strong>5.</strong> इसमें <strong>सुमेरु पर्वत</strong> एवं <strong>कैलाश पर्वत</strong> का भी उल्लेख मिलता है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>करमदण्डा लेख</strong></td>\n  <td style=\"text-align:left\">फैजाबाद, उत्तर प्रदेश</td>\n  <td style=\"text-align:left\">इसके अनुसार कुमारगुप्त के सन्धिविग्रहिक (मंत्री) <strong>पृथ्वीषेण</strong> ने शिव प्रतिमा स्थापित कराकर <strong>'पृथ्वीश्वर शिवलिंग'</strong> की स्थापना करवाई थी।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>मथुरा लेख</strong></td>\n  <td style=\"text-align:left\">मथुरा, उत्तर प्रदेश</td>\n  <td style=\"text-align:left\">इसमें प्रसिद्ध जैन मुनि <strong>दलिताचार्य</strong> का विशेष उल्लेख मिलता है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>मानकुँवर लेख</strong></td>\n  <td style=\"text-align:left\">इलाहाबाद, उत्तर प्रदेश</td>\n  <td style=\"text-align:left\">इसमें <strong>बुद्धमित्र</strong> द्वारा बुद्ध प्रतिमा स्थापित किए जाने का विवरण है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>उदयगिरि लेख</strong></td>\n  <td style=\"text-align:left\">मध्य प्रदेश</td>\n  <td style=\"text-align:left\">इसमें <strong>शंकर</strong> नामक व्यक्ति द्वारा <strong>पार्श्वनाथ (जैन तीर्थंकर)</strong> की मूर्ति स्थापित किए जाने का उल्लेख है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>7</strong></td>\n  <td style=\"text-align:left\"><strong>साँची लेख</strong></td>\n  <td style=\"text-align:left\">मध्य प्रदेश</td>\n  <td style=\"text-align:left\">इसमें <strong>हरिस्वामिनी</strong> द्वारा साँची बौद्ध संघ को दान दिए जाने का विवरण प्राप्त होता है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>8</strong></td>\n  <td style=\"text-align:left\"><strong>तुमैन अभिलेख</strong></td>\n  <td style=\"text-align:left\">ग्वालियर, मध्य प्रदेश</td>\n  <td style=\"text-align:left\">यह लेख <strong>435 ई.</strong> का है, जिसमें कुमारगुप्त प्रथम की तुलना <strong>'शरदकालीन सूर्य'</strong> से की गई है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>9</strong></td>\n  <td style=\"text-align:left\"><strong>दामोदरपुर ताम्रपत्र</strong></td>\n  <td style=\"text-align:left\">दीनाजपुर जिला, बांग्लादेश</td>\n  <td style=\"text-align:left\"><strong>1.</strong> यहाँ से कुल <strong>6 ताम्रपत्र</strong> मिले हैं। <br><strong>2.</strong> इसके तीसरे ताम्रपत्र में कुमारगुप्त प्रथम की <strong>शासन व्यवस्था</strong> एवं प्रमुख ग्राम अधिकारियों—<strong>ग्रामिक, महत्तर, कुटुम्बिन, और अष्टकुलाधिकरण</strong> का विवरण है।  <br><strong>3.</strong> इसमें भूमि के क्रय-विक्रय (खरीद-बिक्री) संबंधी विस्तृत ब्योरा दिया गया है।</td>\n</tr>\n</tbody>\n</table>\n<h4>प्रांतीय एवं क्षेत्रीय राज्यपाल (Provincial Governors):</h4>\n<ul>\n<li><strong>चिरादत्त</strong>: दामोदरपुर / पुण्ड्रवर्धन (बांग्लादेश के दीनाजपुर जिले में स्थित) का राज्यपाल था।</li>\n<li><strong>घटोत्कचगुप्त</strong>: एरण (पूर्वी मालवा) का राज्यपाल था।</li>\n<li><strong>बंधुवर्मा</strong>: मंदसौर (दशपुर, मालवा) का राज्यपाल था।</li>\n</ul>\n<h4>बंगाल से प्राप्त अभिलेख (बंगाल विजय का साक्ष्य):</h4>\n<p>कुमारगुप्त प्रथम इतिहास में प्रथम गुप्त शासक है जिसके अभिलेख <strong>बंगाल</strong> से प्राप्त हुए हैं। ये तीन प्रमुख ताम्रपत्र हैं:</p>\n<ol>\n<li><strong>दामोदरपुर ताम्रपत्र</strong></li>\n<li><strong>वैग्राम ताम्रपत्र</strong></li>\n<li><strong>धनदइह (धनदेह) ताम्रपत्र</strong></li>\n</ol>\n<hr />\n<h2>पुष्यमित्रों एवं हूणों का आक्रमण</h2>\n<p>कुमारगुप्त प्रथम के शासनकाल के अंतिम दिनों में साम्राज्य को बाहरी एवं आंतरिक चुनौतियों का सामना करना पड़ा:</p>\n<ul>\n<li><strong>पुष्यमित्रों का आक्रमण</strong>: स्कन्दगुप्त के <strong>भीतरी अभिलेख</strong> से ज्ञात होता है कि कुमारगुप्त प्रथम के अंतिम दिनों में <strong>पुष्यमित्रों</strong> ने भीषण आक्रमण किया था।</li>\n<li><strong>स्कन्दगुप्त की वीरता</strong>: कुमारगुप्त प्रथम के प्रतापी पुत्र <strong>स्कन्दगुप्त</strong> ने पुष्यमित्रों को युद्ध में पूरी तरह पराजित किया।</li>\n<li><strong>हूणों का दमन</strong>: भीतरी अभिलेख के अनुसार ही स्कन्दगुप्त ने बर्बर <strong>हूणों</strong> को भी पराजित किया और इस उपलक्ष्य में <strong>'क्रमादित्य'</strong> व <strong>'विक्रमादित्य'</strong> की उपाधियाँ धारण कीं।</li>\n</ul>\n<h2>मुद्रा प्रणाली एवं सिक्के (Coinage System)</h2>\n<p>गुप्त शासकों में सर्वाधिक विविध <strong>14 प्रकार के सिक्के</strong> कुमारगुप्त प्रथम के ही मिलते हैं :</p>\n<ul>\n<li><strong>चाँदी के सिक्कों का मध्य भारत में प्रचलन</strong>: मध्य भारत (<strong>गंगा घाटी</strong>) में सर्वप्रथम चाँदी के सिक्कों का प्रचलन कुमारगुप्त प्रथम ने ही किया था।  (नोट: पश्चिमी भारत में सर्वप्रथम चाँदी के सिक्के चलाने का श्रेय चंद्रगुप्त द्वितीय को जाता है)।</li>\n<li><strong>मयूर (कार्तिकेय) प्रकार के सिक्के</strong>: कुमारगुप्त प्रथम के सिक्कों पर राजचिह्न गरुड़ के स्थान पर <strong>मयूर (कार्तिकेय)</strong> की आकृति उत्कीर्ण की गई है।</li>\n<li><strong>अप्रतिघ मुद्राएँ</strong>: उसने विशेष <strong>'अप्रतिघ'</strong> प्रकार के सिक्के चलाए।</li>\n<li><strong>खड्गनिहंता प्रकार</strong>: इस प्रकार के सिक्कों पर कुमारगुप्त प्रथम को <strong>गैंडा (Rhinoceros) मारते हुए</strong> अत्यंत साहसिक रूप में प्रदर्शित किया गया है।</li>\n<li><strong>अन्य मुद्रा प्रकार</strong>: उसने <strong>गजारूढ़ प्रकार</strong> और <strong>खड्ग प्रकार</strong> की मुद्राएँ भी चलवाईं।</li>\n<li><strong>अश्वमेध यज्ञ का मुद्रा साक्ष्य</strong>: कुमारगुप्त प्रथम के <strong>स्वर्ण सिक्कों</strong> से स्पष्ट रूप से प्रमाणित होता है कि उसने <strong>अश्वमेध यज्ञ</strong> का अनुष्ठान किया था, यद्यपि उसके किसी भी अभिलेख में इस यज्ञ का कोई उल्लेख नहीं मिलता है।</li>\n<li><strong>बयाना मुद्रा निधि (Bayana Hoard)</strong>: राजस्थान के बयाना से कुमारगुप्त प्रथम की सर्वाधिक <strong>623 स्वर्ण मुद्राएँ (सिक्के)</strong> प्राप्त हुई हैं।</li>\n</ul>\n<h2>नालंदा विश्वविद्यालय की स्थापना (Nalanda University)</h2>\n<p>कुमारगुप्त प्रथम का सबसे स्थायी और सांस्कृतिक गौरवशाली कार्य नालंदा विश्वविद्यालय का निर्माण था:</p>\n<ul>\n<li><strong>स्थापना</strong>: नालंदा विश्वविद्यालय की स्थापना <strong>कुमारगुप्त प्रथम के शासनकाल</strong> में हुई थी।</li>\n<li><strong>उपाधि 'शक्रादित्य'</strong>: चीनी बौद्ध यात्री ह्वेनसांग के यात्रा विवरण के अनुसार, इस विश्वविद्यालय का संस्थापक <strong>'शक्रादित्य'</strong> था, जो वास्तव में सम्राट कुमारगुप्त प्रथम की ही एक प्रसिद्ध उपाधि थी।</li>\n<li><strong>महायान बौद्ध धर्म का केंद्र</strong>: इस महान शिक्षण संस्थान को <strong>&quot;महायान बौद्ध धर्म का ऑक्सफोर्ड&quot;</strong> (Oxford of Mahayana Buddhism) भी कहा जाता है।</li>\n</ul>\n<h2>ऐतिहासिक तुलनात्मक एवं विशेष तथ्य</h2>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\">ऐतिहासिक आयाम</th>\n  <th style=\"text-align:left\">तथ्य / विवरण</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\"><strong>अन्य मंदसौर प्रशस्ति</strong></td>\n  <td style=\"text-align:left\">मालव नरेश <strong>यशोधर्मन</strong> की भी एक मंदसौर/दशपुर प्रशस्ति मिलती है, जिसके लेखक <strong>वासुल</strong> थे।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\"><strong>धार्मिक सहिष्णुता का प्रमाण</strong></td>\n  <td style=\"text-align:left\">कुमारगुप्त के शासनकाल में विभिन्न धार्मिक संप्रदायों का सह-अस्तित्व था: <br>• <strong>शैव</strong>: शिव प्रतिमा एवं पृथ्वीश्वर शिवलिंग की स्थापना (पृथ्वीषेण द्वारा)।  <br>• <strong>वैष्णव</strong>: स्वयं कुमारगुप्त 'परमभागवत' थे।  <br>• <strong>जैन</strong>: पार्श्वनाथ मूर्ति की स्थापना (शंकर द्वारा) तथा जैन मुनि दलिताचार्य का उल्लेख।  <br>• <strong>बौद्ध</strong>: बुद्ध प्रतिमा स्थापना (बुद्धमित्र द्वारा) तथा साँची संघ को दान (हरिस्वामिनी द्वारा)।</td>\n</tr>\n</tbody>\n</table>\n"}, {"id": "0-7", "title": "स्कन्दगुप्त एवं उनके उत्तराधिकारी", "file": "history-gupta.md", "html": "<h1>स्कन्दगुप्त एवं उनके उत्तराधिकारी</h1>\n<hr />\n<h2>सम्राट स्कन्दगुप्त (455-467 ई.)</h2>\n<p>स्कन्दगुप्त गुप्त साम्राज्य के अंतिम महान और प्रतापी शासक थे, जिन्होंने साम्राज्य की सीमाओं की बर्बर आक्रमणकारियों से रक्षा की।</p>\n<ul>\n<li><strong>वंश का अन्तिम महान शासक</strong>: स्कन्दगुप्त <strong>गुप्त वंश</strong> के अन्तिम महान और शक्तिशाली सम्राट थे।</li>\n<li><strong>शाही एवं भव्य उपाधियाँ (Titles)</strong>: उन्होंने अपने शासनकाल के दौरान निम्नलिखित प्रसिद्ध उपाधियाँ धारण की थीं:<ol>\n<li><strong>क्रमादित्य</strong></li>\n<li><strong>विक्रमादित्य</strong></li>\n<li><strong>शक्रोपम</strong></li>\n<li><strong>परमभागवत</strong></li>\n</ol>\n</li>\n<li><strong>धार्मिक आस्था</strong>: स्कन्दगुप्त व्यक्तिगत आस्था से परम <strong>वैष्णव</strong> धर्मानुयायी थे।</li>\n<li><strong>साम्राज्य की राजधानी</strong>: उन्होंने <strong>अयोध्या</strong> को गुप्त साम्राज्य की नई राजधानी के रूप में स्थापित किया।</li>\n<li><strong>वैदेशिक संबंध (चीन के साथ)</strong>: स्कन्दगुप्त ने <strong>466 ई.</strong> में चीन के तत्कालीन <strong>सांग सम्राट</strong> के दरबार में गुप्त साम्राज्य का एक आधिकारिक <strong>राजदूत</strong> भेजा था।</li>\n</ul>\n<h2>जूनागढ़ अभिलेख (सौराष्ट्र, गुजरात)</h2>\n<p>जूनागढ़ से प्राप्त शिलाभिलेख स्कन्दगुप्त के शासनकाल की राजनीतिक, सैन्य और लोक-कल्याणकारी गतिविधियों की जानकारी देने वाला सबसे महत्वपूर्ण साक्ष्य है।</p>\n<ul>\n<li><strong>लक्ष्मी द्वारा वरण का उल्लेख</strong>: जूनागढ़ लेख में अलंकृत शैली में वर्णित है कि तत्कालीन सभी योग्य राजकुमारों का परित्याग कर <strong>लक्ष्मी</strong> ने स्वयं स्कन्दगुप्त को अपनी पसंद मानकर उनका <strong>वरण</strong> (चुनाव) किया।</li>\n<li><strong>हूणों का बर्बर आक्रमण</strong>: इस अभिलेख के अनुसार, स्कन्दगुप्त के सिंहासन पर बैठते ही गुप्त साम्राज्य पर <strong>हूणों का भीषण आक्रमण</strong> हुआ।<ul>\n<li><strong>हूणों की करारी शिकस्त</strong>: स्कन्दगुप्त ने अपने अदम्य साहस से हूणों को पराजित कर बाहर खदेड़ दिया।</li>\n<li><strong>आक्रमणकारी हूण नरेश</strong>: भारत पर आक्रमण करने वाला तत्कालीन हूण राजा <strong>खुशनवाज</strong> था।</li>\n<li><strong>म्लेच्छ शब्द का प्रयोग</strong>: इस अभिलेख में हूण आक्रमणकारियों को स्पष्ट रूप से <strong>'म्लेच्छ'</strong> कहकर संबोधित किया गया है।</li>\n</ul>\n</li>\n<li><strong>काल गणना साक्ष्य</strong>: जूनागढ़ अभिलेख में गुप्तकालीन समय गणना (काल गणना) से संबंधित महत्वपूर्ण ऐतिहासिक साक्ष्य प्राप्त होते हैं।</li>\n<li><strong>सुदर्शन झील (गिरनार) का पुनर्निर्माण</strong>:<ul>\n<li>इस अभिलेख में स्कन्दगुप्त द्वारा सुदर्शन झील के क्षतिग्रस्त बांध के पुनर्निर्माण का विस्तृत विवरण है।</li>\n<li>सुदर्शन झील का पुनर्निर्माण सौराष्ट्र के तत्कालीन गवर्नर (गोप्ता) <strong>पर्णदत्त</strong> के योग्य पुत्र <strong>चक्रपालित</strong> की देखरेख में संपन्न हुआ था।</li>\n<li><strong>विष्णु मंदिर का निर्माण</strong>: चक्रपालित ने झील के पुनर्निर्माण के उपरांत इसके भव्य किनारे पर <strong>भगवान विष्णु के एक सुंदर मंदिर</strong> की स्थापना भी करवाई थी।</li>\n</ul>\n</li>\n</ul>\n<h3>सुदर्शन झील का संक्षिप्त एवं क्रमिक इतिहास:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">ऐतिहासिक काल / शासक</th>\n  <th style=\"text-align:left\">सौराष्ट्र का गवर्नर (गोप्ता)</th>\n  <th style=\"text-align:left\">झील के विकास में योगदान</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>चन्द्रगुप्त मौर्य</strong> (मूल संस्थापक)</td>\n  <td style=\"text-align:left\"><strong>पुष्यगुप्त वैश्य</strong></td>\n  <td style=\"text-align:left\">चन्द्रगुप्त मौर्य के निर्देश पर सिंचाई हेतु झील का सर्वप्रथम निर्माण करवाया।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>सम्राट अशोक</strong></td>\n  <td style=\"text-align:left\"><strong>यवनराज तुषास्प</strong></td>\n  <td style=\"text-align:left\">मौर्य काल में झील से जल निकासी हेतु नहरों का निर्माण करवाया।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>रुद्रदामन</strong> (शक महाक्षत्रप)</td>\n  <td style=\"text-align:left\"><strong>सुविशाख</strong></td>\n  <td style=\"text-align:left\">भारी वर्षा के कारण टूटे बांध का अपने व्यक्तिगत कोष से पुनर्निर्माण करवाया।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>सम्राट स्कन्दगुप्त</strong></td>\n  <td style=\"text-align:left\"><strong>पर्णदत्त</strong> (पुत्र: <strong>चक्रपालित</strong>)</td>\n  <td style=\"text-align:left\">भीषण बाढ़ से टूटे बांध का भव्य स्तर पर पुनर्निर्माण व किनारे पर विष्णु मंदिर की स्थापना।</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>भीतरी स्तम्भ लेख (गाजीपुर, उत्तर प्रदेश)</h2>\n<p>यह पाषाण लेख स्कन्दगुप्त की विजयों और पारिवारिक वंशावली को जानने का अत्यंत विश्वसनीय दस्तावेज है।</p>\n<ul>\n<li><strong>भौगोलिक स्थिति</strong>: भीतरी स्तम्भ लेख उत्तर प्रदेश के <strong>गाजीपुर जिले</strong> की <strong>सैदपुर तहसील</strong> में स्थित है।</li>\n<li><strong>पुष्यमित्रों और हूणों के साथ युद्ध</strong>: इसमें स्कन्दगुप्त द्वारा साम्राज्य के दो सबसे खतरनाक शत्रुओं—<strong>पुष्यमित्रों</strong> तथा <strong>हूणों</strong> के साथ किए गए ऐतिहासिक युद्धों का जीवंत वर्णन है।</li>\n<li><strong>पुष्यमित्रों का दमन</strong>:<ul>\n<li>इसके अनुसार, पिता कुमारगुप्त प्रथम के शासनकाल के अन्तिम वर्षों में पुष्यमित्रों ने गुप्त साम्राज्य पर भयानक आक्रमण किया था।</li>\n<li>सम्राट कुमारगुप्त प्रथम के वीर पुत्र <strong>स्कन्दगुप्त</strong> ने युद्ध भूमि में डटकर पुष्यमित्रों को पूरी तरह पराजित किया।</li>\n</ul>\n</li>\n<li><strong>हूणों के विरुद्ध महायुद्ध</strong>: भीतरी अभिलेख के <strong>आठवें श्लोक</strong> में हूणों के साथ लड़े गए भीषण युद्ध एवं स्कन्दगुप्त द्वारा उनकी पूर्ण पराजय का गौरवशाली उल्लेख है।<ul>\n<li><strong>अभिलेखीय मूल उद्धरण</strong>: <em>“हूणों के विरुद्ध युद्ध क्षेत्र में उतरने पर उसकी (स्कन्दगुप्त) भुजाओं के प्रताप से पृथ्वी काँप उठी।”<
