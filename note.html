नाट्य रचनाएँ (Plays):</h3>\n<ol>\n<li><strong>मालविकाग्निमित्र</strong>:<ul>\n<li>यह कुल <strong>5 अंकों</strong> (Ankas) में निबद्ध कालिदास की <strong>सर्वप्रथम नाट्य रचना</strong> है।</li>\n<li>इसमें शुंग वंश के राजा <strong>अग्निमित्र</strong> और सुन्दरी <strong>मालविका</strong> की प्रणय (प्रेम) कथा का वर्णन है।</li>\n</ul>\n</li>\n<li><strong>विक्रमोर्वशीय</strong>:<ul>\n<li>यह भी <strong>5 अंकों</strong> में रचित एक अत्यंत प्रसिद्ध नाटक है, जिसमें महाराज <strong>पुरुरवा</strong> तथा अप्सरा <strong>उर्वशी</strong> की अलौकिक प्रेम कहानी का चित्रण है।</li>\n<li><strong>दृश्यांकन स्थल</strong>: इस नाटक का प्रथम ऐतिहासिक दृश्यांकन <strong>झूँसी (प्राचीन प्रतिष्ठानपुर, प्रयागराज)</strong> में किया गया था।</li>\n</ul>\n</li>\n<li><strong>अभिज्ञान शाकुंतलम</strong>:<ul>\n<li>यह महाकवि कालिदास की <strong>तीसरी व अंतिम नाट्य रचना</strong> है, जिसे उनकी <strong>सर्वोत्कृष्ट रचना</strong> माना जाता है।</li>\n<li>यह कुल <strong>7 अंकों</strong> में विभाजित है।</li>\n<li>इसमें हस्तिनापुर के राजा <strong>दुष्यंत</strong> व कण्व ऋषि की पालिता पुत्री <strong>शकुंतला</strong> के संयोग, वियोग एवं पुनर्मिलन की कथा का सविस्तार विवरण है।</li>\n<li><strong>अंतर्राष्ट्रीय ख्याति</strong>: प्रसिद्ध जर्मन कवि <strong>गेटे</strong> (Goethe) ने अभिज्ञान शाकुंतलम की साहित्यिक सुंदरता की भूरि-भूरि प्रशंसा की है।</li>\n</ul>\n</li>\n</ol>\n<h3>घ. लुप्त रचना:</h3>\n<ul>\n<li><strong>कुंतलेश्वरदौत्यम (Kuntaleshvaradautyam)</strong>: कश्मीरी विद्वान <strong>क्षेमेंद्र</strong> ने अपने प्रसिद्ध ग्रंथ <strong>'बृहत्कथामंजरी'</strong> में कालिदास की इस अन्य रचना का एक श्लोक उद्धृत किया है। हालांकि, यह ग्रंथ अभी तक मूल रूप में <strong>प्राप्त नहीं हुआ है</strong>।</li>\n</ul>\n<h2>3. गुप्तकालीन नाटकों की प्रमुख विशेषताएँ (Gupta Playwriting Features)</h2>\n<p>गुप्तकाल में नाट्य कला अत्यंत विकसित हुई, जिसकी अपनी कुछ विशिष्ट सामाजिक और भाषाई विशेषताएँ थीं:</p>\n<ul>\n<li><strong>प्रेमप्रधान एवं सुखांत</strong>: गुप्तकालीन नाटकों के कथानक मुख्यतः <strong>प्रेमप्रधान (Love-oriented)</strong> होते थे तथा इनका अंत हमेशा सुखद यानी <strong>सुखांत (Comedies/Happy endings)</strong> होता था (त्रासद नाटकों का अभाव था)।</li>\n<li><strong>भाषाई विभेद (सामाजिक स्तर का सूचक)</strong>: गुप्तकालीन नाटकों की सबसे बड़ी और अनूठी विशेषता यह थी कि पात्रों की भाषा उनके सामाजिक स्तर को प्रदर्शित करती थी:<ul>\n<li>समाज के <strong>उच्च सामाजिक स्तर के पात्र (जैसे- राजा, मंत्री, ब्राह्मण आदि) हमेशा 'संस्कृत' भाषा बोलते थे</strong>।</li>\n<li>इसके विपरीत, <strong>निम्न सामाजिक स्तर के पात्र (सेवक, दास, सामान्य जन) तथा स्त्रियाँ हमेशा 'प्राकृत' भाषा का प्रयोग करती थीं</strong>।</li>\n<li><strong>कारण</strong>: तत्कालीन समाज में अलंकृत और व्याकरण सम्मत संस्कृत भाषा को समाज के अन्य निम्न वर्ग के लोग नहीं समझ सकते थे, क्योंकि उस समय जनसामान्य की वास्तविक बोलचाल की भाषा मुख्य रूप से <strong>प्राकृत</strong> ही थी।</li>\n</ul>\n</li>\n</ul>\n<h3>क. शूद्रक का 'मृच्छकटिकम' (मिट्टी की गाड़ी):</h3>\n<ul>\n<li><strong>पात्रों की भाषा</strong>: इस नाटक में भी विधिक नियमों के अनुसार सभी <strong>स्त्रियाँ व शूद्र पात्र प्राकृत भाषा</strong> बोलते हैं।</li>\n<li><strong>कथानक</strong>: इसमें एक निर्धन परंतु अत्यंत उदार ब्राह्मण व्यापारी <strong>चारुदत्त</strong> तथा उज्जैन की प्रसिद्ध एवं धनी गणिका <strong>वसंतसेना</strong> की अनुपम प्रणय कथा का वर्णन है।</li>\n<li><strong>सामाजिक दर्पण</strong>: यह नाटक तत्कालीन समाज में व्याप्त <strong>प्रशासनिक भ्रष्टाचार</strong> पर गहरा प्रकाश डालता है तथा प्राचीन भारतीय न्यायालयों एवं <strong>न्याय व्यवस्था की सजीव झाँकी</strong> प्रस्तुत करता है।</li>\n</ul>\n<h3>ख. महाकवि भास के नाटक:</h3>\n<ul>\n<li>महाकवि भास ने कुल <strong>13 नाटकों</strong> की रचना की।</li>\n<li>इनका प्रसिद्ध नाटक <strong>'स्वप्नवासवदत्ता'</strong> कुल <strong>छह (6) अंकों</strong> का है।</li>\n<li>इसे संस्कृत साहित्य इतिहास का <strong>'प्रथम संपूर्ण नाटक'</strong> माना जाता है।</li>\n</ul>\n<h3>ग. विशाखदत्त का 'मुद्राराक्षस':</h3>\n<ul>\n<li>विशाखदत्त द्वारा रचित 'मुद्राराक्षस' संस्कृत साहित्य की एकमात्र ऐसी अनूठी नाट्य रचना है जो पूर्णतः <strong>नायिका विहीन (Heroine-less)</strong> है (अर्थात् इसमें कोई महिला पात्र या प्रेमकथा नहीं है; यह विशुद्ध रूप से राजनीतिक षड्यंत्रों पर आधारित नाटक है)।</li>\n</ul>\n<h2>4. संस्कृत काव्य की शीर्षत्रयी एवं बृहत्त्रयी (Sanskrit Literature Trinity)</h2>\n<p>संस्कृत के तीन महानतम कवियों और उनकी तीन सर्वश्रेष्ठ रचनाओं को क्रमशः शीर्षत्रयी और बृहत्त्रयी के रूप में मान्यता प्राप्त है:</p>\n<h3>शीर्षत्रयी (महान कवियों की तिकड़ी):</h3>\n<ol>\n<li><strong>माघ</strong></li>\n<li><strong>भारवि</strong></li>\n<li><strong>श्री हर्ष</strong></li>\n</ol>\n<h3>बृहत्त्रयी (तीन महान महाकाव्य):</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">महाकाव्य का नाम</th>\n  <th style=\"text-align:left\">रचयिता (कवि)</th>\n  <th style=\"text-align:left\">विषय-वस्तु एवं विशेषता</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>शिशुपालवध</strong></td>\n  <td style=\"text-align:left\"><strong>माघ</strong></td>\n  <td style=\"text-align:left\">श्रीकृष्ण द्वारा शिशुपाल के वध की महाभारत कालीन कथा का वर्णन।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>किरातार्जुनीयम</strong></td>\n  <td style=\"text-align:left\"><strong>भारवि</strong></td>\n  <td style=\"text-align:left\">इसमें शिव (किरात रूप में) और अर्जुन के मध्य पाशुपतास्त्र हेतु संघर्ष का वर्णन है। (कुल <strong>18 सर्ग</strong>)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>नैषधीयचरितम</strong></td>\n  <td style=\"text-align:left\"><strong>श्री हर्ष</strong></td>\n  <td style=\"text-align:left\">राजा नल और दमयंती के पौराणिक चरित्र और उनकी कथा का सुंदर अंकन।</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>5. दर्शन, व्याकरण एवं काव्यशास्त्र का विकास</h2>\n<ul>\n<li><strong>षड्दर्शन का पूर्ण विकास</strong>: हिन्दू धर्म के छह प्रमुख दार्शनिक संप्रदायों—<strong>षड्दर्शन</strong> (सांख्य, योग, न्याय, वैशेषिक, मीमांसा और वेदांत)—का पूर्ण और व्यवस्थित विकास इसी <strong>गुप्तकाल</strong> के दौरान संपन्न हुआ।</li>\n<li><strong>अमरकोश (Sanskrit Encyclopedia)</strong>:<ul>\n<li>इसके रचयिता अमरसिंह हैं। इसका अन्य नाम <strong>'लिंगानुशासन'</strong> है।</li>\n<li>इसे संस्कृत साहित्य का <strong>'विश्वकोश' (Encyclopedia)</strong> कहा जाता है।</li>\n<li>इसके सबसे प्रसिद्ध टीकाकार <strong>'क्षीरस्वामीभट्ट'</strong> हैं।</li>\n</ul>\n</li>\n<li><strong>काव्यालंकार</strong>: इस प्रसिद्ध काव्यशास्त्रीय ग्रंथ की रचना आचार्य <strong>भामह</strong> ने की थी।</li>\n<li><strong>दशावतार</strong>: यह सुप्रसिद्ध ग्रंथ कश्मीरी कवि <strong>क्षेमेंद्र</strong> की प्रमुख रचना है।</li>\n</ul>\n<h2>6. प्रमुख गुप्तकालीन पुस्तकें एवं उनके लेखक (Comparative Reference Table)</h2>\n<p>स्रोत में वर्णित सभी महत्वपूर्ण पुस्तकों और उनके लेखकों का सुव्यवस्थित विवरण निम्नलिखित तालिका में दिया गया है, जो परीक्षाओं के त्वरित रिवीजन के लिए अत्यंत महत्वपूर्ण है:</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">पुस्तक / ग्रंथ का नाम</th>\n  <th style=\"text-align:left\">लेखक / रचयिता का नाम</th>\n  <th style=\"text-align:left\">ग्रंथ की प्रकृति / विषय-वस्तु</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>देवीचंद्रगुप्तम</strong></td>\n  <td style=\"text-align:left\"><strong>विशाखदत्त</strong></td>\n  <td style=\"text-align:left\">गुप्तकालीन ऐतिहासिक नाटक (रामगुप्त और ध्रुवदेवी की कथा)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>मुद्राराक्षस</strong></td>\n  <td style=\"text-align:left\"><strong>विशाखदत्त</strong></td>\n  <td style=\"text-align:left\">मौर्य काल से संबंधित नायिका विहीन राजनीतिक नाटक।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>काव्यदर्शन (काव्यादर्श)</strong></td>\n  <td style=\"text-align:left\"><strong>दंडी</strong></td>\n  <td style=\"text-align:left\">संस्कृत काव्यशास्त्र का महत्वपूर्ण ग्रंथ।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>दशकुमारचरित</strong></td>\n  <td style=\"text-align:left\"><strong>दंडी</strong></td>\n  <td style=\"text-align:left\">दस कुमारों के साहसिक कारनामों की कथा।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>किरातार्जुनीयम</strong></td>\n  <td style=\"text-align:left\"><strong>भारवि</strong></td>\n  <td style=\"text-align:left\">18 सर्गों का वीर रस प्रधान महाकाव्य।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>रावणवध</strong></td>\n  <td style=\"text-align:left\"><strong>भट्टिकाव्य / भट्टिकवि (वत्सभट्टी)</strong></td>\n  <td style=\"text-align:left\">रावण वध की कथा (व्याकरण नियमों को समझाने हेतु रचित)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>7</strong></td>\n  <td style=\"text-align:left\"><strong>अमरकोश</strong></td>\n  <td style=\"text-align:left\"><strong>अमरसिंह</strong></td>\n  <td style=\"text-align:left\">संस्कृत का महान शब्दकोश (लिंगानुशासन)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>8</strong></td>\n  <td style=\"text-align:left\"><strong>न्यायावतार</strong></td>\n  <td style=\"text-align:left\"><strong>सिद्धसेन</strong></td>\n  <td style=\"text-align:left\">जैन न्याय दर्शन का सर्वप्रमुख ग्रंथ।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>9</strong></td>\n  <td style=\"text-align:left\"><strong>पंचतंत्र</strong></td>\n  <td style=\"text-align:left\"><strong>विष्णु शर्मा</strong></td>\n  <td style=\"text-align:left\">नीतिपरक पशु-पक्षियों की कहानियों का विश्वप्रसिद्ध संग्रह।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>10</strong></td>\n  <td style=\"text-align:left\"><strong>कामसूत्र</strong></td>\n  <td style=\"text-align:left\"><strong>वात्स्यायन</strong></td>\n  <td style=\"text-align:left\">सामाजिक, कलात्मक और दांपत्य जीवन के नियमों का ग्रंथ (7 खंड)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>11</strong></td>\n  <td style=\"text-align:left\"><strong>चंद्रव्याकरण</strong></td>\n  <td style=\"text-align:left\"><strong>चंद्रगोमिन</strong></td>\n  <td style=\"text-align:left\">बौद्ध व्याकरण ग्रंथ।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>12</strong></td>\n  <td style=\"text-align:left\"><strong>विशुद्धिमग्ग</strong></td>\n  <td style=\"text-align:left\"><strong>बुद्धघोष</strong></td>\n  <td style=\"text-align:left\">बौद्ध दर्शन (हीनयान मत) का अत्यंत महत्वपूर्ण ग्रंथ।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>13</strong></td>\n  <td style=\"text-align:left\"><strong>मृच्छकटिकम</strong></td>\n  <td style=\"text-align:left\"><strong>शूद्रक</strong></td>\n  <td style=\"text-align:left\">इसका शाब्दिक अर्थ <strong>&quot;मिट्टी की गाड़ी&quot;</strong> है; प्राचीन सामाजिक नाटक।</td>\n</tr>\n</tbody>\n</table>\n"}, {"id": "0-24", "title": "गुप्तकालीन विज्ञान, तकनीक, गणित एवं खगोलशास्त्र", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन विज्ञान, तकनीक, गणित एवं खगोलशास्त्र</h1>\n<h2>1. गणित, संख्या प्रणाली एवं दशमलव व्यवस्था (Mathematics &amp; Number System)</h2>\n<ul>\n<li><strong>शून्य का सिद्धांत एवं दशमलव प्रणाली</strong>: गुप्तकाल के दौरान ही <strong>शून्य का सिद्धांत (Theory of Zero)</strong> तथा <strong>दशमलव प्रणाली (Decimal System)</strong> का क्रांतिकारी विकास हुआ।</li>\n<li><strong>शून्य का आविष्कार</strong>:<ul>\n<li>शून्य का आविष्कार मूल रूप से एक <strong>अज्ञात भारतीय</strong> ने किया था।</li>\n<li>इसका आविष्कार <strong>ईसा पूर्व दूसरी सदी</strong> में भारतीयों द्वारा किया जा चुका था।</li>\n<li><strong>अरबों</strong> ने शून्य का प्रयोग भारत से सीखा और इसे संपूर्ण <strong>यूरोप</strong> में फैलाया।</li>\n</ul>\n</li>\n<li><strong>अंकमाला एवं अंकन पद्धति</strong>:<ul>\n<li>अंग्रेजी में भारतीय अंकमाला को <strong>अरबी अंक (Arabic Numerals)</strong> कहा जाता है।</li>\n<li>इसके विपरीत, <strong>अरब लोग</strong> भारतीय अंकों को आदरपूर्वक <strong>'हिन्दसा' (Hindasa)</strong> कहकर संबोधित करते हैं।</li>\n<li>अरबों ने ही भारतीय अंकन पद्धति को अपनाकर इसे <strong>पश्चिमी दुनिया</strong> में प्रसारित किया।</li>\n</ul>\n</li>\n<li><strong>दशमलव प्रणाली का प्रसार</strong>:<ul>\n<li>दशमलव पद्धति का आविष्कार और सर्वप्रथम प्रयोग <strong>भारतीयों</strong> ने किया।</li>\n<li><strong>चीन</strong> ने दशमलव प्रणाली का ज्ञान <strong>भारतीय बौद्ध धर्म प्रचारकों</strong> से प्राप्त किया।</li>\n<li><strong>यूरोप</strong> ने इस प्रणाली को <strong>अरबों</strong> से सीखा।</li>\n</ul>\n</li>\n<li><strong>श्रीधर (Shridhara)</strong>: इन्होंने गणित की सुप्रसिद्ध पुस्तक <strong>'त्रिशति' (Trishati)</strong> लिखी थी।</li>\n</ul>\n<h2>2. आर्यभट्ट: खगोलशास्त्र एवं बीजगणित के जनक (Aryabhata)</h2>\n<ul>\n<li><strong>परिचय</strong>: महान गणितज्ञ और खगोलशास्त्री <strong>आर्यभट्ट</strong> (5वीं शताब्दी, जन्म: <strong>476 ईस्वी</strong>) कुसुमपुर (<strong>पाटलिपुत्र/पटना</strong>) के मूल निवासी थे।</li>\n<li><strong>प्रथम ऐतिहासिक खगोलशास्त्री</strong>: आर्यभट्ट को भारत का <strong>प्रथम ऐतिहासिक खगोलशास्त्री</strong> माना जाता है। खगोलशास्त्र के सिद्धांतों के शोध के विषय में उनका प्रसिद्ध कथन है:<blockquote>\n<p><strong>&quot;मैंने खगोलशास्त्रीय सिद्धांतों के गहरे समुद्र में गोता लगाया एवं सत्यज्ञान से डूबे रत्न को अपनी बौद्धिकता की नाव से उबारा।&quot;</strong></p>\n</blockquote>\n</li>\n<li><strong>पृथ्वी की गति का सिद्धांत</strong>: आर्यभट्ट ने संपूर्ण विश्व में सर्वप्रथम यह अकाट्य सिद्धांत प्रतिपादित किया कि <strong>&quot;पृथ्वी अपनी धुरी पर घूमती हुई सूर्य की परिक्रमा करती है।&quot;</strong></li>\n<li><strong>बीजगणित के जनक</strong>: आर्यभट्ट को <strong>बीजगणित (Algebra) का जनक</strong> माना जाता है।</li>\n<li><strong>सूर्य सिद्धांत</strong>: इन्होंने <strong>'सूर्य सिद्धांत'</strong> का प्रतिपादन किया, जो खगोलशास्त्र का आधार ग्रंथ है।</li>\n<li><strong>आर्यभटीयम् ग्रंथ</strong>: इन्होंने <strong>'आर्यभटीयम्'</strong> नामक प्रसिद्ध गणितीय ग्रंथ की रचना की।<ul>\n<li><strong>आर्यभटीयम् के चार प्रमुख भाग (पाद)</strong>:<ol>\n<li><strong>दशगीतिकापाद</strong></li>\n<li><strong>गणितपाद</strong></li>\n<li><strong>कालक्रियापाद</strong></li>\n<li><strong>गोलापाद</strong></li>\n</ol>\n</li>\n<li><strong>अरबी अनुवाद</strong>: 800 ईस्वी में आर्यभटीयम् का <strong>&quot;जीज-अल-अजबहर&quot; (Zij-al-Ajabhar)</strong> नाम से अरबी भाषा में अनुवाद किया गया।</li>\n</ul>\n</li>\n<li><strong>अन्य वैज्ञानिक एवं गणितीय योगदान</strong>:<ul>\n<li><strong>ग्रहण की वैज्ञानिक व्याख्या</strong>: आर्यभट्ट ने ही सर्वप्रथम राहु-केतु के पौराणिक मिथक को तोड़कर <strong>चंद्रग्रहण व सूर्यग्रहण की वैज्ञानिक व्याख्या</strong> प्रस्तुत की।</li>\n<li><strong>त्रिभुज का क्षेत्रफल</strong>: इन्होंने <strong>त्रिभुज का क्षेत्रफल (Area of a Triangle)</strong> निकालने का गणितीय सूत्र दिया।</li>\n<li><strong>परिधि व पाई (π) का मान</strong>: इन्होंने <strong>पृथ्वी की परिधि का अनुमानित माप</strong> तथा <strong>पाई (π) का मान</strong> प्रतिपादित किया, जो आधुनिक वैज्ञानिक गणनाओं में भी सही माना जाता है।</li>\n<li><strong>त्रिकोणमिति (Trigonometry)</strong>: आर्यभट्ट ने ही सर्वप्रथम त्रिकोणमिति के <strong>Sign (ज्या)</strong> का खगोलशास्त्र में व्यावहारिक प्रयोग किया था।</li>\n<li><strong>ग्रह स्थिति की गणना</strong>: इन्होंने <strong>बेबीलोनियाई विधि</strong> का उपयोग करके ग्रह स्थिति की सटीक गणना की।</li>\n</ul>\n</li>\n</ul>\n<h2>3. वराहमिहिर: खगोलशास्त्र, ज्योतिष एवं भौगोलिक महाकोश (Varahamihira)</h2>\n<ul>\n<li><strong>परिचय</strong>: गुप्तकाल के दौरान अवंति / पश्चिमी मालवा (<strong>उज्जैन</strong>) के निवासी <strong>वराहमिहिर</strong> (छठी शताब्दी) ने खगोलशास्त्र, ज्योतिष विद्या और प्राकृतिक विज्ञान पर अनेक महत्वपूर्ण ग्रंथ लिखे।</li>\n<li><strong>प्रमुख ग्रंथ</strong>:<ul>\n<li><strong>पंचसिद्धांतिका</strong></li>\n<li><strong>लघुजातक</strong></li>\n<li><strong>वृहज्जातक</strong></li>\n<li><strong>वृहत्संहिता</strong></li>\n<li><strong>योगयात्रा (यात्रायात्रा)</strong></li>\n<li><strong>योगमाया</strong></li>\n</ul>\n</li>\n<li><strong>पंचसिद्धांतिका (Panchasiddhantika)</strong>:<ul>\n<li>इस ग्रंथ के सबसे प्रसिद्ध टीकाकार <strong>भट्टोत्पल</strong> हैं।</li>\n<li>इसमें ज्योतिष और खगोल के <strong>पाँच सिद्धांतों</strong> का संकलन है, जिनका तुलनात्मक विवरण निम्नलिखित तालिका में प्रस्तुत है:</li>\n</ul>\n</li>\n</ul>\n<h3>पंचसिद्धांतिका में वर्णित पाँच ज्योतिषीय सिद्धांतों का विश्लेषण:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">सिद्धांत का नाम</th>\n  <th style=\"text-align:left\">विशिष्टता एवं ऐतिहासिक प्रभाव</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>पितामह सिद्धांत</strong></td>\n  <td style=\"text-align:left\">प्राचीन भारतीय खगोलीय सिद्धांतों पर आधारित।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>वशिष्ठ सिद्धांत</strong></td>\n  <td style=\"text-align:left\">इस सिद्धांत में एक वर्ष की अवधि को 366 दिन के स्थान पर <strong>365.25 दिन</strong> का बताया गया है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>रोमक सिद्धांत</strong></td>\n  <td style=\"text-align:left\">इस सिद्धांत पर <strong>यूनानी (Greek) खगोलशास्त्र का प्रत्यक्ष प्रभाव</strong> स्पष्ट रूप से दिखाई देता है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>पौलिश सिद्धांत</strong></td>\n  <td style=\"text-align:left\">रोमक सिद्धांत की भाँति इस पर भी <strong>यूनानी प्रभाव</strong> है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>सूर्य सिद्धांत</strong></td>\n  <td style=\"text-align:left\">खगोलीय पिंडों और ग्रहों की गति की गणना का सबसे शुद्ध सिद्धांत।</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>पृथ्वी व चंद्रमा की गति का सिद्धांत</strong>: वराहमिहिर ने खगोलीय पिंडों की गति को स्पष्ट करते हुए लिखा कि:<blockquote>\n<p><strong>&quot;चन्द्रमा पृथ्वी के चारों ओर घूमता है एवं पृथ्वी सूर्य के चारों ओर घूमती है।&quot;</strong></p>\n</blockquote>\n</li>\n<li><strong>वृहत्संहिता (प्रथम विश्वकोषीय ग्रंथ)</strong>:<ul>\n<li>वृहत्संहिता को भारत का <strong>प्रथम विश्वकोषीय ग्रंथ (Encyclopedic text)</strong> माना जाता है।</li>\n<li>इसमें ज्योतिष के अतिरिक्त भारत के तत्कालीन <strong>भूगोल, सामाजिक जीवन, आर्थिक गतिविधियों, धार्मिक जीवन</strong> तथा <strong>स्थापत्य एवं मूर्तिकला</strong> की विस्तृत और अत्यंत प्रामाणिक जानकारी दी गई है।</li>\n<li>इस व्यापकता के कारण वृहत्संहिता को <strong>गुप्तयुगीन संस्कृति के ज्ञान का 'महाकोश'</strong> कहा जाता है।</li>\n</ul>\n</li>\n<li><strong>गणितीय पद्धतियाँ</strong>: वराहमिहिर ने गणित के क्षेत्र में <strong>वर्गमूल (Square root)</strong> एवं <strong>घनमूल (Cube root)</strong> निकालने की नवीन पद्धतियाँ प्रदान की थीं।</li>\n</ul>\n<h2>4. ब्रह्मगुप्त: खगोलशास्त्र एवं गुरुत्वाकर्षण सिद्धांत (Brahmagupta)</h2>\n<ul>\n<li><strong>परिचय</strong>: भीनमाल (<strong>जालौर, राजस्थान</strong>) में जन्मे महान गणितज्ञ व खगोलशास्त्री <strong>ब्रह्मगुप्त</strong> (जन्म: <strong>598 ईस्वी</strong>) ने भौतिकी और गणित के क्षेत्र में युगांतकारी खोजें कीं।</li>\n<li><strong>प्रमुख ग्रंथ</strong>:<ul>\n<li><strong>खंडखाद्यक</strong></li>\n<li><strong>ब्रह्मसिद्धांत / ब्रह्मस्फुट सिद्धांत</strong></li>\n<li><strong>वेदांग ज्योतिष</strong></li>\n<li><strong>ध्यान ग्रह (ध्यानग्रह)</strong></li>\n</ul>\n</li>\n<li><strong>ब्रह्मस्फुट सिद्धांत</strong>: इस ग्रंथ में खगोलीय प्रेक्षणों के लिए उपयोग होने वाले <strong>उपकरणों का पहला सुव्यवस्थित विवरण</strong> प्राप्त होता है।</li>\n<li><strong>अरबों में ज्योतिष का प्रसार</strong>: ब्रह्मगुप्त को सर्वप्रथम <strong>अरबों में भारतीय ज्योतिष और गणित के प्रचार-प्रसार का श्रेय</strong> दिया जाता है।</li>\n<li><strong>अरबी अनुवाद</strong>: ब्रह्मगुप्त के ग्रंथों का अरबी भाषा में अनुवाद प्रसिद्ध विद्वानों <strong>अलफजारी</strong> एवं <strong>अलबेरुनी</strong> द्वारा किया गया:<ul>\n<li><strong>ब्रह्मस्फुट सिद्धांत</strong> का अरबी अनुवाद: <strong>'सिन्द हिन्द'</strong> (Sindhind) नाम से किया गया।</li>\n<li><strong>खंडखाद्यक</strong> का अरबी अनुवाद: <strong>'अलात अरकन्द'</strong> (Alat Arakand) नाम से किया गया।</li>\n</ul>\n</li>\n<li><strong>गुरुत्वाकर्षण का सिद्धांत</strong>: सर आइजैक न्यूटन से सदियों पूर्व ब्रह्मगुप्त ने <strong>गुरुत्वाकर्षण (Gravity) के सिद्धांत</strong> का प्रतिपादन करते हुए स्पष्ट लिखा कि:<blockquote>\n<p><strong>&quot;पृथ्वी सभी वस्तुओं को अपनी ओर आकर्षित करती है।&quot;</strong></p>\n</blockquote>\n</li>\n</ul>\n<h2>5. भास्कर प्रथम एवं भास्कर द्वितीय (Bhaskara I &amp; Bhaskara II)</h2>\n<ul>\n<li><strong>भास्कर प्रथम (600 ईस्वी)</strong>:<ul>\n<li>इन्होंने <strong>'महाभास्कर्य'</strong> व <strong>'लघुभास्कर्य'</strong> ग्रंथों की रचना की तथा उन पर विस्तृत भाष्य लिखे।</li>\n<li>इन्होंने आर्यभटीयम् ग्रंथ पर <strong>'आर्यभटीय भाष्य' (अश्मक तंत्र)</strong> नामक प्रसिद्ध टीका लिखी थी।</li>\n</ul>\n</li>\n<li><strong>भास्कर द्वितीय / भास्कराचार्य (12वीं सदी)</strong>:<ul>\n<li><em>विशेष ध्यान रहे</em>: ये <strong>12वीं सदी</strong> के गणितज्ञ थे (गुप्तकालीन नहीं), परंतु इनका संबंध इसी वैज्ञानिक परंपरा से है।</li>\n<li>इनकी सबसे प्रसिद्ध रचना <strong>'सिद्धांत शिरोमणि'</strong> है, जिसके निम्नलिखित <strong>चार प्रमुख भाग</strong> हैं:<ol>\n<li><strong>लीलावती</strong> (इसे <strong>पाटीगणित</strong> भी कहते हैं)।</li>\n<li><strong>बीजगणित</strong></li>\n<li><strong>ग्रहगणित</strong></li>\n<li><strong>गोला</strong></li>\n</ol>\n</li>\n</ul>\n</li>\n<li><strong>महावीराचार्य</strong>: इन्होंने <strong>'गणितसार संग्रह'</strong> नामक गणितीय ग्रंथ की रचना की।</li>\n</ul>\n<h2>6. चिकित्सा शास्त्र, शल्यक्रिया एवं आयुर्वेद (Medicine &amp; Ayurveda)</h2>\n<ul>\n<li><strong>शल्यचिकित्सा (सर्जरी) एवं सुश्रुत</strong>:<ul>\n<li><strong>सुश्रुत</strong> गुप्तकाल के सुप्रसिद्ध <strong>शल्यचिकित्सक (Surgeon)</strong> थे।</li>\n<li>इनकी महान पुस्तक का नाम <strong>'सुश्रुत संहिता'</strong> है।</li>\n<li>सुश्रुत संहिता के मुख्य उपदेशक पौराणिक देव <strong>धन्वंतरी</strong> माने गए हैं।</li>\n<li>इस संहिता में जटिल शल्य क्रियाओं के लिए प्रयुक्त होने वाले <strong>121 उपकरणों का सविस्तार उल्लेख</strong> किया गया है।</li>\n</ul>\n</li>\n<li><strong>धन्वंतरि</strong>:<ul>\n<li>ये आयुर्वेद के महान चिकित्सक थे, जो सम्राट <strong>चन्द्रगुप्त विक्रमादित्य के नवरत्नों</strong> में शामिल होकर उनके दरबार की शोभा बढ़ाते थे।</li>\n<li>इन्होंने <strong>'निघंटु'</strong> नामक प्रसिद्ध आयुर्वेद ग्रंथ की रचना की।</li>\n</ul>\n</li>\n<li><strong>वाग्भट्ट</strong>:<ul>\n<li>इन्होंने आयुर्वेद के दो प्रसिद्ध ग्रंथों—<strong>'अष्टांग हृदय'</strong> एवं <strong>'अष्टांग संग्रह'</strong>—की रचना की।</li>\n</ul>\n</li>\n<li><strong>आयुर्वेदत्रयी एवं वृहत्त्रयी का तुलनात्मक वर्गीकरण</strong>:</li>\n</ul>\n<h3>आयुर्वेद शास्त्र की 'त्रयी' व्यवस्था:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">श्रेणी</th>\n  <th style=\"text-align:left\">समाहित नाम / ग्रंथ</th>\n  <th style=\"text-align:left\">ऐतिहासिक महत्व</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>आयुर्वेदत्रयी (चिकित्सक)</strong></td>\n  <td style=\"text-align:left\"><strong>चरक, सुश्रुत एवं वाग्भट्ट</strong></td>\n  <td style=\"text-align:left\">इन तीनों चिकित्सकों को आयुर्वेद चिकित्सा का स्तंभ माना जाता है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>वृहत्त्रयी (ग्रंथ)</strong></td>\n  <td style=\"text-align:left\"><strong>चरक संहिता, सुश्रुत संहिता एवं अष्टांग हृदय/संग्रह</strong></td>\n  <td style=\"text-align:left\">आयुर्वेद के इन तीनों सर्वश्रेष्ठ ग्रंथों को संयुक्त रूप से वृहत्त्रयी कहा जाता है।</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>नवनीतकम</strong>: गुप्तकाल में ही आयुर्वेद के सुप्रसिद्ध व्यावहारिक नुस्खों और औषधि ग्रंथ <strong>'नवनीतकम'</strong> की रचना हुई थी।</li>\n<li><strong>रस चिकित्सा एवं नागार्जुन (Chemistry &amp; Alchemy)</strong>:<ul>\n<li>प्रसिद्ध रसायनशास्त्री व चिकित्सक <strong>नागार्जुन</strong> ने <strong>रस चिकित्सा प्रणाली</strong> का प्रतिपादन किया।</li>\n<li>इसके अंतर्गत उन्होंने पारा तथा <strong>सोने, चाँदी, ताँबे</strong> आदि धातुओं की <strong>भस्म (Bhasma/Ash)</strong> से विभिन्न असाध्य रोगों के उपचार की वैज्ञानिक पद्धति का विकास किया।</li>\n</ul>\n</li>\n</ul>\n<h2>7. पशु चिकित्सा शास्त्र (Veterinary Science)</h2>\n<ul>\n<li><strong>शालिहोत्र ऋषि (पशु चिकित्सा के जनक)</strong>:<ul>\n<li>इन्हें भारत में <strong>पशु चिकित्सा का जनक</strong> माना जाता है।</li>\n<li>इन्होंने घोड़ों की चिकित्सा, उनके शारीरिक लक्षणों एवं रोगों के उपचार के लिए <strong>'अश्वशास्त्र' / 'शालिहोत्र संहिता' / 'होल शास्त्र'</strong> की रचना की।</li>\n</ul>\n</li>\n<li><strong>परमार भोज</strong>: इन्होंने घोड़ों की चिकित्सा पर <strong>'शालिहोत्र'</strong> नामक ग्रंथ की रचना की थी।</li>\n<li><strong>पालकाप्य</strong>:<ul>\n<li>ये हाथियों के सुप्रसिद्ध चिकित्सक थे।</li>\n<li>इन्होंने हाथियों की चिकित्सा और रोगों से संबंधित <strong>'हस्त्यायुर्वेद' (Hastyayurveda)</strong> नामक महत्वपूर्ण ग्रंथ की रचना की।</li>\n</ul>\n</li>\n</ul>\n<h2>8. धातु विज्ञान, रसायन एवं भौतिक शास्त्र (Metallurgy &amp; Physics)</h2>\n<ul>\n<li><strong>महरौली का लौह स्तंभ (Iron Pillar of Mehrauli)</strong>:<ul>\n<li>दिल्ली में स्थित महरौली का प्रसिद्ध लौह स्तंभ गुप्तकालीन धातु विज्ञान (Metallurgy) की बेजोड़ और उत्कृष्ट कला का संपूर्ण विश्व में <strong>सर्वोत्कृष्ट उदाहरण</strong> है।</li>\n<li>सदियों से खुले आसमान के नीचे धूप और बारिश में खड़े रहने के बावजूद इस पर आज तक <strong>जंग नहीं लगा है</strong>।</li>\n</ul>\n</li>\n<li><strong>इस्पात (Steel) निर्माण की कला</strong>:<ul>\n<li>इस्पात बनाने की जटिल कला का विकास संपूर्ण विश्व में सबसे पहले <strong>भारत</strong> में हुआ था।</li>\n<li>विदेशों में भारतीय इस्पात का निर्यात <strong>ईसा पूर्व चौथी सदी</strong> में ही होने लगा था।</li>\n<li>विदेशों में भारतीय इस्पात की उच्च गुणवत्ता के कारण इसे <strong>'ऊटज' (Wootz)</strong> कहा जाने लगा।</li>\n</ul>\n</li>\n<li><strong>अणु सिद्धांत (Atomic Theory)</strong>: भौतिक शास्त्र के अंतर्गत <strong>वैशेषिक दर्शन शाखा के &quot;अणु सिद्धांत&quot; (Atom Theory)</strong> का प्रतिपादन भी <strong>गुप्तकाल</strong> के दौरान हुआ था।</li>\n</ul>\n"}, {"id": "0-25", "title": "गुप्तकालीन प्रशासनिक शब्दावली, प्रमुख अभिलेख एवं सूर्य पूजा", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन प्रशासनिक शब्दावली, प्रमुख अभिलेख एवं सूर्य पूजा</h1>\n<h2>1. गुप्तकालीन विशिष्ट प्रशासनिक एवं आर्थिक शब्दावली</h2>\n<h3>क. प्रशासनिक इकाइयाँ एवं अधिकारी:</h3>\n<ul>\n<li><strong>भुक्ति (Bhukti)</strong>: गुप्त साम्राज्य में <strong>प्रांतों</strong> को 'भुक्ति' कहा जाता था।</li>\n<li><strong>विषय (Vishaya)</strong>: भुक्ति के अंतर्गत आने वाले <strong>जनपद या जिला</strong> को 'विषय' कहा जाता था।</li>\n<li><strong>महत्तर (Mahattara)</strong>: गुप्तकालीन <strong>ग्राम प्रशासन</strong> का एक प्रमुख अधिकारी या सदस्य।</li>\n<li><strong>अष्टकुलाधिकारी (Ashtakuladhikari)</strong>: <strong>आठ कुलों का मुखिया</strong> या आठ कुलों का प्रतिनिधित्व करने वाला प्रशासनिक अधिकारी।</li>\n<li><strong>कुटुम्बिन (Kutumbin)</strong>: समाज में <strong>परिवार का मुखिया</strong>।</li>\n</ul>\n<h3>ख. सामाजिक एवं व्यावसायिक वर्ग:</h3>\n<ul>\n<li><strong>पूग (Puga)</strong>: <strong>नगर में निवास करने वाले नागरिकों/व्यापारियों की समिति</strong> या संगठन।</li>\n<li><strong>कुटुम्बी (Kutumbi)</strong>: <strong>भू-स्वामी</strong> अर्थात् अपनी भूमि का मालिकाना हक रखने वाला स्वतंत्र किसान।</li>\n<li><strong>सीरिन (Sirin)</strong>: <strong>बटाई पर खेती करने वाले किसान</strong>।</li>\n<li><strong>आर्धिक (Ardhika)</strong>: <strong>फसल की बटाई (आधे हिस्से पर) करने वाली एक पृथक विशिष्ट जाति</strong>।</li>\n<li><strong>मृत्तिकार (Mrittikara)</strong>: मिट्टी के बर्तन बनाने वाला <strong>कुंभकार (कुम्हार)</strong>।</li>\n<li><strong>गंधव्य (Gandhavya)</strong>: इत्र (Perfume) बनाने वाले <strong>गंधी</strong>।</li>\n<li><strong>कासवन (Kasavana)</strong>: हजामत बनाने वाला <strong>नाई</strong>।</li>\n<li><strong>कंसकार (Kansakara)</strong>: धातु के बर्तन बनाने वाला <strong>ठठेरा</strong>।</li>\n<li><strong>भिल्ल (Bhilla)</strong>: आखेट (शिकार) द्वारा अपनी जीविका का संचालन करने वाला विशिष्ट सामाजिक वर्ग।</li>\n<li><strong>अन्तपीलक (Antapilaka)</strong>: कोल्हू से तेल निकालने वाला <strong>तेली</strong>।</li>\n<li><strong>दसक (Dasaka)</strong>: मछली पकड़ने वाला <strong>मछुआरा</strong>।</li>\n</ul>\n<h3>ग. कृषि, राजस्व एवं भूमिदान व्यवस्था:</h3>\n<ul>\n<li><strong>वापी (Vapi) एवं तड़ाग (Tadaga)</strong>: गुप्तकालीन जल संरक्षण के स्रोत अर्थात् <strong>तालाब</strong>।</li>\n<li><strong>अवलगक (Avalagaka)</strong>: युद्ध या बाहरी आक्रमण के समय <strong>स्थानीय प्रजा द्वारा अपने राजा के लिए खाद्य सामग्री का किया जाने वाला विशेष प्रबंध</strong>।</li>\n<li><strong>वात-भूत (Vata-Bhuta)</strong>: वायु और पानी (प्रकृति) के देवताओं की पूजा संपन्न करने के लिए जनता से लिया जाने वाला एक विशेष कर।</li>\n<li><strong>शुल्क (Shulka)</strong>: व्यापारियों और शिल्पकारों से ली जाने वाली सामान्य <strong>चुंगी (Custom duty)</strong>।</li>\n<li><strong>अदायिक (Adayika)</strong>: वैसा मृत व्यक्ति जिसका कोई कानूनी उत्तराधिकारी न हो, उसकी संपत्ति पर राजकीय नियंत्रण हो जाता था; इसका अंतिम <strong>मालिक राजा</strong> होता था।</li>\n<li><strong>गुप्तनिधि (Guptanidhi)</strong>: राज्य के भूमिगत खजाने या भूमि से प्राप्त <strong>राजकीय संपत्ति</strong>।</li>\n<li><strong>मेलबार (Melabara)</strong>: मंदिरों को <strong>अग्रहार गाँवों से होने वाली नियमित राजस्व आय</strong>।</li>\n<li><strong>ब्रह्मदेय (Brahmadeya)</strong>: ब्राह्मणों को राजकीय दान में दी जाने वाली <strong>सर्वथा कर-मुक्त (Tax-free) भूमि</strong>।</li>\n<li><strong>देवदान (Devadana)</strong>: देवालयों (मंदिरों) के भरण-पोषण और पूजा-अर्चना हेतु प्रदान की गई <strong>कर-मुक्त भूमि</strong>।</li>\n<li><strong>परिहार (Parihara)</strong>: वैसे देवदान भूमि जो राज्य के <strong>सभी प्रकार के करों से पूर्णतः मुक्त</strong> घोषित हो।</li>\n<li><strong>भोग (Bhoga)</strong>: स्थानीय जनता द्वारा अपने राजा को नियमित अंतराल पर फल, फूल व सब्जियों के रूप में दिया जाने वाला स्वैच्छिक कर।</li>\n<li><strong>कल्पत (Kalpat / Kalpita)</strong>: गुप्तकाल में लिया जाने वाला <strong>बिक्री कर (Sales tax)</strong>।</li>\n<li><strong>ताम्बूल (Tambula)</strong>: समाज में विनिमय और स्वागत हेतु प्रयुक्त होने वाला <strong>पान</strong>।</li>\n</ul>\n<h2>2. गुप्तकालीन प्रमुख अभिलेख एवं संबंधित शासक (Gupta Inscriptions)</h2>\n<p>गुप्त राजवंश के राजनीतिक इतिहास, सैन्य विज्यों और वंशावली के पुनर्निर्माण में अभिलेखों का स्थान सर्वोपरि है। इनका शासकवार विवरण नीचे दी गई तालिका में प्रस्तुत है:</p>\n<h3>गुप्त अभिलेखों की सुव्यवस्थित तालिका:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">अभिलेख / शिलालेख / ताम्रपत्र का नाम</th>\n  <th style=\"text-align:left\">संबंधित गुप्त शासक / महारानी</th>\n  <th style=\"text-align:left\">भौगोलिक अवस्थिति / विशेष विवरण</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>प्रयाग प्रशस्ति</strong></td>\n  <td style=\"text-align:left\"><strong>समुद्रगुप्त</strong></td>\n  <td style=\"text-align:left\">इलाहाबाद (प्रयागराज), उत्तर प्रदेश।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>महरौली लौह स्तंभ लेख</strong></td>\n  <td style=\"text-align:left\"><strong>चंद्र (चन्द्रगुप्त द्वितीय)</strong></td>\n  <td style=\"text-align:left\">दिल्ली। धातु विज्ञान का अद्भुत उदाहरण।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>उदयगिरि गुहालेख</strong></td>\n  <td style=\"text-align:left\"><strong>चन्द्रगुप्त द्वितीय</strong></td>\n  <td style=\"text-align:left\">भिलसा (विदिशा), मध्य प्रदेश।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>मथुरा स्तंभ लेख</strong></td>\n  <td style=\"text-align:left\"><strong>चन्द्रगुप्त द्वितीय</strong></td>\n  <td style=\"text-align:left\">उत्तर प्रदेश।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>बिल्सड़ अभिलेख</strong></td>\n  <td style=\"text-align:left\"><strong>कुमारगुप्त प्रथम</strong></td>\n  <td style=\"text-align:left\">एटा, उत्तर प्रदेश।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>करमदंडा अभिलेख</strong></td>\n  <td style=\"text-align:left\"><strong>कुमारगुप्त प्रथम</strong></td>\n  <td style=\"text-align:left\">फैजाबाद, उत्तर प्रदेश।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>7</strong></td>\n  <td style=\"text-align:left\"><strong>दामोदरपुर ताम्रपत्र</strong></td>\n  <td style=\"text-align:left\"><strong>कुमारगुप्त प्रथम</strong></td>\n  <td style=\"text-align:left\">बंगाल।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>8</strong></td>\n  <td style=\"text-align:left\"><strong>गढ़वा शिलालेख</strong></td>\n  <td style=\"text-align:left\"><strong>कुमारगुप्त प्रथम</strong></td>\n  <td style=\"text-align:left\">इलाहाबाद (प्रयागराज), उत्तर प्रदेश।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>9</strong></td>\n  <td style=\"text-align:left\"><strong>मंदसौर अभिलेख (473 ईस्वी)</strong></td>\n  <td style=\"text-align:left\"><strong>कुमारगुप्त द्वितीय</strong></td>\n  <td style=\"text-align:left\">मध्य प्रदेश। रेशम बुनकरों से संबंधित महत्वपूर्ण तिथि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>10</strong></td>\n  <td style=\"text-align:left\"><strong>भीतरी स्तंभ लेख</strong></td>\n  <td style=\"text-align:left\"><strong>स्कन्दगुप्त</strong></td>\n  <td style=\"text-align:left\">गाजीपुर, उत्तर प्रदेश। हूण युद्ध का प्रसंग।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>11</strong></td>\n  <td style=\"text-align:left\"><strong>कहोम स्तंभ लेख</strong></td>\n  <td style=\"text-align:left\"><strong>स्कन्दगुप्त</strong></td>\n  <td style=\"text-align:left\">गोरखपुर, उत्तर प्रदेश। जैन मूर्तियों की स्थापना।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>12</strong></td>\n  <td style=\"text-align:left\"><strong>जूनागढ़ अभिलेख</strong></td>\n  <td style=\"text-align:left\"><strong>स्कन्दगुप्त</strong></td>\n  <td style=\"text-align:left\">गुजरात। सुदर्शन झील के जीर्णोद्धार का विवरण।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>13</strong></td>\n  <td style=\"text-align:left\"><strong>गढ़वा शिलालेख</strong></td>\n  <td style=\"text-align:left\"><strong>स्कन्दगुप्त</strong></td>\n  <td style=\"text-align:left\">इलाहाबाद (प्रयागराज), उत्तर प्रदेश।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>14</strong></td>\n  <td style=\"text-align:left\"><strong>सुपिया अभिलेख</strong></td>\n  <td style=\"text-align:left\"><strong>स्कन्दगुप्त</strong></td>\n  <td style=\"text-align:left\">रीवा, मध्य प्रदेश।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>15</strong></td>\n  <td style=\"text-align:left\"><strong>पूना ताम्रपत्र</strong></td>\n  <td style=\"text-align:left\"><strong>प्रभावती गुप्ता</strong></td>\n  <td style=\"text-align:left\">गुप्त राजवंश की वंशावली और भूमिदान का विवरण।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>16</strong></td>\n  <td style=\"text-align:left\"><strong>रिद्धपुर ताम्रपत्र</strong></td>\n  <td style=\"text-align:left\"><strong>प्रभावती गुप्ता</strong></td>\n  <td style=\"text-align:left\">वाकाटक-गुप्त संबंधों का साक्ष्य।</td>\n</tr>\n</tbody>\n</table>\n<h3>राष्ट्रकूट ताम्रपत्रों से गुप्तकालीन इतिहास की जानकारी:</h3>\n<p>दक्षिण भारत के <strong>राष्ट्रकूट शासकों</strong> के निम्नलिखित तीन ताम्रपत्रों से भी गुप्त वंश के राजनीतिक इतिहास (विशेष रूप से विस्मृत शासक <strong>रामगुप्त</strong>) के विषय में अत्यंत महत्वपूर्ण ऐतिहासिक जानकारियाँ मिलती हैं:</p>\n<ol>\n<li><strong>संजन ताम्र अभिलेख</strong> - यह राष्ट्रकूट राजा <strong>अमोघवर्ष प्रथम</strong> का है।</li>\n<li><strong>काम्बे ताम्र अभिलेख</strong> - यह राष्ट्रकूट राजा <strong>गोविंद चतुर्थ</strong> का है।</li>\n<li><strong>सांगली ताम्र अभिलेख</strong> - यह भी राष्ट्रकूट राजा <strong>गोविंद चतुर्थ</strong> का है।</li>\n</ol>\n<ul>\n<li><strong>विशेष तथ्य</strong>: इन तीनों राष्ट्रकूट ताम्र लेखों से गुप्त शासक <strong>रामगुप्त</strong> के शासनकाल और ऐतिहासिकता के बारे में प्रामाणिक जानकारी मिलती है।</li>\n</ul>\n<h2>3. प्राचीन भारत में सूर्य पूजा का इतिहास (History of Sun Worship)</h2>\n<p>गुप्तकाल और उससे पूर्व के काल में सूर्य देव की उपासना अत्यधिक लोकप्रिय एवं जनसामान्य में रची-बसी थी, जिसके पुरातात्विक साक्ष्य निम्नलिखित हैं:</p>\n<h3>क. सूर्य उपासना की उत्पत्ति एवं प्रथम साक्ष्य:</h3>\n<ul>\n<li><strong>सर्वप्रथम मूर्ति का साक्ष्य</strong>: सूर्य देव की भारत में सबसे प्राचीन प्रतिमा (मूर्ति) <strong>भरहुत (मध्य प्रदेश)</strong> से प्राप्त हुई है, जो <strong>तीसरी सदी ईसा पूर्व (3rd Century BC)</strong> की मानी जाती है।</li>\n<li><strong>विदेशी प्रभाव (ईरान)</strong>: भारत में सूर्य-पूजा के व्यवस्थित स्वरूप का सूत्रपात मुख्य रूप से <strong>ईरान (फारस) के प्रभाव</strong> से हुआ था।</li>\n<li><strong>प्राचीनतम सूर्य मंदिर</strong>: संपूर्ण भारत का सबसे प्राचीनतम सूर्य मंदिर <strong>तक्षशिला का सूर्य मंदिर</strong> है।<ul>\n<li><strong>काल निर्धारण</strong>: यह ऐतिहासिक सूर्य मंदिर पश्चिमोत्तर भारत के <strong>पह्लव (Parthian) शासक गोंडोफर्नीज (Gondophares)</strong> के शासनकाल का माना जाता है।</li>\n</ul>\n</li>\n</ul>\n<h3>ख. मुल्तान (मूलस्थान) - सूर्य पूजा का महान केंद्र:</h3>\n<ul>\n<li><strong>मुल्तान का सूर्य मंदिर</strong>: प्राचीन काल में मुल्तान (मूलस्थान) सूर्य-पूजा का संपूर्ण भारत में सबसे प्रसिद्ध और पवित्र केंद्र था।</li>\n<li><strong>साम्ब द्वारा निर्माण</strong>: चीनी बौद्ध यात्री <strong>ह्वेनसांग</strong> के यात्रा विवरण के अनुसार, मुल्तान के इस विशाल सूर्य मन्दिर का निर्माण पौराणिक चरित्र <strong>साम्ब</strong> द्वारा करवाया गया था।</li>\n<li><strong>कुष्ठ रोग से मुक्ति (कुवलयमाला का साक्ष्य)</strong>: जैन आचार्य उद्योतनसूरि कृत ग्रंथ <strong>'कुवलयमाला'</strong> के अनुसार, मुल्तान का यह सूर्य मंदिर (भट्टार्क) एक ऐसे आलौकिक स्थान के रूप में प्रतिष्ठित हो गया था जहाँ <strong>कुष्ठ (Leprosy) के रोगी आकर पूजा-अर्चना करके अपने भयानक रोग से पूर्णतः मुक्त हो जाते थे</strong>।</li>\n<li><strong>विदेशी यात्रियों के विवरण</strong>: मुल्तान में होने वाली भव्य सूर्य पूजा और इस मंदिर की समृद्धि का उल्लेख पाँच सुप्रसिद्ध विदेशी लेखकों और यात्रियों ने किया है:<ol>\n<li><strong>ह्वेनसांग</strong> (चीनी यात्री)</li>\n<li><strong>अबू ज़ैद</strong> (अरब भूगोलवेत्ता)</li>\n<li><strong>अलमसूदी</strong> (अरब इतिहासकार)</li>\n<li><strong>अलबेरुनी</strong> (महान फारसी विद्वान)</li>\n<li><strong>इस्तखरी</strong> (अरब यात्री)</li>\n</ol>\n</li>\n</ul>\n<h3>ग. अन्य प्रमुख सूर्य मंदिर एवं पुरातात्विक स्थल:</h3>\n<ul>\n<li><strong>माडास्यात का सूर्य मंदिर</strong>: उत्तर प्रदेश के <strong>बुलंदशहर</strong> में स्थित 'माडास्यात' का सूर्य मन्दिर पूर्णतः <strong>गुप्तकालीन</strong> वास्तुकला का प्रतिनिधित्व करता है।</li>\n<li><strong>भारत के अन्य प्रसिद्ध ऐतिहासिक सूर्य मंदिर</strong>:<ul>\n<li><strong>मोढेरा का सूर्य मंदिर</strong> (गुजरात)</li>\n<li><strong>ओसियां का सूर्य मंदिर</strong> (जोधपुर, राजस्थान)</li>\n<li><strong>कोणार्क का सूर्य मंदिर</strong> (उड़ीसा)</li>\n</ul>\n</li>\n<li><strong>राजस्थान का सबसे प्राचीन सूर्य मंदिर</strong>: राजस्थान में सूर्य देव का सबसे प्राचीनतम मंदिर <strong>चित्तौड़गढ़ दुर्ग में स्थित कालिका माता का मंदिर</strong> है (जो प्रारंभ में मूलतः एक भव्य सूर्य मंदिर था)।</li>\n</ul>\n"}, {"id": "1-1", "title": "वर्धन राजवंश और सम्राट हर्षवर्धन (606-647 ई.)", "file": "history-medieval.md", "html": "<h1>वर्धन राजवंश और सम्राट हर्षवर्धन (606-647 ई.)</h1>\n<p>गुप्त साम्राज्य के पतन के पश्चात, <strong>वर्धन राजवंश</strong> (जिसे <strong>पुष्यभूति वंश</strong> के रूप में भी जाना जाता है) ने उत्तर भारत में सबसे विशाल साम्राज्य की स्थापना की। यह अध्ययन मार्गदर्शिका इस वंश के उद्भव, प्रमुख शासकों और विशेष रूप से सम्राट हर्षवर्धन के शासनकाल का विस्तृत विवरण प्रस्तुत करती है।</p>\n<h3>1. राजवंश की उत्पत्ति और स्थापना</h3>\n<ul>\n<li><strong>संस्थापक:</strong> <strong>पुष्यभूति</strong> को इस वंश का संस्थापक माना जाता है। उन्होंने छठी शताब्दी ईस्वी में <strong>थानेस्वर</strong> (वर्तमान हरियाणा, जिसे <strong>स्थाण्वीश्वर</strong> भी कहा जाता था) में इस वंश की नींव रखी। वे भगवान <strong>शिव</strong> के उपासक थे।</li>\n<li><strong>जाति:</strong> चीनी यात्री <strong>ह्वेनसांग</strong> और ऐतिहासिक ग्रंथ <strong>'आर्यमंजूश्रीमूलकल्प'</strong> के अनुसार, वर्धन वंश <strong>वैश्य (फीशे)</strong> जाति से संबंधित था।</li>\n<li><strong>ऐतिहासिक विरोधाभास:</strong><ul>\n<li><strong>बाणभट्ट</strong> की <strong>'हर्षचरित'</strong> में <strong>पुष्यभूति</strong> को वंश का संस्थापक बताया गया है।</li>\n<li>हालांकि, इस वंश के <strong>अभिलेखों और मुहरों</strong> में प्रथम शासक के रूप में <strong>नरवर्धन</strong> का उल्लेख मिलता है।</li>\n</ul>\n</li>\n</ul>\n<h3>2. प्रारंभिक शासक और उनकी धार्मिक निष्ठा</h3>\n<p>वर्धन वंश के प्रथम चार शासक भगवान <strong>सूर्य</strong> के अनन्य उपासक थे। इनका क्रम इस प्रकार है:</p>\n<ol>\n<li><strong>नरवर्धन</strong> (अभिलेखों के अनुसार प्रथम शासक)</li>\n<li><strong>राज्यवर्धन प्रथम</strong></li>\n<li><strong>आदित्यवर्धन</strong></li>\n<li><strong>प्रभाकरवर्धन</strong></li>\n</ol>\n<h3>3. प्रभाकरवर्धन: शक्ति का विस्तार</h3>\n<p>प्रभाकरवर्धन इस वंश के चौथे और अत्यंत शक्तिशाली शासक थे। वे <strong>'महाराजाधिराज'</strong> और <strong>'परमभट्टारक'</strong> की उपाधि धारण करने वाले इस वंश के <strong>प्रथम शासक</strong> थे।</p>\n<ul>\n<li><strong>सैन्य उपलब्धियाँ:</strong> उन्होंने ही सर्वप्रथम इस वंश में <strong>हूणों</strong> को परास्त किया था।</li>\n<li><strong>उपाधियाँ (हर्षचरित के अनुसार):</strong><ul>\n<li><strong>हूणहरिणकेसरी:</strong> हूण रूपी हिरणों के लिए सिंह के समान।</li>\n<li><strong>मालव लक्ष्मी लतापरशु:</strong> मालवा की लक्ष्मी रूपी लता को काटने के लिए कुल्हाड़ी।</li>\n<li><strong>सिंधु राजज्वर:</strong> सिंधु देश के राजा के लिए ज्वर (बुखार) के समान।</li>\n<li><strong>गुर्जर प्रजागर:</strong> गुर्जरों की नींद उड़ाने वाला।</li>\n</ul>\n</li>\n</ul>\n<p><strong>पारिवारिक घटनाएँ:</strong></p>\n<ul>\n<li>उनकी पत्नी का नाम <strong>यशोमती</strong> था। प्रभाकरवर्धन की बीमारी के दौरान, उनके जीवित रहते हुए ही यशोमती ने चिता में जलकर <strong>आत्मदाह (सती)</strong> कर लिया था।</li>\n<li>राजवैद्य <strong>रसायन</strong> और <strong>सुषेण</strong> ने प्रभाकरवर्धन को बचाने का भरसक प्रयास किया, किंतु वे सफल नहीं हुए।</li>\n</ul>\n<h3>4. उत्तराधिकार का संकट और राज्यवर्धन द्वितीय</h3>\n<p>प्रभाकरवर्धन की मृत्यु के बाद <strong>राज्यवर्धन द्वितीय</strong> सिंहासन पर बैठे। उनके शासनकाल में कई संकट आए:</p>\n<ul>\n<li>मालवा के शासक <strong>देवगुप्त</strong> ने राज्यवर्धन के बहनोई <strong>ग्रहवर्मा द्वितीय</strong> (राजश्री के पति) की हत्या कर दी और <strong>राजश्री</strong> को कारागार में डाल दिया।</li>\n<li>राज्यवर्धन ने देवगुप्त को युद्ध में मार डाला।</li>\n<li>अंततः, गौड़ (बंगाल) के राजा <strong>शशांक</strong> ने राज्यवर्धन द्वितीय की छल से हत्या कर दी।</li>\n</ul>\n<h3>5. सम्राट हर्षवर्धन (606-647 ई.)</h3>\n<p>अपने भाई राज्यवर्धन द्वितीय की मृत्यु के बाद, <strong>हर्षवर्धन</strong> 606 ई. में सिंहासन पर बैठे। उनके जन्म के समय ज्योतिषी <strong>तारक</strong> ने उनके चक्रवर्ती सम्राट बनने का संकेत दिया था।</p>\n<h4><strong>राज्यारोहण और प्रतिज्ञा</strong></h4>\n<ul>\n<li>हर्ष ने सेनापति <strong>सिंहनाद</strong> के कहने पर सिंहासन स्वीकार किया।</li>\n<li>उन्होंने <strong>606 ई.</strong> में अपने राज्यारोहण के साथ ही <strong>'हर्ष संवत'</strong> का प्रवर्तन किया।</li>\n<li>हर्ष को अपने भाई की हत्या का समाचार <strong>कुंतल</strong> नामक दूत से मिला था।</li>\n<li><strong>हर्ष की भीषण प्रतिज्ञा:</strong> 'हर्षचरित' के अनुसार, उन्होंने प्रतिज्ञा ली थी कि यदि उन्होंने कुछ ही दिनों में पृथ्वी को गौड़ राजाओं से विहीन नहीं किया, तो वे पतंगे की भाँति जलती चिता में प्रवेश कर अपने प्राण त्याग देंगे।</li>\n</ul>\n<h4><strong>राजश्री की खोज और सहायता</strong></h4>\n<ul>\n<li>हर्ष के ममेरे भाई और मित्र <strong>भंडी</strong> ने सूचना दी कि उनकी बहन राजश्री विंध्याचल के जंगलों में भाग गई है।</li>\n<li>हर्ष ने बौद्ध भिक्षु <strong>दिवाकर मित्र</strong> की सहायता से राजश्री को उस समय खोज निकाला जब वह आत्मदाह करने जा रही थीं। हर्ष और दिवाकर मित्र की प्रथम भेंट <strong>विंध्य प्रदेश</strong> में हुई थी।</li>\n</ul>\n<h4><strong>विदेशी संबंध और सैन्य अभियान</strong></h4>\n<ul>\n<li><strong>कामरूप (असम) से संधि:</strong> कामरूप के राजा <strong>भास्करवर्मा</strong> ने अपने दूत <strong>हंसबेग</strong> को असंख्य उपहारों के साथ हर्ष के पास संधि प्रस्ताव लेकर भेजा। हर्ष ने इसे स्वीकार किया और गौड़ राजा शशांक के विरुद्ध सैन्य कार्यवाही की।</li>\n<li><strong>शशांक की पराजय:</strong> हर्ष ने शशांक को पराजित किया, जिसका विवरण <strong>'आर्यमंजूश्रीमूलकल्प'</strong> में मिलता है।</li>\n</ul>\n<h4><strong>कन्नौज का प्रशासन</strong></h4>\n<ul>\n<li>ह्वेनसांग के अनुसार, <strong>बानी</strong> के नेतृत्व में कन्नौज के राजनीतिज्ञों ने हर्ष से कन्नौज का प्रशासन संभालने का अनुरोध किया।</li>\n<li><strong>अवलोकितेश्वर बोधिसत्व</strong> के परामर्श पर, हर्ष ने प्रारंभ में 'महाराज' की उपाधि धारण न करने की प्रतिज्ञा की और <strong>'आर्यपुत्र'</strong> या <strong>'राजपुत्र'</strong> की उपाधि धारण की।</li>\n<li>कालांतर में, <strong>बांसखेड़ा अभिलेख</strong> के अनुसार, उन्होंने <strong>'महाराजाधिराज'</strong> की उपाधि ग्रहण की।</li>\n<li>चीनी ग्रंथ <strong>'फेंगचिन्ह'</strong> के अनुसार, हर्ष और उनकी बहन राजश्री कन्नौज के सिंहासन पर <strong>साथ-साथ</strong> बैठते थे।</li>\n</ul>\n<h3>6. महत्वपूर्ण ऐतिहासिक संदर्भ (तालिकाएँ)</h3>\n<h4><strong>तालिका 1: प्रमुख पात्र और उनकी भूमिका</strong></h4>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>पात्र</td>\n  <td>भूमिका/संबंध</td>\n</tr>\n<tr>\n  <td><strong>पुष्यभूति</strong></td>\n  <td>वंश के संस्थापक (हर्षचरित के अनुसार)</td>\n</tr>\n<tr>\n  <td><strong>नरवर्धन</strong></td>\n  <td>अभिलेखों के अनुसार वंश के प्रथम शासक</td>\n</tr>\n<tr>\n  <td><strong>प्रभाकरवर्धन</strong></td>\n  <td>हर्ष के पिता; 'महाराजाधिराज' की उपाधि पाने वाले प्रथम राजा</td>\n</tr>\n<tr>\n  <td><strong>यशोमती</strong></td>\n  <td>हर्ष की माता; सती होने वाली रानी</td>\n</tr>\n<tr>\n  <td><strong>राज्यवर्धन द्वितीय</strong></td>\n  <td>हर्ष के बड़े भाई; शशांक द्वारा हत्या की गई</td>\n</tr>\n<tr>\n  <td><strong>राजश्री</strong></td>\n  <td>हर्ष की बहन; कन्नौज की रानी</td>\n</tr>\n<tr>\n  <td><strong>ग्रहवर्मा द्वितीय</strong></td>\n  <td>हर्ष के बहनोई; देवगुप्त द्वारा हत्या की गई</td>\n</tr>\n<tr>\n  <td><strong>देवगुप्त</strong></td>\n  <td>मालवा का राजा; राज्यवर्धन द्वारा मारा गया</td>\n</tr>\n<tr>\n  <td><strong>शशांक</strong></td>\n  <td>गौड़ (बंगाल) का राजा; हर्ष का मुख्य शत्रु</td>\n</tr>\n<tr>\n  <td><strong>दिवाकर मित्र</strong></td>\n  <td>बौद्ध भिक्षु; राजश्री को खोजने में सहायक</td>\n</tr>\n<tr>\n  <td><strong>भंडी</strong></td>\n  <td>हर्ष का ममेरा भाई और मित्र</td>\n</tr>\n<tr>\n  <td><strong>हंसबेग</strong></td>\n  <td>कामरूप के राजा भास्करवर्मा का दूत</td>\n</tr>\n<tr>\n  <td><strong>सिंहनाद</strong></td>\n  <td>हर्ष का सेनापति</td>\n</tr>\n</tbody>\n</table>\n<h4><strong>तालिका 2: ऐतिहासिक स्रोत और जानकारी</strong></h4>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>स्रोत</td>\n  <td>प्रमुख जानकारी</td>\n</tr>\n<tr>\n  <td><strong>हर्षचरित (बाणभट्ट)</strong></td>\n  <td>पुष्यभूति को संस्थापक बताना, प्रभाकरवर्धन की उपाधियाँ और हर्ष की प्रतिज्ञा</td>\n</tr>\n<tr>\n  <td><strong>ह्वेनसांग (चीनी यात्री)</strong></td>\n  <td>वंश को वैश्य बताना और कन्नौज के प्रशासन का विवरण</td>\n</tr>\n<tr>\n  <td><strong>आर्यमंजूश्रीमूलकल्प</strong></td>\n  <td>जाति का विवरण और शशांक की पराजय की जानकारी</td>\n</tr>\n<tr>\n  <td><strong>बांसखेड़ा अभिलेख</strong></td>\n  <td>हर्ष द्वारा 'महाराजाधिराज' की उपाधि धारण करने का उल्लेख</td>\n</tr>\n<tr>\n  <td><strong>फेंगचिन्ह (चीनी ग्रंथ)</strong></td>\n  <td>हर्ष और राजश्री के संयुक्त शासन (कन्नौज) का उल्लेख</td>\n</tr>\n<tr>\n  <td><strong>मुहरें और अभिलेख</strong></td>\n  <td>नरवर्धन को प्रथम शासक के रूप में दर्शाना</td>\n</tr>\n</tbody>\n</table>\n<p><strong>विशेष तथ्य:</strong> सम्राट हर्षवर्धन का काल उत्तर भारतीय इतिहास में राजनीतिक एकता और सांस्कृतिक उत्थान का युग माना जाता है, जहाँ उन्होंने अपनी कूटनीति और वीरता से एक अस्थिर साम्राज्य को सुदृढ़ता प्रदान की।</p>\n<hr />\n<h2>हर्ष साम्राज्य विस्तार और धार्मिक नीतियां</h2>\n<p>यह दस्तावेज़ <strong>हर्षवर्धन</strong> के साम्राज्य विस्तार, सैन्य अभियानों, विदेशी संबंधों और उनकी धार्मिक नीतियों का एक गहन विश्लेषण प्रदान करता है। यह अध्ययन सामग्री विशेष रूप से संघ लोक सेवा आयोग (UPSC), NET-JRF और अन्य उच्च-स्तरीय प्रतियोगी परीक्षाओं के लिए संकलित की गई है।</p>\n<h3>1. साम्राज्य विस्तार (Empire Expansion)</h3>\n<p>हर्षवर्धन का साम्राज्य उत्तर भारत के एक विशाल भू-भाग पर फैला हुआ था। उनकी विजय और विस्तार की मुख्य विशेषताएं निम्नलिखित हैं:</p>\n<ul>\n<li><strong>साम्राज्य की सीमाएं:</strong> हर्ष का साम्राज्य पूर्व में <strong>गंजाम</strong> (ओडिशा) से लेकर पश्चिम में <strong>वल्लभी</strong> (सौराष्ट्र) तक विस्तृत था। उत्तर में <strong>कश्मीर को छोड़कर</strong> शेष सभी प्रांत उनके साम्राज्य का हिस्सा थे। दक्षिण में उनका प्रभाव <strong>नर्मदा नदी</strong> के तट तक था।</li>\n<li><strong>पंचभारत (Panchabharata) विजय:</strong> हर्ष की 'पंचभारत' विजय में निम्नलिखित पांच क्षेत्र शामिल थे:<ol>\n<li>पंजाब</li>\n<li>बंगाल</li>\n<li>कन्नौज (उत्तर प्रदेश)</li>\n<li>मिथिला (बिहार)</li>\n<li>ओडिशा</li>\n</ol>\n</li>\n<li><strong>राजधानी का स्थानांतरण:</strong> अपनी बहन (<strong>राज्यश्री</strong>) के विशेष आग्रह पर, हर्ष ने अपनी राजधानी को <strong>थानेस्वर</strong> से हटाकर <strong>कन्नौज</strong> स्थानांतरित किया।</li>\n<li><strong>अंतिम युद्ध:</strong> हर्ष द्वारा लड़ा गया अंतिम युद्ध <strong>643 ईस्वी</strong> में <strong>गंजाम</strong> या <strong>कांगोद</strong> (ओडिशा) में हुआ था।</li>\n</ul>\n<h4>प्रमुख विजय एवं संघर्ष: तुलनात्मक विवरण</h4>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>शत्रु/क्षेत्र</td>\n  <td>शासक</td>\n  <td>विवरण/परिणाम</td>\n</tr>\n<tr>\n  <td><strong>वल्लभी</strong> (सौराष्ट्र)</td>\n  <td><strong>ध्रुवसेन द्वितीय</strong></td>\n  <td>हर्ष ने उसे पराजित किया। ध्रुवसेन ने भड़ौच के गुर्जर शासक <strong>दद्द द्वितीय</strong> के यहाँ शरण ली। बाद में हर्ष ने अपनी पुत्री का विवाह ध्रुवसेन से कर दिया।</td>\n</tr>\n<tr>\n  <td><strong>चालुक्य वंश</strong></td>\n  <td><strong>पुलेकेशिन द्वितीय</strong></td>\n  <td>नर्मदा नदी के तट पर युद्ध (<strong>630-634 ई.</strong>)। हर्ष इस युद्ध में पराजित हुआ।</td>\n</tr>\n<tr>\n  <td><strong>मगध</strong></td>\n  <td><strong>पूर्णवर्मा</strong></td>\n  <td>ह्वेनसांग के अनुसार, हर्ष ने पूर्णवर्मा को हराकर मगध पर अधिकार किया।</td>\n</tr>\n<tr>\n  <td><strong>सिंध</strong></td>\n  <td><strong>साहसीराय</strong></td>\n  <td>यह हर्ष का समकालीन शासक था।</td>\n</tr>\n<tr>\n  <td><strong>कश्मीर</strong></td>\n  <td><strong>दुर्लभवर्धन</strong></td>\n  <td>हर्ष ने कश्मीर नरेश से बलपूर्वक <strong>बुद्ध के दांत के अवशेष</strong> प्राप्त किए और उन्हें कन्नौज के एक विहार में सुरक्षित रखा।</td>\n</tr>\n</tbody>\n</table>\n<h3>2. हर्ष-पुलेकेशिन द्वितीय संघर्ष</h3>\n<p>हर्ष और वातापी के चालुक्य शासक <strong>पुलेकेशिन द्वितीय</strong> के मध्य हुआ युद्ध भारतीय इतिहास की एक महत्वपूर्ण घटना है।</p>\n<ul>\n<li><strong>युद्ध का कारण:</strong> हर्ष का दक्षिण की ओर विस्तार करने का प्रयास और वल्लभी पर आक्रमण।</li>\n<li><strong>युद्ध का स्थल:</strong> नर्मदा नदी का तट।</li>\n<li><strong>तिथि:</strong> 630 ईस्वी से 634 ईस्वी के बीच।</li>\n<li><strong>ऐतिहासिक स्रोत:</strong> इस युद्ध का उल्लेख <strong>ऐहोल अभिलेख</strong>, <strong>सी-यू-की</strong> (ह्वेनसांग की रचना) और <strong>येक्केरी अभिलेख</strong> में मिलता है।</li>\n<li><strong>ऐहोल अभिलेख (634 ई.):</strong> इसकी रचना <strong>रविकीर्ति</strong> ने की थी। इसमें हर्ष की पराजय का उल्लेख है और उसकी <strong>गजसेना</strong> (हाथियों की सेना) का वर्णन मिलता है। हर्ष के प्रधान हाथी का नाम <strong>दर्पशात</strong> बताया गया है।</li>\n</ul>\n<h3>3. विदेशी संबंध और चीनी मिशन</h3>\n<p>हर्षवर्धन के चीन के साथ घनिष्ठ राजनयिक संबंध थे। <strong>मात्वाालिन</strong> के अनुसार, हर्ष ने <strong>641 ईस्वी</strong> में चीनी नरेश <strong>ताई-सुंग (ती-आंग)</strong> के दरबार में अपना दूत भेजा था। इसके उत्तर में चीन से तीन दूत-मंडल हर्ष के दरबार में आए:</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>क्रम</td>\n  <td>वर्ष</td>\n  <td>चीनी दूत/मंडल का नेतृत्व</td>\n  <td>टिप्पणी</td>\n</tr>\n<tr>\n  <td>1</td>\n  <td><strong>641 ई.</strong></td>\n  <td><strong>लियांग-होई-किंग</strong></td>\n  <td>प्रथम चीनी दूत मंडल।</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td><strong>643 ई.</strong></td>\n  <td><strong>ली-यि-पियाओ</strong></td>\n  <td>द्वितीय मंडल।</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td><strong>647 ई.</strong></td>\n  <td><strong>वैन-हुआन-त्से (वांगह्वेनत्से)</strong></td>\n  <td>यह मंडल हर्ष की मृत्यु के बाद पहुँचा।</td>\n</tr>\n</tbody>\n</table>\n<h3>4. धार्मिक नीतियां और उदारता</h3>\n<p>हर्षवर्धन अपनी धार्मिक सहिष्णुता और उदारता के लिए विख्यात था।</p>\n<ul>\n<li><strong>धार्मिक विकास:</strong> हर्ष प्रारंभ में <strong>शैव</strong> मतावलंबी था और उसे अभिलेखों में <strong>'परममाहेश्वर'</strong> कहा गया है। वह सूर्य और शिव के साथ बुद्ध की भी उपासना करता था। बाद में ह्वेनसांग के प्रभाव में उसका झुकाव <strong>महायान बौद्ध धर्म</strong> की ओर अधिक हो गया।</li>\n<li><strong>प्रथम बौद्ध अनुयायी:</strong> वर्धन वंश में सर्वप्रथम हर्ष के भाई <strong>राज्यवर्धन</strong> ने बौद्ध धर्म ग्रहण किया था। <strong>बांसखेड़ा</strong> और <strong>मधुबन</strong> अभिलेखों में राज्यवर्धन को <strong>'परम सौगत'</strong> (बौद्ध) कहा गया है।</li>\n<li><strong>दानशीलता:</strong> हर्ष को उसकी अत्यधिक दानशीलता के कारण <strong>'भारतीय हातिम'</strong> भी कहा गया है। उसने <strong>नालंदा महाविहार</strong> के रखरखाव के लिए <strong>100 गाँवों</strong> की आय दान में दी थी।</li>\n<li><strong>भूमिदान के साक्ष्य:</strong> हर्ष के <strong>बांसखेड़ा</strong>, <strong>मधुबन</strong> एवं <strong>नालंदा</strong> लेखों में भूमिदान का स्पष्ट उल्लेख मिलता है।</li>\n</ul>\n<h3>5. प्रमुख धार्मिक सभाएं</h3>\n<p>हर्ष ने बौद्ध धर्म के प्रचार और विद्वानों के सम्मान में दो विशाल सभाओं का आयोजन किया:</p>\n<h4>अ. कन्नौज धर्म सभा (643 ईस्वी)</h4>\n<ul>\n<li><strong>उद्देश्य:</strong> महायान बौद्ध धर्म की महत्ता स्थापित करना।</li>\n<li><strong>अवधि:</strong> 20 दिनों तक चली।</li>\n<li><strong>सहभागी:</strong> 20 देशों के राजाओं ने भाग लिया।</li>\n<li><strong>विशेष घटना:</strong> 21वें दिन एक विशाल जुलूस निकाला गया जिसमें बुद्ध की स्वर्ण प्रतिमा सबसे आगे थी। <strong>भास्करवर्मा</strong> 'ब्रह्मा' की वेशभूषा में और <strong>हर्षवर्धन</strong> 'शक्र' (इंद्र) की वेशभूषा में बुद्ध के अनुचर के रूप में साथ चल रहे थे।</li>\n<li><strong>घोषणा:</strong> हर्ष ने घोषणा की कि यदि कोई धर्माचार्य (ह्वेनसांग) के विरुद्ध बोलेगा, तो उसकी जिह्वा (जीभ) काट ली जाएगी। सभा के अंत में <strong>500 ब्राह्मणों</strong> को देश से निर्वासित किया गया।</li>\n<li><strong>उपाधियाँ:</strong> इसी सभा में ह्वेनसांग को <strong>'महायानदेव'</strong> एवं <strong>'मोक्षदेव'</strong> की उपाधियाँ दी गईं।</li>\n<li><strong>इतिहासकार का मत:</strong> <strong>आर.के. मुकर्जी</strong> ने इस सभा को <strong>&quot;धर्मों का महासम्मेलन&quot;</strong> कहा है।</li>\n</ul>\n<h4>ब. प्रयाग महामोक्षपरिषद</h4>\n<ul>\n<li><strong>आयोजन:</strong> हर्ष प्रत्येक <strong>पांचवें वर्ष</strong> प्रयाग (संगम) में एक दान महोत्सव आयोजित करता था।</li>\n<li><strong>ह्वेनसांग की भागीदारी:</strong> चीनी यात्री ह्वेनसांग <strong>643 ईस्वी</strong> में ऐसे <strong>छठे महोत्सव</strong> में शामिल हुआ था।</li>\n<li><strong>विवरण:</strong> यह समारोह <strong>75 दिनों</strong> तक चला और इसमें 18 देशों के राजाओं ने भाग लिया।</li>\n<li><strong>पूजन पद्धति:</strong><ul>\n<li><strong>प्रथम दिन:</strong> बुद्ध की पूजा।</li>\n<li><strong>द्वितीय दिन:</strong> आदित्य (सूर्य) की पूजा।</li>\n<li><strong>तृतीय दिन:</strong> ईश्वरदेव (शिव) की पूजा।</li>\n</ul>\n</li>\n<li><strong>विदाई:</strong> प्रयाग में ही ह्वेनसांग ने हर्ष से चीन वापस जाने की अनुमति मांगी थी।</li>\n</ul>\n<h3>6. चीनी यात्री ह्वेनसांग (Hiuen Tsang)</h3>\n<ul>\n<li><strong>भारत प्रवास:</strong> ह्वेनसांग <strong>629 ईस्वी से 645 ईस्वी</strong> तक भारत में रहा।</li>\n<li><strong>शिक्षा:</strong> उसने तत्कालीन शिक्षा के प्रसिद्ध केंद्र <strong>नालंदा विश्वविद्यालय</strong> में अध्ययन किया।</li>\n<li><strong>महत्व:</strong> उसके वृत्तांत हर्ष के शासनकाल, सामाजिक स्थिति और धार्मिक आयोजनों को समझने के लिए प्राथमिक स्रोत माने जाते हैं।</li>\n</ul>\n<p><strong>नोट:</strong> यह अध्ययन मार्गदर्शिका पूर्णतः प्रदान किए गए ऐतिहासिक संदर्भों पर आधारित है और तथ्यों की शुद्धता के लिए 'हर्ष नोट 2' के विवरणों का अक्षरशः पालन करती है।</p>\n<hr />\n<h2>हर्षवर्धन प्रशासन: प्रशासनिक ढांचा, अधिकारी एवं पुरातात्विक स्रोत</h2>\n<h3>1. प्रशासनिक दर्शन एवं दिनचर्या</h3>\n<p>हर्षवर्धन एक अत्यंत परिश्रमी शासक था। प्रशासन के सुचारू संचालन के लिए उसने अपनी दिनचर्या को अत्यंत व्यवस्थित किया था:</p>\n<ul>\n<li><strong>दिन का विभाजन:</strong> हर्ष ने अपने दिन को <strong>तीन भागों</strong> में विभाजित किया था, जिसमें से <strong>एक भाग</strong> पूर्णतः <strong>राज्य-कार्य</strong> के लिए निश्चित था।</li>\n<li><strong>प्रशासनिक स्वरूप:</strong> हर्ष का शासन <strong>निरंकुश</strong> तथा <strong>गणतंत्रीय तत्वों</strong> का एक अनूठा मिश्रण था।</li>\n<li><strong>सामंतवाद का उदय:</strong> हर्ष की शासन-प्रणाली <strong>सामंत-प्रणाली</strong> की अग्रगामी मानी जाती है।</li>\n</ul>\n<h3>2. केंद्रीय सचिवालय एवं प्रमुख अधिकारी</h3>\n<p>प्रशासन में सहायता के लिए एक <strong>मन्त्रिपरिषद्</strong> होती थी। हर्ष के शासनकाल में एक सुव्यवस्थित सचिवालय कार्यरत था, जिसमें उच्च पदों पर निम्नलिखित अधिकारी नियुक्त थे:</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>अधिकारी का पद</td>\n  <td>उत्तरदायित्व एवं कार्य</td>\n</tr>\n<tr>\n  <td><strong>अवन्ति</strong></td>\n  <td>युद्ध एवं शांति का अधिकारी (विदेश मंत्री/सचिव)</td>\n</tr>\n<tr>\n  <td><strong>सिंहनाद</strong></td>\n  <td>सेनापति (प्रधान सेनापति)</td>\n</tr>\n<tr>\n  <td><strong>कुन्तल</strong></td>\n  <td><strong>अश्व सेना</strong> का प्रधान</td>\n</tr>\n<tr>\n  <td><strong>स्कन्दगुप्त</strong></td>\n  <td><strong>हस्ती सेना</strong> (गज सेना) का प्रधान</td>\n</tr>\n<tr>\n  <td><strong>भाण्डी</strong></td>\n  <td>प्रधान सचिव या प्रधानमंत्री</td>\n</tr>\n<tr>\n  <td><strong>महासंधिविग्रहिक</strong></td>\n  <td>विदेश सचिव</td>\n</tr>\n<tr>\n  <td><strong>सचिव</strong> या <strong>अमात्य</strong></td>\n  <td>मंत्री</td>\n</tr>\n</tbody>\n</table>\n<p><strong>प्रान्तीय एवं स्थानीय प्रशासन:</strong></p>\n<ul>\n<li><strong>राजस्थानीय:</strong> संभवतः ये <strong>वायसराय</strong> या <strong>प्रांत प्रमुख</strong> होते थे।</li>\n<li><strong>चाट</strong> एवं <strong>भाट</strong>: ये <strong>पुलिस अधिकारी</strong> के रूप में कानून-व्यवस्था बनाए रखने का कार्य करते थे।</li>\n<li><strong>महासामन्त</strong>: <strong>बंसखेड़ा</strong> एवं <strong>मधुबन</strong> लेखों में हर्ष के <strong>महासामन्त</strong> के रूप में <strong>स्कन्दगुप्त</strong> एवं <strong>ईश्वरगुप्त</strong> का उल्लेख प्राप्त होता है।</li>\n</ul>\n<h3>3. प्रशासनिक सुधार एवं राजधानी परिवर्तन</h3>\n<p>हर्षवर्धन ने अपनी बहन के प्रशासनिक कार्यों में सहयोग करने के उद्देश्य से अपनी राजधानी को <strong>थानेश्वर</strong> से <strong>कन्नौज</strong> स्थानांतरित किया था। <strong>हर्षचरित</strong> के अनुसार, हर्ष ने ही सर्वप्रथम पदाधिकारियों को वेतन के रूप में भूमि देने की <strong>जागीरदारी प्रथा</strong> की शुरुआत की थी।</p>\n<h3>4. भू-राजस्व एवं वेतन व्यवस्था</h3>\n<p>चीनी यात्री <strong>ह्वेनसांग</strong> के विवरणों से हर्षकालीन आर्थिक और प्रशासनिक व्यवस्था पर गहरा प्रकाश पड़ता है:</p>\n<ul>\n<li><strong>वेतन प्रणाली:</strong> <strong>मंत्रियों</strong> एवं <strong>केंद्रीय कर्मचारियों</strong> को नकद वेतन के स्थान पर <strong>भू-खंड</strong> दिए जाते थे, जबकि <strong>सैनिक पदाधिकारियों</strong> को <strong>नकद वेतन</strong> दिया जाता था।</li>\n<li><strong>राज-भूमि का विभाजन:</strong> <strong>ह्वेनसांग</strong> के अनुसार राज्य की भूमि को चार प्रमुख भागों में बाँटा गया था:<ol>\n<li><strong>प्रथम भाग:</strong> राज्य-कार्य के संचालन हेतु।</li>\n<li><strong>द्वितीय भाग:</strong> <strong>मंत्रियों</strong> तथा अन्य <strong>राजकर्मचारियों</strong> के वेतन हेतु।</li>\n<li><strong>तृतीय भाग:</strong> सुयोग्य व्यक्तियों को पुरस्कृत करने हेतु।</li>\n<li><strong>चतुर्थ भाग:</strong> धार्मिक संप्रदायों को दान देने हेतु।</li>\n</ol>\n</li>\n</ul>\n<h3>5. प्रमुख पुरातात्विक स्रोत: अभिलेख</h3>\n<p>हर्षवर्धन के शासनकाल की सटीक जानकारी प्रदान करने वाले प्रमुख अभिलेख निम्नलिखित हैं:</p>\n<ul>\n<li><strong>मधुबन ताम्रपत्र अभिलेख (631 ई.):</strong> यह उत्तर प्रदेश के <strong>मऊ</strong> जिले की <strong>घोषी तहसील</strong> में स्थित है। इसमें हर्ष द्वारा <strong>श्रावस्ती भुक्ति</strong> के <strong>सोमकुण्डा</strong> नामक ग्राम को दान में देने का विवरण मिलता है।</li>\n<li><strong>बंसखेड़ा ताम्रपत्र अभिलेख (628 ई.):</strong> यह उत्तर प्रदेश के <strong>शाहजहाँपुर</strong> जिले में स्थित है। इस अभिलेख से हर्षकालीन शासन के अनेक <strong>प्रदेशों</strong> व <strong>पदाधिकारियों</strong> के नाम, हर्ष की <strong>वंशावली</strong> तथा <strong>राज्यवर्धन</strong> की धोखे से हुई हत्या का विवरण प्राप्त होता है।</li>\n<li><strong>विशेष संदर्भ:</strong> <strong>बंसखेड़ा</strong> एवं <strong>मधुबन</strong> दोनों ही लेखों में हर्ष की <strong>नौसेना</strong> का स्पष्ट उल्लेख मिलता है।</li>\n</ul>\n<h3>6. मुद्राशास्त्रीय साक्ष्य (सिक्के एवं मुद्राएँ)</h3>\n<p>पुरातात्विक खुदाई में प्राप्त मुद्राएँ हर्ष के साम्राज्य विस्तार और धार्मिक झुकाव की पुष्टि करती हैं:</p>\n<p><strong>भिटौरा मुद्राभाण्ड:</strong> फैजाबाद जिले के <strong>भिटौरा</strong> नामक स्थान से एक विशाल <strong>मुद्राभाण्ड</strong> प्राप्त हुआ है, जिसमें निम्नलिखित <strong>चाँदी की मुद्राएँ</strong> मिली हैं:</p>\n<ul>\n<li><strong>प्रतापशील (प्रभाकर वर्धन)</strong> की <strong>9 मुद्राएँ</strong>।</li>\n<li><strong>शिलादित्य (हर्षवर्धन)</strong> की <strong>284 मुद्राएँ</strong>।</li>\n<li><strong>मौखरि नरेश ईशानवर्मा</strong> की <strong>9 मुद्राएँ</strong>।</li>\n<li><strong>सर्ववर्मा</strong> की <strong>6 मुद्राएँ</strong>।</li>\n<li><strong>अवन्ति वर्मा</strong> की <strong>17 मुद्राएँ</strong>।</li>\n</ul>\n<p><strong>अन्य प्रमुख मुद्रा साक्ष्य:</strong></p>\n<ul>\n<li><strong>सोनीपत की मुद्रा:</strong> यह <strong>ताँबे की मुद्रा</strong> है जिस पर <strong>शिव</strong>, <strong>पार्वती</strong> तथा <strong>नन्दी</strong> का अंकन है।</li>\n<li><strong>नालंदा की मुद्रा:</strong> <strong>मिट्टी की मुद्रा</strong> जिस पर <strong>'श्री हर्ष'</strong> अंकित है। इसमें हर्ष को <strong>माहेश्वर</strong>, <strong>सार्वभौम</strong> तथा <strong>महाराजाधिराज</strong> कहा गया है।</li>\n<li><strong>फर्रुखाबाद का स्वर्ण सिक्का:</strong> यहाँ से हर्ष का <strong>स्वर्ण सिक्का</strong> प्राप्त हुआ है, जिस पर <strong>'परमभट्टारक महाराजाधिराज श्रीहर्षदेव'</strong> और <strong>नन्दी</strong> पर आसीन <strong>शिव-पार्वती</strong> का अंकन है।</li>\n</ul>\n<h3>7. अन्य महत्वपूर्ण ऐतिहासिक संदर्भ</h3>\n<ul>\n<li><strong>उदित:</strong> <strong>जालंधर</strong> का राजा <strong>उदित</strong>, हर्षवर्धन का समकालीन था।</li>\n<li><strong>हर्ष का टीला:</strong> यह ऐतिहासिक स्थल <strong>थानेश्वर</strong> में स्थित है।</li>\n<li><strong>बंसखेड़ा अभिलेख</strong> हर्षकालीन प्रशासन और पदाधिकारियों के नामों की जानकारी का प्राथमिक स्रोत है।</li>\n</ul>\n<hr />\n<h2>हर्षवर्धन: साहित्यिक एवं सांस्कृतिक उपलब्धियाँ</h2>\n<p>यह दस्तावेज़ <strong>हर्षवर्धन</strong> के शासनकाल की साहित्यिक, सांस्कृतिक और प्रशासनिक उपलब्धियों का एक विस्तृत विश्लेषण प्रस्तुत करता है। इसमें उनके दरबार के विद्वानों, उनकी स्वयं की रचनाओं, समकालीन लेखकों और उनके शासन से संबंधित ऐतिहासिक साक्ष्यों का पूर्ण विवरण दिया गया है।</p>\n<h3>1. हर्षवर्धन: एक साहित्यकार सम्राट</h3>\n<p><strong>हर्षवर्धन</strong> न केवल एक महान योद्धा और प्रशासक थे, बल्कि वे उच्च कोटि के कवि और विद्वान भी थे। उनकी साहित्यिक प्रतिभा के कारण उन्हें <strong>'साहित्यकार सम्राट'</strong> के रूप में जाना जाता है।</p>\n<ul>\n<li><strong>प्रमुख नाटक:</strong> हर्ष ने संस्कृत में तीन महत्वपूर्ण नाटकों की रचना की:<ol>\n<li><strong>नागानन्द</strong></li>\n<li><strong>रत्नावली</strong></li>\n<li><strong>प्रियदर्शिका</strong></li>\n</ol>\n</li>\n<li><strong>वैकल्पिक मत:</strong> कुछ ऐतिहासिक संदर्भों और मान्यताओं के अनुसार, <strong>धावक</strong> नामक कवि ने <strong>हर्ष</strong> के नाम से ये तीनों नाटक लिखे थे।</li>\n<li><strong>कलात्मक अभिरुचि:</strong> <strong>बाणभट्ट</strong> ने अपनी रचनाओं में <strong>हर्ष</strong> को एक कुशल <strong>बांसुरी वादक</strong> के रूप में वर्णित किया है।</li>\n</ul>\n<h3>2. हर्ष के दरबारी विद्वान और उनकी कृतियाँ</h3>\n<p><strong>हर्षवर्धन</strong> का दरबार विद्वानों और कवियों से सुशोभित था। उन्होंने कई महान साहित्यकारों को संरक्षण प्रदान किया:</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>विद्वान का नाम</td>\n  <td>प्रमुख रचनाएँ / विवरण</td>\n</tr>\n<tr>\n  <td><strong>बाणभट्ट</strong></td>\n  <td><strong>कादम्बरी</strong>, <strong>हर्षचरित</strong>, <strong>चण्डीशतक</strong>, <strong>पार्वतीपरिणय</strong>, <strong>मुकुटताडितक</strong></td>\n</tr>\n<tr>\n  <td><strong>भूषणभट्ट</strong> (या <strong>पुलिन्दभट्ट</strong>)</td>\n  <td><strong>बाणभट्ट</strong> के पुत्र, जिन्होंने अपने पिता के अपूर्ण ग्रंथ <strong>कादम्बरी</strong> को पूर्ण किया।</td>\n</tr>\n<tr>\n  <td><strong>मयूरभट्ट</strong></td>\n  <td><strong>सुभाषितावली</strong>, <strong>मयूरशतक</strong>, <strong>सूर्यशतक</strong></td>\n</tr>\n<tr>\n  <td><strong>मातंग दिवाकर</strong></td>\n  <td>हर्ष की सभा के एक विद्वान, जो <strong>चांडाल</strong> जाति से संबंधित थे।</td>\n</tr>\n<tr>\n  <td><strong>ह्वेनसांग</strong></td>\n  <td>चीनी यात्री, जिन्हें हर्ष ने राजकीय संरक्षण दिया।</td>\n</tr>\n</tbody>\n</table>\n<h4><strong>बाणभट्ट</strong> का विशेष परिचय:</h4>\n<ul>\n<li>वे बिहार के <strong>औरंगाबाद</strong> जिले के <strong>प्रीतिकूट</strong> गाँव के निवासी थे।</li>\n<li>उनके द्वारा रचित <strong>हर्षचरित</strong> में कुल आठ <strong>अध्याय/उच्छवास</strong> हैं।</li>\n<li>कुछ विद्वान <strong>चण्डीशतक</strong>, <strong>पार्वतीपरिणय</strong> एवं <strong>मुकुटताडितक</strong> का रचयिता भी उन्हें ही मानते हैं।</li>\n</ul>\n<h3>3. अन्य समकालीन विद्वान एवं साहित्यिक विकास</h3>\n<p>हर्ष के काल में संस्कृत साहित्य और दर्शन का अत्यधिक विकास हुआ। इस काल के अन्य महत्वपूर्ण विद्वान और उनकी रचनाएँ निम्नलिखित हैं:</p>\n<ul>\n<li><strong>भर्तृहरि:</strong> इन्होंने <strong>शृंगारशतक</strong>, <strong>नीतिशतक</strong> और <strong>वैराग्यशतक</strong> की रचना की।</li>\n<li><strong>कुमारदास:</strong> इनके द्वारा रचित प्रसिद्ध ग्रंथ <strong>जानकीहरण</strong> है।</li>\n<li><strong>जयादित्य</strong> एवं <strong>वामन:</strong> इन्होंने <strong>काशिकावृत्ति</strong> नामक व्याकरण ग्रंथ की रचना की।</li>\n<li><strong>उद्योतकर:</strong> संभवतः इसी समय इन्होंने <strong>न्यायवार्तिक</strong> लिखा।</li>\n<li><strong>ह्वेनसांग:</strong> इन्होंने <strong>योगाचार दर्शन</strong> पर एक महत्वपूर्ण ग्रंथ की रचना की। वे चीनी सम्राट <strong>ताइशुंग</strong> के समकालीन थे।</li>\n<li><strong>जयसेन:</strong> ये एक प्रसिद्ध बौद्ध विद्वान थे। <strong>हर्ष</strong> ने उन्हें <strong>ओडिशा</strong> के 80 ग्राम दान में देने का प्रस्ताव रखा था, परंतु <strong>जयसेन</strong> ने विनीत भाव से इसे अस्वीकार कर दिया।</li>\n</ul>\n<h3>4. हर्षवर्धन की उपाधियाँ और प्रशंसात्मक वर्णन</h3>\n<p>इतिहासकारों और कवियों ने <strong>हर्षवर्धन</strong> को विभिन्न उपाधियों और विशेषणों से अलंकृत किया है:</p>\n<ul>\n<li><strong>शिलादित्य:</strong> चीनी यात्री <strong>ह्वेनसांग</strong> ने हर्ष का वर्णन इसी नाम से किया है।</li>\n<li><strong>हिन्दूकाल का अकबर:</strong> एक यूरोपीय लेखक ने <strong>हर्ष</strong> को इस नाम से संबोधित किया है।</li>\n<li><strong>कवीन्द्र</strong> एवं <strong>वाणी का हर्ष:</strong> 11वीं शताब्दी के गुजराती लेखक <strong>सोड्ढल</strong> ने अपनी रचना <strong>उदयसुन्दरी कथा</strong> में हर्ष को इन उपाधियों से विभूषित किया है।</li>\n<li><strong>कविताकामिनी का साक्षात् हर्ष</strong> / <strong>काव्य का हर्ष:</strong> <strong>गीतगोविन्द</strong> के लेखक <strong>जयदेव</strong> ने अपनी रचना <strong>प्रसन्नराघव</strong> में हर्ष की तुलना <strong>भास</strong> एवं <strong>कालिदास</strong> के समतुल्य करते हुए यह उपाधि दी है।</li>\n<li><strong>देवताओं का अवतार:</strong> <strong>हर्षचरित</strong> में हर्ष को सभी देवताओं का सम्मिलित अवतार कहा गया है।</li>\n</ul>\n<h4><strong>बाणभट्ट</strong> द्वारा प्रदत्त उपाधियाँ:</h4>\n<ul>\n<li><strong>चतुः समुद्राधिपति</strong></li>\n<li><strong>सकलराजचक्रचूड़ामणि</strong></li>\n<li><strong>सर्वचक्रवर्तिनां धौरेय</strong></li>\n</ul>\n<h4><strong>ऐतिहासिक अभिलेखों में उल्लेख:</strong></h4>\n<ul>\n<li><strong>सकलोत्तरापथनाथ:</strong> चालुक्य अभिलेखों (विशेषकर <strong>ऐहोल अभिलेख</strong>) में हर्ष को 'सम्पूर्ण उत्तरी भारत का सम्राट' या <strong>सकलोत्तरापथनाथ</strong> कहा गया है।</li>\n</ul>\n<h3>5. पुरातात्विक एवं ऐतिहासिक साक्ष्य</h3>\n<p><strong>हर्षवर्धन</strong> के शासनकाल की पुष्टि कई अभिलेखों और मुहरों से होती है:</p>\n<ul>\n<li><strong>बंसखेड़ा अभिलेख:</strong> इस अभिलेख पर <strong>हर्ष</strong> के स्वयं के हस्ताक्षर मौजूद हैं।</li>\n<li><strong>सोनीपत मुहर:</strong> इस मुहर पर हर्ष का पूरा नाम <strong>हर्षवर्धन</strong> अंकित मिलता है।</li>\n</ul>\n<h3>6. पुष्यभूति वंश का अंत</h3>\n<p><strong>हर्षवर्धन</strong> का व्यक्तिगत जीवन और उनके साम्राज्य का अंत निम्नलिखित तथ्यों से स्पष्ट होता है:</p>\n<ul>\n<li>हर्ष स्वयं <strong>निःसंतान</strong> थे।</li>\n<li>उनकी मृत्यु के साथ ही <strong>647 ईस्वी</strong> में <strong>पुष्यभूति वंश</strong> का अंत हो गया।</li>\n</ul>\n<hr />\n<h2>ह्वेनसांग (Xuanzang): जीवन, यात्रा और भारत का ऐतिहासिक विवरण</h2>\n<h3>1. व्यक्तिगत परिचय और प्रारंभिक जीवन</h3>\n<p><strong>ह्वेनसांग</strong>, जिसे <strong>युवान-चुआंग</strong> (Yuan Chwang) के नाम से भी जाना जाता है, एक महान चीनी बौद्ध भिक्षु, यात्री और विद्वान था।</p>\n<ul>\n<li><strong>जन्म:</strong> लगभग <strong>600 ई.</strong> में।</li>\n<li><strong>जन्म स्थान:</strong> चीन के <strong>होनन प्रांत</strong> का <strong>चिन-चिउ</strong> नामक स्थान।</li>\n<li><strong>पिता का नाम:</strong> <strong>चेन हुई</strong>।</li>\n<li><strong>उपाधि:</strong> उसे <strong>'तीर्थयात्रियों का राजकुमार'</strong> (Prince of Pilgrims) कहा जाता है।</li>\n<li><strong>अन्य नाम:</strong> ऐतिहासिक स्रोतों में उसके विभिन्न नाम मिलते हैं जैसे <strong>शुआन-त्यांग</strong>, <strong>युवान-चुआंग</strong>, और <strong>शुआन-त्सांग</strong>।</li>\n</ul>\n<h3>2. भारत यात्रा का वृत्तांत</h3>\n<p>ह्वेनसांग ने बौद्ध धर्म के मूल ग्रंथों का अध्ययन करने और पवित्र बौद्ध स्थलों के दर्शन के लिए भारत की यात्रा की।</p>\n<ul>\n<li><strong>प्रस्थान:</strong> वह <strong>629 ई.</strong> में चीन से भारत के लिए रवाना हुआ।</li>\n<li><strong>प्रवेश:</strong> चीनी सम्राट की आज्ञा न मिलने के कारण वह <strong>गुप्त रूप से</strong> भारत आया था।</li>\n<li><strong>प्रथम भारतीय राज्य:</strong> भारत की सीमा पर वह सर्वप्रथम <strong>कपिशा</strong> पहुँचा।</li>\n<li><strong>वापसी और सम्मान:</strong> वह <strong>644 ई.</strong> में भारत से वापस चला गया। चीन पहुँचने पर चीनी सम्राट ने उसे उसके द्वारा किए गए नियमों के उल्लंघन के लिए क्षमा कर दिया और उसे अत्यधिक सम्मानित किया।</li>\n<li><strong>मृत्यु:</strong> ह्वेनसांग की मृत्यु <strong>665 ई.</strong> में हुई।</li>\n</ul>\n<h3>3. प्रमुख शासकों के साथ संपर्क और भ्रमण किए गए क्षेत्र</h3>\n<p>ह्वेनसांग ने उत्तर से दक्षिण तक भारत के विस्तृत भू-भाग की यात्रा की और तत्कालीन शक्तिशाली शासकों के दरबारों में उपस्थिति दर्ज कराई।</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>क्षेत्र/राज्य</td>\n  <td>शासक का नाम</td>\n  <td>विवरण</td>\n</tr>\n<tr>\n  <td><strong>कन्नौज</strong></td>\n  <td><strong>हर्षवर्धन</strong></td>\n  <td>यह हर्ष की राजधानी थी और ह्वेनसांग के प्रवास का मुख्य केंद्र रही।</td>\n</tr>\n<tr>\n  <td><strong>कामरूप</strong></td>\n  <td><strong>भास्कर वर्मा</strong></td>\n  <td>ह्वेनसांग ने कामरूप के शासक के दरबार की भी यात्रा की।</td>\n</tr>\n<tr>\n  <td><strong>काँची</strong></td>\n  <td><strong>नरसिंहवर्मन</strong></td>\n  <td>दक्षिण भारत में ह्वेनसांग पल्लव नरेश नरसिंहवर्मन की राजधानी काँची पहुँचा।</td>\n</tr>\n<tr>\n  <td><strong>मो-हो-ला-चा (महाराष्ट्र)</strong></td>\n  <td><strong>पुलकेशिन (द्वितीय)</strong></td>\n  <td>काँची से वह चालुक्य शासक पुलकेशिन के राज्य महाराष्ट्र गया।</td>\n</tr>\n<tr>\n  <td><strong>सिंध</strong></td>\n  <td>-</td>\n  <td>ह्वेनसांग ने सिंध की यात्रा की और वहां के शासक को <strong>'शूद्र'</strong> बताया।</td>\n</tr>\n<tr>\n  <td><strong>मालवा और वल्लभी</strong></td>\n  <td>-</td>\n  <td>उसने मालवा एवं वल्लभी राज्यों का भी भ्रमण किया।</td>\n</tr>\n</tbody>\n</table>\n<h3>4. शिक्षा और शैक्षणिक केंद्र</h3>\n<p>ह्वेनसांग का मुख्य उद्देश्य बौद्ध दर्शन की शिक्षा प्राप्त करना था, जिसके लिए उसने तत्कालीन प्रमुख केंद्रों में समय बिताया।</p>\n<ul>\n<li><strong>थानेश्वर:</strong> यहाँ उसने <strong>जयगुप्त</strong> नामक बौद्ध विद्वान से शिक्षा ग्रहण की।</li>\n<li><strong>नालंदा विश्वविद्यालय:</strong><ul>\n<li>उसने नालंदा में उच्च शिक्षा प्राप्त की।</li>\n<li>उस समय नालंदा विश्वविद्यालय के <strong>कुलपति</strong> (Chanceller) <strong>आचार्य शीलभद्र</strong> थे।</li>\n<li>नालंदा प्रवास के दौरान ह्वेनसांग को <strong>'मोक्षदेव'</strong> नाम दिया गया।</li>\n</ul>\n</li>\n</ul>\n<h3>5. धार्मिक सभाएँ और आयोजन</h3>\n<p>ह्वेनसांग ने सम्राट हर्षवर्धन के संरक्षण में आयोजित महत्वपूर्ण धार्मिक परिषदों में सक्रिय भूमिका निभाई।</p>\n<ul>\n<li><strong>कन्नौज की धर्मसभा:</strong> ह्वेनसांग ने कन्नौज में आयोजित विशाल धर्मसभा की <strong>अध्यक्षता</strong> की थी।</li>\n<li><strong>छठी महामोक्ष परिषद:</strong> <strong>643 ई.</strong> में <strong>प्रयाग</strong> में आयोजित छठी महामोक्ष परिषद में ह्वेनसांग ने भाग लिया था।</li>\n</ul>\n<h3>6. साहित्यिक कृति: सी-यू-की (Si-Yu-Ki)</h3>\n<p>ह्वेनसांग ने अपनी भारत यात्रा के अनुभवों को एक वृत्तांत के रूप में लिपिबद्ध किया।</p>\n<ul>\n<li><strong>ग्रंथ का नाम:</strong> <strong>'सी-यू-की'</strong> (Si-Yu-Ki), जिसका अर्थ है <strong>&quot;पश्चिमी संसार का विवरण&quot;</strong>।</li>\n<li><strong>अंग्रेजी अनुवाद:</strong> इस प्रसिद्ध ग्रंथ का अंग्रेजी में अनुवाद <strong>बील</strong> (Beal) द्वारा किया गया।</li>\n</ul>\n<h3>7. भारतीय समाज और संस्कृति का विवरण</h3>\n<p>ह्वेनसांग के विवरणों से तत्कालीन भारत की सामाजिक, धार्मिक और प्रशासनिक व्यवस्था पर गहरा प्रकाश पड़ता है:</p>\n<ul>\n<li><strong>इतिहास लेखन:</strong> ह्वेनसांग के अनुसार, <strong>भारत के प्रत्येक प्रांत में इतिहास लिखने के लिए इतिहासकार नियुक्त थे</strong>।</li>\n<li><strong>बौद्ध धर्म की स्थिति:</strong> उसके समय में बौद्ध धर्म <strong>18 संप्रदायों</strong> में विभाजित हो चुका था।</li>\n<li><strong>बंगाल में जैन धर्म:</strong> उसने <strong>बंगाल</strong> में <strong>जैन धर्म</strong> को अत्यंत समृद्ध और उन्नत स्थिति में पाया।</li>\n<li><strong>वाराणसी की भव्यता:</strong> वाराणसी में उसने <strong>100 फीट ऊँची शिव मूर्ति</strong> का उल्लेख किया है।</li>\n<li><strong>मथुरा के वस्त्र:</strong> ह्वेनसांग के अनुसार, <strong>मथुरा</strong> अपने <strong>सूती वस्त्रों</strong> के निर्माण के लिए विश्व प्रसिद्ध था।</li>\n<li><strong>मलय पर्वत के चंदन:</strong> उसने <strong>मलय पर्वत (मलकूट)</strong> पर पाए जाने वाले <strong>चंदन</strong> की अत्यधिक प्रशंसा की है।</li>\n</ul>\n<hr />\n"}, {"id": "1-2", "title": "पाल राजवंश: एक विस्तृत ऐतिहासिक विवरण", "file": "history-medieval.md", "html": "<h1>पाल राजवंश: एक विस्तृत ऐतिहासिक विवरण</h1>\n<p>पाल राजवंश प्राचीन और मध्यकालीन भारत के इतिहास में, विशेषकर बंगाल और बिहार के क्षेत्रों में, एक अत्यंत महत्वपूर्ण स्थान रखता है। यह राजवंश न केवल अपनी राजनीतिक शक्ति के लिए, बल्कि बौद्ध धर्म के संरक्षण, कला, साहित्य और शिक्षा के प्रसार के लिए भी जाना जाता है।</p>\n<h3>1. पाल राजवंश की स्थापना और प्रारंभिक इतिहास</h3>\n<p>पाल राजवंश की स्थापना <strong>गोपाल</strong> (750–770 ई.) ने की थी।</p>\n<ul>\n<li><strong>मत्स्य न्याय का अंत:</strong> धर्मपाल के <strong>खलीमपुर लेख</strong> के अनुसार, बंगाल में व्याप्त अव्यवस्था और अराजकता (जिसे 'मत्स्य न्याय' कहा गया है) को समाप्त करने के लिए जनता ने स्वयं <strong>गोपाल</strong> को अपना राजा चुना।</li>\n<li><strong>धार्मिक झुकाव:</strong> पाल वंश के शासक बौद्ध धर्म के अनुयायी थे।</li>\n<li><strong>स्थापत्य:</strong> गोपाल ने बिहार में <strong>ओदन्तपुरी विहार</strong> का निर्माण करवाया था (यद्यपि कुछ विद्वान इसका श्रेय धर्मपाल को देते हैं)।</li>\n</ul>\n<h3>2. प्रमुख शासक और उनकी उपलब्धियाँ</h3>\n<h4><strong>धर्मपाल (770–810 ई.)</strong></h4>\n<p>धर्मपाल गोपाल का पुत्र था जिसने पाल वंश को नई ऊँचाइयों पर पहुँचाया।</p>\n<ul>\n<li><strong>उपाधियाँ:</strong><ul>\n<li>गुजराती कवि सोढ्ढल ने अपनी कृति 'उदय सुन्दरी कथा' में उसे <strong>उत्तरापथ स्वामी</strong> कहा है।</li>\n<li>अभिलेखों में उसे <strong>परमसौगत</strong> कहा गया है।</li>\n<li>उसने <strong>विक्रमशील</strong>, <strong>परमेश्वर</strong>, <strong>निर्वाण नारायण</strong> और <strong>राजत्रयाधिपति</strong> (अश्वपति, गजपति, नरपति—तीन राजाओं का स्वामी) जैसी उपाधियाँ धारण कीं।</li>\n<li><em>नोट:</em> राजत्रयाधिपति की उपाधि धर्मपाल के अतिरिक्त गोविंदचन्द्र (गहड़वाल) और लक्ष्मीकर्ण (कलचुरी) ने भी धारण की थी।</li>\n</ul>\n</li>\n<li><strong>युद्ध और संघर्ष:</strong> उसे प्रतिहार शासक वत्सराज और राष्ट्रकूट शासक ध्रुव प्रथम से पराजय का सामना करना पड़ा। उसने कन्नौज पर अधिकार कर एक भव्य दरबार का आयोजन किया, जिसमें प्रतिहार नरेश वत्सराज ने भी भाग लिया।</li>\n<li><strong>सांस्कृतिक योगदान:</strong><ul>\n<li>उसने प्रसिद्ध <strong>विक्रमशिला विश्वविद्यालय</strong> की स्थापना की।</li>\n<li>बंगाल के <strong>सोमपुरी</strong> (पहाड़पुरी) में मठों का निर्माण करवाया।</li>\n<li>उसकी सभा में प्रसिद्ध बौद्ध विद्वान <strong>हरिभद्र</strong> निवास करते थे, जिन्होंने <strong>'अष्टसाहस्रिका प्रज्ञापारमिता'</strong> नामक बौद्ध ग्रंथ की रचना की।</li>\n</ul>\n</li>\n</ul>\n<h4><strong>देवपाल (810–850 ई.)</strong></h4>\n<p>धर्मपाल का पुत्र देवपाल इस वंश का सर्वाधिक प्रतापी शासक था।</p>\n<ul>\n<li><strong>सैन्य विजय:</strong> नारायणपाल के <strong>बादल अभिलेख</strong> के अनुसार, देवपाल ने उत्कल, हूणों, द्रविड़ों और गुर्जरों को पराजित किया था। उसने गुर्जर प्रतिहार शासक रामभद्र और मिहिरभोज को भी परास्त किया।</li>\n<li><strong>विदेशी संबंध:</strong> <strong>नालंदा ताम्रपत्र</strong> के अनुसार, मलया (सुमात्रा/जावा) के शैलेंद्रवंशी राजा <strong>बालपुत्रदेव</strong> के प्रार्थना करने पर देवपाल ने नालंदा के बौद्ध विहार के लिए पाँच गाँव दान में दिए। उसने <strong>वीरसेन</strong> नामक बौद्ध विद्वान को नालंदा विहार का अध्यक्ष नियुक्त किया।</li>\n<li><strong>राजधानी:</strong> देवपाल ने <strong>मुंगेर</strong> को अपनी राजधानी बनाया।</li>\n<li><strong>उपाधि और मूल्यांकन:</strong> उसे 'परम सौगत' कहा गया है। तारानाथ ने उसे &quot;बौद्ध धर्म का पुनरुद्धारक और पुनर्स्थापक&quot; माना है। उसके सुयोग्य मंत्रियों में <strong>दर्भपाणि</strong> और <strong>केदार मिश्र</strong> शामिल थे।</li>\n</ul>\n<h4><strong>महिपाल प्रथम (988–1038 ई.)</strong></h4>\n<p>इसे पाल वंश का <strong>द्वितीय संस्थापक</strong> माना जाता है क्योंकि इसने पाल वंश की खोई हुई शक्ति को पुनः स्थापित किया।</p>\n<ul>\n<li><strong>चोल आक्रमण:</strong> महिपाल के शासनकाल में राजेंद्र चोल ने आक्रमण कर उसे पराजित किया था।</li>\n<li><strong>धार्मिक प्रसार:</strong> उसने <strong>दीपांकर श्रीज्ञान</strong> (जिन्हें 'अतिसा' भी कहा जाता है) के नेतृत्व में एक बौद्ध प्रचार मंडल तिब्बत भेजा।</li>\n</ul>\n<h4><strong>रामपाल (1077–1130 ई.)</strong></h4>\n<p>रामपाल इस वंश का अंतिम महत्वपूर्ण शासक था। वह विग्रहपाल तृतीय का पुत्र था।</p>\n<ul>\n<li><strong>साहित्यिक प्रमाण:</strong> <strong>संध्याकर नंदी</strong> द्वारा रचित <strong>'रामपालचरित'</strong> में उसका विस्तृत वर्णन है। यह ग्रंथ 'श्लेष शैली' में लिखा गया है, जिसमें रामायण के राम और पाल शासक रामपाल की कथा साथ-साथ चलती है।<ul>\n<li>संध्याकर नंदी ने स्वयं को 'कलिकाल वाल्मीकि' कहा है।</li>\n</ul>\n</li>\n<li><strong>कैवर्त विद्रोह:</strong> रामपालचरित में कैवर्तों (कृषक समुदाय) के नेता <strong>भीम</strong> (दिव्वोक का पुत्र) को पराजित करने का उल्लेख है।</li>\n<li><strong>अंत:</strong> रामपाल ने गंगा नदी (प्रयाग) में डूबकर अपने प्राण त्याग दिए थे।</li>\n</ul>\n<h3>3. पाल राजवंश के अन्य उत्तराधिकारी</h3>\n<p>महिपाल प्रथम के बाद शासकों का क्रम इस प्रकार रहा: | शासक | शासन काल | | :--- | :--- | | नयपाल | 1038–1055 ई. | | विग्रहपाल तृतीय | 1055–1070 ई. | | महिपाल द्वितीय | 1070–1075 ई. | | सुरपाल द्वितीय | 1075–1077 ई. | | रामपाल | 1077–1130 ई. | | मदनपाल | पाल वंश का अंतिम शासक |</p>\n<h3>4. सांस्कृतिक, साहित्यिक और कलात्मक योगदान</h3>\n<h4><strong>शिक्षा और विद्वान</strong></h4>\n<ul>\n<li><strong>विक्रमशिला विश्वविद्यालय:</strong> यह शिक्षा का प्रमुख केंद्र था। यहाँ दीपांकर, अभयंकर, ज्ञानपाद, रत्नवज्र और संतरक्षित जैसे बौद्ध विद्वानों को संरक्षण प्राप्त था। 1203 ई. में बख्तियार खिलजी के आक्रमण से यह नष्ट हो गया।</li>\n<li><strong>बौद्ध धर्म:</strong> पाल शासकों के समय <strong>तांत्रिक बौद्ध धर्म</strong> का अत्यधिक विकास हुआ। वज्रयान में मंत्रपाठ के विरोध में एक पृथक तांत्रिक संप्रदाय बना जो <strong>'सहजयान'</strong> के नाम से प्रसिद्ध हुआ। बौद्ध विचारकों ने <strong>'चर्यापदों'</strong> की रचना की।</li>\n</ul>\n<h4><strong>साहित्य और विज्ञान</strong></h4>\n<ul>\n<li><strong>जीमूतवाहन:</strong> 12वीं शताब्दी के प्रसिद्ध लेखक, जिन्होंने <strong>'दायभाग'</strong> की रचना की, पाल शासकों के दरबार से संबद्ध थे।</li>\n<li><strong>चक्रपाणि दत्त:</strong> 11वीं शताब्दी के बंगाल के प्रसिद्ध चिकित्साशास्त्री। उनकी प्रमुख कृ
