trong>: छठी शताब्दी के सुप्रसिद्ध इतिहासकार <strong>प्रोकोपियस</strong> के यात्रा विवरण से प्रमाणित होता है कि <strong>फारसवासियों (Persians)</strong> ने रेशम के अंतर्राष्ट्रीय व्यापार पर अपना पूर्ण एकाधिकार स्थापित कर लिया था।</li>\n<li><strong>रोमन-फारसी शत्रुता</strong>: फारस की रोमन साम्राज्य के साथ तीव्र शत्रुता और अनवरत संघर्ष के कारण भारतीय अंतर्राष्ट्रीय व्यापार को बहुत अधिक क्षति और आर्थिक नुकसान उठाना पड़ा।</li>\n<li><strong>पूर्वी रोमन साम्राज्य की आत्मनिर्भरता (550 ईस्वी)</strong>: <strong>550 ईस्वी</strong> के आस-पास पूर्वी रोमन साम्राज्य ने स्वयं सीधे चीन से <strong>रेशम उगाने (रेशम कीट पालन) की कला सीख ली</strong>, जिसके कारण भारत का रेशम निर्यात व्यापार अत्यंत बुरी तरह प्रभावित हुआ।</li>\n</ul>\n<h2>3. चीन एवं बाइजेंटाइन व्यापारिक संबंध (China &amp; Byzantine Trade)</h2>\n<ul>\n<li><strong>व्यापारिक निरंतरता</strong>: ह्रास के बावजूद गुप्तकाल में चीन तथा पूर्वी रोमन साम्राज्य जिसे <strong>बाइजेंटाइन साम्राज्य (Byzantine Empire)</strong> भी कहा जाता है, के साथ व्यापारिक संपर्क बने रहे।</li>\n<li><strong>मध्यस्थ की भूमिका (सिंहल द्वीप)</strong>: यूनानी लेखक व भूगोलवेत्ता <strong>कॉस्मास</strong> के वर्णन के अनुसार, भारत और चीन के मध्य होने वाले समुद्री व्यापार में <strong>सिंहल द्वीप (श्रीलंका)</strong> एक अत्यंत महत्वपूर्ण <strong>बिचौलिए (मध्यस्थ)</strong> का कार्य करता था।</li>\n<li><strong>फाह्यान का साक्ष्य</strong>: चीनी बौद्ध यात्री <strong>फाह्यान</strong> अपनी भारत यात्रा के पश्चात् स्वयं सीधे एक <strong>व्यापारी जहाज</strong> पर सवार होकर चीन वापस गया था, जो समुद्री व्यापार की निरंतरता को दर्शाता है।</li>\n<li><strong>चीनांशुक का उल्लेख</strong>: महाकवि <strong>कालिदास</strong> ने अपने काव्यों में चीन के प्रसिद्ध रेशमी वस्त्रों के लिए <strong>&quot;चीनांशुक&quot;</strong> शब्द का गौरवपूर्वक उल्लेख किया है।</li>\n<li><strong>वस्तु विनिमय (Barter System) पर आधारित व्यापार</strong>: भारत और चीन के मध्य होने वाला यह व्यापार मुख्य रूप से वस्तुओं की अदला-बदली पर ही आधारित था, क्योंकि इन दोनों देशों में एक-दूसरे के सिक्के पुरातात्विक साक्ष्य के रूप में प्राप्त नहीं हुए हैं।</li>\n<li><strong>निर्यातित वस्तुएँ</strong>: बाइजेंटाइन साम्राज्य को भारत से निर्यात की जाने वाली प्रमुख वस्तुओं में <strong>रेशम</strong> तथा बहुमूल्य <strong>मसाले</strong> सर्वप्रमुख थे।</li>\n<li><strong>दक्षिण-पूर्व एशियाई व्यापार का सत्य</strong>: विधिक और ऐतिहासिक साक्ष्यों के अनुसार, दक्षिण-पूर्व एशियाई देशों (सुवर्णभूमि आदि) के साथ होने वाले व्यापारिक लाभ का श्रेय <strong>गुप्त नरेशों (शासकों) को नहीं दिया जा सकता है</strong>।</li>\n</ul>\n<h2>4. प्रमुख बंदरगाह एवं व्यापारिक केंद्र (Ports &amp; Trade Centers)</h2>\n<ul>\n<li><strong>ताम्रलिप्ति बंदरगाह (पूर्वी तट)</strong>: यह पूर्वी भारत का सर्वप्रमुख बंदरगाह था, जहाँ से चीन, श्रीलंका तथा संपूर्ण दक्षिण-पूर्वी एशिया के देशों के साथ निरंतर नौपरिवहन और समुद्री व्यापार संपन्न होता था।</li>\n<li><strong>भड़ौंच बंदरगाह (पश्चिमी तट)</strong>: यह पश्चिमी भारत का सबसे महत्वपूर्ण बंदरगाह था, जहाँ से मुख्यतः पाश्चात्य देशों (पश्चिमी जगत) के साथ बड़े पैमाने पर व्यापारिक जलयान संचालित होते थे।</li>\n<li><strong>पैठन (प्रतिष्ठान)</strong>: गुप्तकाल में सुदूर पश्चिम का सबसे प्रमुख व्यापारिक केंद्र <strong>पैठन</strong> था।</li>\n<li><strong>कल्याण</strong>: यूनानी लेखक <strong>कॉस्मास</strong> ने अपने यात्रा विवरण में <strong>कल्याण</strong> (कलिआन) को एक अत्यंत समृद्ध और गतिशील व्यापारिक केंद्र के रूप में रेखांकित किया है।</li>\n</ul>\n<h2>5. जलयान निर्माण, धातुकला एवं प्रमुख उद्योग (Industries)</h2>\n<ul>\n<li><strong>जलयान निर्माण (Cavalry/Shipbuilding)</strong>: गुप्तकाल में भारत जलयान निर्माण (जहाज बनाने की तकनीक) के क्षेत्र में समकालीन संपूर्ण <strong>यूरोप से काफी आगे</strong> था।</li>\n<li><strong>कामसूत्र में धातुकला का स्थान</strong>: वात्स्यायन रचित <strong>'कामसूत्र'</strong> में वर्णित <strong>64 कलाओं</strong> के अंतर्गत <strong>'धातुकला'</strong> को भी एक विशिष्ट और महत्वपूर्ण स्थान प्रदान किया गया है।</li>\n<li><strong>सूती वस्त्र उद्योग</strong>: गुप्त काल में <strong>सूती वस्त्र निर्माण</strong> ही देश का सर्वप्रमुख उद्योग था।</li>\n<li><strong>वाराणसी</strong>: यह नगर <strong>रेशमी कपड़ों (Silk textiles)</strong> के उत्पादन का संपूर्ण साम्राज्य में सर्वोत्तम एवं सर्वप्रमुख केंद्र था।</li>\n<li><strong>अमरकोश में रत्नों की सूची</strong>: अमरसिंह द्वारा रचित <strong>'अमरकोश'</strong> में तत्कालीन समाज में प्रचलित विभिन्न प्रकार के कीमती तथा अर्ध-बहुमूल्य रत्नों (Precious &amp; Semi-precious stones) की एक विस्तृत सूची दी गई है।</li>\n</ul>\n<h2>6. नगरीकरण का ह्रास एवं नगरों का क्रमिक पतन (Deurbanization)</h2>\n<ul>\n<li><strong>नगरों का क्रमिक पतन</strong>: संपूर्ण गुप्तकाल की सबसे बड़ी और विशिष्ट विशेषता <strong>नगरों का क्रमिक पतन</strong> (Deurbanization) थी।</li>\n<li><strong>गंगाघाटी की रौनक का अंत</strong>: कुषाण युग के समय के जो अत्यंत समृद्ध गंगाघाटी के व्यापारिक शहर थे, वे अब गुप्तकाल तक आते-आते अपनी ऐतिहासिक रौनक पूर्णतः खो चुके थे।</li>\n<li><strong>पाटलिपुत्र की स्थिति</strong>: मौर्य साम्राज्य की भव्य राजधानी रहा <strong>पाटलिपुत्र</strong> चीनी बौद्ध यात्री <strong>ह्वेनसांग</strong> के आगमन काल तक केवल एक <strong>छोटा गाँव बन चुका था</strong>।</li>\n<li><strong>इंपोर्ट (आयात) की जाने वाली वस्तुएँ</strong>: पश्चिमी जगत (पाश्चात्य देशों) से भारत में मुख्य रूप से <strong>मदिरा (वाइन)</strong>, <strong>बहुमूल्य रत्न</strong>, <strong>औषधियाँ</strong> तथा दुर्लभ <strong>जड़ी-बूटियाँ</strong> आयात की जाती थीं।</li>\n<li><strong>रोम में कालीमिर्च और रेशम का मूल्य (408 ईस्वी)</strong>: <strong>408 ईस्वी</strong> में जब हूण आक्रमणकारी <strong>एलेरिक</strong> ने रोम साम्राज्य को अपनी घेराबंदी से मुक्त किया, तो उसने हर्जाने के रूप में रोम के निवासियों से विशेष तौर पर <strong>3000 पाउंड कालीमिर्च</strong> तथा <strong>4000 रेशम के थान</strong> की मांग की थी, जो तत्कालीन पश्चिमी जगत में भारतीय मसालों व रेशम के अत्यधिक आर्थिक मूल्य को प्रमाणित करता है।</li>\n<li><strong>विद्वानों के मत एवं साहित्यिक भविष्यवाणियाँ</strong>:<ul>\n<li>प्रसिद्ध इतिहासकार <strong>आर. एस. शर्मा</strong> ने भारतीय उपमहाद्वीप के इतिहास में <strong>मौर्योत्तर काल</strong> (Post-Mauryan Period) को <strong>नगरीकरण का 'स्वर्ण काल'</strong> माना था, जिसके विपरीत गुप्तकाल में नगरीय ह्रास दिखाई देता है।</li>\n<li>वराहमिहिर की <strong>वृहत्संहिता</strong> में स्पष्ट रूप से यह खगोलीय भविष्यवाणी की गई थी कि भविष्य में विभिन्न प्रसिद्ध और समृद्ध <strong>शहर या तो पूरी तरह नष्ट हो जाएंगे या फिर उनके बुरे दिन आ जाएंगे</strong>।</li>\n<li>महाकवि कालिदास के सुप्रसिद्ध महाकाव्य <strong>'रघुवंश'</strong> में भी तत्कालीन ऐतिहासिक नगरों के पतन की तार्किक व्याख्या <strong>लंबी दूरी के अंतर्राष्ट्रीय व्यापार के पतन</strong> के साथ जोड़कर की गई है।</li>\n</ul>\n</li>\n</ul>\n"}, {"id": "0-17", "title": "गुप्तकालीन सामाजिक जीवन एवं वर्ण व्यवस्था", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन सामाजिक जीवन एवं वर्ण व्यवस्था</h1>\n<h2>1. वर्ण व्यवस्था की सामान्य विशेषताएँ (General Structure of Varna System)</h2>\n<ul>\n<li><strong>पारंपरिक वर्गीकरण</strong>: गुप्तकालीन समाज पारंपरिक रूप से <strong>चार वर्णों</strong> (ब्राह्मण, क्षत्रिय, वैश्य और शूद्र) में विभाजित था ।</li>\n<li><strong>वर्ण का आधार</strong>: इस काल में वर्ण व्यवस्था का मूल आधार व्यक्तिगत गुण और कर्म न होकर पूर्णतः <strong>&quot;जन्म&quot;</strong> पर आधारित हो गया था ।</li>\n<li><strong>भौगोलिक बस्तियों का विभाजन</strong>: मौर्यकालीन अर्थशास्त्री <strong>कौटिल्य के 'अर्थशास्त्र'</strong> तथा गुप्तकालीन ज्योतिषाचार्य वराहमिहिर की <strong>'वृहत्संहिता'</strong> में समाज के चारों वर्णों के लिए नगरों में <strong>अलग-अलग बस्तियों (निवास क्षेत्रों) का विधिक विधान</strong> किया गया है ।</li>\n<li><strong>जातियों की संख्या में असाधारण वृद्धि के कारण</strong>:<ol>\n<li><strong>आदिवासियों का आत्मसातीकरण</strong>: गुप्तकाल में बड़े पैमाने पर दिए गए <strong>भूमि अनुदानों</strong> के माध्यम से अनेक <strong>आदिवासी जातियों</strong> का हिंदू/ब्राह्मण समाज में आत्मसातीकरण (Assimilation) हुआ, जिससे नई जातियों की संख्या बढ़ी ।</li>\n<li><strong>शिल्पी श्रेणियों का जातिकरण</strong>: तत्कालीन शिल्पकारों और कारीगरों की <strong>व्यापारिक श्रेणियों (Guilds)</strong> ने भी धीरे-धीरे रूढ़ होकर अपनी स्वतंत्र जातियों का रूप धारण कर लिया था ।</li>\n</ol>\n</li>\n<li><strong>सामाजिक गतिशीलता (Social Mobility)</strong>: सामाजिक बंधनों के बावजूद तत्कालीन विभिन्न <strong>जातियों व श्रेणियों में गतिशीलता (Mobility) काफी अधिक थी</strong> ।</li>\n</ul>\n<h2>2. न्यायिक संहिताओं में वर्णगत विभेद (Varna-based Legal Ordeals &amp; Testimony)</h2>\n<p>गुप्तकाल की विभिन्न कानूनी स्मृतियों और न्याय संहिताओं में वर्ण के आधार पर न्याय प्रणाली में स्पष्ट विभेद किया गया था:</p>\n<h3>क. दिव्य परीक्षा के नियम (Types of Legal Ordeals):</h3>\n<p>अपराध सिद्ध करने या निर्दोषता प्रमाणित करने के लिए चारों वर्णों के लिए अलग-अलग दिव्य परीक्षाओं का निर्धारण किया गया था :</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">अभियुक्त का वर्ण (Varna)</th>\n  <th style=\"text-align:left\">निर्धारित दिव्य परीक्षा का प्रकार (Ordeal Type)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>ब्राह्मण</strong></td>\n  <td style=\"text-align:left\"><strong>तुला परीक्षा</strong> (तराजू से तौलकर सत्यता की जाँच)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>क्षत्रिय</strong></td>\n  <td style=\"text-align:left\"><strong>अग्नि परीक्षा</strong> (अग्नि के माध्यम से पवित्रता सिद्ध करना)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>वैश्य</strong></td>\n  <td style=\"text-align:left\"><strong>जल परीक्षा</strong> (जल के माध्यम से परीक्षा)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>शूद्र</strong></td>\n  <td style=\"text-align:left\"><strong>विष परीक्षा</strong> (विष या जहर के माध्यम से न्याय करना)</td>\n</tr>\n</tbody>\n</table>\n<h3>ख. साक्षी (गवाही) एवं अपराध की गंभीरता के नियम:</h3>\n<ul>\n<li><strong>गवाही के विधिक मतभेद</strong>:<ul>\n<li><strong>कात्यायन स्मृति के अनुसार</strong>: किसी भी न्यायिक मुकदमे में अभियुक्त (Accused) के विरुद्ध केवल <strong>समान जाति का व्यक्ति ही गवाही (साक्ष्य) दे सकता था</strong> ।</li>\n<li><strong>नारद स्मृति के अनुसार</strong>: न्याय के लिए <strong>सभी वर्णों के व्यक्तियों को गवाह (साक्षी) बनाया जा सकता था</strong> ।</li>\n</ul>\n</li>\n<li><strong>चोरी के दंड में वर्णगत विभेद</strong>: <strong>नारद स्मृति</strong> के अनुसार, यदि कोई व्यक्ति चोरी का अपराध करता है, तो वर्ण के आधार पर उसके अपराध की गंभीरता और नैतिक पतन का पैमाना भिन्न था :<ul>\n<li><strong>ब्राह्मण का अपराध सबसे अधिक गंभीर</strong> माना जाता था (क्योंकि उससे सामाजिक नैतिकता की सर्वाधिक अपेक्षा थी) ।</li>\n<li><strong>शूद्र का अपराध सबसे कम गंभीर</strong> माना जाता था</li>\n</ul>\n</li>\n</ul>\n<h2>3. ब्राह्मण वर्ण (The Brahmana Varna)</h2>\n<ul>\n<li><strong>व्यावसायिक लचीलापन</strong>: गुप्तकाल में ब्राह्मणों ने अपनी आजीविका के लिए अन्य वर्णों के कार्यों को भी अपना लिया था। वे आवश्यकतानुसार <strong>क्षत्रिय</strong> (सैन्य/शासन) और <strong>वैश्य</strong> (व्यापार-वाणिज्य) के कर्म भी करते थे ।<ul>\n<li><strong>मृच्छकटिकम् का साक्ष्य</strong>: महाकवि शूद्रक रचित नाटक <strong>'मृच्छकटिकम्'</strong> के अनुसार, मुख्य पात्र ब्राह्मण <strong>चारुदत्त</strong> अपनी आजीविका के लिए <strong>व्यापार-वाणिज्य</strong> (वैश्य कर्म) करता था ।</li>\n</ul>\n</li>\n<li><strong>&quot;ब्रह्म क्षत्र&quot; (Brahma-Kshatra)</strong>: वैसे ब्राह्मण जिन्होंने ब्राह्मण धर्म छोड़कर सक्रिय रूप से <strong>क्षत्रिय कर्म</strong> (राजपाट संभालना या युद्ध लड़ना) अपना लिया था, वे समाज में <strong>&quot;ब्रह्म क्षत्र&quot;</strong> कहलाते थे ।</li>\n<li><strong>कदम्ब वंश की स्वतंत्र स्थापना (मयूरशर्मन)</strong>:<ul>\n<li><strong>मानव्य गोत्र</strong> के सुप्रसिद्ध ब्राह्मण <strong>मयूरशर्मन</strong> ने कांची के पल्लव राजा के प्रभाव वाले क्षेत्र पर अपना सैन्य आधिपत्य स्थापित कर लिया ।</li>\n<li>मयूरशर्मन ने <strong>'वनवासी'</strong> को अपनी राजधानी बनाया और स्वतंत्र <strong>कदम्ब वंश</strong> की स्थापना की ।</li>\n<li>अपनी महान विजयों के उपलक्ष्य में इस ब्राह्मण राजा ने कुल <strong>अट्ठारह (18) बार अश्वमेध यज्ञ</strong> का संपादन किया ।</li>\n</ul>\n</li>\n<li><strong>ब्राह्मणों की सामाजिक श्रेष्ठता</strong>: धर्मशास्त्री <strong>मनु</strong> के अनुसार, एक <strong>दस वर्ष का ब्राह्मण</strong> बालक भी ज्ञान व गरिमा में <strong>सौ वर्ष के वृद्ध क्षत्रिय से श्रेष्ठ</strong> माना जाता था ।</li>\n<li><strong>शूद्रों से अन्न ग्रहण करने के नियम (विधिक मतभेद)</strong>:<ul>\n<li><strong>याज्ञवल्क्य स्मृति के अनुसार</strong>: यदि कोई ब्राह्मण द्विजों (ब्राह्मण, क्षत्रिय, वैश्य) से अन्न प्राप्त करके अपनी जीविका चलाने में पूर्णतः असमर्थ हो जाए, तो संकट काल में वह <strong>शूद्रों से भी अन्न ग्रहण कर अपनी जान बचा सकता था</strong> ।</li>\n<li><strong>प्रारंभिक स्मृतिकार (विशेषतः मनु)</strong>: मनु के अनुसार, किसी भी परिस्थिति में ब्राह्मण के लिए <strong>शूद्र से अन्न ग्रहण करना पूर्णतः वर्जित था</strong> ।</li>\n</ul>\n</li>\n<li><strong>सामाजिक सह-अस्तित्व</strong>: शूद्रक के नाटक <strong>'मृच्छकटिक'</strong> में स्पष्ट उल्लेख है कि गुप्त समाज में <strong>ब्राह्मण और शूद्र एक ही कुएं से पानी भरते थे</strong> ।</li>\n<li><strong>ब्राह्मण भूमिपतियों (Priestly Landlords) का उदय</strong>:<ul>\n<li>गुप्तकाल में राजाओं द्वारा दिए गए अत्यधिक <strong>भूमिदान के कारण</strong> स्थानीय स्तर के कृषकों के ऊपर <strong>ब्राह्मण भूमिपतियों का एक नया वर्ग उदय हुआ</strong> ।</li>\n<li>इसके सकारात्मक प्रभाव के रूप में <strong>मध्य भारत के दुर्गम आदिवासी क्षेत्रों में कृषि भूमि का व्यापक विस्तार</strong> हुआ ।</li>\n</ul>\n</li>\n</ul>\n<h2>4. क्षत्रिय वर्ण (The Kshatriya Varna)</h2>\n<ul>\n<li><strong>हूणों का हिंदू समाज में विलय</strong>: पांचवीं शताब्दी के अंत में भारत पर आक्रमण करने वाले विदेशी <strong>हूणों</strong> को गुप्तकालीन समाज में आत्मसात कर लिया गया और उन्हें राजपूतों के <strong>क्षत्रिय कुलों में एक प्रतिष्ठित स्थान प्रदान किया गया</strong> ।</li>\n<li><strong>ह्वेनसांग द्वारा प्रशंसा</strong>: चीनी यात्री ह्वेनसांग ने क्षत्रियों की अद्भुत कर्मनिष्ठा की भूरि-भूरि प्रशंसा की है। उसने क्षत्रियों के चरित्र को:<ul>\n<li><strong>निर्दोष</strong></li>\n<li><strong>पवित्र</strong></li>\n<li><strong>सरल</strong></li>\n<li><strong>मितव्ययी (कम खर्चीला)</strong> बताया है ।</li>\n</ul>\n</li>\n<li><strong>वर्णसंकर जातियों की प्रचुरता</strong>: पूर्व गुप्तकाल से ही भारी संख्या में भारत आने वाली विदेशी जातियों (जैसे शक, कुषाण) के आगमन और समाज में होने वाले <strong>अंतर्जातीय विवाहों</strong> के फलस्वरूप अनेक <strong>वर्णसंकर जातियों</strong> की संख्या में अत्यधिक वृद्धि हुई ।</li>\n<li><strong>विदेशी विजेताओं का दर्जा</strong>: तत्कालीन समाज की अवशोषक प्रकृति के कारण सभी <strong>विदेशी विजेताओं को गुप्त समाज में 'क्षत्रिय' का दर्जा</strong> प्रदान किया गया ।</li>\n</ul>\n<h2>5. वैश्य वर्ण (The Vaishya Varna)</h2>\n<ul>\n<li><strong>मूल व्यावसायिक कर्म</strong>: वैश्य वर्ण के मूल परंपरागत कार्य मुख्य रूप से <strong>कृषि</strong> (खेती) और <strong>व्यवसाय</strong> (व्यापार) करना था ।</li>\n<li><strong>प्रयुक्त संज्ञाएँ</strong>: गुप्त युग में वैश्यों के लिए मुख्य रूप से <strong>'वणिक'</strong>, <strong>'श्रेष्ठी'</strong> तथा <strong>'सार्थवाह'</strong> जैसे शब्दों का प्रयोग किया जाता था ।</li>\n<li><strong>अमरकोश का साक्ष्य</strong>: अमरसिंह के <strong>'अमरकोश'</strong> में कृषक (किसान) के जितने भी पर्यायवाची शब्द दिए गए हैं, उन सभी को <strong>वैश्य वर्ग के अंतर्गत ही गिनाया गया है</strong> ।</li>\n<li><strong>सामाजिक स्थिति का ह्रास</strong>: गुप्त तथा गुप्तोत्तर काल में वैश्यों और शूद्रों की सामाजिक-आर्थिक स्थिति में कोई विशेष अंतर नहीं रह गया था। <strong>वैश्यों की सामाजिक स्थिति में तेजी से गिरावट आई</strong> [4, 5]।</li>\n<li><strong>व्यापारिक निषेध (महाभारत के अनुसार)</strong>: महाभारत के विधिक ग्रंथों के अनुसार, वैश्यों के लिए समाज में <strong>मद्य (शराब), मांस, लोहा तथा चमड़े का व्यापार करना (बेचना) पूर्णतः निषिद्ध</strong> (वर्जित) घोषित किया गया था ।</li>\n</ul>\n<h2>6. शूद्र वर्ण (The Shudra Varna)</h2>\n<p>गुप्तकाल में शूद्रों की सामाजिक और आर्थिक स्थिति में पूर्ववर्ती काल की तुलना में अत्यंत क्रांतिकारी और सकारात्मक सुधार देखने को मिलते हैं।</p>\n<h3>क. व्यावसायिक एवं आर्थिक उन्नति:</h3>\n<ul>\n<li><strong>सैन्य सेवा</strong>: गुप्त काल में शूद्रों ने <strong>सैनिक कार्य</strong> करना भी प्रारंभ कर दिया था ।</li>\n<li><strong>परंपरागत नियमों में ढील</strong>:<ul>\n<li><strong>मनु के अनुसार</strong>: शूद्रों का एकमात्र शास्त्रीय कार्य केवल उच्च तीनों वर्णों (द्विजों) की सेवा करना ही था ।</li>\n<li><strong>याज्ञवल्क्य स्मृति के अनुसार</strong>: याज्ञवल्क्य ने शूद्रों को समाज में स्वतंत्र रूप से <strong>व्यापारी</strong>, <strong>कारीगर</strong> तथा <strong>कृषक</strong> होने की पूर्ण विधिक अनुमति प्रदान की थी [4, 5]।</li>\n<li><strong>ह्वेनसांग का साक्ष्य</strong>: चीनी यात्री ह्वेनसांग ने भी अपने यात्रा वृत्तांत में शूद्रों को स्पष्ट रूप से <strong>'कृषक' (किसान)</strong> कहकर संबोधित किया है ।</li>\n</ul>\n</li>\n<li><strong>आर्थिक उन्नति</strong>: इस काल में जहाँ वैश्यों की आर्थिक व सामाजिक स्थिति में गिरावट आ रही थी, वहीं <strong>शूद्रों की आर्थिक दशा में निरंतर सुधार दर्ज किया गया</strong> ।</li>\n</ul>\n<h3>ख. राजनीतिक एवं धार्मिक अधिकार:</h3>\n<ul>\n<li><strong>शूद्र राजाओं का उदय</strong>: गुप्तकाल में राजनीतिक उथल-पुथल के कारण <strong>सौराष्ट्र, अवन्ति और मालवा</strong> जैसे क्षेत्रों में <strong>शूद्र राजाओं के शासन करने की चर्चा</strong> ऐतिहासिक रूप से मिलती है । इसके अतिरिक्त, <strong>सिंध व कश्मीर के म्लेच्छ राजाओं को भी 'शूद्र'</strong> कहा गया है ।</li>\n<li><strong>धार्मिक ग्रंथों के श्रवण का अधिकार</strong>: गुप्तकाल में शूद्रों को पहली बार महान ग्रंथ <strong>रामायण</strong>, <strong>महाभारत</strong> व <strong>पुराणों को सुनने का विधिक अधिकार</strong> प्राप्त हुआ ।</li>\n<li><strong>कृष्ण की पूजा का अधिकार</strong>: शूद्र समाज के लोग इस काल में <strong>'कृष्ण' नामक नए लोकप्रिय देवता की पूजा</strong> करने का धार्मिक अधिकार भी रखते थे ।</li>\n<li><strong>शिल्पियों का वर्गीकरण</strong>: <strong>'अमरकोश'</strong> में समाज के सभी प्रकार के शिल्पियों (कारीगरों) की पूरी सूची को <strong>शूद्र वर्ग के अंतर्गत वर्गीकृत</strong> करके रखा गया है ।</li>\n<li><strong>पुराणों में शूद्रों के विधिक कर्त्तव्य</strong>:<ul>\n<li><strong>मार्कण्डेय पुराण के अनुसार</strong>: समाज में <strong>दान देना</strong> व <strong>यज्ञ संपन्न करना</strong> भी शूद्रों के प्रमुख कर्तव्यों में शामिल किया गया था ।</li>\n<li><strong>मत्स्य पुराण के अनुसार</strong>: यदि कोई शूद्र सच्ची ईश्वर भक्ति करे और अपनी समस्त इंद्रियों को पूर्ण नियंत्रण में रखकर निर्भयता के साथ जीवन व्यतीत करे, तो उसे भी <strong>'मोक्ष' (Salvation)</strong> की प्राप्ति सुलभ हो सकती है ।</li>\n</ul>\n</li>\n</ul>\n<h2>7. चाण्डाल एवं अस्पृश्यता की उत्पत्ति (Chandalas and Untouchability)</h2>\n<ul>\n<li><strong>सबसे निम्न सामाजिक स्थान</strong>: गुप्तकालीन सामाजिक व्यवस्था में <strong>'चाण्डाल' जाति</strong> का स्थान सामाजिक पदानुक्रम में सबसे निम्न (अपवित्र) माना जाता था ।</li>\n<li><strong>अस्पृश्यता (Untouchability) का जन्म (फाह्यान का विवरण)</strong>:<ul>\n<li>चीनी बौद्ध यात्री फाह्यान के यात्रा विवरण के अनुसार, चाण्डाल लोग सामान्य बस्तियों से दूर <strong>गाँवों और नगरों की सीमाओं के बाहर निवास करते थे</strong> ।</li>\n<li>जब भी किसी चाण्डाल को अपने किसी कार्य से मुख्य नगर या शहर की सीमा में प्रवेश करना होता था, तो उसे अनिवार्य रूप से <strong>हाथों में ढोल (या लकड़ी) बजाते हुए चलना पड़ता था</strong> ।</li>\n<li>इस ढोल की आवाज को सुनकर सामान्य उच्च वर्ण के लोग अपवित्र होने के भय से तुरंत उनसे <strong>दूर हट जाते थे</strong> । इस सामाजिक कुप्रथा से गुप्त समाज में <strong>अस्पृश्यता का पूर्ण रूप से विकास हुआ</strong> ।</li>\n</ul>\n</li>\n<li><strong>जनसंख्या में वृद्धि</strong>: गुप्तकाल के दौरान समाज में चाण्डालों की कुल संख्या में उल्लेखनीय वृद्धि दर्ज की गई ।</li>\n<li><strong>खान-पान और आर्थिक कार्य</strong>: चाण्डाल भोजन में मुख्य रूप से <strong>मांस व लहसुन</strong> का सेवन करते थे । उनका समाज में मुख्य कार्य <strong>मछली पकड़ना</strong>, <strong>जंगली जानवरों का शिकार करना</strong> तथा <strong>मांस बेचना</strong> था ।</li>\n<li><strong>संभ्रांत वर्ग का खान-पान</strong>: फाह्यान के अनुसार, गुप्त समाज के उच्च और संभ्रांत व्यक्ति मांसाहार (मांस खाने) का सेवन बिल्कुल नहीं करते थे ।</li>\n<li><strong>विधिक वर्गीकरण</strong>: यद्यपि समाज में अस्पृश्यों (अछूतों) की सामाजिक स्थिति शूद्रों से सर्वथा भिन्न (अधिक निम्न) थी, किन्तु सुप्रसिद्ध संस्कृत कोश <strong>'अमरकोश'</strong> में वर्णसंकरों और अस्पृश्यों दोनों को संयुक्त रूप से <strong>'शूद्र जाति' के अंतर्गत ही वर्गीकृत</strong> करके रखा गया है ।</li>\n</ul>\n"}, {"id": "0-18", "title": "गुप्तकालीन सामाजिक जीवन: कायस्थ वर्ग, दास प्रथा एवं स्त्रियों की दशा", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन सामाजिक जीवन: कायस्थ वर्ग, दास प्रथा एवं स्त्रियों की दशा</h1>\n<h2>1. कायस्थ वर्ग (The Kayastha Class)</h2>\n<p>गुप्तकाल में प्रशासनिक गतिविधियों और लेखा-जोखा रखने के लिए कायस्थ वर्ग का विकास हुआ:</p>\n<ul>\n<li><strong>जाति के रूप में उदय</strong>: गुप्तकाल में <strong>कायस्थ जाति</strong> का भी स्पष्ट उल्लेख मिलता है।</li>\n<li><strong>साहित्यिक एवं विधिक साक्ष्य</strong>:<ul>\n<li><strong>याज्ञवल्क्य स्मृति</strong>: कायस्थों का <strong>सर्वप्रथम उल्लेख</strong> याज्ञवल्क्य स्मृति में प्राप्त होता है।</li>\n<li><strong>औशनस स्मृति (Oshanas Smriti)</strong>: एक <strong>जाति के रूप में</strong> कायस्थों का सर्वप्रथम उल्लेख औशनस स्मृति में मिलता है।</li>\n<li><strong>मुद्राराक्षस नाटक</strong>: कायस्थ शब्द का उल्लेख गुप्तकालीन प्रसिद्ध नाटक <strong>'मुद्राराक्षस'</strong> में भी प्राप्त होता है।</li>\n</ul>\n</li>\n<li><strong>वर्ग से जाति का संक्रमण</strong>:<ul>\n<li>गुप्तकाल तक कायस्थ मुख्य रूप से <strong>एक वर्ग (पेशेवर समूह) के रूप में</strong> ही कार्यरत थे।</li>\n<li>गुप्तकालीन स्मृतियों में उनका स्वतंत्र <strong>जाति के रूप में उल्लेख नहीं मिलता है</strong>।</li>\n</ul>\n</li>\n<li><strong>अभिलेखीय संज्ञाएँ</strong>: गुप्त अभिलेखों में कायस्थों के लिए <strong>&quot;प्रथम कायस्थ&quot;</strong> या <strong>&quot;ज्येष्ठकायस्थ&quot;</strong> शब्दों का प्रयोग किया गया है।</li>\n<li><strong>प्रशासनिक अधिकार एवं कर्त्तव्य</strong>: कायस्थ मुख्य रूप से निम्नलिखित राजकीय विभागों के प्रमुख अधिकारी होते थे:<ul>\n<li><strong>लेखाकरण</strong> (Bookkeeping / Accounting)</li>\n<li><strong>गणना</strong> (Calculations)</li>\n<li><strong>आय-व्यय का विवरण</strong> (Income and Expenditure registers)</li>\n<li><strong>भूमिकर</strong> (Land Revenue records)</li>\n</ul>\n</li>\n</ul>\n<h2>2. महत्तर (Mahattara)</h2>\n<ul>\n<li><strong>परिभाषा एवं स्वरूप</strong>: उत्तरी भारत (North India) के ग्रामीण क्षेत्रों में <strong>ग्रामीण वृद्धों तथा मुख्य (मुखिया) लोगों का एक विशिष्ट वर्ग</strong> था, जिसे <strong>'महत्तर'</strong> कहा जाता था।</li>\n<li><strong>प्रशासनिक भूमिका</strong>: भूमि के हस्तांतरण (क्रय-विक्रय या दान) के समय महत्तर वर्ग को <strong>अनिवार्य रूप से सूचना प्रदान की जाती थी</strong>।</li>\n</ul>\n<h2>3. दास प्रथा (Slavery System)</h2>\n<p>गुप्तकाल में दास प्रथा का स्वरूप विधिक संहिताओं और आर्थिक बदलावों से प्रभावित था:</p>\n<h3>क. दासों के प्रकार (वर्गीकरण):</h3>\n<ul>\n<li><strong>नारद स्मृति</strong>: नारद ने कुल <strong>15 प्रकार के दासों</strong> का उल्लेख किया है।</li>\n<li><strong>मिताक्षरा</strong>: विज्ञानेश्वर कृत मिताक्षरा में भी <strong>15 प्रकार के दासों</strong> का विवरण मिलता है।</li>\n<li><strong>मनुस्मृति</strong>: मनु ने समाज में केवल <strong>7 प्रकार के दासों</strong> का उल्लेख किया है।</li>\n</ul>\n<h3>ख. दासों की सामाजिक एवं विधिक स्थिति:</h3>\n<ul>\n<li><strong>दयनीय स्थिति</strong>: गुप्तकाल में दासों की सामाजिक स्थिति <strong>पूर्वकाल (जैसे मौर्यकाल या मौर्योत्तर काल) की तुलना में अत्यधिक दयनीय</strong> थी।</li>\n<li><strong>दास मुक्ति का विधिक विधान</strong>: भारतीय इतिहास में सर्वप्रथम <strong>दास मुक्ति के अनुष्ठान व नियमों का विधान दरबारी स्मृतिकार नारद ने किया था</strong>।</li>\n<li><strong>ब्राह्मणों के लिए नियम</strong>: स्मृतिकार <strong>कात्यायन</strong> के अनुसार, कोई भी <strong>ब्राह्मण कभी भी दास नहीं बन सकता था</strong> (ब्राह्मणों के लिए दासता पूर्णतः वर्जित थी)।</li>\n<li><strong>संपत्ति का अधिकार</strong>: <strong>मनुस्मृति पर भारुचि की प्रसिद्ध टीका</strong> में दासों के <strong>संपत्ति विषयक अधिकारों</strong> की विस्तृत चर्चा की गई है।</li>\n</ul>\n<h3>ग. दास प्रथा के कमजोर होने का कारण:</h3>\n<ul>\n<li><strong>कमजोर होने की प्रक्रिया</strong>: गुप्तकाल में दास प्रथा धीरे-धीरे <strong>कमजोर</strong> होती चली गई।</li>\n<li><strong>आर्थिक कारण (भूमि विभाजन)</strong>: पारिवारिक संपत्ति के <strong>बंटवारे</strong> तथा राजाओं द्वारा दिए जाने वाले <strong>धार्मिक अनुदानों (भूमि दानों)</strong> के कारण कृषि भूमि छोटे-छोटे टुकड़ों में विभाजित हो गई।</li>\n<li><strong>दासों की छंटनी</strong>: इन छोटे कृषि क्षेत्रों में खेती करने के लिए अधिक दासों को रखने की आर्थिक आवश्यकता नहीं रह गई थी, जिसके परिणामस्वरूप <strong>अधिकांश दासों की छंटनी कर दी गई</strong>। दास प्रथा के कमजोर होने का यह सबसे <strong>मुख्य कारण</strong> था।</li>\n</ul>\n<h2>4. स्त्रियों की दशा (Status of Women)</h2>\n<p>गुप्तकाल में नारी की सामाजिक स्थिति में बाह्य आदर्शवाद और आंतरिक व्यावहारिक ह्रास का द्वंद्व दिखाई देता है:</p>\n<h3>क. नारी का सामाजिक स्वरूप:</h3>\n<ul>\n<li><strong>साहित्यिक आदर्श बनाम व्यावहारिक सत्य</strong>: गुप्तकाल के साहित्य एवं कला में नारी का अत्यंत <strong>आदर्श चित्रण (श्रद्धा व सम्मान के साथ)</strong> किया गया है, परंतु व्यावहारिक जीवन (वास्तविकता) में उसकी सामाजिक स्थिति पहले की तुलना में <strong>अधिक दयनीय हो गई थी</strong>।</li>\n<li><strong>स्त्रीरत्न</strong>: महाकवि <strong>कालिदास</strong> ने स्त्रियों को आदरपूर्वक <strong>&quot;स्त्रीरत्न&quot;</strong> कहकर संबोधित किया है।</li>\n<li><strong>महाभारत का मत</strong>: महाभारत के अनुसार, <strong>पत्नी के बिना पुरुष का जीवन पूर्णतः शून्य (अधूरा)</strong> माना गया है।</li>\n</ul>\n<h3>ख. शिक्षा, विवाह एवं सामाजिक कुप्रथाएँ:</h3>\n<ul>\n<li><strong>शिक्षा से वंचना (याज्ञवल्क्य का मत)</strong>: याज्ञवल्क्य के अनुसार, <strong>&quot;महिला का विवाह ही उसका उपनयन संस्कार है, इसलिए उसे स्वतंत्र रूप से शिक्षा ग्रहण करने का कोई अधिकार नहीं है।&quot;</strong></li>\n<li><strong>स्त्री शिक्षा का प्रचलन (विरोधाभासी साक्ष्य)</strong>: समाज में व्यावहारिक स्तर पर स्त्री शिक्षा का प्रचलन था। इसका सबसे बड़ा प्रमाण <strong>'अमरकोश'</strong> में मिलता है, जहाँ महिला शिक्षिकाओं के लिए <strong>&quot;उपाध्याया&quot;</strong> तथा <strong>&quot;आचार्या&quot;</strong> शब्दों का प्रयोग किया गया है।</li>\n<li><strong>विवाह प्रणालियाँ</strong>:<ul>\n<li><strong>बाल विवाह</strong>: गुप्तकाल में <strong>बाल विवाह की प्रथा का प्रारंभ</strong> हुआ।</li>\n<li><strong>बहुविवाह</strong>: उच्च वर्ग के पुरुषों के पास अधिक भूमि और संपत्ति होने के कारण वे <strong>बहुविवाह</strong> (एक से अधिक पत्नियाँ रखना) करते थे, जिसके परिणामस्वरूप स्त्री को स्वतंत्र मानव न मानकर <strong>एक संपत्ति के रूप में देखा जाने लगा</strong>।</li>\n</ul>\n</li>\n<li><strong>दहेज एवं पर्दा प्रथा</strong>:<ul>\n<li>सामान्यतः समाज में <strong>दहेज प्रथा एवं पर्दा प्रथा का प्रचलन नहीं था</strong>।</li>\n<li>हालांकि, <strong>कालिदास</strong> के ग्रंथों में स्त्रियों में पर्दा प्रथा के प्रचलन का <strong>प्रथम साहित्यिक प्रमाण</strong> प्राप्त होता है।</li>\n</ul>\n</li>\n<li><strong>वेश्यावृत्ति</strong>: गुप्तकालीन समाज में <strong>वेश्यावृत्ति (Prostitution)</strong> का प्रचलन था।</li>\n<li><strong>देवदासी प्रथा</strong>:<ul>\n<li>देवदासी प्रथा का उल्लेख तत्कालीन <strong>पुराणों</strong> तथा कालिदास के <strong>'मेघदूत'</strong> में मिलता है।</li>\n<li><strong>कालिदास</strong> ने <strong>उज्जैन के प्रसिद्ध महाकाल मंदिर</strong> में पूजा अर्चना के समय नृत्य करने वाली देवदासियों का सजीव वर्णन प्रस्तुत किया है।</li>\n</ul>\n</li>\n<li><strong>गणिकाओं का प्रशिक्षण</strong>: <strong>वात्स्यायन के 'कामसूत्र'</strong> में गणिकाओं (नगरवधुओं) को कला और विधाओं में दिए जाने वाले विशेष <strong>प्रशिक्षण</strong> का विस्तृत वर्णन है। 'कामसूत्र' मुख्य रूप से <strong>7 खंडों</strong> में विभाजित है।</li>\n</ul>\n<h3>ग. सती प्रथा (Sati System):</h3>\n<ul>\n<li><strong>सैनिक जातियों में प्रचलन</strong>: सती प्रथा मुख्य रूप से तत्कालीन <strong>सैनिक जातियों</strong> (योद्धा वर्गों) में विद्यमान थी।</li>\n<li><strong>प्रथम अभिलेखीय साक्ष्य (एरण अभिलेख, 510 ईस्वी)</strong>:<ul>\n<li>सती प्रथा का संपूर्ण भारतीय इतिहास में <strong>प्रथम अभिलेखीय साक्ष्य 510 ईस्वी के 'एरण अभिलेख' (मध्य प्रदेश) से प्राप्त होता है</strong>।</li>\n<li>इस अभिलेख में गुप्त सम्राट <strong>भानुगुप्त के सेनापति 'गोपराज'</strong> की युद्ध में मृत्यु होने पर उनकी <strong>पत्नी (स्त्री) के चिता पर सती होने का स्पष्ट उल्लेख</strong> मिलता है।</li>\n</ul>\n</li>\n</ul>\n<h2>5. स्त्रियों के संपत्ति संबंधी अधिकार (Property Rights of Women)</h2>\n<p>प्रतिकूल सामाजिक परिस्थितियों के बावजूद कुछ विधिक संहिताओं ने स्त्रियों के आर्थिक अधिकारों की वकालत की:</p>\n<ul>\n<li><strong>याज्ञवल्क्य स्मृति का समर्थन</strong>: याज्ञवल्क्य स्मृति स्त्रियों के संपत्ति संबंधी अधिकारों का पुरजोर समर्थन करती है। इसके अनुसार, <strong>पुत्र के अभाव में मृत पुरुष की संपत्ति पर सर्वप्रथम अधिकार उसकी पत्नी का होगा</strong>।</li>\n<li><strong>कात्यायन स्मृति का समर्थन</strong>: स्मृतिकार कात्यायन भी <strong>स्त्रीधन</strong> (Women's personal property) के प्रबल समर्थक थे। कात्यायन के विधिक नियम के अनुसार, <strong>स्त्री अपनी अचल संपत्ति तथा स्त्रीधन को अपनी इच्छानुसार बेच सकती थी अथवा गिरवी (बंधक) रख सकती थी</strong>।</li>\n<li><strong>पुत्रियों का प्रथम अधिकार</strong>: प्रायः सभी तत्कालीन स्मृतिकारों ने यह व्यवस्था दी थी कि माता के <strong>स्त्रीधन के उत्तराधिकार में सर्वप्रथम अधिकार उसकी पुत्रियों का होगा</strong>।</li>\n</ul>\n<h2>6. विशेष परिस्थितियों में स्त्रियों के पुनर्विवाह के नियम</h2>\n<p>उत्तर गुप्तकालीन विधिक ग्रंथकारों और स्मृति लेखकों ने महिलाओं को निम्नलिखित <strong>सात विशेष परिस्थितियों में पुनर्विवाह (दूसरा विवाह) करने की विधिक अनुमति</strong> प्रदान की थी:</p>\n<ol>\n<li><strong>पति की मृत्यु होने पर</strong> (पति मर गया हो)</li>\n<li><strong>पति के नष्ट हो जाने पर</strong> (अर्थात् अशास्त्रीय आचरण करने के कारण बंधु-बांधवों और परिवार द्वारा परित्यक्त कर दिया गया हो)</li>\n<li><strong>पति के संन्यासी बन जाने पर</strong> (संसार त्यागने पर)</li>\n<li><strong>पति के पतित हो जाने पर</strong> (धर्माचरण व नैतिक आचरण से पूर्णतः भ्रष्ट होने पर)</li>\n<li><strong>पति के नपुंसक हो जाने पर</strong> (शारीरिक रूप से अक्षम होने पर)</li>\n<li><strong>पति के राजद्रोही हो जाने पर</strong> (देशद्रोह का दोषी होने पर)</li>\n<li><strong>पति के लंबे समय तक विदेश जाने पर</strong> (और वापस न लौटने पर)</li>\n</ol>\n<h2>7. विधवाओं की स्थिति एवं राज्य के कर्त्तव्य (Status of Widows)</h2>\n<ul>\n<li><strong>दयनीय स्थिति</strong>: समाज में विधवाओं की व्यावहारिक स्थिति अत्यंत <strong>दयनीय</strong> और कष्टप्रद थी।</li>\n<li><strong>विधवा विवाह पर विधिक मतभेद</strong>:<ul>\n<li><strong>नारद व पाराशर स्मृति</strong>: इन दोनों प्रगतिशील स्मृतियों में विशेष परिस्थितियों में <strong>विधवा विवाह का स्पष्ट समर्थन</strong> किया गया है।</li>\n<li><strong>बृहस्पति स्मृति</strong>: इसके विपरीत, बृहस्पति स्मृति में विधवा विवाह को <strong>पूर्णतः निषिद्ध</strong> (वर्जित) माना गया है।</li>\n</ul>\n</li>\n<li><strong>भरण-पोषण का राजकीय दायित्व</strong>: स्मृतिकार <strong>नारद</strong> के अनुसार, <strong>&quot;यह राजा का परम कर्त्तव्य है कि वह निराश्रित विधवाओं का उचित भरण-पोषण करे।&quot;</strong> नारद ने इस राजकीय उत्तरदायित्व को समाज का <strong>&quot;सनातन धर्म&quot;</strong> घोषित किया है।</li>\n</ul>\n<h2>8. वर्णगत भिन्नता एवं स्त्रियों की आर्थिक स्वतंत्रता</h2>\n<ul>\n<li><strong>वैश्य व शूद्र वर्ग की महिलाएँ</strong>: समाज के निम्न वर्णों (वैश्य एवं शूद्र) की महिलाओं को पुरुषों के समान <strong>अत्यधिक सामाजिक एवं व्यावसायिक स्वतंत्रता प्राप्त थी</strong>।</li>\n<li><strong>उच्च वर्ण की महिलाएँ</strong>: इसके विपरीत, समाज के उच्च वर्णों (ब्राह्मण एवं क्षत्रिय) की संभ्रांत महिलाओं को अपनी जीविका उपार्जन के लिए स्वतंत्र रूप से <strong>कार्य करने की आर्थिक स्वतंत्रता प्राप्त नहीं थी</strong> (वे आर्थिक रूप से पुरुषों पर पूर्णतः आश्रित थीं)।</li>\n</ul>\n"}, {"id": "0-19", "title": "गुप्त साम्राज्य: धार्मिक दशा", "file": "history-gupta.md", "html": "<h1>गुप्त साम्राज्य: धार्मिक दशा</h1>\n<h2>1. धार्मिक दशा: सामान्य परिचय एवं पुनरुत्थान</h2>\n<ul>\n<li><strong>ब्राह्मण धर्म का पुनरुत्थान</strong>: गुप्तकाल को <strong>ब्राह्मण धर्म (हिन्दू धर्म)</strong> के पुनरुत्थान का स्वर्ण काल माना जाता है।</li>\n<li><strong>विकास की प्रक्रिया</strong>: हिन्दू धर्म के पुनरुत्थान की यह प्रक्रिया गुप्त साम्राज्य की स्थापना से <strong>पूर्व ही आरम्भ हो चुकी थी</strong>, किन्तु गुप्त काल में यह अपने विकास की <strong>चरम सीमा पर पहुँच गई</strong>।</li>\n<li><strong>मूर्ति पूजा एवं मन्दिर</strong>: हिन्दू धर्म के इतिहास में <strong>मन्दिरों में मूर्ति पूजा का विधिवत विकास</strong> गुप्तकाल से ही प्रारम्भ हुआ।</li>\n</ul>\n<h2>2. सूर्य उपासना के ऐतिहासिक साक्ष्य</h2>\n<p>गुप्तकाल में सूर्य पूजा अत्यधिक लोकप्रिय थी, जिसके संबंध में निम्नलिखित प्रमुख पुरातात्विक एवं अभिलेखीय साक्ष्य प्राप्त होते हैं:</p>\n<ul>\n<li><strong>कुमारगुप्त प्रथम का मन्दसौर शिलालेख</strong>: इस प्रसिद्ध शिलालेख से गुप्तकाल में <strong>सूर्य उपासना (पूजा)</strong> के प्रचलन की प्रामाणिक जानकारी प्राप्त होती है।</li>\n<li><strong>स्कन्दगुप्त का इन्दौर (इन्द्रपुर) ताम्रलेख</strong>:<ul>\n<li>इस ताम्रलेख का प्रारम्भ <strong>सूर्य देव की वन्दना (पूजा) से</strong> होता है।</li>\n<li>इसके अनुसार, <strong>'देव विष्णु'</strong> नामक एक प्रतिष्ठित ब्राह्मण ने <strong>इन्द्रपुर (इन्दौर) के तेलियों की श्रेणी (Guild)</strong> के पास एक अक्षय पूँजी जमा कराई थी।</li>\n<li>इस पूँजी से मिलने वाले ब्याज का उपयोग स्थानीय <strong>सूर्य मन्दिर में दीपक जलाने</strong> की अनवरत व्यवस्था के लिए किया जाता था।</li>\n</ul>\n</li>\n</ul>\n<h2>3. हिन्दू धर्म के दो मुख्य सम्प्रदाय</h2>\n<p>गुप्तकाल के दौरान हिन्दू धर्म के अंतर्गत <strong>दो सर्वप्रमुख सम्प्रदाय</strong> विकसित एवं सुव्यवस्थित हुए:</p>\n<ol>\n<li><strong>वैष्णव सम्प्रदाय</strong> (भागवत धर्म)</li>\n<li><strong>शैव सम्प्रदाय</strong></li>\n</ol>\n<h2>4. वैष्णव सम्प्रदाय (भागवत धर्म) का विस्तृत विवरण</h2>\n<h3>क. गुप्त सम्राटों का संरक्षण एवं उपाधियाँ:</h3>\n<ul>\n<li><strong>राजधर्म</strong>: अधिकांश गुप्त शासक व्यक्तिगत रूप से <strong>वैष्णव धर्म के परम अनुयायी</strong> थे और उन्होंने इसे राजकीय संरक्षण प्रदान किया।</li>\n<li><strong>परमभागवत (Title)</strong>: गुप्त सम्राटों ने अपने सिक्कों और अभिलेखों में अपने नाम के साथ सम्मानपूर्वक <strong>&quot;परमभागवत&quot;</strong> विशेषण (उपाधि) का प्रयोग किया है।</li>\n<li><strong>गरुड़ राजचिह्न</strong>: गाजीपुर जिले के <strong>भीतरी</strong> नामक स्थान से प्राप्त <strong>चन्द्रगुप्त द्वितीय</strong> तथा <strong>समुद्रगुप्त</strong> के सिक्कों पर भगवान विष्णु के वाहन <strong>'गरुड़' की प्रतिमा अंकित</strong> है, जो गुप्तों का राजकीय चिह्न भी था।</li>\n</ul>\n<h3>ख. लक्ष्मी का अंकन एवं वैदिक देवों का उल्लेख:</h3>\n<ul>\n<li><strong>विष्णु-लक्ष्मी का सर्वप्रथम उल्लेख</strong>: भगवान विष्णु के साथ उनकी पत्नी के रूप में देवी लक्ष्मी का सर्वप्रथम संयुक्त उल्लेख <strong>स्कन्दगुप्त के जूनागढ़ अभिलेख</strong> में मिलता है।</li>\n<li><strong>सिक्कों पर लक्ष्मी का अंकन</strong>: गुप्तकालीन मुद्राओं (सिक्कों) पर <strong>लक्ष्मी का चित्र विष्णु की पत्नी के रूप में</strong> अपरिहार्य और अनिवार्य रूप से अंकित किया गया है।</li>\n<li><strong>प्रयाग-प्रशस्ति के वैदिक देवता</strong>: समुद्रगुप्त की प्रयाग-प्रशस्ति में प्रमुख प्राचीन वैदिक देवताओं—<strong>धनद (कुबेर), वरुण, इन्द्र और यम</strong>—का उल्लेख मिलता है।</li>\n<li><strong>विष्णु स्तुति से प्रारम्भ होने वाले अभिलेख</strong>:<ul>\n<li><strong>स्कन्दगुप्त का जूनागढ़ अभिलेख</strong></li>\n<li><strong>बुद्धगुप्त का एरण स्तम्भलेख</strong>\n<em>(नोट: ये दोनों महत्वपूर्ण अभिलेख भगवान विष्णु की स्तुति से ही प्रारम्भ होते हैं)</em>।</li>\n</ul>\n</li>\n</ul>\n<h3>ग. अवतारवाद एवं विष्णु के दस अवतार:</h3>\n<ul>\n<li><strong>भगवद्गीता का अवतारवाद</strong>: श्रीमद्भगवद्गीता में प्रतिपादित <strong>'अवतारवाद का उपदेश'</strong> भी मुख्य रूप से गुप्तकालीन विचारों का ही प्रतिनिधित्व करता है।</li>\n<li><strong>विष्णु के दस अवतार</strong>: गुप्तकाल में भगवान विष्णु के निम्नलिखित दस अवतारों की अवधारणा को पूर्णतः मान्यता मिली:<ol>\n<li><strong>मत्स्य</strong></li>\n<li><strong>कूर्म</strong></li>\n<li><strong>वराह</strong></li>\n<li><strong>नृसिंह</strong></li>\n<li><strong>वामन</strong></li>\n<li><strong>परशुराम</strong></li>\n<li><strong>राम</strong></li>\n<li><strong>कृष्ण</strong></li>\n<li><strong>बुद्ध</strong></li>\n<li><strong>कल्कि</strong></li>\n</ol>\n</li>\n<li><strong>बुद्ध को विष्णु का अवतार मानना</strong>: तत्कालीन <strong>अग्नि पुराण</strong>, <strong>भागवत पुराण</strong> तथा <strong>मत्स्य पुराण</strong> में महात्मा बुद्ध को भगवान विष्णु के दस अवतारों में पूरी तरह शामिल कर लिया गया।</li>\n<li><strong>अवैदिक देवताओं का समावेश</strong>: गुप्तकाल में <strong>नारायण</strong>, <strong>संकर्षण</strong> तथा <strong>लक्ष्मी</strong> जैसे अवैदिक (लोकल/समान्तर) देवताओं को भी वैष्णव धर्म का अभिन्न अंग बना लिया गया।</li>\n</ul>\n<h3>घ. हरिहर एवं देवगढ़ का दशावतार मन्दिर:</h3>\n<ul>\n<li><strong>हरिहर की अवधारणा (विष्णु + शिव)</strong>: भगवान विष्णु (हर) और भगवान शिव (हरि) के संयुक्त रूप <strong>'हरिहर' की मूर्ति</strong> का निर्माण सर्वप्रथम गुप्तकाल में ही प्रारम्भ हुआ।<ul>\n<li><strong>बादामी गुफाएँ</strong>: हरिहर का सबसे प्राचीनतम प्रतिमाशास्त्रीय (Iconographic) अंकन <strong>बादामी की गुफाओं</strong> में देखने को मिलता है।</li>\n</ul>\n</li>\n<li><strong>देवगढ़ (झाँसी) का दशावतार मन्दिर</strong>:<ul>\n<li>यह मन्दिर गुप्तकालीन वैष्णव वास्तुकला और धर्म का सबसे अनुपम एवं महत्वपूर्ण ऐतिहासिक उदाहरण है।</li>\n<li><strong>पंचायतन श्रेणी</strong>: यह मन्दिर पूर्णतः <strong>पंचायतन श्रेणी</strong> (Panchayatana Style) की शिल्प कला में निर्मित है।</li>\n<li><strong>शेषशायी विष्णु</strong>: इस मन्दिर के मुख्य गर्भगृह में भगवान विष्णु को <strong>शेषनाग की शैया पर विश्राम करते हुए (अनन्त शयन मुद्रा में)</strong> अत्यंत सजीव रूप में चित्रित किया गया है।</li>\n<li><strong>केशवपुर</strong>: ऐतिहासिक रूप से, पहले इस स्थान/मन्दिर का नाम <strong>'केशवपुर'</strong> था।</li>\n</ul>\n</li>\n</ul>\n<h2>5. शैव सम्प्रदाय का विस्तृत विवरण</h2>\n<h3>क. शिव-पार्वती एवं त्रिमूर्ति पूजा का विकास:</h3>\n<ul>\n<li><strong>धार्मिक सहिष्णुता</strong>: गुप्त सम्राटों की उदार धार्मिक सहिष्णुता की नीति के कारण वैष्णव धर्म के समान ही <strong>शैवधर्म का भी संपूर्ण साम्राज्य में व्यापक प्रचार-प्रसार</strong> हुआ।</li>\n<li><strong>शिव-पार्वती की संयुक्त मूर्तियाँ</strong>: भगवान शिव और देवी पार्वती की <strong>संयुक्त मूर्तियों (मूर्तिकला)</strong> का निर्माण इसी गौरवशाली काल में आरम्भ हुआ था।</li>\n<li><strong>अर्धनारीश्वर (शक्ति + शिव एकीकरण)</strong>:<ul>\n<li><strong>'अर्धनारीश्वर'</strong> के रूप में देवी शक्ति और भगवान शिव (दोनों प्रमुख सम्प्रदायों) का ऐतिहासिक एकीकरण हुआ।</li>\n<li><strong>भीटा का साक्ष्य</strong>: अर्धनारीश्वर की सबसे <strong>प्रथम और प्राचीनतम मूर्ति भीटा से प्राप्त हुई है</strong>।</li>\n</ul>\n</li>\n<li><strong>त्रिमूर्ति की अवधारणा</strong>: गुप्तकाल के अंतिम दौर में (विशेषतः <strong>छठी शताब्दी तक आते-आते</strong>) हिन्दू धर्म में <strong>ब्रह्मा, विष्णु और महेश (शिव) की त्रिमूर्ति</strong> की संयुक्त पूजा-अर्चना आरम्भ हो गई थी।</li>\n<li><strong>शिवलिंगों का विकास</strong>: भगवान शिव के <strong>एकमुखी</strong> (एक मुख वाले) तथा <strong>चतुर्मुखी</strong> (चार मुख वाले) शिवलिंगों के निर्माण की कला सर्वप्रथम गुप्तकाल में ही विकसित हुई।</li>\n</ul>\n<h3>ख. शैव धर्म के चार प्रमुख सम्प्रदाय:</h3>\n<p>गुप्तकाल में शैव मत के अंतर्गत निम्नलिखित <strong>चार सम्प्रदायों</strong> का व्यवस्थित विकास हुआ:</p>\n<ol>\n<li><strong>शैव</strong></li>\n<li><strong>पाशुपत</strong></li>\n<li><strong>कापालिक</strong></li>\n<li><strong>कालामुख</strong></li>\n</ol>\n<h3>ग. शैव धर्म से जुड़े महत्वपूर्ण ऐतिहासिक एवं अभिलेखीय साक्ष्य:</h3>\n<ul>\n<li><strong>आर्योदिताचार्य का मथुरा स्तम्भ लेख</strong>:<ul>\n<li>चन्द्रगुप्त द्वितीय (विक्रमादित्य) के शासनकाल के <strong>मथुरा स्तम्भ लेख</strong> में <strong>'आर्योदिताचार्य'</strong> नामक एक प्रसिद्ध पाशुपत मतानुयायी आचार्य का उल्लेख मिलता है।</li>\n<li>आचार्य उदिताचार्य ने यहाँ <strong>दो शिवलिंगों की स्थापना</strong> करवाई थी।</li>\n<li>इस अभिलेख में भगवान <strong>'कुशिक'</strong> का भी ऐतिहासिक उल्लेख है, जिन्हें पाशुपत सम्प्रदाय के प्रणेता <strong>लकुलीश का परम शिष्य</strong> माना जाता है।</li>\n</ul>\n</li>\n<li><strong>स्कन्दगुप्त के 'बैल' (नंदी) अंकित सिक्के</strong>: सम्राट स्कन्दगुप्त ने अपने शासनकाल में <strong>बैल (नंदी) की आकृति वाले सिक्के</strong> जारी करवाए थे, जो शैव मत में उनकी अगाध व्यक्तिगत आस्था को प्रत्यक्ष रूप से प्रदर्शित करते हैं।</li>\n<li><strong>कुमारगुप्त के 'कार्तिकेय' अंकित सिक्के</strong>: सम्राट कुमारगुप्त के सिक्कों पर <strong>मयूर (मोर) पर आरूढ़ भगवान कार्तिकेय (स्कन्द)</strong> की अत्यंत सुंदर प्रतिमा अंकित मिलती है।</li>\n<li><strong>वीरसेन का उदयगिरि गुहालेख</strong>: चंद्रगुप्त विक्रमादित्य के शैव धर्मानुयायी सन्धिविग्रहिक मंत्री <strong>'वीरसेन'</strong> ने <strong>उदयगिरि की पहाड़ी पर एक शिव मन्दिर का भव्य निर्माण</strong> करवाया था।</li>\n<li><strong>पृथ्वीषेण का दान</strong>: कुमारगुप्त प्रथम के शैव धर्मानुयायी मंत्री <strong>'पृथ्वीषेण'</strong> ने एक शिव मन्दिर को भारी दान प्रदान किया था।</li>\n<li><strong>गुप्तकालीन सर्वप्रमुख शिव मन्दिर</strong>:<ul>\n<li><strong>नचनाकुठारा का पार्वती मन्दिर</strong></li>\n<li><strong>भूमरा (नागोद, मध्य प्रदेश) का शिव मन्दिर</strong>\n<em>(नोट: ये दोनों मन्दिर गुप्तकालीन शैव वास्तुकला के सर्वप्रमुख केंद्र माने जाते हैं)</em>।</li>\n</ul>\n</li>\n<li><strong>कालिदास के साहित्यिक साक्ष्य</strong>:<ul>\n<li>कालिदास द्वारा रचित प्रसिद्ध महाकाव्य <strong>'कुमारसंभव'</strong> में भगवान शिव और पार्वती के पुत्र <strong>कुमार (स्कन्द/कार्तिकेय) के जन्म का अत्यंत विशद वर्णन</strong> मिलता है।</li>\n<li>कालिदास की विभिन्न अमर रचनाओं में <strong>गोकर्ण के शिव</strong>, <strong>काशी के विश्वनाथ</strong> तथा <strong>उज्जैन के सुप्रसिद्ध महाकाल ज्योतिर्लिंग</strong> की उपासना के स्पष्ट ऐतिहासिक संकेत प्राप्त होते हैं।</li>\n</ul>\n</li>\n<li><strong>ह्वेनसांग की बलि का प्रसंग (दुर्गा पूजा)</strong>:<ul>\n<li>चीनी बौद्ध यात्री <strong>ह्वेनसांग</strong> की बलि कुछ कपाली/स्थानीय दस्युओं द्वारा <strong>शिव की पत्नी देवी दुर्गा के सम्मुख</strong> दी जाने वाली थी।</li>\n<li>परन्तु बलि दिए जाने के ठीक पहले अचानक आए एक <strong>भयानक प्राकृतिक तूफान</strong> के कारण डाकू भयभीत हो गए और ह्वेनसांग की जान बाल-बाल बच गई।</li>\n</ul>\n</li>\n</ul>\n"}, {"id": "0-20", "title": "गुप्तकाल में बौद्ध एवं जैन धर्म", "file": "history-gupta.md", "html": "<h1>गुप्तकाल में बौद्ध एवं जैन धर्म</h1>\n<h2>1. बौद्ध धर्म का विकास एवं सम्प्रदाय (Buddhism in the Gupta Period)</h2>\n<h3>क. महायान शाखा और नवीन दार्शनिक सम्प्रदाय:</h3>\n<ul>\n<li><strong>महायान की लोकप्रियता</strong>: गुप्तकाल में बौद्ध धर्म की <strong>महायान शाखा (सम्प्रदाय)</strong> अधिक लोकप्रिय हुई।</li>\n<li><strong>दार्शनिक सम्प्रदायों का प्रादुर्भाव</strong>: महायान के अन्तर्गत बौद्ध दर्शन के दो सर्वप्रमुख सम्प्रदायों का उदय हुआ:<ol>\n<li><strong>माध्यमिक सम्प्रदाय</strong> (Madhyamaka)</li>\n<li><strong>योगाचार सम्प्रदाय</strong> (Yogachara)</li>\n</ol>\n</li>\n<li><strong>महान बौद्ध आचार्य</strong>: गुप्तकाल में बौद्ध दर्शन को समृद्ध करने वाले महायान शाखा के प्रमुख बौद्ध आचार्य निम्नलिखित थे:<ul>\n<li><strong>आर्यदेव</strong> (Aryadeva)</li>\n<li><strong>असंग</strong> (Asanga)</li>\n<li><strong>वसुबन्धु</strong> (Vasubandhu)</li>\n<li><strong>मैत्रेयनाथ</strong> (Maitreyanatha)</li>\n<li><strong>दिङ्नाग</strong> (Dignaga)</li>\n</ul>\n</li>\n<li><strong>आचार्य दिङ्नाग की उपाधि</strong>: गुप्तकालीन महान बौद्ध न्यायविद् आचार्य दिङ्नाग को <strong>'तर्कपुङ्गव'</strong> की प्रतिष्ठित उपाधि प्रदान की गई थी।</li>\n</ul>\n<h3>ख. राजकीय संरक्षण एवं अभिलेखीय साक्ष्य (साँची अभिलेख):</h3>\n<ul>\n<li><strong>आम्रकार्दव की नियुक्ति</strong>: गुप्त सम्राट <strong>चन्द्रगुप्त द्वितीय (विक्रमादित्य)</strong> ने <strong>आम्रकार्दव</strong> नामक एक बौद्ध धर्मावलम्बी को अपने प्रशासन में अत्यंत उच्च और महत्वपूर्ण पद प्रदान किया था।</li>\n<li><strong>पच्चीस दीनार का दान</strong>: <strong>साँची अभिलेख</strong> से प्राप्त प्रामाणिक जानकारी के अनुसार, सेनापति आम्रकार्दव ने <strong>काकनादबार (साँची) के महाविहार</strong> को <strong>पच्चीस (25) दीनार</strong> उदारतापूर्वक दान में दी थी।</li>\n</ul>\n<h3>ग. बौद्ध केन्द्रों का ह्रास एवं फाह्यान का विवरण:</h3>\n<ul>\n<li><strong>समृद्धि का अंत</strong>: पूर्ववर्ती कालों के समृद्ध बौद्ध केन्द्र—<strong>वैशाली</strong>, <strong>श्रावस्ती</strong> तथा <strong>कपिलवस्तु</strong>—गुप्त युग तक आते-आते बौद्ध धर्म के समृद्ध केन्द्र नहीं रहे।</li>\n<li><strong>उजड़ी हुई अवस्था</strong>: चीनी बौद्ध यात्री <strong>फाह्यान</strong> ने अपनी यात्रा के दौरान महात्मा बुद्ध के जीवन से जुड़े प्रसिद्ध नगरों—<strong>कपिलवस्तु</strong>, <strong>श्रावस्ती</strong> तथा <strong>कुशीनगर</strong> को अत्यंत उजड़ी हुई (जर्जर) अवस्था में पाया था।</li>\n<li><strong>मगध में बौद्धों को जन-समर्थन</strong>: फाह्यान के यात्रा विवरण के अनुसार, <strong>मगध</strong> क्षेत्र में अनेक समृद्ध नगर थे तथा वहाँ के धनी और संभ्रांत नागरिकों द्वारा बौद्ध धर्म का बड़े पैमाने पर समर्थन और वित्तीय सहयोग किया जाता था।</li>\n</ul>\n<h3>घ. चीनी तीर्थयात्रियों हेतु मन्दिर (मृगशिखावन) एवं इत्सिंग का साक्ष्य:</h3>\n<ul>\n<li><strong>चेलिकिटो (श्रीगुप्त) का निर्माण कार्य</strong>: सातवीं शताब्दी के चीनी यात्री <strong>इत्सिंग</strong> के अनुसार, गुप्त राजवंश के आदि-पुरुष (संस्थापक) <strong>श्रीगुप्त</strong> ने भारत आने वाले चीनी बौद्ध तीर्थयात्रियों के भरण-पोषण और विश्राम के लिए <strong>मृगशिखावन</strong> के पास एक भव्य मन्दिर का निर्माण करवाया था।</li>\n<li><strong>श्रीगुप्त का चीनी नाम</strong>: इत्सिंग ने अपने यात्रा वृत्तांत में राजा श्रीगुप्त का नाम <strong>'चेलिकिटो'</strong> (Che-li-ki-to) बताया है।</li>\n<li><strong>मृगशिखावन का अन्य संदर्भ</strong>: बौद्ध इतिहास के अनुसार, सुप्रसिद्ध बौद्ध विद्यापीठ <strong>नालंदा का दूसरा नाम भी 'मृगशिखावन' था</strong>।</li>\n</ul>\n<h2>2. जैन धर्म की दशा एवं सम्प्रदाय (Jainism in the Gupta Period)</h2>\n<h3>क. सामाजिक स्थिति एवं राजकीय संरक्षण:</h3>\n<ul>\n<li><strong>फाह्यान का मौन</strong>: चीनी बौद्ध यात्री फाह्यान ने अपने पूरे यात्रा विवरण में <strong>जैन धर्म का कोई उल्लेख नहीं किया है</strong>।</li>\n<li><strong>व्यापारिक वर्ग में लोकप्रियता</strong>: फाह्यान के मौन के विपरीत, गुप्तकाल में जैन धर्म समाज के <strong>व्यापारियों (वणिक वर्ग) के बीच अत्यधिक लोकप्रिय और प्रचलित था</strong>।</li>\n<li><strong>राजकीय प्रश्रय (क्षेत्रीय विभेद)</strong>:<ul>\n<li><strong>उत्तर भारत</strong>: उत्तर भारत में जैन धर्म को गुप्त सम्राटों अथवा किसी अन्य प्रांतीय शासक द्वारा <strong>कोई राजकीय प्रश्रय (संरक्षण) प्राप्त नहीं हुआ</strong>।</li>\n<li><strong>दक्षिण भारत</strong>: इसके विपरीत, दक्षिण भारत के शक्तिशाली <strong>कदम्ब वंश</strong> एवं <strong>गंग वंश</strong> के राजाओं ने जैन धर्म को उदारतापूर्वक राजकीय संरक्षण और आश्रय प्रदान किया।</li>\n</ul>\n</li>\n</ul>\n<h3>ख. जैन सम्प्रदाय और उनके प्रमुख केन्द्र:</h3>\n<ul>\n<li><strong>श्वेताम्बर जैन धर्म के केन्द्र</strong>: उत्तर भारत में <strong>मथुरा</strong> तथा पश्चिमी भारत में <strong>वल्लभी</strong> (गुजरात) श्वेताम्बर जैन धर्म के दो सर्वप्रमुख और जीवंत केन्द्र थे।</li>\n<li><strong>वल्लभी जैन संगीति (513 ईस्वी)</strong>:<ul>\n<li>गुजरात के <strong>वल्लभी</strong> नामक स्थान पर <strong>513 ईस्वी</strong> में श्वेताम्बर जैन धर्म की द्वितीय महासभा (संगीति) का ऐतिहासिक आयोजन संपन्न हुआ।</li>\n<li><strong>सभापति</strong>: इस ऐतिहासिक वल्लभी जैन सभा के अध्यक्ष/सभापति सुप्रसिद्ध जैन आचार्य <strong>देवर्धिगणि 'क्षमाश्रमण'</strong> (Devardhigani Kshamasramana) थे।</li>\n</ul>\n</li>\n<li><strong>दिगम्बर जैन धर्म का केन्द्र</strong>: पूर्वी भारत के बंगाल में स्थित <strong>पुण्ड्रवर्धन</strong> (Pundravardhana) दिगम्बर जैन सम्प्रदाय का एक अत्यंत समृद्ध और सक्रिय केन्द्र था।</li>\n</ul>\n<h3>ग. जैन धर्म का भौगोलिक विस्तार:</h3>\n<ul>\n<li><strong>व्यापक प्रसार</strong>: गुप्तकाल के दौरान जैन धर्म का भौगोलिक विस्तार <strong>मगध से लेकर कलिंग (उड़ीसा), मथुरा, उदयगिरि (मध्य प्रदेश) तथा सुदूर दक्षिण में तमिलनाडु तक</strong> विस्तृत था।</li>\n<li><strong>मगध का ह्रास</strong>: यद्यपि जैन धर्म का प्रचार इतने विशाल भू-भाग पर था, परन्तु प्राचीन काल में जैन धर्म का मुख्य गढ़ रहा <strong>मगध अब इसका मुख्य केन्द्र नहीं रह गया था</strong>।</li>\n</ul>\n<h2>3. गुप्तकालीन बौद्ध एवं जैन विद्वान तथा उनके साहित्यिक योगदान</h2>\n<p>गुप्तकाल संस्कृत और दर्शन के विकास का स्वर्ण युग था। इस काल में बौद्ध और जैन आचार्यों द्वारा रचित कालजयी ग्रंथों का विवरण निम्नलिखित तालिकाओं में दिया गया है:</p>\n<h3>तालिका 1: प्रमुख बौद्ध आचार्य एवं उनकी उपलब्धियाँ</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">बौद्ध आचार्य का नाम</th>\n  <th style=\"text-align:left\">दार्शनिक शाखा / सम्प्रदाय</th>\n  <th style=\"text-align:left\">ऐतिहासिक योगदान / उपाधि</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>दिङ्नाग</strong></td>\n  <td style=\"text-align:left\">महायान बौद्ध दर्शन</td>\n  <td style=\"text-align:left\">इन्हें तर्कशास्त्र में असाधारण योगदान हेतु <strong>'तर्कपुङ्गव'</strong> की उपाधि मिली थी।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>वसुबन्धु</strong></td>\n  <td style=\"text-align:left\">महायान (योगाचार)</td>\n  <td style=\"text-align:left\">गुप्तकालीन प्रसिद्ध बौद्ध दार्शनिक और महान आचार्य।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>आर्यदेव</strong></td>\n  <td style=\"text-align:left\">महायान (माध्यमिक)</td>\n  <td style=\"text-align:left\">शून्यवाद और माध्यमिक दर्शन के प्रकांड विद्वान।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>असंग</strong></td>\n  <td style=\"text-align:left\">महायान (योगाचार)</td>\n  <td style=\"text-align:left\">योगाचार सम्प्रदाय के महत्वपूर्ण आचार्य और व्याख्याता।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>मैत्रेयनाथ</strong></td>\n  <td style=\"text-align:left\">महायान (योगाचार)</td>\n  <td style=\"text-align:left\">योगाचार दार्शनिक शाखा के प्रारंभिक प्रणेताओं में से एक।</td>\n</tr>\n</tbody>\n</table>\n<h3>तालिका 2: प्रमुख जैन आचार्य, ग्रंथ एवं पुरातात्विक साक्ष्य</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">जैन आचार्य / व्यक्तित्व</th>\n  <th style=\"text-align:left\">रचित ग्रंथ / पुरातात्विक कृत्य</th>\n  <th style=\"text-align:left\">ऐतिहासिक तिथि / काल</th>\n  <th style=\"text-align:left\">विशिष्ट विवरण एवं महत्व</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>आचार्य देवनन्दि</strong></td>\n  <td style=\"text-align:left\"><strong>'सर्वार्थसिद्धि'</strong> एवं <strong>'जैनेन्द्र व्याकरण'</strong></td>\n  <td style=\"text-align:left\">गुप्तकाल</td>\n  <td style=\"text-align:left\">इन्होंने संस्कृत व्याकरण का अत्यंत प्रसिद्ध ग्रंथ <strong>'जैनेन्द्र व्याकरण'</strong> लिखा।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>मुनि सर्वनन्दी</strong></td>\n  <td style=\"text-align:left\"><strong>'लोकविभाग'</strong> (Lokavibhaga)</td>\n  <td style=\"text-align:left\"><strong>458 ईस्वी</strong></td>\n  <td style=\"text-align:left\">इन्होंने प्राकृत/संस्कृत ग्रंथ 'लोकविभाग' की रचना की।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>आचार्य सिद्धसेन</strong></td>\n  <td style=\"text-align:left\"><strong>'न्यायवार्ता'</strong> (Nyayavarta)</td>\n  <td style=\"text-align:left\">गुप्तकाल</td>\n  <td style=\"text-align:left\">इस ग्रंथ के लेखन से जैन दर्शन और भारतीय न्याय दर्शन के विकास में अभूतपूर्व योगदान मिला।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>मद्र</strong> (श्रावक/व्यक्ति)</td>\n  <td style=\"text-align:left\"><strong>पाँच जैन तीर्थंकरों की मूर्तियाँ</strong></td>\n  <td style=\"text-align:left\"><strong>स्कन्दगुप्त का शासनकाल</strong></td>\n  <td style=\"text-align:left\"><strong>कहोम अभिलेख</strong> के अनुसार, इन्होंने कहोम (उत्तर प्रदेश) में पाँच तीर्थंकरों की पाषाण मूर्तियाँ स्थापित कराई थीं।</td>\n</tr>\n</tbody>\n</table>\n"}, {"id": "0-21", "title": "गुप्तकालीन कला एवं मंदिर स्थापत्य: ऐतिहासिक एवं संरचनात्मक विश्लेषण", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन कला एवं मंदिर स्थापत्य: ऐतिहासिक एवं संरचनात्मक विश्लेषण</h1>\n<h2>1. गुप्तकाल: भारतीय कला एवं साहित्य का 'स्वर्णयुग'</h2>\n<ul>\n<li><strong>स्वर्णयुग की संज्ञा</strong>: कला एवं साहित्य के सर्वांगीण विकास की दृष्टि से <strong>गुप्तकाल को भारतीय इतिहास का &quot;स्वर्णयुग&quot; (Golden Age)</strong> कहा गया है।</li>\n<li><strong>गोपियाँ और कृष्ण</strong>: कला एवं साहित्य में <strong>कृष्ण के साथ गोपियों का अंगीकरण</strong> (गोपियों की आकृतियों का निर्माण) सर्वप्रथम <strong>गुप्तकाल में ही संपन्न हुआ था</strong>।</li>\n<li><strong>विदेशी प्रभावों से मुक्ति</strong>: गुप्तकालीन कला की सबसे बड़ी विशेषता यह है कि यह <strong>विदेशी प्रभावों से पूर्णतः मुक्त</strong> थी (यानी पूर्णतः स्वदेशी एवं शास्त्रीय मानदंडों पर आधारित थी)।</li>\n<li><strong>पर्सी ब्राउन का विख्यात कथन</strong>: प्रसिद्ध कला इतिहासकार <strong>पर्सी ब्राउन</strong> ने गुप्त स्थापत्य की प्रशंसा करते हुए लिखा है कि:<blockquote>\n<p><strong>“भारत में राजनीतिक एकता, प्रशासनिक स्थिरता एवं राज्याश्रय का सर्वाधिक प्रभाव गुप्तयुगीन वास्तुकला पर दिखाई देता है।”</strong></p>\n</blockquote>\n</li>\n</ul>\n<hr />\n<h2>2. गुप्तकालीन मंदिर निर्माण कला की सामान्य विशेषताएँ</h2>\n<p>गुप्तकाल भारतीय इतिहास का वह संक्रांति काल है जहाँ <strong>सर्वप्रथम मंदिरों के व्यवस्थित निर्माण की कला का जन्म हुआ</strong>। इससे पूर्व मंदिर निर्माण के सुसंगठित पुरातात्विक साक्ष्य नहीं मिलते हैं।</p>\n<ul>\n<li><strong>वास्तु शैली</strong>: गुप्तयुगीन मंदिर मुख्य रूप से <strong>नागर शैली (Nagara Style)</strong> में निर्मित किए गए हैं।</li>\n<li><strong>पंचायतन शैली का उदय</strong>: गुप्तकाल में ही <strong>पंचायतन शैली</strong> (Panchayatana Style - मुख्य मंदिर के चारों ओर चार सहायक मंदिर) के मंदिर बनने शुरू हुए। पंचायतन शैली का संपूर्ण भारत में <strong>प्राचीनतम उदाहरण देवगढ़ का दशावतार मंदिर</strong> है।</li>\n<li><strong>शिखर युक्त मंदिर</strong>: मंदिरों पर <strong>शिखर (Tower)</strong> का निर्माण गुप्त युग की सर्वाधिक महत्वपूर्ण और क्रांतिकारी उपलब्धि है। <strong>देवगढ़ का दशावतार मंदिर</strong> भारतीय कला इतिहास में <strong>शिखरयुक्त मंदिर का प्रथम (सबसे प्राचीनतम) उदाहरण</strong> माना जाता है।</li>\n<li><strong>वक्ररेखीय शिखर (Curvilinear Shikhara)</strong>: वक्ररेखीय शिखर, जो कि नागर शैली का एक अनिवार्य और विशिष्ट लक्षण है, का संपूर्ण भारत में <strong>प्राचीनतम उदाहरण नचनाकुठार का पार्वती मंदिर</strong> एवं <strong>सिरपुर का लक्ष्मण मंदिर</strong> प्रस्तुत करते हैं।</li>\n<li><strong>निर्माण सामग्री</strong>:<ul>\n<li>गुप्तकाल में मंदिर निर्माण में मुख्य रूप से <strong>छोटी ईंटों व पत्थरों</strong> का प्रयोग किया गया है।</li>\n<li>यद्यपि <strong>भीतरगाँव (कानपुर)</strong> का मंदिर पूर्णतः <strong>ईंटों से निर्मित</strong> है, फिर भी एक महत्वपूर्ण ऐतिहासिक तथ्य के रूप में यह स्मरणीय है कि <strong>गुप्तकाल के अधिकांश मंदिर पाषाण (पत्थरों) द्वारा निर्मित हैं</strong>।</li>\n</ul>\n</li>\n<li><strong>वर्गाकार चबूतरे</strong>: गुप्तकाल में मंदिरों का निर्माण <strong>वर्गाकार चबूतरे</strong> पर होना शुरू हुआ। इस चबूतरे पर चढ़ने के लिए <strong>चारों ओर सीढ़ियाँ</strong> बनाई जाती थीं।</li>\n<li><strong>शास्त्रीय नियमों का निर्धारण</strong>: मंदिर वास्तुकला के विकास के साथ-साथ इस काल में इसके सुदृढ़ <strong>शास्त्रीय नियम</strong> (विधिक नियम) भी निर्धारित हुए।</li>\n<li><strong>सामान्य मंदिर संरचना (Key Elements)</strong>: गुप्तकालीन मंदिरों में सामान्यतः निम्नलिखित संरचनात्मक अंग अनिवार्य रूप से पाए जाते थे:<ul>\n<li><strong>आधारपीठिका</strong> (Jagati)</li>\n<li><strong>गर्भगृह</strong> (Sanctum Sanctorum)</li>\n<li><strong>सभामंडप</strong> (Sabha Mandapa)</li>\n<li><strong>शिखर</strong> (Shikhara)</li>\n<li><strong>अंतराल</strong> (Antarala)</li>\n<li><strong>प्रदक्षिणापथ</strong> (गर्भगृह के चारों ओर ऊपर से पूरी तरह आच्छादित मार्ग)</li>\n<li><strong>द्वार पर गंगा-यमुना की मूर्तियाँ</strong>।</li>\n</ul>\n</li>\n</ul>\n<h2>3. गर्भगृह (The Garbhagriha)</h2>\n<ul>\n<li><strong>परिभाषा</strong>: मंदिर के भीतर निर्मित वह <strong>चौकोर कक्ष</strong> जिसमें मुख्य आराध्य देवी या देवता की मूर्ति स्थापित की जाती थी, उसे मंदिर का सबसे महत्वपूर्ण भाग—<strong>गर्भगृह</strong> कहा जाता था।</li>\n<li><strong>कलात्मक सजावट</strong>: प्रारंभ में गर्भगृह की दीवारें अत्यंत <strong>सादी होती थीं</strong>, किन्तु बाद के काल में उन्हें विभिन्न कलात्मक और सुंदर <strong>मूर्तियों से सजाया जाने लगा</strong>।</li>\n</ul>\n<h2>4. प्रमुख गुप्तकालीन मंदिरों का सविस्तार वर्णन (Classified Temple Directory)</h2>\n<p>स्रोत के अनुसार गुप्तकाल के प्रमुख मंदिरों की वर्गीकृत सूची, उनके स्थान और स्थापत्य कलात्मक विशेषताओं का विस्तृत विवरण निम्नलिखित है:</p>\n<h3>1. देवगढ़ का दशावतार मंदिर (ललितपुर, उत्तर प्रदेश)</h3>\n<ul>\n<li><strong>काल</strong>: यह मन्दिर <strong>छठी शताब्दी</strong> का है।</li>\n<li><strong>नदी</strong>: यह बेतवा की प्राचीन सहायक नदी <strong>वेत्रवती नदी के तट</strong> पर स्थित है।</li>\n<li><strong>महत्त्व</strong>: भारतीय मंदिर निर्माण के इतिहास में <strong>शिखर का संभवतः यह पहला ऐतिहासिक उदाहरण</strong> है।</li>\n<li><strong>दीवारों पर उत्कीर्ण प्रमुख दृश्य</strong>:<ul>\n<li><strong>शेषशायी विष्णु</strong> (शेषनाग की शय्या पर लेटे भगवान विष्णु)।</li>\n<li><strong>नर-नारायण की तपस्या</strong> का भव्य दृश्य।</li>\n<li><strong>गजेंद्र मोक्ष</strong> (हाथी को ग्राह के चंगुल से मुक्त कराने) का मार्मिक दृश्य।</li>\n</ul>\n</li>\n<li><strong>शिव का योगी रूप</strong>: इस दशावतार मंदिर में <strong>भगवान शिव को एक 'योगी' के रूप में</strong> दर्शाया गया है।</li>\n</ul>\n<h3>2. नचना-कुठारा का पार्वती मंदिर (अजयगढ़, मध्य प्रदेश)</h3>\n<ul>\n<li><strong>शिव-पार्वती का अंकन</strong>: इस मंदिर में <strong>भगवान शिव और देवी पार्वती को विभिन्न संगीत वाद्य यंत्रों के साथ</strong> उकेरा (उत्कीर्ण) गया है।</li>\n<li><strong>रामकथा का सर्वप्रथम अंकन</strong>: भारतीय शिल्प कला के इतिहास में <strong>रामकथा (रामायण) का सर्वप्रथम पुरातात्विक अंकन</strong> इसी नचना-कुठारा के पार्वती मंदिर की दीवारों पर मिलता है।</li>\n</ul>\n<h3>3. भूमरा का शिव मंदिर (सतना, मध्य प्रदेश)</h3>\n<ul>\n<li><strong>गंगा-यमुना की मूर्तियाँ</strong>: भूमरा शिव मंदिर के प्रवेश द्वार के स्तंभ के <strong>दाएँ भाग पर मकरवाहिनी गंगा</strong> तथा <strong>बाएँ भाग पर कूर्मवाहिनी यमुना</strong> की आकृतियाँ उत्कृष्ट रूप से उत्कीर्ण हैं।</li>\n<li><strong>रत्नजड़ित शिव</strong>: इस मंदिर में <strong>भगवान शिव को रत्नजड़ित मुकुट धारण किए हुए</strong> अत्यंत भव्यता के साथ दिखाया गया है।</li>\n</ul>\n<h3>4. खोह का शिव मंदिर (सतना, मध्य प्रदेश)</h3>\n<ul>\n<li>यह मध्य प्रदेश के सतना जिले में स्थित शैव मत का एक अन्य सुप्रसिद्ध मंदिर है।</li>\n</ul>\n<h3>5. साँची का मंदिर संख्या- 17 (मध्य प्रदेश)</h3>\n<ul>\n<li><strong>काल</strong>: यह एक <strong>प्रारंभिक गुप्तकालीन मंदिर</strong> है।</li>\n<li><strong>योजना</strong>: इसकी योजना पूर्णतः <strong>आयताकार (Rectangular)</strong> थी, जिसमें शिखर का अभाव था और छत चपटी थी।</li>\n</ul>\n<h3>6. तिगवा का विष्णु मंदिर (जबलपुर, मध्य प्रदेश)</h3>\n<ul>\n<li>यह मध्य प्रदेश के जबलपुर में स्थित वैष्णव मत का एक ऐतिहासिक मंदिर है।</li>\n</ul>\n<h3>7. एरण का विष्णु मंदिर (सागर, मध्य प्रदेश)</h3>\n<ul>\n<li><strong>वराह की विशाल मूर्ति</strong>: एरण से भगवान विष्णु के <strong>वराह अवतार की वास्तविक आकार (विशाल) की मूर्ति</strong> प्राप्त हुई है, जिसका निर्माण <strong>धन्यविष्णु</strong> द्वारा कराया गया था।</li>\n<li><strong>गरुड़ ध्वज</strong>: एरण विष्णु मंदिर के ठीक सम्मुख <strong>बुद्धगुप्त के शासनकाल में 484 ईस्वी में एक विशाल गरुड़ ध्वज स्थापित किया गया था</strong>।</li>\n</ul>\n<h3>8. भीतरगाँव का मंदिर (कानपुर, उत्तर प्रदेश)</h3>\n<ul>\n<li><strong>निर्माण सामग्री</strong>: यह पूर्णतः <strong>ईंटों से निर्मित</strong> संपूर्ण भारत का सबसे प्राचीनतम मंदिर है।</li>\n<li><strong>मेहराबों का सर्वप्रथम प्रयोग</strong>: भीतरगाँव मंदिर के शिखर में <strong>भारत में सर्वप्रथम मेहराबों (Arches) का प्रयोग</strong> किया गया था। ये मेहराब कलात्मक रूप से <strong>चैत्याकार</strong> (Chaitya-shaped) हैं।</li>\n<li><strong>शिखर</strong>: भीतरगाँव का शिखर संपूर्ण भारत में <strong>शिखर निर्माण का दूसरा प्राचीनतम उदाहरण</strong> प्रस्तुत करता है।</li>\n<li><strong>समर्पण</strong>: यह मंदिर किसी एक विशिष्ट देवता को समर्पित नहीं है, बल्कि इसमें <strong>शिव, विष्णु, गणेश, दुर्गा तथा महिषासुरमर्दिनी</strong> आदि अनेक प्रमुख देवी-देवताओं की भव्य मूर्तियाँ स्थापित हैं।</li>\n</ul>\n<h3>9. सिरपुर का लक्ष्मण मंदिर (महासमुंद, छत्तीसगढ़)</h3>\n<ul>\n<li><strong>समर्पण</strong>: यह मंदिर मुख्य रूप से <strong>भगवान विष्णु</strong> को समर्पित है।</li>\n<li><strong>निर्माण</strong>: इस मंदिर का निर्माण <strong>7वीं सदी</strong> में सिरपुर की <strong>रानी वासटा</strong> द्वारा करवाया गया था।</li>\n<li><strong>निर्माण सामग्री</strong>: सिरपुर का लक्ष्मण मंदिर तथा बांग्लादेश का <strong>पहाड़पुर मंदिर</strong> भी पूर्णतः <strong>ईंटों से निर्मित</strong> हैं।</li>\n</ul>\n<h3>10. उदयगिरी का गुहा मंदिर (विदिशा, मध्य प्रदेश)</h3>\n<ul>\n<li><strong>निर्माण</strong>: विदिशा के उदयगिरी में भव्य <strong>ब्राह्मण गुहा मंदिर (Cave temple)</strong> का निर्माण संपन्न हुआ। इसका निर्माण चन्द्रगुप्त विक्रमादित्य के शैव सेनापति <strong>वीरसेन</strong> द्वारा करवाया गया था।</li>\n<li><strong>वराह की विशाल मूर्ति</strong>: इस गुहा मंदिर में भगवान विष्णु के <strong>वराह अवतार की अत्यंत विशाल मूर्ति</strong> स्थापित है।</li>\n<li><strong>उद्धार का अंकन</strong>: इस मूर्ति में वराह देव को <strong>समुद्र से पृथ्वी का संकटपूर्ण उद्धार करते हुए</strong> अत्यंत जीवंतता के साथ अंकित किया गया है।</li>\n</ul>\n<h3>11. दीनाजपुर का वैग्राम मंदिर (बांग्लादेश)</h3>\n<ul>\n<li>यह पूर्वी बंगाल (तत्कालीन दीनाजपुर, वर्तमान बांग्लादेश) में स्थित गुप्तकालीन मंदिर है।</li>\n</ul>\n<h2>5. गुप्तकालीन गुहा स्थापत्य एवं भौगोलिक वितरण</h2>\n<ul>\n<li><strong>गुहा मंदिर</strong>: गुप्तकाल में ब्राह्मणों के साथ-साथ <strong>बौद्ध गुहा मंदिरों</strong> का भी व्यापक पैमाने पर निर्माण हुआ।</li>\n<li><strong>सर्वाधिक साक्ष्य</strong>: पुरातात्विक साक्ष्यों के विश्लेषण के अनुसार, गुप्तकालीन <strong>मंदिरों के सबसे ज्यादा साक्ष्य वर्तमान मध्य प्रदेश राज्य से प्राप्त होते हैं</strong>।</li>\n</ul>\n"}, {"id": "0-22", "title": "गुप्तकालीन मूर्तिकला, चित्रकला एवं गुफा स्थापत्य", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन मूर्तिकला, चित्रकला एवं गुफा स्थापत्य</h1>\n<h2>1. गुप्तकालीन मूर्तिकला (Gupta Sculpture)</h2>\n<p>गुप्तकाल में मूर्तिकला अपनी परिपक्वता, स्वाभाविकता और सौंदर्य के चरमोत्कर्ष पर पहुँच गई थी। कला और साहित्य के असाधारण विकास के कारण ही इस काल को <strong>भारतीय इतिहास का 'स्वर्णयुग'</strong> कहा जाता है।</p>\n<h3>क. मूर्तिकला की प्रमुख विशेषताएँ:</h3>\n<ul>\n<li><strong>मुख्य केंद्र</strong>: गुप्तकाल में मूर्तिकला के <strong>तीन प्रमुख केंद्र</strong> थे:<ol>\n<li><strong>मथुरा</strong></li>\n<li><strong>सारनाथ</strong></li>\n<li><strong>पाटलिपुत्र</strong></li>\n</ol>\n</li>\n<li><strong>मथुरा शैली का प्रभाव</strong>: गुप्तकालीन मूर्तिकारों ने <strong>मथुरा शैली</strong> से गहराई से प्रभावित होकर मूर्तियों का निर्माण किया।</li>\n<li><strong>गंगा-यमुना की मूर्तियाँ</strong>: हिन्दू देव परिवार में <strong>गंगा और यमुना देवी की मूर्तियाँ</strong> स्वतंत्र रूप से बनाना गुप्तकाल की ही देन है।</li>\n<li><strong>निर्माण सामग्री</strong>: इस काल में मूर्तियाँ मुख्य रूप से तीन प्रकार की सामग्रियों से बनाई जाती थीं:<ul>\n<li><strong>धातु</strong> (Metals)</li>\n<li><strong>पत्थर</strong> (Stone)</li>\n<li><strong>मिट्टी</strong> (Terracotta / Clay)</li>\n</ul>\n</li>\n<li><strong>प्रतिमाशास्त्रीय लक्षण (Aesthetic Features)</strong>: गुप्तकालीन मूर्तिकला के प्रमुख कलात्मक लक्षणों में निम्नलिखित शामिल हैं:<ul>\n<li><strong>परिधानों (वस्त्रों) की महत्ता</strong> (पारदर्शी और सुंदर सलवटें)</li>\n<li><strong>अलंकृत प्रभामंडल</strong> (सिर के पीछे अत्यधिक सजावटी ओरा)</li>\n<li><strong>विशेष केश सज्जा</strong> (बालों की अनूठी और सुंदर बनावट)</li>\n<li><strong>मुद्रा एवं आसन</strong> (शरीर की विभिन्न विधिक मुद्राएँ)</li>\n<li><strong>आध्यात्मिकता एवं सरलता</strong> (चेहरे पर शांत और अलौकिक भाव)</li>\n<li><strong>भारतीयकरण</strong> (विदेशी प्रभावों से पूर्ण मुक्ति)</li>\n</ul>\n</li>\n<li><strong>अर्धनारीश्वर रूप की रचना</strong>: भगवान शिव के <strong>'अर्धनारीश्वर'</strong> रूप (आधा शरीर पुरुष/शिव और आधा शरीर नारी/पार्वती) की सर्वप्रथम रचना इसी गुप्त काल में हुई।</li>\n</ul>\n<h3>ख. मूर्तिकला के सर्वोत्कृष्ट पुरातात्विक साक्ष्य:</h3>\n<ul>\n<li><strong>सारनाथ की मूर्तियाँ</strong>: गुप्त मूर्तिकला का <strong>सर्वोत्तम और सर्वश्रेष्ठ उदाहरण</strong> सारनाथ से प्राप्त मूर्तियाँ हैं।</li>\n<li><strong>चुनार का पत्थर</strong>: सारनाथ से प्राप्त सभी बौद्ध मूर्तियों का निर्माण विशेष रूप से <strong>चुनार के सफेद बालूदार पत्थर</strong> से किया गया है।</li>\n<li><strong>काँगड़ा की पीतल की मूर्ति</strong>: हिमाचल प्रदेश के <strong>काँगड़ा</strong> से बुद्ध की <strong>'धर्मचक्रप्रवर्तन मुद्रा'</strong> में बनी <strong>पीतल की अत्यंत दुर्लभ मूर्ति</strong> प्राप्त हुई है।</li>\n<li><strong>सुल्तानगंज की ताँबे की प्रतिमा</strong>: बिहार के <strong>सुल्तानगंज</strong> से बुद्ध की <strong>7½ फीट (साढ़े सात फीट) ऊँची, 'अभय मुद्रा' में खड़ी ताँबे की विशाल प्रतिमा</strong> प्राप्त हुई है (जो वर्तमान में बर्मिंघम संग्रहालय में सुरक्षित है)।</li>\n<li><strong>परिपक्वता के अन्य उदाहरण</strong>: निम्नलिखित मूर्तियाँ गुप्तकालीन मूर्तिकला की पूर्ण परिपक्वता और शास्त्रीयता को प्रमाणित करती हैं:<ul>\n<li><strong>देवगढ़ के दशावतार मंदिर</strong> में स्थापित भगवान विष्णु की भव्य मूर्ति।</li>\n<li><strong>उदयगिरि की गुफा</strong> में उत्कीर्ण भगवान विष्णु के <strong>वराह अवतार</strong> की विशाल मूर्ति।</li>\n<li>काशी एवं कौशाम्बी से प्राप्त <strong>सूर्य देव</strong> की ऐतिहासिक मूर्तियाँ।</li>\n</ul>\n</li>\n<li><strong>बुद्ध की अन्य मुद्राएँ</strong>:<ul>\n<li><strong>सारनाथ</strong> से <strong>'बैठे हुए बुद्ध'</strong> की प्रतिमा प्राप्त हुई है।</li>\n<li><strong>मथुरा</strong> से <strong>'खड़े हुए बुद्ध'</strong> की <strong>'समभंग मुद्रा'</strong> में निर्मित मूर्ति प्राप्त हुई है।</li>\n</ul>\n</li>\n<li><strong>जैन एवं शैव मूर्तियाँ</strong>:<ul>\n<li><strong>मथुरा</strong> से जैन तीर्थंकर <strong>महावीर स्वामी</strong> तथा भगवान <strong>विष्णु</strong> की मूर्तियाँ प्राप्त हुई हैं।</li>\n<li>विष्णु के <strong>वराह अवतार</strong> की मूर्तियाँ विशेष रूप से <strong>उदयगिरि</strong> तथा <strong>एरण</strong> (मध्य प्रदेश) से प्राप्त हुई हैं।</li>\n</ul>\n</li>\n</ul>\n<h2>2. गुप्तकालीन गुहा स्थापत्य, स्तूप एवं विहार (Gupta Architecture)</h2>\n<h3>क. स्तूप एवं विहारों का निर्माण:</h3>\n<ul>\n<li><strong>मूलगंधकुटी विहार (सारनाथ)</strong>: गुप्तकाल में सारनाथ में <strong>'मूलगंधकुटी विहार'</strong> का भव्य निर्माण हुआ था, जिसका ऐतिहासिक उल्लेख चीनी बौद्ध यात्री <strong>ह्वेनसांग</strong> ने अपने यात्रा वृत्तांत में सविस्तार किया है।</li>\n<li><strong>धमेख स्तूप (सारनाथ)</strong>:<ul>\n<li>इस स्तूप का निर्माण गुप्तकाल में हुआ था।</li>\n<li><strong>संरचना</strong>: यह स्तूप एक विस्तृत वर्गाकार <strong>चबूतरे</strong> पर बना हुआ है।</li>\n<li><strong>सामग्री</strong>: धमेख स्तूप पूर्णतः <strong>ईंटों से निर्मित एक विशाल गोलाकार स्तूप</strong> है।</li>\n</ul>\n</li>\n<li><strong>मीरपुरखास स्तूप (सिंध)</strong>: पाकिस्तान के <strong>सिंध</strong> प्रांत में स्थित प्रसिद्ध <strong>'मीरपुरखास स्तूप'</strong> का निर्माण भी इसी गुप्तकाल के दौरान किया गया था।</li>\n<li><strong>गुहा स्थापत्य</strong>: गुप्तकाल के दौरान <strong>ब्राह्मण (हिन्दू) एवं बौद्ध</strong> दोनों धर्मों से संबंधित भव्य गुहा मंदिरों (गुफा मंदिरों) का निर्माण किया गया।<ul>\n<li><strong>भौगोलिक साक्ष्य</strong>: पुरातात्विक साक्ष्यों के अनुसार, गुप्तकालीन मंदिरों और गुफाओं के <strong>सर्वाधिक साक्ष्य वर्तमान मध्य प्रदेश राज्य से प्राप्त होते हैं</strong>।</li>\n</ul>\n</li>\n</ul>\n<h3>ख. उदयगिरि का गुहा मंदिर:</h3>\n<ul>\n<li><strong>स्थान</strong>: उदयगिरि (विदिशा, मध्य प्रदेश)।</li>\n<li><strong>निर्माता</strong>: इस ब्राह्मण गुहा मंदिर का निर्माण गुप्त सम्राट चन्द्रगुप्त विक्रमादित्य के शैव धर्मावलम्बी सेनापति <strong>वीरसेन</strong> ने करवाया था।</li>\n<li><strong>मुख्य मूर्ति</strong>: इस गुहा मंदिर में भगवान विष्णु के <strong>'वराह अवतार' की एक अत्यंत विशाल और भव्य प्रतिमा</strong> स्थापित की गई है।</li>\n<li><strong>कलात्मक अंकन</strong>: यहाँ वराह देव को अत्यंत शौर्यपूर्ण मुद्रा में <strong>समुद्र के गर्त से देवी पृथ्वी का उद्धार करते हुए</strong> सजीव रूप में अंकित किया गया है।</li>\n</ul>\n<h2>3. गुप्तकालीन चित्रकला (Gupta Paintings)</h2>\n<p>गुप्तकाल में चित्रकला के क्षेत्र में <strong>असाधारण और अभूतपूर्व प्रगति</strong> हुई। इस काल की चित्रकला के दो मुख्य और जीवंत उदाहरण <strong>अजंता</strong> और <strong>बाघ</strong> की गुफाओं के चित्र हैं, जो गुप्तकालीन चित्रकला की उन्नति को दर्शाते हैं।</p>\n<h3>क. अजंता की गुफाएँ (Ajanta Caves):</h3>\n<ul>\n<li><strong>स्थान</strong>: ये गुफाएँ <strong>महाराष्ट्र के औरंगाबाद जिले</strong> में <strong>वाघोरा नदी</strong> के किनारे <strong>सह्याद्रि की पहाड़ियों</strong> को अर्धवृत्ताकार रूप में काटकर बनाई गई हैं।</li>\n<li><strong>नामकरण</strong>: गुफाओं से लगभग <strong>दो मील की दूरी पर स्थित 'अविष्ठा' (अविष्ठा) गाँव</strong> के नाम पर इन गुफाओं का नाम 'अजंता' पड़ा।</li>\n<li><strong>खोज</strong>: अजंता की इन गुफाओं की खोज सर्वप्रथम <strong>1819 ईस्वी में मद्रास रेजिमेंट के एक ब्रिटिश सैनिक विलियम एरिस्कन</strong> द्वारा की गई थी।</li>\n<li><strong>कुल संख्या</strong>: अजंता में <strong>कुल 29 गुफाएँ</strong> हैं।</li>\n<li><strong>चैत्य एवं विहार वर्गीकरण</strong>:<ul>\n<li><strong>चैत्य गुफाएँ (पूजा गृह)</strong>: गुफा संख्या <strong>9, 10, 19 व 26</strong> चैत्य गुफाएँ हैं।</li>\n<li><strong>विहार गुफाएँ (निवास स्थान)</strong>: शेष <strong>25 गुफाएँ</strong> बौद्ध भिक्षुओं के रहने के लिए विहार गुफाएँ हैं।</li>\n<li><strong>सबसे प्राचीन गुफा</strong>: गुफा संख्या <strong>13</strong> संपूर्ण अजंता में सबसे प्राचीन मानी जाती है।</li>\n</ul>\n</li>\n<li><strong>हीनयान सम्प्रदाय</strong>: गुफा संख्या <strong>8वीं से लेकर 13वीं गुफा तक</strong> की कुल छह गुफाएँ बौद्ध धर्म के <strong>हीनयान सम्प्रदाय</strong> से संबंधित हैं।</li>\n<li><strong>गुप्तकालीन गुफाएँ</strong>: अजंता की गुफा संख्या <strong>16, 17 एवं 19 पूर्णतः गुप्तकालीन हैं</strong>।<ul>\n<li><strong>निर्माता</strong>: इन गुफाओं का निर्माण वाकाटक राजवंश के प्रतापी राजा <strong>पृथ्वीषेण द्वितीय</strong> के सामंत <strong>व्याघ्रदेव (वराहदेव)</strong> द्वारा करवाया गया था।</li>\n<li><strong>अभिलेखीय साक्ष्य</strong>: इन गुफाओं के अभिलेखों में वाकाटक राजवंश के संस्थापक <strong>'विंध्यशक्ति'</strong> का नाम भी अत्यंत आदरपूर्वक अंकित होने का उल्लेख मिलता है।</li>\n</ul>\n</li>\n<li><strong>चालुक्य कालीन चित्र</strong>: गुफा संख्या <strong>1 तथा 2 के चित्रों का निर्माण छठी-सातवीं शताब्दी में</strong> वातापी के चालुक्य शासक <strong>पुलकेशिन द्वितीय</strong> के काल में संपन्न हुआ था।</li>\n<li><strong>चित्रों के प्रकार</strong>: अजंता की गुफाओं में मुख्य रूप से तीन प्रकार के चित्र मिलते हैं:<ol>\n<li><strong>आलेखन</strong></li>\n<li><strong>वर्णन</strong></li>\n<li><strong>अलंकरण</strong></li>\n</ol>\n</li>\n<li><strong>चित्रण की तकनीकी विधि</strong>: चित्रों के निर्माण में विशेष रूप से <strong>'टेम्परा' (Tempera)</strong> और <strong>'फ्रेस्को' (Fresco)</strong> तकनीकों व विधियों का प्रयोग किया गया है।</li>\n<li><strong>रंगों का प्रयोग</strong>: अजंता की चित्रकला में कुल <strong>6 रंगों</strong> का उपयोग किया गया है:<blockquote>\n<p><strong>लाल, पीला, नीला, काला, सफेद एवं हरा</strong>।</p>\n</blockquote>\n</li>\n</ul>\n<h2>4. अजंता के चित्रों का गुफावार एवं विषयवार विस्तृत विवरण</h2>\n<p>अजंता की गुफाओं में बने चित्र बुद्ध के जीवन, जातक कथाओं और तत्कालीन सामाजिक जीवन को प्रदर्शित करते हैं। वर्तमान में सर्वाधिक चित्र गुफा संख्या 17 में सुरक्षित हैं (पहले 16वीं गुफा में सबसे अधिक चित्र थे, परंतु उनमें से अधिकांश अब नष्ट हो चुके हैं)।</p>\n<h3>क. गुफा संख्या 17 (राशिचक्र गुफा या 'चित्रशाला'):</h3>\n<p>गुफा संख्या 17 को इसकी चित्र-समृद्धि के कारण <strong>'राशिचक्र गुफा'</strong> अथवा <strong>'चित्रशाला'</strong> कहा जाता है। इसके प्रमुख चित्र निम्नलिखित हैं:</p>\n<ul>\n<li><strong>माता और शिशु का चित्र</strong>: यह गुफा संख्या 17 का <strong>सर्वश्रेष्ठ और सर्वाधिक मार्मिक चित्र</strong> है।</li>\n<li><strong>बुद्ध के जीवन के दृश्य</strong>: इसमें बुद्ध के जीवन की महत्वपूर्ण घटनाओं जैसे <strong>महाभिनिष्क्रमण</strong> (गृह-त्याग) तथा <strong>महापरिनिर्वाण</strong> आदि के अत्यंत जीवंत दृश्य उकेरे गए हैं।</li>\n<li><strong>महाहंस जातक कथा का चित्र</strong>: इस चित्र में राजा को एक दिव्य <strong>स्वर्ण हंस</strong> से अत्यंत श्रद्धापूर्वक धार्मिक कथा सुनते हुए प्रदर्शित किया गया है।</li>\n<li><strong>राहुल समर्पण का चित्र</strong>: यशोधरा द्वारा अपने पुत्र राहुल को बुद्ध को सौंपने (समर्पण) का अत्यंत भावुक कर देने वाला दृश्य।</li>\n<li><strong>बुद्ध का गृह-त्याग</strong>: सिद्धार्थ द्वारा अपनी पत्नी और पुत्र को सोता हुआ छोड़कर जाने का दृश्य।</li>\n</ul>\n<h3>ख. गुफा संख्या 16 (सबसे प्रसिद्ध चित्र):</h3>\n<ul>\n<li><strong>मरणासन्न राजकुमारी का चित्र</strong>: यह गुफा संख्या 16 का <strong>सबसे प्रसिद्ध और विश्वव्यापी ख्याति प्राप्त चित्र</strong> है, जिसमें आसन्न मृत्यु से पीड़ित राजकुमारी के दुखद भावों का अत्यंत सजीव चित्रण किया गया है।</li>\n<li><strong>उपदेश सुनते भक्तगण</strong>: भगवान बुद्ध का उपदेश शांत भाव से सुनते हुए बौद्ध भक्तों का समूह।</li>\n<li><strong>वैराग्य के चार दृश्य</strong>: गौतम बुद्ध के मन में वैराग्य उत्पन्न करने वाले चार ऐतिहासिक दृश्यों (वृद्ध, बीमार, मृत व्यक्ति और संन्यासी) का अंकन।</li>\n</ul>\n<h3>ग. गुफा संख्या 9:</h3>\n<ul>\n<li><strong>बैठी हुई स्त्री का चित्र</strong>।</li>\n<li><strong>पुजारियों के दल का चित्र</strong>: पुजारियों का एक समूह अत्यंत भक्तिभाव से <strong>स्तूप की ओर</strong> पूजा-अर्चना के लिए जाता हुआ अंकित है।</li>\n</ul>\n<h3>घ. गुफा संख्या 10:</h3>\n<ul>\n<li><strong>जातक कथाओं के विभिन्न चित्र</strong>।</li>\n<li><strong>राजा का जुलूस</strong>: अनेक <strong>स्त्रियों से घिरे हुए राजा</strong> के वैभवशाली जुलूस (विजय यात्रा) का सजीव चित्रण।</li>\n</ul>\n<h3>ङ. गुफा संख्या 19:</h3>\n<ul>\n<li>यह संपूर्ण अजंता की <strong>सबसे बड़ी 'स्तूप गुफा'</strong> (चैत्य गुफा) है, जिसकी स्थापत्य कला अत्यंत बेजोड़ है।</li>\n</ul>\n<h3>च. गुफा संख्या 1 (चालुक्य कालीन वैभव):</h3>\n<ul>\n<li><strong>मार विजय का चित्र</strong>: वासना और मृत्यु के देवता 'मार' पर बुद्ध की आध्यात्मिक विजय का भव्य चित्र।</li>\n<li><strong>पुलकेशिन द्वितीय की सभा का दृश्य</strong>: वातापी के चालुक्य सम्राट <strong>पुलकेशिन द्वितीय की राजसभा में आए फारसी नरेश खुसरो परवेज द्वितीय के दूत के राजकीय स्वागत</strong> का अत्यंत ऐतिहासिक दृश्य।</li>\n<li><strong>बोधिसत्त्व पद्मपाणि व वज्रपाणि के चित्र</strong>: हाथ में कमल धारण किए बोधिसत्त्व पद्मपाणि और वज्रपाणि के आलौकिक चित्र।</li>\n<li><strong>सांडों की लड़ाई का चित्र</strong>: दो सांडों की आपस में होने वाली भयंकर लड़ाई का अत्यंत स्वाभाविक चित्र।</li>\n</ul>\n<h3>छ. गुफा संख्या 2:</h3>\n<ul>\n<li><strong>विदुर पंडित जातक कथा</strong> का कलात्मक चित्र।</li>\n<li><strong>बुद्ध के जन्म</strong> का सुंदर दृश्य।</li>\n<li>देवी <strong>माया का स्वप्न</strong> (बुद्ध के गर्भ में आने के समय का स्वप्न)।</li>\n<li><strong>झूला झूलती हुई राजकुमारी</strong> का अत्यंत सुंदर और स्वाभाविक चित्र।</li>\n</ul>\n<h3>ज. गुफा संख्या 9 और 10 (सबसे प्राचीन चित्र):</h3>\n<ul>\n<li>अजंता की गुफा संख्या <strong>9 और 10 के चित्र संपूर्ण श्रृंखला में सबसे प्राचीन हैं</strong>।</li>\n<li><strong>काल निर्धारण</strong>: इन प्राचीन चित्रों का निर्माण <strong>प्रथम शताब्दी ईस्वी</strong> के समय, दक्षिण के प्रतापी <strong>सातवाहन शासकों</strong> के राजकीय संरक्षण में किया गया था।</li>\n</ul>\n<h2>5. बाघ की गुफाएँ (Bagh Caves)</h2>\n<ul>\n<li><strong>स्थान</strong>: ये गुफाएँ <strong>मध्य प्रदेश के धार जिले में बाघिनी नदी</strong> के सुरम्य तट पर स्थित हैं।</li>\n<li><strong>खोज</strong>: बाघ की इन ऐतिहासिक गुफाओं की खोज सर्वप्रथम <strong>1818 ईस्वी में लेफ्टिनेंट डेंजरफील्ड (Dangerfield)</strong> द्वारा की गई थी।</li>\n<li><strong>कुल संख्या</strong>: यहाँ <strong>कुल 9 गुफाएँ</strong> काटकर बनाई गई थीं।</li>\n<li><strong>सुरक्षित चित्र</strong>: अत्यधिक जर्जर होने के कारण वर्तमान में <strong>केवल गुफा संख्या 4 एवं 5 में ही चित्र सुरक्षित बचे हैं</strong>।</li>\n<li><strong>'रंगमहल' गुफा</strong>: गुफा संख्या 4 और 5 को उनके अद्भुत और रंगीन चित्रों के कारण संयुक्त रूप से <strong>'रंगमहल' गुफा</strong> कहा जाता है।</li>\n<li><strong>पांडव गुफा</strong>: यहाँ की <strong>गुफा संख्या 2 सबसे बड़ी गुफा है, जिसे 'पांडव गुफा'</strong> के नाम से जाना जाता है।</li>\n<li><strong>हाथीखाना</strong>: यहाँ की <strong>गुफा संख्या 3 को सामान्यतः 'हाथीखाना'</strong> कहा जाता है।</li>\n<li><strong>विषयगत अंतर (बाघ बनाम अजंता)</strong>:<ul>\n<li><strong>बाघ की गुफाओं के चित्रों का मुख्य विषय 'लौकिक जीवन'</strong> (आम जनजीवन, संगीत, नृत्य और सामाजिक उत्सवों) से संबंधित था।</li>\n<li>इसके विपरीत, <strong>अजंता की गुफाओं के चित्रों का मुख्य विषय 'धार्मिक'</strong> (बौद्ध धर्म, जातक कथाएँ और बुद्ध का आध्यात्मिक जीवन) था।</li>\n</ul>\n</li>\n</ul>\n<h2>6. एलोरा एवं एलीफेंटा की गुफाएँ</h2>\n<h3>क. एलोरा की गुफाएँ (Ellora Caves):</h3>\n<ul>\n<li><strong>स्थान</strong>: औरंगाबाद जिला (महाराष्ट्र)।</li>\n<li><strong>काल निर्धारण</strong>: इन गुफाओं का निर्माण <strong>सातवीं से नौवीं शताब्दी के बीच राष्ट्रकूट शासकों</strong> द्वारा करवाया गया था।</li>\n<li><strong>कुल संख्या</strong>: यहाँ पहाड़ों को काटकर <strong>कुल 34 शैलकृत (Rock-cut) गुफाएँ</strong> बनाई गई हैं।</li>\n<li><strong>धार्मिक वर्गीकरण (एकता का प्रतीक)</strong>:<ul>\n<li><strong>बौद्ध गुफाएँ</strong>: गुफा संख्या <strong>1 से 12 तक</strong> बौद्ध धर्म से संबंधित हैं।</li>\n<li><strong>हिंदू गुफाएँ</strong>: गुफा संख्या <strong>13 से 29 तक</strong> हिंदू धर्म से संबंधित हैं।</li>\n<li><strong>जैन गुफाएँ</strong>: गुफा संख्या <strong>30 से 34 तक</strong> जैन धर्म से संबंधित हैं।</li>\n</ul>\n</li>\n</ul>\n<h3>ख. एलीफेंटा की गुफाएँ (Elephanta Caves):</h3>\n<ul>\n<li><strong>धार्मिक संबंध</strong>: एलीफेंटा की प्रसिद्ध गुफाएँ मुख्य रूप से <strong>शैव</strong> (हिंदू धर्म के शिव सम्प्रदाय) तथा <strong>बौद्ध धर्म</strong> से संबंधित हैं।</li>\n</ul>\n"}, {"id": "0-23", "title": "गुप्तकालीन साहित्य, नाटककार एवं प्रमुख रचनाएँ", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन साहित्य, नाटककार एवं प्रमुख रचनाएँ</h1>\n<h2>1. धार्मिक ग्रंथों, स्मृतियों एवं संहिताओं का संकलन (Puranas, Epics &amp; Smritis)</h2>\n<ul>\n<li><strong>पुराणों का संकलन</strong>: वर्तमान समय में <strong>पुराणों</strong> का जो रूप प्राप्त होता है, उसका अंतिम संकलन और रचना मुख्य रूप से <strong>गुप्तकाल</strong> में ही संपन्न हुई थी।</li>\n<li><strong>महाकाव्यों का अंतिम संपादन</strong>: सुप्रसिद्ध महाकाव्य <strong>रामायण</strong> व <strong>महाभारत</strong> को अंतिम रूप (Final Recension) इसी <strong>गुप्तकाल</strong> में प्रदान किया गया।</li>\n<li><strong>स्मृतियों और सूत्रों पर भाष्य</strong>: इस काल में प्राचीन स्मृतियों व सूत्रों पर अनेक प्रसिद्ध <strong>भाष्य (Commentaries)</strong> लिखे गए।</li>\n<li><strong>प्रमुख स्मृतियों की रचना</strong>: इस काल में कई महत्वपूर्ण कानूनी एवं सामाजिक स्मृतियों की रचना हुई:<ul>\n<li><strong>नारद स्मृति</strong></li>\n<li><strong>कात्यायन स्मृति</strong></li>\n<li><strong>पाराशर स्मृति</strong></li>\n<li><strong>बृहस्पति स्मृति</strong></li>\n</ul>\n</li>\n<li><strong>विषयगत वर्गीकरण</strong>:<ul>\n<li><strong>नारद व बृहस्पति स्मृति</strong> मुख्य रूप से <strong>विधि विषयक (Legal affairs)</strong> ग्रंथ हैं।</li>\n<li><strong>कात्यायन स्मृति</strong> मुख्य रूप से <strong>आर्थिक विषयों (Economic matters)</strong> पर विस्तारपूर्वक लिखी गई है।</li>\n</ul>\n</li>\n</ul>\n<h2>2. महाकवि कालिदास और उनकी कालजयी रचनाएँ (Kalidasa: The Shakespeare of India)</h2>\n<ul>\n<li><strong>संस्कृत के महान विद्वान</strong>: गुप्तकाल में संस्कृत के सर्वश्रेष्ठ कवि और नाटककार <strong>कालिदास</strong> हुए, जिन्हें गौरवपूर्वक <strong>'भारत का शेक्सपियर'</strong> कहा जाता है।</li>\n<li><strong>रचनाओं की संख्या</strong>: कालिदास ने कुल <strong>चार (4) काव्य ग्रंथों</strong> तथा <strong>तीन (3) प्रसिद्ध नाटकों</strong> की रचना की।</li>\n<li><strong>वैदर्भी शैली</strong>: कालिदास की काव्य रचना की विशिष्ट शैली को <strong>'वैदर्भी शैली' (Vaidarbhi style)</strong> कहा जाता है।</li>\n<li><strong>कालिदास की रचनाओं का संपूर्ण वर्गीकरण</strong>:</li>\n</ul>\n<h3>क. खंडकाव्य (Khandakavyas):</h3>\n<ol>\n<li><strong>ऋतुसंहार</strong>:<ul>\n<li>यह कालिदास की <strong>सर्वप्रथम काव्य रचना</strong> है।</li>\n<li>यह कुल <strong>6 सर्गों</strong> का एक अत्यंत सुंदर खंडकाव्य है।</li>\n</ul>\n</li>\n<li><strong>मेघदूत</strong>:<ul>\n<li>यह खंडकाव्य <strong>'पूर्वमेघ'</strong> तथा <strong>'उत्तरमेघ'</strong> नामक दो भागों में विभक्त है।</li>\n<li>इसमें अपनी पत्नी से अलग हुए एक <strong>यक्ष की विरहगाथा</strong> का सजीव और मार्मिक विवरण प्रस्तुत किया गया है।</li>\n<li><strong>रचना स्थल</strong>: कालिदास ने इस कालजयी काव्य की रचना वाकाटक वंश के प्रतापी राजा <strong>प्रवरसेन द्वितीय के राजदरबार में</strong> की थी।</li>\n</ul>\n</li>\n</ol>\n<h3>ख. महाकाव्य (Mahakavyas):</h3>\n<ol>\n<li><strong>कुमारसंभव</strong>:<ul>\n<li>यह कुल <strong>17 सर्गों</strong> का एक विशाल महाकाव्य है।</li>\n<li>इसमें भगवान शिव और देवी पार्वती के पुत्र <strong>कुमार (कार्तिकेय) के जन्म की पौराणिक कथा</strong> का विस्तृत वर्णन किया गया है।</li>\n</ul>\n</li>\n<li><strong>रघुवंश</strong>:<ul>\n<li>यह कुल <strong>19 सर्गों</strong> का एक अत्यंत प्रतिष्ठित महाकाव्य है।</li>\n<li>इसमें राजा <strong>दिलीप</strong> से लेकर <strong>अग्निवर्ण</strong> तक कुल <strong>चालीस (40) इक्ष्वाकु (सूर्यवंशी) राजाओं के चरित्र और जीवन वृत्त</strong> का उत्कृष्ट काव्यात्मक चित्रण किया गया है।</li>\n</ul>\n</li>\n</ol>\n<h3>ग.
