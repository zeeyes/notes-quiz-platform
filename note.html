/em></li>\n</ul>\n</li>\n<li><strong>गंगा घाटी में युद्ध का साक्ष्य</strong>: अभिलेख में प्रयुक्त <strong>'श्रोत्रेषु गंगाध्वनि'</strong> शब्द से स्पष्ट आभास होता है कि हूणों और गुप्त सेना के बीच यह निर्णायक युद्ध <strong>गंगा घाटी</strong> के मैदानों में लड़ा गया था।</li>\n<li><strong>शाही माताओं के नामों का अंकन</strong>: इस ऐतिहासिक भीतरी लेख में सम्राट <strong>समुद्रगुप्त</strong>, <strong>चन्द्रगुप्त द्वितीय</strong> तथा <strong>कुमारगुप्त प्रथम</strong> की धर्मपत्नियों (अर्थात् शाही माताओं) के नामों का अत्यंत आदरपूर्वक उल्लेख किया गया है।</li>\n<li><strong>काव्यमयी प्रशस्ति</strong>: साहित्यिक दृष्टि से यह स्तम्भ लेख स्कन्दगुप्त की एक उत्कृष्ट एवं अलंकृत <strong>काव्यमयी प्रशस्ति</strong> है।</li>\n</ul>\n<hr />\n<h2>अन्य प्रमुख अभिलेख एवं साक्ष्य</h2>\n<ul>\n<li><strong>कहोम स्तम्भ लेख</strong>:<ul>\n<li>इस स्तम्भ लेख में स्कन्दगुप्त को इन्द्र के समान तेजस्वी बताते हुए <strong>'शक्रोपम'</strong> कहा गया है। (स्मरण रहे, जूनागढ़ अभिलेख में उन्हें <strong>'श्रीपरीक्षितवक्षा'</strong> कहा गया है)।</li>\n<li><strong>जैन तीर्थंकरों की स्थापना</strong>: इसमें स्पष्ट उल्लेख है कि <strong>भद्र</strong> नामक एक श्रद्धालु व्यक्ति ने इस स्थान पर <strong>5 जैन तीर्थंकरों</strong> की भव्य पाषाण प्रतिमाओं का निर्माण करवाकर उन्हें स्थापित करवाया था।</li>\n</ul>\n</li>\n<li><strong>इन्दौर ताम्रपत्र लेख</strong>: इसमें तत्कालीन समाज की प्रसिद्ध <strong>तैली श्रेणी</strong> (Guild of Oilmen) द्वारा सूर्य देव की उपासना किए जाने तथा स्थानीय सूर्य मंदिर के दीप-व्यय हेतु प्रचुर मात्रा में दान दिए जाने का सुंदर उल्लेख है।</li>\n<li><strong>गढ़वा अभिलेख</strong>: यह अभिलेख सम्राट स्कन्दगुप्त के शासनकाल का <strong>अन्तिम अभिलेख</strong> माना जाता है।</li>\n</ul>\n<hr />\n<h2>मुद्रा प्रणाली एवं सिक्कों का इतिहास</h2>\n<p>स्कन्दगुप्त के शासनकाल में गुप्तकालीन अर्थव्यवस्था और सिक्कों की शुद्धता में आए बदलावों के महत्वपूर्ण पुरातात्विक साक्ष्य मिलते हैं।</p>\n<ul>\n<li><strong>स्वर्ण सिक्कों के वजन में वृद्धि</strong>: स्कन्दगुप्त के समय सोने के सिक्कों का वजन बढ़ाकर <strong>144 से 146 ग्रेन</strong> तक कर दिया गया था।<ul>\n<li><strong>सबसे भारी सिक्के</strong>: 146 ग्रेन के ये सिक्के संपूर्ण गुप्त राजवंश के इतिहास में <strong>सबसे भारी स्वर्ण सिक्के</strong> थे।</li>\n<li><strong>पूर्ववर्ती राजाओं के सिक्कों का भार</strong>: स्कन्दगुप्त से पूर्व के गुप्त सम्राटों के समय सिक्कों का भार सामान्यतः <strong>118 से 124 ग्रेन</strong> के मध्य हुआ करता था।</li>\n</ul>\n</li>\n<li><strong>स्वर्ण धातुओं में मिलावट</strong>: भारी वजन के बावजूद स्कन्दगुप्त के काल की स्वर्ण मुद्राओं में मिलावट की मात्रा काफी अधिक बढ़ गई थी, जो गिरती अर्थव्यवस्था का सूचक है।<ul>\n<li><strong>सर्वाधिक मिलावट</strong>: गुप्त साम्राज्य के पतन काल में सर्वाधिक अशुद्धता/मिलावट अन्तिम गुप्त शासक <strong>विष्णुगुप्त</strong> के सिक्कों में पाई जाती है।</li>\n</ul>\n</li>\n<li><strong>चाँदी के सिक्के (Rupaka)</strong>: पश्चिमी भारत के जीते गए क्षेत्रों में चाँदी के सिक्कों का प्रचलन निरंतर जारी रखने वाले स्कन्दगुप्त <strong>गुप्त वंश के अन्तिम शासक</strong> थे।</li>\n<li><strong>नंदी प्रकार की मुद्राएँ</strong>: स्कन्दगुप्त ने विशेष रूप से <strong>'नंदी' (शिव के वाहन बैल)</strong> अंकित प्रकार की सुंदर मुद्राएँ चलायी थीं।</li>\n</ul>\n<hr />\n<h2>स्कन्दगुप्त के उत्तराधिकारी एवं साम्राज्य का पतन</h2>\n<p>स्कन्दगुप्त की मृत्यु (467 ई.) के साथ ही विशाल गुप्त साम्राज्य छिन्न-भिन्न होने लगा और उसका पतन प्रारम्भ हो गया।</p>\n<h3>उत्तराधिकारियों का प्रामाणिक कालक्रम:</h3>\n<ol>\n<li><strong>पुरुगुप्त</strong> (467-473 ई.)</li>\n<li><strong>कुमारगुप्त द्वितीय</strong> (473-476 ई.)</li>\n<li><strong>बुद्धगुप्त</strong> (476-495 ई.)</li>\n<li><strong>नरसिंहगुप्त 'बालादित्य'</strong> (495-510 ई.)</li>\n<li><strong>भानुगुप्त</strong> (510 ई. के आसपास)</li>\n</ol>\n<h3>प्रमुख उत्तराधिकारियों की महत्वपूर्ण ऐतिहासिक उपलब्धियाँ:</h3>\n<h4>क. पुरुगुप्त (467-473 ई.):</h4>\n<ul>\n<li><strong>प्रथम बौद्ध अनुयायी शासक</strong>: पुरुगुप्त गुप्त वंश के <strong>प्रथम शासक थे जिन्होंने बौद्ध धर्म को अपनाया</strong> था।</li>\n<li><strong>वृद्धावस्था में राज्याभिषेक</strong>: वे अपने जीवन के अंतिम पड़ाव पर सर्वाधिक आयु में (अर्थात् अपनी <strong>वृद्धावस्था</strong> में) सम्राट बने थे।</li>\n</ul>\n<h4>ख. बुद्धगुप्त (476-495 ई.):</h4>\n<ul>\n<li><strong>ताम्रपत्र साक्ष्य</strong>: बुद्धगुप्त के शासनकाल के <strong>दामोदरपुर से तीन महत्वपूर्ण ताम्रपत्र</strong> प्राप्त हुए हैं। इसके अतिरिक्त, प्रसिद्ध <strong>पहाड़पुर ताम्रपत्र</strong> भी बुद्धगुप्त के समय का ही है।</li>\n<li><strong>धार्मिक आस्था</strong>: वे व्यक्तिगत रूप से <strong>बौद्ध मतानुयायी</strong> थे।</li>\n<li><strong>उपाधि</strong>: बुद्धगुप्त को उनके अभिलेखों में <strong>'परमदैवत'</strong> की सम्मानजनक उपाधि से विभूषित किया गया है।</li>\n</ul>\n<h4>ग. नरसिंहगुप्त 'बालादित्य' (495-510 ई.):</h4>\n<ul>\n<li><strong>उपाधियाँ</strong>: उन्होंने वैष्णव धर्म की उपाधि <strong>'परमभागवत'</strong> धारण की थी, परन्तु वे स्वयं <strong>बौद्ध धर्म के अनुयायी</strong> बन चुके थे।</li>\n<li><strong>मिहिरकुल की पराजय</strong>: चीनी यात्री <strong>ह्वेनसांग</strong> के यात्रा विवरण के अनुसार, नरसिंहगुप्त बालादित्य ने क्रूर हूण नरेश <strong>मिहिरकुल</strong> को एक भीषण युद्ध में पराजित कर बंदी बना लिया था। किन्तु, बाद में उन्होंने अपनी <strong>माता के धार्मिक अनुरोध पर</strong> दयापूर्वक मिहिरकुल को कारागार से मुक्त कर दिया।</li>\n<li><strong>साम्राज्य का त्रि-विभाजन</strong>: बालादित्य के कमजोर शासनकाल में विशाल गुप्त साम्राज्य स्पष्ट रूप से <strong>तीन स्वतंत्र भागों</strong> में विभाजित हो गया:<ol>\n<li><strong>मगध क्षेत्र</strong> — यहाँ स्वयं <strong>नरसिंहगुप्त 'बालादित्य'</strong> का शासन बना रहा।</li>\n<li><strong>मालवा क्षेत्र</strong> — यहाँ <strong>भानुगुप्त</strong> ने अपनी स्वतंत्र सत्ता स्थापित की।</li>\n<li><strong>बंगाल क्षेत्र</strong> — यहाँ <strong>वैन्यगुप्त</strong> ने स्वतंत्र राजवंश की नींव रखी।</li>\n</ol>\n</li>\n</ul>\n<h4>घ. कुमारगुप्त तृतीय एवं विष्णुगुप्त (अंतिम शासक):</h4>\n<ul>\n<li><strong>कुमारगुप्त तृतीय</strong>: नरसिंहगुप्त बालादित्य की मृत्यु के उपरांत उनका पुत्र कुमारगुप्त तृतीय शासक बना, जो गुप्त वंश का <strong>अन्तिम महान शासक</strong> था।</li>\n<li><strong>विष्णुगुप्त (550 ई.)</strong>: यह संपूर्ण गुप्त राजवंश का <strong>सर्वथा अन्तिम शासक</strong> था, जिसने <strong>'चन्द्रादित्य'</strong> की उपाधि धारण की थी।</li>\n</ul>\n<hr />\n<h2>एरण अभिलेख (510 ई.) एवं सती प्रथा का प्रथम साक्ष्य</h2>\n<p>मध्य प्रदेश के सागर जिले में स्थित एरण से प्राप्त भानुगुप्त के काल का अभिलेख भारतीय इतिहास के सामाजिक विकास की दृष्टि से क्रांतिकारी महत्त्व रखता है।</p>\n<ul>\n<li><strong>सती प्रथा का प्रथम अभिलेखीय साक्ष्य</strong>: यह संपूर्ण भारतीय इतिहास में <strong>सती प्रथा का सर्वप्रथम प्रामाणिक लिखित/अभिलेखीय साक्ष्य</strong> है।</li>\n<li><strong>ऐतिहासिक प्रसंग</strong>: हूणों के विरुद्ध भीषण युद्ध में भानुगुप्त के परम वीर मित्र <strong>गोपराज</strong> वीरगति को प्राप्त हो गए थे, जिसके शोक में उनकी <strong>पत्नी</strong> मर्यादापूर्वक गोपराज के शव के साथ चिता पर बैठकर <strong>सती</strong> हो गई थीं।</li>\n<li><strong>स्वतंत्रता संग्राम की संज्ञा</strong>: सुप्रसिद्ध इतिहासकार <strong>हेमचंद्र रायचौधरी</strong> ने देश की अस्मिता की रक्षा के लिए हूणों के विरुद्ध लड़े गए इस युद्ध को भारत के प्रथम <strong>&quot;स्वतंत्रता संग्राम&quot;</strong> की संज्ञा दी है।</li>\n</ul>\n"}, {"id": "0-8", "title": "गुप्त साम्राज्य: केंद्रीय प्रशासन एवं सामंती संरचना", "file": "history-gupta.md", "html": "<h1>गुप्त साम्राज्य: केंद्रीय प्रशासन एवं सामंती संरचना</h1>\n<hr />\n<h2>राजपद की अवधारणा एवं दैवीय सिद्धांत का ह्रास</h2>\n<p>गुप्त काल में राजपद और राजा की स्थिति से संबंधित राजनीतिक विचारों में महत्वपूर्ण परिवर्तन दिखाई देते हैं:</p>\n<ul>\n<li><strong>दैवीय उत्पत्ति के सिद्धांत का ह्रास</strong>: इस काल में राजा के <strong>दैवीय उत्पत्ति का सिद्धांत</strong> (Theory of Divine Origin of Kingship) लोकप्रिय नहीं रहा।<ul>\n<li><strong>मनुस्मृति का संदर्भ</strong>: यह दैवीय उत्पत्ति का सिद्धांत मूल रूप से <strong>मनुस्मृति</strong> में प्रतिपादित किया गया है।</li>\n<li><strong>बाणभट्ट का दृष्टिकोण</strong>: सुप्रसिद्ध गुप्तोत्तर लेखक <strong>बाणभट्ट</strong> ने राजा की दैवीय उत्पत्ति के इस सिद्धांत का पूर्णतः <strong>तिरस्कार (खंडन)</strong> किया है।</li>\n</ul>\n</li>\n<li><strong>राजपद का वंशानुगत स्वरूप</strong>: राजपद पूर्णतः <strong>वंशानुगत</strong> (Hereditary) था, अर्थात् राजा का पद उसी के वंश में रहता था।<ul>\n<li><strong>ज्येष्ठाधिकार की अनुपस्थिति</strong>: वंशानुगत होने के बावजूद, यह आवश्यक नहीं था कि राजगद्दी हमेशा <strong>बड़े पुत्र</strong> (eldest son) को ही प्राप्त हो।</li>\n</ul>\n</li>\n<li><strong>वर्णाश्रमधर्म का रक्षक</strong>: धर्मग्रंथों के अनुसार, राजा को समाज में नैतिक व सामाजिक व्यवस्था बनाए रखने के लिए <strong>वर्णाश्रमधर्म का रक्षक</strong> घोषित किया गया है।</li>\n<li><strong>विष्णु के अवतार के रूप में</strong>: गुप्त काल में राजा को सामान्य मनुष्य न मानकर रक्षक के रूप में <strong>भगवान विष्णु के अवतार</strong> के रूप में देखा जाता था।</li>\n<li><strong>यशोधर्मन का अभिलेखीय साक्ष्य</strong>: <strong>532 ईस्वी</strong> के <strong>यशोधर्मन के अभिलेख</strong> में शासक को <strong>चारों वर्णों</strong> (ब्राह्मण, क्षत्रिय, वैश्य और शूद्र) के हितों का सर्वप्रमुख रक्षक बताया गया है।</li>\n</ul>\n<h2>प्रशासनिक विकेंद्रीकरण एवं सामंतवाद का उदय</h2>\n<p>मौर्य प्रशासन की अत्यधिक केंद्रीकृत व्यवस्था के विपरीत गुप्त काल में विकेंद्रीकरण की मजबूत प्रवृत्ति का उदय हुआ।</p>\n<h3>क. केंद्रीकरण बनाम विकेंद्रीकरण:</h3>\n<ul>\n<li><strong>मौर्य प्रशासन के विपरीत</strong>: मौर्य काल की सबसे बड़ी विशेषता उसका सुदृढ़ केंद्रीय नियंत्रण था, जबकि इसके ठीक विपरीत गुप्त प्रशासन में <strong>विकेंद्रीकरण (Decentralization)</strong> की प्रवृत्ति तेजी से बढ़ने लगी।</li>\n</ul>\n<h3>ख. वेतन प्रणाली में परिवर्तन (नकद से भूमिदान):</h3>\n<ul>\n<li><strong>प्रारंभिक व्यवस्था</strong>: गुप्तकाल के <strong>प्रारंभिक दौर</strong> में राजकीय अधिकारियों को उनके वेतन के रूप में <strong>नकद वेतन</strong> दिया जाता था।</li>\n<li><strong>परिवर्तित व्यवस्था</strong>: कालांतर में नकद वेतन के स्थान पर <strong>भूमिदान की प्रथा</strong> प्रचलन में आ गई, जिसने प्रशासन का स्वरूप बदल दिया।</li>\n</ul>\n<h3>ग. भूमि अनुदान का तुलनात्मक एवं ऐतिहासिक विकास:</h3>\n<ul>\n<li><strong>सातवाहन काल की नीति</strong>: सातवाहन शासकों के काल में भूमि अनुदान (Land Grants) विशेष रूप से केवल <strong>ब्राह्मणों व पुरोहितों</strong> को ही धार्मिक कार्यों हेतु दिया जाता था।</li>\n<li><strong>गुप्त काल की नीति (प्रशासनिक भूमिदान)</strong>: गुप्त काल के अंत तक आते-आते धार्मिक दान के अतिरिक्त <strong>प्रशासनिक अधिकारियों</strong> को भी उनकी सेवाओं के बदले में भूमि अनुदान दिया जाने लगा।</li>\n<li><strong>छठी शताब्दी का कालक्रम</strong>: छठी शताब्दी के आते-आते प्रशासन में विकेंद्रीकरण इतना बढ़ गया कि <strong>कुमारामात्य</strong> जैसे उच्च अधिकारी भी अब <strong>सम्राट की पूर्व अनुमति के बिना ही स्वेच्छा से भूमिदान</strong> करने लगे थे।</li>\n</ul>\n<h3>घ. दानग्रहीताओं के अधिकारों में विस्तार और सामंतवाद:</h3>\n<ul>\n<li><strong>अधिकारों का हस्तांतरण</strong>: दान में दी गई भूमि पर केवल राजस्व वसूलने का ही अधिकार नहीं होता था, बल्कि भूमि पर <strong>राजस्व के साथ-साथ प्रशासनिक व न्यायिक अधिकार</strong> भी दानग्रहीता (भूमि प्राप्तकर्ता) को सौंप दिए जाते थे।</li>\n<li><strong>सामंतवाद (Feudalism) को बढ़ावा</strong>: इन प्रशासनिक व न्यायिक अधिकारों के हस्तांतरण ने देश में <strong>सामंतवाद</strong> व विकेंद्रीकरण की प्रवृत्ति को अत्यधिक बढ़ावा दिया।</li>\n<li><strong>सामंतों का वास्तविक स्वामित्व</strong>: इस व्यवस्था के कारण <strong>सामंत</strong> (Feudatories) अपनी-अपनी भूमि के <strong>वास्तविक स्वामी</strong> बन बैठे, जिससे केंद्रीय सत्ता कमजोर हुई।</li>\n</ul>\n<h2>सामंती राजनीतिक व्यवस्था (Feudal Political System)</h2>\n<p>गुप्त साम्राज्य की राजनीतिक व्यवस्था मूल रूप से सामंती स्वरूप ग्रहण कर चुकी थी, जिसके निम्नलिखित लक्षण थे:</p>\n<ul>\n<li><strong>अधिग्रहण की नीति का परित्याग</strong>: गुप्त सम्राट पराजित राजाओं के राज्यों और उनके साम्राज्यों का पूर्ण अधिग्रहण (प्रत्यक्ष विलय) करने के स्थान पर उनसे केवल <strong>अधीनता स्वीकार</strong> करवा कर ही संतुष्ट रहते थे।</li>\n<li><strong>वार्षिक कर एवं उपहार</strong>: पराजित राजाओं से सम्राट केवल <strong>वार्षिक कर (राजस्व)</strong> तथा बहुमूल्य <strong>उपहार</strong> लेकर ही संतुष्ट हो जाते थे।</li>\n<li><strong>आन्तरिक शासन में गैर-हस्तक्षेप</strong>: गुप्त सम्राटों ने अधीन राजाओं के राज्यों के <strong>आन्तरिक शासन में कभी हस्तक्षेप नहीं किया</strong>।</li>\n<li><strong>सामंती स्वरूप</strong>: इस नीति के कारण गुप्त राजनीतिक व्यवस्था पूरी तरह से <strong>सामंती</strong> हो गई, जिसने अंततः विकेंद्रीकरण की प्रवृत्ति को और अधिक बल दिया।</li>\n<li><strong>सम्राट और सामंतों का संपर्क</strong>: सामंतों का सम्राट से केवल मात्र इतना ही संपर्क था कि वे समय-समय पर सम्राट के सम्मुख उपस्थित होकर <strong>उपहार-भेंट</strong> आदि प्रस्तुत करते थे और सम्राट के प्रति अपनी <strong>निष्ठा व्यक्त</strong> करते रहते थे।</li>\n</ul>\n<hr />\n<h2>गुप्त नौकरशाही एवं प्रशासनिक तत्व (Bureaucracy)</h2>\n<ul>\n<li><strong>विभिन्न प्रशासनों के अंश</strong>: गुप्त प्रशासनिक व्यवस्था कोई सर्वथा नवीन व्यवस्था नहीं थी, बल्कि इसमें पूर्ववर्ती <strong>मौर्य, सातवाहन, शक तथा कुषाण प्रशासन के अंश (तत्व)</strong> समाहित थे।</li>\n<li><strong>नौकरशाही का आकार</strong>: गुप्त नौकरशाही मौर्य नौकरशाही की तुलना में <strong>उतनी व्यापक (विस्तृत) नहीं थी</strong>।<ul>\n<li><strong>कारण</strong>: गुप्त शासकों ने मौर्यों की भांति देश की <strong>आर्थिक गतिविधियों पर राज्य का अत्यधिक कठोर नियंत्रण स्थापित नहीं किया</strong> था।</li>\n</ul>\n</li>\n</ul>\n<h2>प्रशासनिक पदों की विशिष्ट व्यवस्था</h2>\n<p>गुप्त काल में प्रशासनिक पदों के संचालन में दो अत्यंत विशिष्ट लक्षण दिखाई देते हैं:</p>\n<h3>क. बहु-पद धारण की प्रथा (Plurality of Offices):</h3>\n<p>गुप्त काल में कभी-कभी सम्राट एक ही योग्य व्यक्ति की निष्ठा और योग्यता पर विश्वास करके उसे एक साथ <strong>कई महत्वपूर्ण पदों पर नियुक्त</strong> कर देता था।</p>\n<ul>\n<li><strong>सर्वश्रेष्ठ उदाहरण (हरिषेण)</strong>: समुद्रगुप्त का दरबारी कवि व सचिव <strong>हरिषेण</strong> एक ही समय में निम्नलिखित <strong>तीन प्रमुख पदों</strong> पर एक साथ आसीन था:<ol>\n<li><strong>कुमारामात्य (Kumaramatya)</strong>: उच्च कोटि का प्रशासनिक अधिकारी।</li>\n<li><strong>सन्धिविग्रहिक (Sandhivigrahika)</strong>: युद्ध और शांति का मंत्री (विदेश मंत्री)।</li>\n<li><strong>महादंडनायक (Mahadandanayaka)</strong>: मुख्य सैन्य अधिकारी या न्यायाधीश।</li>\n</ol>\n</li>\n</ul>\n<h3>ख. पदों का वंशानुगत होना (Hereditary Offices):</h3>\n<p>गुप्तकाल में उच्च प्रशासनिक और राजनैतिक पद बाद के काल में <strong>वंशानुगत</strong> (पीढ़ी-दर-पीढ़ी स्थानांतरित होने वाले) होने लगे थे।</p>\n<h4>प्रमुख ऐतिहासिक उदाहरण:</h4>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">प्रशासनिक अधिकारी का नाम</th>\n  <th style=\"text-align:left\">पुत्र / उत्तराधिकारी का नाम</th>\n  <th style=\"text-align:left\">संबद्ध सम्राट का शासनकाल</th>\n  <th style=\"text-align:left\">प्रशासनिक पद की स्थिति / क्षेत्र</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>हरिषेण</strong></td>\n  <td style=\"text-align:left\"><strong>वीरसेन</strong></td>\n  <td style=\"text-align:left\"><strong>समुद्रगुप्त</strong> एवं <strong>चन्द्रगुप्त विक्रमादित्य</strong></td>\n  <td style=\"text-align:left\">ये दोनों पिता-पुत्र अपने-अपने सम्राटों के काल में <strong>'अमात्य'</strong> (उच्च प्रशासनिक मंत्री) के पद पर कार्यरत थे।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>पर्णदत्त</strong></td>\n  <td style=\"text-align:left\"><strong>चक्रपालित</strong></td>\n  <td style=\"text-align:left\"><strong>स्कन्दगुप्त</strong></td>\n  <td style=\"text-align:left\">यह पिता-पुत्र की जोड़ी स्कन्दगुप्त के शासनकाल में <strong>सौराष्ट्र</strong> (गुजरात) क्षेत्र में प्रमुख प्रशासनिक अधिकारी के रूप में कार्यरत थी।</td>\n</tr>\n</tbody>\n</table>\n<hr />\n"}, {"id": "0-9", "title": "गुप्त साम्राज्य का केंद्रीय प्रशासन", "file": "history-gupta.md", "html": "<h1>गुप्त साम्राज्य का केंद्रीय प्रशासन</h1>\n<hr />\n<h2>केंद्रीय प्रशासन की अवधारणा एवं सम्राट का महत्व</h2>\n<ul>\n<li><strong>सम्राट की स्थिति</strong>: गुप्त साम्राज्य में <strong>केंद्रीय प्रशासन का प्रमुख स्वयं सम्राट</strong> होता था।</li>\n<li><strong>भव्य उपाधियाँ</strong>: गुप्त शासकों ने अपनी संप्रभुता और शक्ति को प्रदर्शित करने के लिए कई बड़ी-बड़ी उपाधियाँ धारण की थीं:<ul>\n<li><strong>महाराजाधिराज</strong></li>\n<li><strong>परमभट्टारक</strong></li>\n<li><strong>परमेश्वर</strong></li>\n<li><strong>एकराट</strong></li>\n</ul>\n</li>\n<li><strong>अश्वमेध यज्ञ</strong>: गुप्त सम्राटों ने <strong>अश्वमेध यज्ञ</strong> का संपादन करके अन्य छोटे शासकों पर अपनी सैन्य एवं राजनैतिक श्रेष्ठता सिद्ध की थी।</li>\n<li><strong>राजसभा</strong>: समुद्रगुप्त की <strong>प्रयाग प्रशस्ति</strong> में सम्राट की <strong>'राजसभा'</strong> का स्पष्ट उल्लेख प्राप्त होता है।</li>\n<li><strong>'अप्रतिरथ' (अद्वितीय योद्धा) की उपाधि</strong>:<ul>\n<li>गुप्तकालीन राजकीय अभिलेखों में <strong>'अप्रतिरथ'</strong> की गरिमामयी उपाधि का उपयोग केवल दो ही सम्राटों के लिए किया गया है:<ol>\n<li><strong>समुद्रगुप्त</strong></li>\n<li><strong>चंद्रगुप्त विक्रमादित्य</strong></li>\n</ol>\n</li>\n<li><strong>अप्रतिरथ का अर्थ</strong>: इस उपाधि का शाब्दिक अर्थ <strong>&quot;अद्वितीय योद्धा&quot;</strong> (जिसके मुकाबले कोई अन्य रथ या योद्धा न हो) होता है।</li>\n</ul>\n</li>\n</ul>\n<h2>मंत्रियों, अमात्यों एवं मंत्रिपरिषद् की संरचना</h2>\n<ul>\n<li><strong>शासकीय सहायता</strong>: शासकीय एवं राजकीय कार्यों के संपादन में सम्राट की सहायता के लिए <strong>मंत्री</strong> तथा <strong>अमात्य</strong> नियुक्त किए जाते थे।</li>\n<li><strong>नीतिसार में अंतर</strong>: महान विद्वान <strong>कामन्दक</strong> द्वारा रचित प्रसिद्ध ग्रंथ <strong>'नीतिसार'</strong> में मंत्रियों और अमात्यों के बीच के प्रशासनिक अंतर को बिल्कुल स्पष्ट रूप से प्रतिपादित किया गया है:<ul>\n<li><strong>मंत्री का दायित्व</strong>: मंत्री का मुख्य कार्य राजा को किसी अत्यंत <strong>गूढ़ विषय पर मंत्रणा (परामर्श) देना</strong> था।</li>\n<li><strong>अमात्य का दायित्व</strong>: अमात्य आधुनिक काल की <strong>ब्यूरोक्रेसी (नौकरशाही)</strong> के समान थे, जो राज्य के बड़े शासकीय अधिकारी होते थे और प्रशासनिक क्रियान्वयन संभालते थे।</li>\n</ul>\n</li>\n<li><strong>मंत्रिपरिषद् का अस्तित्व</strong>: गुप्त काल में <strong>मंत्रिपरिषद्</strong> नामक एक महत्वपूर्ण प्रशासनिक संस्था अस्तित्व में थी।<ul>\n<li><strong>साहित्यिक पुष्टि</strong>: तत्कालीन दो महान लेखकों—<strong>कामन्दक</strong> तथा <strong>कालिदास</strong>—दोनों ने अपने-अपने ग्रंथों में मंत्रिपरिषद् का स्पष्ट रूप से उल्लेख किया है।</li>\n</ul>\n</li>\n<li><strong>अमात्यों की योग्यता एवं नियुक्ति</strong>:<ul>\n<li><strong>कात्यायन स्मृति</strong> के अनुसार, प्रशासनिक सुव्यवस्था बनाए रखने के लिए अमात्यों की नियुक्ति अनिवार्य रूप से केवल <strong>ब्राह्मण वर्ग</strong> से की जानी चाहिए थी।</li>\n<li>अमात्यों की यह नियुक्ति सीधे <strong>सम्राट स्वयं अपने हाथों से</strong> करता था।</li>\n</ul>\n</li>\n</ul>\n<h2>कुमारामात्य (सर्वोच्च अधिकारी वर्ग)</h2>\n<ul>\n<li><strong>सर्वोच्च प्रशासनिक पद</strong>: गुप्त साम्राज्य के प्रशासनिक ढांचे में <strong>'कुमारामात्य'</strong> सबसे बड़ा और प्रतिष्ठित अधिकारी होता था।</li>\n<li><strong>नियुक्ति का क्षेत्र</strong>: कुमारामात्यों की नियुक्ति स्वयं सम्राट द्वारा सीधे <strong>केंद्रीय प्रांतों</strong> (Central Provinces) में की जाती थी।</li>\n<li><strong>वेतन प्रणाली</strong>: इन उच्च स्तरीय प्रशासनिक अधिकारियों को राज्य कोष से <strong>नकद वेतन</strong> (Cash Salary) प्रदान किया जाता था।</li>\n<li><strong>राज चिह्न</strong>: गुप्त राजवंश और उनके प्रशासन का राष्ट्रीय/राजकीय चिह्न <strong>'गरुड़'</strong> था।</li>\n</ul>\n<h2>गुप्तकालीन केंद्रीय प्रशासनिक अधिकारी एवं उनके विभाग</h2>\n<p>गुप्तकालीन प्रशासनिक व्यवस्था अत्यंत विकसित थी। विभिन्न क्षेत्रों के क्रियान्वयन के लिए विशेष पदाधिकारी नियुक्त थे, जिनका वर्गीकृत विवरण निम्नलिखित तालिका में दिया गया है:</p>\n<h3>गुप्तकालीन प्रशासनिक अधिकारियों की तालिका:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">प्रशासनिक पदाधिकारी (पद)</th>\n  <th style=\"text-align:left\">वर्तमान नाम / अधिकार क्षेत्र (विभाग)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>कुमारामात्य</strong></td>\n  <td style=\"text-align:left\"><strong>सर्वोच्च प्रशासनिक अधिकारी</strong> (शासकीय कार्यों का मुख्य नियंत्रक)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>अमात्य</strong></td>\n  <td style=\"text-align:left\"><strong>नौकरशाह</strong> (ब्यूरोक्रेसी के सदस्य, प्रशासनिक क्रियान्वयनकर्ता)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>प्रतिहार</strong></td>\n  <td style=\"text-align:left\"><strong>अन्तःपुर का रक्षक</strong> (राजनिवास के आंतरिक भागों का सुरक्षा प्रमुख)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>महाप्रतिहार</strong></td>\n  <td style=\"text-align:left\"><strong>राजमहल का प्रधान सुरक्षा अधिकारी</strong> (संपूर्ण राजप्रसाद का सुरक्षा अधीक्षक)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>महाबलाधिकृत / महासेनापति</strong></td>\n  <td style=\"text-align:left\"><strong>सेना का सर्वोच्च अधिकारी</strong> (प्रधान सेनापति)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>महादंडनायक</strong></td>\n  <td style=\"text-align:left\"><strong>मुख्य न्यायाधीश</strong> (न्यायिक व्यवस्था का प्रधान)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>7</strong></td>\n  <td style=\"text-align:left\"><strong>महासन्धिविग्रहिक</strong></td>\n  <td style=\"text-align:left\"><strong>युद्ध व शांति का अधिकारी</strong>, <strong>विदेशमंत्री</strong> (राजनयिक संबंधों का प्रमुख)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>8</strong></td>\n  <td style=\"text-align:left\"><strong>पुस्तकपाल</strong></td>\n  <td style=\"text-align:left\"><strong>भूमि का लेखा-जोखा रखने वाला अधिकारी</strong> (भूमि अभिलेखों का मुख्य पंजीयक)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>9</strong></td>\n  <td style=\"text-align:left\"><strong>दण्डपाशिक</strong></td>\n  <td style=\"text-align:left\"><strong>पुलिस अधिकारी</strong> (शांति व्यवस्था और आंतरिक सुरक्षा का रक्षक)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>10</strong></td>\n  <td style=\"text-align:left\"><strong>विनयस्थितिस्थापक</strong></td>\n  <td style=\"text-align:left\"><strong>नैतिक एवं धार्मिक मामलों का अधिकारी</strong> (सार्वजनिक नैतिकता का निरीक्षक)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>11</strong></td>\n  <td style=\"text-align:left\"><strong>महाअक्षपटलिक</strong></td>\n  <td style=\"text-align:left\"><strong>आय-व्यय का लेखा-जोखा रखने वाला अधिकारी</strong> (मुख्य लेखाकार / ऑडिट प्रमुख)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>12</strong></td>\n  <td style=\"text-align:left\"><strong>शौल्किक</strong></td>\n  <td style=\"text-align:left\"><strong>सीमा शुल्क विभाग का प्रधान</strong> (चुंगी एवं आयात-निर्यात कर संग्रहकर्ता)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>13</strong></td>\n  <td style=\"text-align:left\"><strong>गोल्मिक</strong></td>\n  <td style=\"text-align:left\"><strong>वन अधिकारी</strong> (राजकीय वनों एवं प्राकृतिक संपदा का अधीक्षक)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>14</strong></td>\n  <td style=\"text-align:left\"><strong>ध्रुवाधिकरणिक</strong></td>\n  <td style=\"text-align:left\"><strong>राजस्व एकत्र करने वाला अधिकारी</strong> (भू-राजस्व संग्रह का प्रधान)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>15</strong></td>\n  <td style=\"text-align:left\"><strong>पुरपाल</strong></td>\n  <td style=\"text-align:left\"><strong>नगर का मुख्य अधिकारी</strong> (नगर प्रशासक / गवर्नर)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>16</strong></td>\n  <td style=\"text-align:left\"><strong>महाभाण्डागाराधिकृत</strong></td>\n  <td style=\"text-align:left\"><strong>राजकीय कोष का प्रधान</strong> (शाही खजाने का मुख्य रक्षक)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>17</strong></td>\n  <td style=\"text-align:left\"><strong>अग्रहारिक</strong></td>\n  <td style=\"text-align:left\"><strong>दान विभाग का प्रधान</strong> (धार्मिक एवं अग्रहार दानों का संचालक)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>18</strong></td>\n  <td style=\"text-align:left\"><strong>रणभाण्डागारिक</strong></td>\n  <td style=\"text-align:left\"><strong>सेना के सामान की व्यवस्था रखने वाला पदाधिकारी</strong> (सैन्य रसद प्रमुख)</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>19</strong></td>\n  <td style=\"text-align:left\"><strong>करणिक</strong></td>\n  <td style=\"text-align:left\"><strong>लिपिक</strong> (राजकीय दस्तावेजों को तैयार करने वाला क्लर्क)</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>गुप्तकालीन प्रसिद्ध मंत्रियों एवं सेनापतियों की ऐतिहासिक तालिका</h2>\n<p>स्रोत के अनुसार, विभिन्न महान गुप्त सम्राटों के समय उनके केंद्रीय प्रशासन को सुशोभित करने वाले प्रसिद्ध मंत्रियों, सचिवों और सैन्य अधिकारियों की सूची निम्नलिखित है:</p>\n<h3>प्रसिद्ध प्रशासनिक व्यक्तित्व:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">अधिकारी का नाम</th>\n  <th style=\"text-align:left\">धारित प्रशासनिक पद</th>\n  <th style=\"text-align:left\">किस सम्राट का समकालीन था?</th>\n  <th style=\"text-align:left\">विशेष ऐतिहासिक टिप्पणी</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>हरिषेण</strong></td>\n  <td style=\"text-align:left\"><strong>सन्धिविग्रहिक, महादंडनायक व कुमारामात्य</strong></td>\n  <td style=\"text-align:left\"><strong>समुद्रगुप्त</strong></td>\n  <td style=\"text-align:left\">समुद्रगुप्त का दरबारी कवि जिसने प्रयाग प्रशस्ति की रचना की; एक साथ तीन प्रमुख पदों पर कार्यरत था।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>वीरसेन</strong></td>\n  <td style=\"text-align:left\"><strong>सन्धिविग्रहिक</strong></td>\n  <td style=\"text-align:left\"><strong>चंद्रगुप्त द्वितीय</strong></td>\n  <td style=\"text-align:left\">चंद्रगुप्त द्वितीय का प्रसिद्ध युद्ध व संधि सचिव जो शैव धर्म का अनुयायी था।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>शिखरस्वामी</strong></td>\n  <td style=\"text-align:left\"><strong>मंत्री</strong></td>\n  <td style=\"text-align:left\"><strong>चंद्रगुप्त द्वितीय</strong></td>\n  <td style=\"text-align:left\">चंद्रगुप्त द्वितीय का सुप्रसिद्ध मंत्री (अमात्य)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>पृथ्वीषेण</strong></td>\n  <td style=\"text-align:left\"><strong>मंत्री</strong></td>\n  <td style=\"text-align:left\"><strong>कुमारगुप्त प्रथम</strong></td>\n  <td style=\"text-align:left\">यह चंद्रगुप्त द्वितीय के प्रसिद्ध मंत्री <strong>शिखर स्वामी का पुत्र</strong> था।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>आम्रकार्दव</strong></td>\n  <td style=\"text-align:left\"><strong>सेनापति</strong></td>\n  <td style=\"text-align:left\"><strong>चंद्रगुप्त द्वितीय</strong></td>\n  <td style=\"text-align:left\">चंद्रगुप्त द्वितीय का महान बौद्ध सेनापति जिसने साँची बौद्ध विहार को दान दिया था।</td>\n</tr>\n</tbody>\n</table>\n"}, {"id": "0-10", "title": "गुप्त प्रांतीय, जिला एवं स्थानीय प्रशासन", "file": "history-gupta.md", "html": "<h1>गुप्त प्रांतीय, जिला एवं स्थानीय प्रशासन</h1>\n<h2>प्रांतीय प्रशासन (Provincial Administration)</h2>\n<p>गुप्त साम्राज्य का प्रांतीय प्रशासनिक ढांचा केंद्रीय नियंत्रण और स्थानीय स्वायत्तता के बीच एक सुंदर संतुलन प्रस्तुत करता था।</p>\n<ul>\n<li><strong>प्रांतों के नाम</strong>: गुप्त साम्राज्य में प्रांतों को मुख्य रूप से <strong>'भुक्ति'</strong>, <strong>'अवनी'</strong> अथवा <strong>'देश'</strong> कहा जाता था।</li>\n<li><strong>अभिलेखीय साक्ष्य</strong>: संपूर्ण भारतीय इतिहास में <strong>'भुक्ति'</strong> शब्द का सर्वप्रथम प्रयोग सम्राट समुद्रगुप्त की प्रसिद्ध <strong>प्रयाग-प्रशस्ति</strong> में मिलता है।</li>\n<li><strong>प्रांतीय गवर्नर (प्रमुख)</strong>: गुप्तकाल में सीमावर्ती एवं आंतरिक प्रांतों के प्रशासनिक प्रमुखों में अंतर था:<ul>\n<li><strong>गोप्ता</strong>: <strong>सीमांत प्रांतों</strong> (Border Provinces) के सर्वोच्च प्रशासनिक प्रमुख को <strong>'गोप्ता'</strong> कहा जाता था।</li>\n<li><strong>उपरिक (भोगिक या भोगपति)</strong>: <strong>आंतरिक प्रांतों</strong> के सर्वोच्च प्रशासनिक प्रमुख को <strong>'उपरिक'</strong>, <strong>'भोगिक'</strong> अथवा <strong>'भोगपति'</strong> कहा जाता था।</li>\n</ul>\n</li>\n<li><strong>ऐतिहासिक उदाहरण (पुण्ड्रवर्धन)</strong>: सम्राट <strong>कुमारगुप्त प्रथम</strong> के शासनकाल में <strong>'पुण्ड्रवर्धन' (वर्तमान बंगाल)</strong> नामक महत्वपूर्ण प्रांत का उपरिक (प्रमुख) <strong>चिरादत्त</strong> था।</li>\n</ul>\n<h2>जिला प्रशासन (District Administration)</h2>\n<p>प्रांतों (भुक्ति) को पुनः छोटी प्रशासनिक इकाइयों में विभाजित किया गया था, जो आधुनिक जिला प्रणाली से काफी मिलती-जुलती थीं।</p>\n<ul>\n<li><strong>प्रशासनिक इकाई (विषय)</strong>: भुक्ति के ठीक नीचे <strong>'विषय' (जिला)</strong> नामक प्रशासनिक इकाई होती थी।</li>\n<li><strong>प्रशासनिक प्रमुख (विषयपति)</strong>: विषय के सर्वोच्च प्रशासनिक अधिकारी को <strong>'विषयपति'</strong> कहा जाता था।</li>\n<li><strong>नियुक्ति का अधिकार</strong>: विषयपति की नियुक्ति संबंधित प्रांत के सर्वोच्च अधिकारी <strong>'उपरिक' (गवर्नर)</strong> द्वारा की जाती थी।</li>\n<li><strong>दामोदरपुर ताम्रपत्र का साक्ष्य</strong>: कुमारगुप्त के प्रसिद्ध <strong>दामोदरपुर ताम्रपत्र</strong> से यह प्रमाणित होता है कि विषयपति को सुचारू प्रशासनिक सलाह देने के लिए एक <strong>'विषय परिषद'</strong> (जिला परिषद) होती थी।</li>\n<li><strong>विषय महत्तर</strong>: विषय परिषद अथवा विषय समिति के सम्मानित सदस्यों को <strong>'विषय महत्तर'</strong> कहा जाता था।</li>\n</ul>\n<h3>विषय परिषद (नगर सभा) की संरचना:</h3>\n<p>विषय परिषद का स्वरूप 'नगर सभा' के समान था, जिसमें समाज के विभिन्न व्यावसायिक एवं बौद्धिक वर्गों का प्रतिनिधित्व होता था:</p>\n<ol>\n<li><strong>नगरश्रेष्ठि</strong>: यह व्यापारी वर्ग एवं व्यापारिक श्रेणियों (Guilds) का प्रधान होता था।</li>\n<li><strong>सार्थवाह</strong>: यह व्यवसायियों (कारवां/सार्थ) का प्रधान होता था।</li>\n<li><strong>प्रथम कुलिक</strong>: यह मुख्य शिल्पी (शिल्पियों का प्रधान) होता था।</li>\n<li><strong>प्रथम कायस्थ</strong>: यह लिपिकों (लेखकों/क्लर्कों) का प्रमुख होता था।</li>\n</ol>\n<ul>\n<li><strong>अभिलेख संरक्षक (पुस्तकपाल)</strong>: विषयपति के मुख्य कार्यालय (<strong>अधिष्ठान</strong>) के महत्वपूर्ण राजकीय अभिलेखों और दस्तावेजों को सुरक्षित रखने वाले विशिष्ट अधिकारी को <strong>'पुस्तकपाल'</strong> कहा जाता था।</li>\n</ul>\n<h2>स्थानीय एवं ग्राम प्रशासन (Local &amp; Village Administration)</h2>\n<p>गुप्त साम्राज्य की सबसे बड़ी विशेषता उसकी विकेंद्रीकृत और सुदृढ़ ग्राम प्रशासन प्रणाली थी।</p>\n<ul>\n<li><strong>प्रशासनिक विभाजन का क्रम</strong>: विषय (जिला) के नीचे <strong>'वीथि' (तहसील)</strong> तथा वीथि के नीचे <strong>'पैठ' / 'पेठ'</strong> (ग्रामों के समूह की सबसे छोटी इकाई) नामक इकाइयाँ क्रियाशील थीं।</li>\n<li><strong>खोह अभिलेख का साक्ष्य</strong>: ग्राम समूह की छोटी इकाई <strong>'पेठ'</strong> का प्रामाणिक उल्लेख महाराज संक्षोभ के <strong>खोह अभिलेख</strong> में प्राप्त होता है।</li>\n<li><strong>ग्राम (सबसे छोटी इकाई)</strong>: गुप्तकालीन प्रशासन की सबसे छोटी और मूलभूत इकाई <strong>'ग्राम'</strong> (गाँव) होती थी।</li>\n<li><strong>पंचमण्डली</strong>: मध्य भारत के क्षेत्रों में स्थानीय ग्राम सभा को <strong>'पंचमण्डली'</strong> कहकर संबोधित किया जाता था।</li>\n<li><strong>ग्राम सभा के मुख्य उत्तरदायित्व</strong>:<ul>\n<li>गाँव की बाह्य शत्रुओं व चोरों से <strong>सुरक्षा</strong> करना।</li>\n<li>गाँव में <strong>निर्माण कार्य</strong> (जैसे कुएं, तालाब, जलाशय आदि) का संपादन कराना।</li>\n<li>कृषकों से <strong>राजस्व (लगान) की वसूली</strong> करना तथा उसे राजकीय कोष में सुरक्षित जमा कराना।</li>\n</ul>\n</li>\n<li><strong>ग्राम प्रमुख (ग्रामिक या महत्तर)</strong>: ग्राम स्तर का सर्वोच्च प्रशासनिक अधिकारी <strong>'ग्रामिक'</strong> अथवा <strong>'महत्तर'</strong> कहलाता था, जिसकी सहायता के लिए ग्राम सभा उत्तरदायी होती थी।</li>\n</ul>\n<h3>दामोदरपुर ताम्रपत्र संख्या 3 के महत्वपूर्ण ग्राम अधिकारी:</h3>\n<p>दामोदरपुर ताम्रपत्र संख्या 3 में ग्राम सभा से जुड़े कुछ अत्यंत महत्वपूर्ण पदाधिकारियों और वर्गों के नामों का उल्लेख मिलता है:</p>\n<ul>\n<li><strong>महत्तर</strong>: ग्राम सभा के सम्मानित बुजुर्ग/प्रमुख सदस्य।</li>\n<li><strong>अष्टकुलाधिकरण</strong>: भूमि के क्रय-विक्रय (रजिस्ट्री एवं भूमि हस्तांतरण) से संबंधित महत्वपूर्ण प्रशासनिक अधिकारी।</li>\n<li><strong>ग्रामिक</strong>: ग्राम का मुख्य कार्यकारी अधिकारी।</li>\n<li><strong>कुटुम्बिन्</strong>: ग्राम सभा का हिस्सा बनने वाले प्रतिष्ठित किसान/परिवार के मुखिया।</li>\n<li><strong>तमवारक</strong>: यह भी ग्राम सभा से जुड़ा एक महत्वपूर्ण स्थानीय अधिकारी था।</li>\n</ul>\n<h2>नगर प्रशासन (Municipal Administration)</h2>\n<p>गुप्तकाल में बड़े नगरों के कुशल प्रबंधन के लिए सुव्यवस्थित नगर प्रशासन की व्यवस्था की गई थी।</p>\n<ul>\n<li><strong>पुरपाल या द्रांगिक</strong>: नगर के सर्वोच्च प्रशासनिक अधिकारी (नगरपति/मेयर) को <strong>'पुरपाल'</strong> अथवा <strong>'द्रांगिक'</strong> कहा जाता था।</li>\n<li><strong>प्रशासनिक स्तर</strong>: पुरपाल का पद अत्यंत गरिमामयी था और वह <strong>'कुमारामात्य'</strong> (सर्वोच्च प्रशासनिक सेवा श्रेणी) के स्तर का अधिकारी होता था।</li>\n<li><strong>ऐतिहासिक उदाहरण (गिरनार नगर)</strong>: स्कन्दगुप्त के सुप्रसिद्ध <strong>जूनागढ़ अभिलेख</strong> से यह प्रमाणित होता है कि गिरनार नगर का तत्कालीन पुरपाल (गवर्नर/नगर प्रमुख) पर्णदत्त का पुत्र <strong>चक्रपालित</strong> था।</li>\n</ul>\n<hr />\n<h2>गुप्तकालीन प्रांतीय एवं स्थानीय प्रशासनिक इकाइयों का पदानुक्रम (Hierarchy)</h2>\n<p>निम्नलिखित तालिका गुप्तकाल के प्रशासनिक पदानुक्रम को सर्वोच्च स्तर से निम्नतम स्तर तक स्पष्ट रूप से प्रदर्शित करती है:</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">प्रशासनिक इकाई का नाम</th>\n  <th style=\"text-align:left\">तत्कालीन नाम (वैकल्पिक नाम)</th>\n  <th style=\"text-align:left\">प्रशासनिक प्रमुख का पदनाम</th>\n  <th style=\"text-align:left\">ऐतिहासिक साक्ष्य / विशेष विवरण</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>सर्वोच्च</strong></td>\n  <td style=\"text-align:left\"><strong>साम्राज्य (केंद्र)</strong></td>\n  <td style=\"text-align:left\"><strong>सम्राट</strong> (महाराजाधिराज)</td>\n  <td style=\"text-align:left\">शासन व्यवस्था का सर्वोच्च स्रोत।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>प्रथम स्तर</strong></td>\n  <td style=\"text-align:left\"><strong>प्रांत</strong> (भुक्ति / अवनी / देश)</td>\n  <td style=\"text-align:left\"><strong>उपरिक</strong> (आंतरिक) / <strong>गोप्ता</strong> (सीमांत)</td>\n  <td style=\"text-align:left\">'भुक्ति' शब्द का सर्वप्रथम उल्लेख <strong>प्रयाग-प्रशस्ति</strong> में।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>द्वितीय स्तर</strong></td>\n  <td style=\"text-align:left\"><strong>जिला</strong> (विषय)</td>\n  <td style=\"text-align:left\"><strong>विषयपति</strong></td>\n  <td style=\"text-align:left\">इसकी सहायता हेतु विषय परिषद (नगर सभा) होती थी।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>तृतीय स्तर</strong></td>\n  <td style=\"text-align:left\"><strong>तहसील</strong> (वीथि)</td>\n  <td style=\"text-align:left\">-</td>\n  <td style=\"text-align:left\">विषय (जिला) के अधीन कार्य करने वाली इकाई।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>चतुर्थ स्तर</strong></td>\n  <td style=\"text-align:left\"><strong>ग्राम समूह</strong> (पेठ / पैठ)</td>\n  <td style=\"text-align:left\">-</td>\n  <td style=\"text-align:left\">इसका उल्लेख महाराज संक्षोभ के <strong>खोह अभिलेख</strong> में है।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>निम्नतम स्तर</strong></td>\n  <td style=\"text-align:left\"><strong>ग्राम</strong> (गाँव)</td>\n  <td style=\"text-align:left\"><strong>ग्रामिक</strong> / <strong>महत्तर</strong></td>\n  <td style=\"text-align:left\">सबसे छोटी प्रशासनिक इकाई; मध्य भारत में ग्राम सभा को <strong>पंचमण्डली</strong> कहते थे।</td>\n</tr>\n</tbody>\n</table>\n"}, {"id": "0-11", "title": "गुप्त साम्राज्य: न्याय प्रशासन एवं सैन्य संगठन", "file": "history-gupta.md", "html": "<h1>गुप्त साम्राज्य: न्याय प्रशासन एवं सैन्य संगठन</h1>\n<hr />\n<h2>1. न्याय प्रशासन (Judicial Administration)</h2>\n<p>गुप्तकाल में न्याय व्यवस्था पूर्ववर्ती कालों की तुलना में अधिक विकसित और सुसंगठित अवस्था में पहुँच चुकी थी।</p>\n<h3>क. न्यायिक पदानुक्रम एवं सर्वोच्च न्यायालय:</h3>\n<ul>\n<li><strong>सम्राट का स्थान</strong>: सम्राट राज्य का <strong>सर्वोच्च न्यायाधीश</strong> होता था।</li>\n<li><strong>धर्मासन</strong>: सम्राट के न्याय आसन को <strong>'धर्मासन'</strong> कहा जाता था।</li>\n<li><strong>प्राडविवाक (प्राङ्विवाक)</strong>: सम्राट की अनुपस्थिति में न्याय करने वाला राज्य का <strong>सर्वोच्च न्यायाधीश 'प्राडविवाक'</strong> कहलाता था।</li>\n<li><strong>अभिलेखीय एवं साहित्यिक विरोधाभास</strong>:<ul>\n<li><strong>स्मृतियों</strong> में गुप्तकालीन न्याय प्रणाली का बहुत ही विस्तृत उल्लेख मिलता है।</li>\n<li>इसके विपरीत, <strong>गुप्त अभिलेखों</strong> में न्याय प्रणाली का सीधा उल्लेख प्राप्त नहीं होता है।</li>\n</ul>\n</li>\n<li><strong>अभिलेखों में न्यायाधीशों के नाम</strong>: गुप्तकालीन अभिलेखों में न्यायाधीशों को मुख्य रूप से <strong>दंडनायक</strong>, <strong>महादंडनायक</strong> व <strong>सर्वदंडनायक</strong> कहा गया है।</li>\n</ul>\n<h3>ख. स्मृतियों के अनुसार विशिष्ट सामाजिक एवं व्यावसायिक न्यायालय:</h3>\n<p>गुप्तकाल में श्रेणियों और पारिवारिक स्तर पर विवादों के त्वरित निपटारे के लिए स्वायत्त संस्थाएँ कार्यरत थीं:</p>\n<ul>\n<li><strong>श्रेणी न्यायालय</strong>: व्यापारियों की श्रेणियों के अपने <strong>अलग न्यायालय और नियम (कानून)</strong> होते थे, जो अपने सदस्यों के मध्य होने वाले विवादों का न्यायपूर्वक निपटारा करते थे।</li>\n<li><strong>पूग (Puga)</strong>: यह नगर में रहने वाली <strong>विभिन्न जातियों की एक संयुक्त समिति</strong> होती थी, जो अपने सदस्यों के विवादों का फैसला करती थी।</li>\n<li><strong>कुल (Kula)</strong>: यह <strong>समान परिवार के सदस्यों की समिति</strong> होती थी, जो पारिवारिक स्तर के विवादों को सुलझाती थी।<ul>\n<li><em>नोट</em>: स्मृतियों में <strong>पूग</strong> व <strong>कुल</strong> नामक इन दोनों संस्थाओं के न्यायिक अधिकारों का स्पष्ट उल्लेख मिलता है।</li>\n</ul>\n</li>\n<li><strong>ग्राम स्तर पर न्याय</strong>: ग्रामीण क्षेत्रों में <strong>ग्राम पंचायत</strong> द्वारा न्याय कार्य संपादित किया जाता था।</li>\n</ul>\n<h2>2. गुप्तकालीन कानून एवं दंडविधान (Civil, Criminal &amp; Penal Codes)</h2>\n<h3>क. कानून का वर्गीकरण एवं वर्गीकरण के साक्ष्य:</h3>\n<ul>\n<li><strong>बृहस्पति स्मृति का साक्ष्य</strong>: <strong>बृहस्पति स्मृति</strong> से प्राप्त साक्ष्यों के अनुसार, गुप्त काल में ही इतिहास में <strong>पहली बार दीवानी (Civil Law) और फौजदारी (Criminal Law) कानूनों को भलीभांति परिभाषित एवं पूर्णतः पृथक (अलग)</strong> किया गया था।</li>\n<li><strong>स्थायी न्यायालय</strong>: इस काल में <strong>प्रतिष्ठित स्थायी न्यायालय</strong> अस्तित्व में थे।</li>\n<li><strong>उत्तराधिकार नियम</strong>: गुप्तकाल में उत्तराधिकार से संबंधित नियमों के बारे में <strong>व्यापक और विस्तृत कानून</strong> बनाए गए थे।</li>\n<li><strong>मृच्छकटिकम् का साक्ष्य</strong>: महाकवि शूद्रक रचित प्रसिद्ध ग्रंथ <strong>'मृच्छकटिकम्'</strong> में <strong>'कायस्थ'</strong> का उल्लेख मिलता है, जो न्यायालय की कार्यवाही (Judicial Proceedings) को लिखने वाले <strong>मुख्य लेखक</strong> (Scribe/Registrar) के रूप में कार्य करता था।</li>\n</ul>\n<h3>ख. दंड व्यवस्था एवं फाह्यान का विवरण:</h3>\n<ul>\n<li><strong>कोमल दंडविधान</strong>: चीनी यात्री <strong>फाह्यान</strong> के यात्रा विवरण के अनुसार, गुप्त साम्राज्य का दंडविधान अत्यंत <strong>कोमल</strong> (मृदु) था।</li>\n<li><strong>यातनाओं का अभाव</strong>: अपराधियों को <strong>शारीरिक यातनाएँ</strong> नहीं दी जाती थीं और न ही सामान्यतः <strong>मृत्युदंड</strong> का प्रावधान था।</li>\n<li><strong>राजद्रोह का गंभीर दंड</strong>: यदि कोई व्यक्ति <strong>बार-बार राजद्रोह</strong> करने का दोषी पाया जाता था, तो दंडस्वरूप उसका <strong>दाहिना हाथ काट लिया जाता था</strong>।</li>\n</ul>\n<h2>3. पुलिस विभाग (Police Department)</h2>\n<p>शांति एवं सुरक्षा व्यवस्था की देखरेख तथा अपराधियों के दमन के लिए एक सुव्यवस्थित पुलिस तंत्र कार्यरत था:</p>\n<ul>\n<li><strong>प्रमुख पुलिस अधिकारी</strong>: पुलिस विभाग के अंतर्गत निम्नलिखित सर्वोच्च अधिकारी कार्यरत थे:<ol>\n<li><strong>उपरिक</strong> (प्रांतीय प्रशासनिक प्रमुख, जो सुरक्षा भी देखता था)</li>\n<li><strong>दशापराधिक</strong> (दस प्रकार के अपराधों की जाँच करने वाला अधिकारी)</li>\n<li><strong>चौरोद्धरणिक</strong> (चोरों व डाकुओं को पकड़ने वाला मुख्य पुलिस अधिकारी)</li>\n<li><strong>दण्डपाशिक</strong> (सामान्य पुलिस अधिकारी / दंड देने का अधिकार रखने वाला)</li>\n</ol>\n</li>\n</ul>\n<h2>4. सैन्य संगठन (Military Organization)</h2>\n<p>गुप्त साम्राज्य की विशालता और उसकी सुरक्षा अदम्य सैन्य शक्ति पर टिकी हुई थी।</p>\n<h3>क. सैन्य नेतृत्व एवं संरचना:</h3>\n<ul>\n<li><strong>महाबलाधिकृत</strong>: सेना का सर्वोच्च सेनापति एवं मुख्य अधिकारी <strong>'महाबलाधिकृत'</strong> कहलाता था।</li>\n<li><strong>चतुरंगिणी सेना</strong>: गुप्त सेना के मुख्य रूप से <strong>चार प्रमुख अंग</strong> थे:<ol>\n<li><strong>पैदल सेना</strong> (Infantry)</li>\n<li><strong>रथ सेना</strong> (Chariot force)</li>\n<li><strong>अश्वारोही सेना</strong> (Cavalry)</li>\n<li><strong>गज सेना</strong> (Elephant force)</li>\n</ol>\n</li>\n</ul>\n<h3>ख. सैन्य अंगों के प्रधान अधिकारी एवं शब्दावलियाँ:</h3>\n<ul>\n<li><strong>महापीलुपति</strong>: गज सेना (हाथियों की सेना) के सर्वोच्च प्रधान को <strong>'महापीलुपति'</strong> कहा जाता था।</li>\n<li><strong>भटाश्वपति</strong>: अश्वसेना (घोड़ों की सेना) के सर्वोच्च प्रधान को <strong>'भटाश्वपति'</strong> कहा जाता था।</li>\n<li><strong>चमूप</strong>: पैदल सेना की सबसे <strong>छोटी टुकड़ी</strong> को <strong>'चमूप'</strong> कहा जाता था।</li>\n<li><strong>चाट (Chata)</strong>: सेना के <strong>साधारण सैनिक</strong> को <strong>'चाट'</strong> कहा जाता था।</li>\n<li><strong>रणभाण्डागारिक</strong>: युद्ध के दौरान सेना के अस्त्र-शस्त्र, रसद और संपूर्ण <strong>साजोसामान की देखरेख करने वाला</strong> सर्वोच्च अधिकारी <strong>'रणभाण्डागारिक'</strong> कहलाता था।</li>\n<li><strong>रणनीतिक बदलाव</strong>: गुप्त काल में <strong>रथों का महत्त्व लगभग समाप्त हो गया था</strong> और सेना में <strong>घोड़ों (अश्वारोही सेना) का महत्त्व अत्यधिक बढ़ गया था</strong>।</li>\n</ul>\n"}, {"id": "0-12", "title": "गुप्त साम्राज्य की राजस्व व्यवस्था", "file": "history-gupta.md", "html": "<h1>गुप्त साम्राज्य की राजस्व व्यवस्था</h1>\n<h2>1. भूमि स्वामित्व की अवधारणा (Concept of Land Ownership)</h2>\n<ul>\n<li><strong>राजा भूमि का स्वामी</strong>: प्राचीन भारतीय परंपरा के अनुसार राजा को संपूर्ण भूमि का स्वामी माना जाता था।</li>\n<li><strong>साहित्यिक साक्ष्य</strong>:<ul>\n<li>कौटिल्य के <strong>'अर्थशास्त्र'</strong> में भी राजा को भूमि का स्वामी स्वीकार किया गया है।</li>\n<li>प्राचीन धर्मशास्त्रकार <strong>मनु</strong> और <strong>गौतम</strong> ने भी राजा को स्पष्ट रूप से <strong>&quot;भूमि का अधिपति&quot;</strong> बताया है।</li>\n</ul>\n</li>\n</ul>\n<hr />\n<h2>2. गुप्तकालीन भूमिकर एवं अन्य करों के प्रकार (Land Revenue &amp; Taxes)</h2>\n<p>गुप्तकालीन अर्थव्यवस्था में राज्य की आय के अनेक साधन थे, जिनमें विभिन्न प्रकार के कर सम्मिलित थे:</p>\n<h3>क. प्रमुख करों का वर्गीकृत विवरण:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">कर (Tax) का नाम</th>\n  <th style=\"text-align:left\">कर का स्वरूप / विवरण</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>भाग</strong></td>\n  <td style=\"text-align:left\">राजा द्वारा भूमिपति के रूप में लिया जाने वाला मुख्य भूमिकर, जो <strong>उपज का छठा हिस्सा (1/6)</strong> होता था।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>भोग</strong></td>\n  <td style=\"text-align:left\">मनुस्मृति के अनुसार, यह राजा को <strong>प्रतिदिन दी जाने वाली फल-फूल, सब्जी इत्यादि की भेंट</strong> थी।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>उद्रंग</strong></td>\n  <td style=\"text-align:left\">केवल <strong>स्थायी किसानों</strong> से लिया जाने वाला भूमिकर।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>उपरिकर</strong></td>\n  <td style=\"text-align:left\">केवल <strong>अस्थायी (गैर-स्थायी) किसानों</strong> से लिया जाने वाला भूमिकर।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>भूतवातप्रत्याय</strong></td>\n  <td style=\"text-align:left\">राज्य के भीतर उत्पन्न होने वाली वस्तुओं तथा बाहर से <strong>आयात की जाने वाली वस्तुओं पर लगाया जाने वाला कर</strong>।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>शुल्क / बिक्रीकर</strong></td>\n  <td style=\"text-align:left\">व्यापारिक वस्तुओं की खरीद-बिक्री पर लगाया जाने वाला कर।</td>\n</tr>\n</tbody>\n</table>\n<h3>ख. कर प्रणाली में संरचनात्मक बदलाव:</h3>\n<ul>\n<li><strong>भूमिकर में वृद्धि</strong>: गुप्तकाल में कृषि पर लगने वाले <strong>भूमिकर (Land Tax) में वृद्धि</strong> दर्ज की गई थी।</li>\n<li><strong>व्यापारिक करों में कमी</strong>: इसके विपरीत, व्यापारियों और वाणिज्यिक गतिविधियों पर लगने वाले <strong>व्यापारिक करों में कमी</strong> की गई थी।</li>\n</ul>\n<hr />\n<h2>3. भूमिकर भुगतान के माध्यम (Modes of Tax Payment)</h2>\n<p>गुप्तकाल में किसानों को कर चुकाने के लिए लचीलापन प्रदान किया गया था। कृषक अपना भूमिकर निम्नलिखित दोनों रूपों में चुका सकते थे:</p>\n<ol>\n<li><strong>हिरण्य</strong>: कर का <strong>नकद (Cash)</strong> रूप में भुगतान करना।</li>\n<li><strong>मेय</strong>: कर का <strong>अन्न (Grain)</strong> के रूप में भुगतान करना।</li>\n</ol>\n<hr />\n<h2>4. विष्टि या बेगार प्रथा (Forced Labor)</h2>\n<ul>\n<li><strong>बेगार (विष्टि) की व्यवस्था</strong>: भूपति (भूमि का स्वामी या राजा) कृषकों तथा उनकी स्त्रियों से बिना पारिश्रमिक के जबरन काम (बेगार) ले सकता था।</li>\n<li><strong>वणिकों एवं शिल्पियों पर लागू</strong>: किसानों के अतिरिक्त <strong>वणिकों (व्यापारियों)</strong> तथा <strong>शिल्पियों</strong> को भी राज्य के लिए <strong>'विष्टि' (बेगार)</strong> देनी पड़ती थी।</li>\n<li><strong>विष्टि के ऐतिहासिक साक्ष्य</strong>:<ul>\n<li>विष्टि का ऐतिहासिक उल्लेख <strong>वाकाटक अभिलेखों</strong> तथा वात्स्यायन के <strong>'कामसूत्र'</strong> में प्राप्त होता है।</li>\n<li><strong>विशेष तथ्य</strong>: महत्वपूर्ण बात यह है कि <strong>गुप्तकालीन राजकीय लेखों (अभिलेखों) में 'विष्टि' का कहीं भी उल्लेख प्राप्त नहीं होता है</strong>।</li>\n</ul>\n</li>\n</ul>\n<hr />\n<h2>5. राजस्व का विकेंद्रीकरण एवं सामंतवाद का उदय</h2>\n<p>गुप्तकाल के उत्तरार्ध में भूमिदान की प्रथा ने गुप्त केंद्रीय सत्ता के वित्तीय नियंत्रण को अत्यधिक कमजोर कर दिया:</p>\n<ul>\n<li><strong>राजस्व के बाह्य स्रोत</strong>: भूमि से प्राप्त होने वाले रत्नों, <strong>गढ़े हुए गुप्त धन (खजाने)</strong>, खानों (Mines) और नमक (Salt) इत्यादि पर मूलतः राजा का अधिकार होता था।</li>\n<li><strong>दानग्रहीता का विशेषाधिकार</strong>: यदि दान में दी गई भूमि के भीतर से कोई गुप्त खजाना निकलता था, तो उस धन पर राजा के स्थान पर <strong>दानग्रहीता (दान प्राप्त करने वाले) का पूर्ण अधिकार</strong> माना जाता था।</li>\n<li><strong>वित्तीय नियंत्रण का ह्रास</strong>: भूमिदान के साथ-साथ उस भूमि या गाँव से होने वाली संपूर्ण आय भी ग्रहीता को सौंप दी जाती थी। इसके कारण सामंती व्यवस्था सुदृढ़ हुई और <strong>राजस्व पर केंद्रीय सरकार का नियंत्रण लगातार कमजोर होता चला गया</strong>।</li>\n<li><strong>प्रशासनिक व न्यायिक स्थानांतरण</strong>: गुप्त काल के अंतिम दिनों में अपराधियों को दंडित करने तथा स्थानीय झगड़ों में न्याय करने (फैसला सुनाने) का अधिकार भी भूमिदान के साथ ब्राह्मणों एवं अन्य दानग्रहीताओं को स्थानांतरित किया जाने लगा।</li>\n<li><strong>भूमिदान की अनुमति में परिवर्तन</strong>:<ul>\n<li><strong>प्रारम्भिक दौर में</strong>: केंद्रीय प्रांतों में राजा की पूर्वानुमति के बिना कोई भी सामंत भूमिदान नहीं दे सकता था।</li>\n<li><strong>छठी शताब्दी से (परिवर्तन)</strong>: छठी शताब्दी से यह परंपरा शुरू हो गई कि सामंत <strong>राजा की अनुमति के बिना भी स्वतंत्र रूप से भूमिदान</strong> देने लगे।</li>\n</ul>\n</li>\n</ul>\n<h2>6. भूमि अनुदानों का वर्गीकरण (Classification of Land Grants)</h2>\n<p>शैक्षणिक, धार्मिक और प्रशासनिक आवश्यकताओं के लिए कर-मुक्त भूमि दी जाती थी, जिसे निम्नलिखित श्रेणियों में वर्गीकृत किया गया था:</p>\n<ul>\n<li><strong>अग्रहार</strong>: मंदिरों तथा ब्राह्मणों को शैक्षणिक व धार्मिक उद्देश्यों से दी जाने वाली पूर्णतः <strong>कर-मुक्त भूमि 'अग्रहार'</strong> कहलाती थी। सामान्य तौर पर ये अनुदान स्थायी होते थे।</li>\n<li><strong>ब्रह्मदेय</strong>: ब्राह्मणों के जीविकोपार्जन एवं भरण-पोषण हेतु प्रदान की जाने वाली कर-मुक्त भूमि को <strong>'ब्रह्मदेय'</strong> कहा जाता था।</li>\n<li><strong>वेतन के बदले भूमिदान</strong>: गुप्त काल के उत्तरार्ध में गुप्त शासकों ने अपने राजकीय कर्मचारियों को उनके <strong>वेतन के बदले भूमिदान देना शुरू कर दिया</strong>। इसके परिणामस्वरूप भूमि के ये अनुदान और राजकीय प्रशासनिक पद वंशानुगत (Hereditary) होने लगे।</li>\n</ul>\n<hr />\n<h2>7. कृषकों का सामाजिक-आर्थिक वर्गीकरण</h2>\n<p>स्रोत के अनुसार, कृषि कार्य से जुड़े कृषकों को दो मुख्य श्रेणियों में विभाजित किया गया था:</p>\n<ol>\n<li><strong>कुटुम्बिन्</strong>: ये राज्य के <strong>स्वतंत्र किसान</strong> (Independent Peasants) थे।</li>\n<li><strong>कीनाश</strong>: ये भूमिहीन या ऐसे किसान थे जो दूसरों की भूमि पर <strong>बटाई पर कृषि</strong> (Sharecropping) का कार्य करते थे।</li>\n</ol>\n<hr />\n<h2>8. राजस्व व भूमि प्रशासन के प्रमुख अधिकारी (Administrative Officers)</h2>\n<p>भूमि और राजस्व के सुचारू संचालन के लिए विशेष अधिकारियों की नियुक्ति की गई थी:</p>\n<ul>\n<li><strong>ध्रुवाधिकरण</strong>: भूमिकर संग्रह (धान्य/अन्न के रूप में राजा का हिस्सा एकत्रित करने) के लिए उत्तरदायी मुख्य राजकीय अधिकारी।</li>\n<li><strong>महाअक्षपटलिक एवं करणिक</strong>: राजकीय भूमि संबंधी अभिलेखों व दस्तावेजों को सुरक्षित रखने वाले अधिकारी।</li>\n<li><strong>न्यायाधिकरण</strong>: भूमि संबंधी उत्पन्न होने वाले विवादों का निपटारा करने वाला विशिष्ट अधिकारी।</li>\n</ul>\n<hr />\n<h2>9. विशिष्ट साहित्यिक एवं अभिलेखीय साक्ष्य</h2>\n<ul>\n<li><strong>बृहस्पति स्मृति का साक्ष्य</strong>: ब्राह्मणों को राजकीय भूमिदान के साथ-साथ <strong>राजस्व/कर-मुक्त भूमि दिए जाने का स्पष्ट उल्लेख सिर्फ 'बृहस्पति स्मृति' में ही प्राप्त होता है</strong>।</li>\n<li><strong>स्कन्दगुप्त का भीतरी लेख</strong>: संपूर्ण गुप्त इतिहास में किसी भी गुप्त सम्राट द्वारा स्वयं <strong>प्रत्यक्ष रूप से भूमिदान दिए जाने का एकमात्र प्रामाणिक साक्ष्य स्कन्दगुप्त का 'भीतरी लेख' (Bhitori Inscription) है</strong>, जिसमें उनके द्वारा एक <strong>विष्णु मंदिर</strong> को भूमिदान दिए जाने का विवरण उत्कीर्ण है।</li>\n</ul>\n"}, {"id": "0-13", "title": "गुप्तकालीन आर्थिक जीवन: कृषि, सिंचाई, भूमि वर्गीकरण एवं भू-धारण पद्धतियाँ", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन आर्थिक जीवन: कृषि, सिंचाई, भूमि वर्गीकरण एवं भू-धारण पद्धतियाँ</h1>\n<hr />\n<h2>1. गुप्तकालीन कृषि व्यवस्था एवं प्रमुख फसलें (Agriculture &amp; Crops)</h2>\n<p>गुप्तकाल में कृषि अर्थव्यवस्था का मुख्य आधार थी, जिसका विविध साहित्यिक और ऐतिहासिक स्रोतों में सविस्तार वर्णन प्राप्त होता है।</p>\n<ul>\n<li><strong>मुख्य व्यवसाय</strong>: गुप्तकाल में <strong>कृषि ही लोगों का मुख्य व्यवसाय</strong> था।</li>\n<li><strong>कालिदास के अनुसार</strong>:<ul>\n<li>राष्ट्रीय आर्थिक विकास में <strong>कृषि व पशुपालन का बहुत अधिक महत्त्व</strong> था।</li>\n<li>कालिदास ने अपने साहित्य में <strong>गन्ना (ईख)</strong> व <strong>चावल (धान)</strong> की खेती का विशेष रूप से उल्लेख किया है।</li>\n<li>कालिदास के विवरण के अनुसार, <strong>कालीमिर्च</strong> और <strong>इलायची मलय पर्वत (नीलगिरी पर्वतमाला)</strong> के आसपास के क्षेत्रों में प्रचुर मात्रा में उत्पन्न होते थे।</li>\n</ul>\n</li>\n<li><strong>वृहत्संहिता (वराहमिहिर कृत) के अनुसार</strong>:<ul>\n<li>वर्ष में मुख्य रूप से <strong>तीन फसलें</strong> उगाई जाती थीं।</li>\n<li>कृषि के विकास के लिए यह अधिकांशतः <strong>वर्षा पर ही निर्भर</strong> थी।</li>\n<li>वृहत्संहिता में मौसम के विषय में <strong>अनेक भविष्यवाणियां</strong> भी अंकित की गई हैं।</li>\n<li>वराहमिहिर ने अपने ग्रंथों में तत्कालीन <strong>दुर्भिक्ष (अकाल)</strong> की स्थिति का भी सजीव वर्णन किया है।</li>\n</ul>\n</li>\n<li><strong>अमरकोश के साक्ष्य</strong>:<ul>\n<li>अमरकोश में <strong>हलों की बनावट</strong> का अत्यंत सूक्ष्म वर्णन मिलता है (जिसके अनुसार <strong>पांच प्रकार की लौह की फाल</strong> वाले हल का उपयोग होता था)।</li>\n<li>इसमें विभिन्न प्रकार की फसलों के उत्पादन के लिए <strong>भूमि का अलग-अलग विभाजन</strong> किया गया है।</li>\n</ul>\n</li>\n<li><strong>अष्टांग संग्रह के साक्ष्य</strong>: इस सुप्रसिद्ध ग्रंथ में <strong>चावल की कुल 44 किस्मों</strong> का अत्यंत विस्तृत वर्णन प्राप्त होता है।</li>\n<li><strong>इत्सिंग (चीनी यात्री) के अनुसार</strong>: गुप्तकाल की प्रमुख और लोकप्रिय फसलों में <strong>चावल व जौ</strong> सर्वप्रमुख थीं।</li>\n<li><strong>कॉस्मस के अनुसार</strong>: यूनानी भूगोलवेत्ता कॉस्मस ने भी अपने यात्रा वृतांत में <strong>मलय पर्वत को &quot;कालीमिर्च का देश&quot;</strong> कहकर संबोधित किया है।</li>\n<li><strong>पारिवारिक भूमि विभाजन (बृहस्पति व नारद स्मृतियों के अनुसार)</strong>:<ul>\n<li>परिवार के <strong>मुखिया की मृत्यु के पश्चात्</strong> उसकी भूमि का स्वामित्व <strong>उसके पुत्रों में समान रूप से बांट दिया जाता था</strong>।</li>\n</ul>\n</li>\n</ul>\n<hr />\n<h2>2. सिंचाई व्यवस्था (Irrigation System)</h2>\n<p>कृषि की उन्नति और फसलों के बेहतर उत्पादन के लिए गुप्तकाल में कृत्रिम सिंचाई प्रणालियों का व्यापक विकास किया गया था।</p>\n<ul>\n<li><strong>सुदर्शन झील (गिरनार, सौराष्ट्र)</strong>:<ul>\n<li><strong>स्कन्दगुप्त के जूनागढ़ अभिलेख</strong> से यह प्रामाणिक जानकारी मिलती है कि एक बार <strong>अत्यधिक वर्षा होने के कारण सुदर्शन झील का पानी चारों ओर फैल गया था</strong> (झील का बांध टूट गया था)। इसके कारण वहां के स्थानीय निवासियों के लिए अत्यंत भयानक <strong>दुर्भिक्ष (अकाल) की स्थिति</strong> उत्पन्न हो गई थी।</li>\n<li>सुदर्शन झील का मुख्य उपयोग <strong>कृषि कार्यों हेतु सिंचाई के लिए</strong> किया जाता था।</li>\n<li>जूनागढ़ अभिलेख गुप्तकालीन उन्नत सिंचाई व्यवस्था का <strong>सर्वोत्तम ऐतिहासिक उदाहरण</strong> प्रस्तुत करता है।</li>\n</ul>\n</li>\n<li><strong>नहरों और तालाबों का विकास</strong>: <strong>अमरकोश</strong> से यह स्पष्ट रूप से ज्ञात होता है कि गुप्तकाल में सिंचाई की सुविधा के लिए <strong>नदियों से बड़ी-बड़ी नहरें निकाली गई थीं</strong> तथा कृत्रिम <strong>तालाबों का भी निर्माण</strong> करवाया गया था।</li>\n<li><strong>अग्नि पुराण के अनुसार</strong>: कृषि की वृद्धि और प्रजा की संपन्नता के लिए कृत्रिम सिंचाई के सुदृढ़ साधन जुटाना <strong>राजा के प्रमुख आठ कर्तव्यों में से एक</strong> अनिवार्य कर्तव्य माना गया था।</li>\n<li><strong>रहट (अरघट्ट)</strong>: इस काल में कुओं से पानी निकालकर खेतों की सिंचाई करने के लिए <strong>'रहट'</strong> (जिसे संस्कृत में <strong>'अरघट्ट'</strong> कहा गया है) का बड़े पैमाने पर प्रयोग किया जाता था।</li>\n</ul>\n<h2>3. आर्थिक उपयोगिता के आधार पर भूमि के प्रकार (Classification of Land)</h2>\n<p>गुप्तकालीन भू-राजस्व और कृषि व्यवस्था के अंतर्गत आर्थिक उपयोगिता एवं कृषि की योग्यता के आधार पर भूमि को मुख्य रूप से निम्नलिखित प्रकारों में विभाजित किया गया था:</p>\n<h3>क. आर्थिक उपयोगिता की दृष्टि से मूल श्रेणियाँ:</h3>\n<ol>\n<li><strong>क्षेत्र</strong>: खेती कार्य के लिए सर्वाधिक <strong>उपयुक्त और उपजाऊ भूमि</strong>।</li>\n<li><strong>वास्तु</strong>: मनुष्यों के <strong>निवास करने योग्य भूमि</strong> (जहाँ घर या बस्तियाँ बसाई जाती थीं)।</li>\n<li><strong>खिल</strong>: वह बंजर या परती भूमि <strong>जो जोती नहीं जाती थी</strong>।</li>\n<li><strong>अप्रहत</strong>: बिना जोती गई <strong>जंगली या अनियंत्रित भूमि</strong>।</li>\n</ol>\n<h3>ख. सिंचाई के आधार पर वर्गीकरण:</h3>\n<ul>\n<li><strong>हलदंडकार (कर)</strong>: हल रखने वाले <strong>प्रत्येक कृषक (किसान) द्वारा राज्य को दिया जाने वाला एक विशिष्ट कर</strong> था।</li>\n<li><strong>अदेवमातृक भूमि</strong>: यह अत्यंत महत्वपूर्ण श्रेणी थी। वह भूमि <strong>जो कृषि के लिए पूर्णतः वर्षा पर आश्रित न होकर कृत्रिम साधनों (जैसे नहर, तालाब, कुआँ) द्वारा की गई सिंचाई पर निर्भर थी</strong>, अर्थात् वह भूमि जिस पर <strong>बिना वर्षा के भी अत्यंत अच्छी खेती संपन्न हो सके</strong>। (इसके विपरीत वर्षा पर आश्रित भूमि को 'देवमातृक' कहा जाता था)।</li>\n</ul>\n<h2>4. अमरकोश में वर्णित 12 प्रकार की भूमि (12 Types of Land)</h2>\n<p>अमरसिंह द्वारा रचित प्रसिद्ध शब्दकोश <strong>'अमरकोश'</strong> में गुप्तकाल की मृदा और कृषि उत्पादकता के आधार पर कुल <strong>12 प्रकार की भूमियों</strong> का विस्तृत वर्गीकरण मिलता है:</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">भूमि का नाम</th>\n  <th style=\"text-align:left\">विशेषता एवं ऐतिहासिक अर्थ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>उर्वरा</strong></td>\n  <td style=\"text-align:left\">अत्यंत उपजाऊ और कृषि योग्य भूमि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>ऊसर</strong></td>\n  <td style=\"text-align:left\">बंजर भूमि (कृषि के अयोग्य)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>मरु</strong></td>\n  <td style=\"text-align:left\">रेतीली या मरुस्थलीय भूमि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>अप्रहत</strong></td>\n  <td style=\"text-align:left\">बिना जोती हुई जंगली भूमि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>सद्वल</strong></td>\n  <td style=\"text-align:left\">घास के मैदान (पशुओं के चरने की चरागाह भूमि)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>पंकिल</strong></td>\n  <td style=\"text-align:left\">कीचड़ से युक्त दलदली जमीन।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>7</strong></td>\n  <td style=\"text-align:left\"><strong>जलप्रायमनूपम</strong></td>\n  <td style=\"text-align:left\">अत्यधिक पानी से भरी हुई या जलमग्न भूमि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>8</strong></td>\n  <td style=\"text-align:left\"><strong>कच्छ</strong></td>\n  <td style=\"text-align:left\">पानी या जलाशयों के अत्यंत निकट स्थित आर्द्र भूमि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>9</strong></td>\n  <td style=\"text-align:left\"><strong>शर्करा</strong></td>\n  <td style=\"text-align:left\">कंकड़-पत्थरों से युक्त कंकरीली भूमि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>10</strong></td>\n  <td style=\"text-align:left\"><strong>शर्कारावती</strong></td>\n  <td style=\"text-align:left\">रेत की अधिकता वाली विशुद्ध रेतीली भूमि।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>11</strong></td>\n  <td style=\"text-align:left\"><strong>नदीमात्रुक</strong></td>\n  <td style=\"text-align:left\">वह भूमि जो मुख्य रूप से नदियों के जल से सींची जाती थी।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>12</strong></td>\n  <td style=\"text-align:left\"><strong>देवमात्रुक</strong></td>\n  <td style=\"text-align:left\">वह भूमि जो पूर्णतः बादलों या वर्षा के जल से सींची जाती थी।</td>\n</tr>\n</tbody>\n</table>\n<h2>5. भू-धारण पद्धतियाँ एवं शब्दावलियाँ (Land Tenure Systems)</h2>\n<p>गुप्तकाल में राज्य द्वारा भूमि दान देने, पट्टे पर देने और भूमि के स्वामित्व के अधिकारों को विनियमित करने के लिए छह विशिष्ट भू-धारण पद्धतियों का प्रचलन था:</p>\n<h3>छह प्रमुख भू-धारण पद्धतियों का तुलनात्मक एवं विस्तृत विश्लेषण:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">भू-धारण पद्धति का नाम</th>\n  <th style=\"text-align:left\">विधिक अर्थ एवं स्वामित्व के अधिकार</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>नीवी धर्म</strong></td>\n  <td style=\"text-align:left\">इसका विधिक अर्थ यह है कि <strong>मूलधन सदा उतना ही सुरक्षित रहेगा</strong>। अर्थात् दान में प्राप्त भूमि खंड को सदा <strong>अक्षुण्ण रखने की अनुमति</strong> थी (ग्रहीता मूल भूमि को नष्ट या बेच नहीं सकता था)।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>अक्षय नीवी धर्म</strong></td>\n  <td style=\"text-align:left\">इससे तात्पर्य ऐसी भूमि से था <strong>जिससे अनवरत भू-राजस्व प्राप्त होता रहे</strong>। इसमें दानग्रहीता को भू-राजस्व स्थायी रूप से दान कर दिया जाता था। इस पद्धति का सर्वप्रथम प्रचलन <strong>कुषाण काल</strong> में हुआ था, किन्तु यह प्रणाली <strong>गुप्त व गुप्तोत्तर काल में अत्यधिक लोकप्रिय</strong> हुई।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>नीवी धर्म क्षय</strong></td>\n  <td style=\"text-align:left\">इसका सीधा आशय <strong>'नीवी धर्म को समाप्त करना'</strong> था। इसके अंतर्गत पूर्ववर्ती नीवी नियमों को समाप्त करके उस विशिष्ट भूमि खंड को <strong>किसी दूसरे व्यक्ति को हस्तांतरित (दान/बेच)</strong> कर दिया जाता था।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4</strong></td>\n  <td style=\"text-align:left\"><strong>अप्रदा धर्म</strong></td>\n  <td style=\"text-align:left\">इसका विधिक अर्थ यह था कि दान पाने वाला व्यक्ति उस विशिष्ट भूमि खंड का <strong>स्वयं तो उपभोग कर सकता था, परन्तु उसे किसी अन्य व्यक्ति को दान में देने का अधिकार नहीं था</strong>।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5</strong></td>\n  <td style=\"text-align:left\"><strong>अप्रदा नीवी धर्म</strong></td>\n  <td style=\"text-align:left\">इसके अंतर्गत अनुदान पाने वाला व्यक्ति भूमि का <strong>पूरा उपभोग तो कर सकता था, किन्तु उसे किसी अन्य व्यक्ति को हस्तांतरित या दान देने का बिल्कुल अधिकार नहीं था</strong>। इस भूमि को <strong>राज्य कभी भी वापस ले सकता था</strong>।</td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>6</strong></td>\n  <td style=\"text-align:left\"><strong>भूमि छिद्र न्याय</strong></td>\n  <td style=\"text-align:left\">इस विधिक न्याय के अनुसार, <strong>जो व्यक्ति किसी बंजर या जंगली भूमि को सबसे पहले खेती के योग्य बनाता था, वही उस भूमि खंड का वास्तविक स्वामी बन जाता था</strong>। हालांकि, भूमि के गर्भ में छिपे <strong>खनिजों पर केवल राजा का ही आधिपत्य</strong> रहता था। इस भूमि को कोई भी दानग्रहीता बेच नहीं सकता था।</td>\n</tr>\n</tbody>\n</table>\n<h2>6. अक्षय नीवी स्थायी पूंजी न्यास (Permanent Endowment Guilds)</h2>\n<ul>\n<li><strong>विशिष्ट बैंकिंग प्रणाली</strong>: गुप्तकाल में <strong>'अक्षय नीवी'</strong> एक प्रकार की <strong>स्थायी पूंजी न्यास (Trust)</strong> के रूप में भी कार्य करती थी।</li>\n<li><strong>श्रेणियों में निवेश</strong>: दानी धनी व्यक्ति अपनी धन-संपदा अथवा स्थायी पूंजी को तत्कालीन <strong>व्यापारिक श्रेणियों (Guilds)</strong> में जमा करा देते थे।</li>\n<li><strong>धार्मिक एवं शैक्षणिक उपयोग</strong>: इस जमा पूंजी का मुख्य उद्देश्य <strong>धार्मिक व शैक्षणिक कार्यों का सुचारू संचालन</strong> करना था।</li>\n<li><strong>ब्याज से अनवरत कार्य</strong>: इस जमा पूंजी पर श्रेणियों द्वारा दिए जाने वाले <strong>ब्याज (Interest) की राशि से</strong> श्रेणियां दानी व्यक्तियों द्वारा सौंपे गए सामाजिक, शैक्षणिक व धार्मिक कार्यों को <strong>अनवरत रूप से बिना रुके संचालित करती थीं</strong>।</li>\n</ul>\n<hr />\n"}, {"id": "0-14", "title": "गुप्तकालीन आर्थिक जीवन, भूमि माप एवं व्यापारिक श्रेणियाँ", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन आर्थिक जीवन, भूमि माप एवं व्यापारिक श्रेणियाँ</h1>\n<hr />\n<h2>1. भूमि माप की इकाइयाँ एवं प्रशासनिक नियम (Land Measurements &amp; Administration)</h2>\n<p>गुप्तकाल में भूमि प्रबंधन और उसकी माप के लिए एक अत्यंत सुव्यवस्थित और मानकीकृत प्रणाली विद्यमान थी।</p>\n<h3>क. भूमि माप के विभिन्न पैमाने (Land Measurement Scales)</h3>\n<ul>\n<li><strong>अंगुल (Angula)</strong>: यह गुप्तकालीन भूमि माप का <strong>सबसे छोटा पैमाना</strong> था।</li>\n<li><strong>नल (Nala)</strong>: भूमि मापने के लिए प्रयुक्त होने वाली <strong>धातु की छड़</strong> या <strong>उसी निश्चित लम्बाई की रस्सी</strong> को &quot;नल&quot; कहा जाता था।</li>\n<li><strong>पाटक (Pataka)</strong>: यह भूमि माप का <strong>सबसे बड़ा पैमाना</strong> था।</li>\n<li><strong>धनु (Dhanu) एवं दंड (Danda)</strong>: ये भी भूमि की माप में प्रयुक्त होने वाले अन्य महत्वपूर्ण पैमाने थे।</li>\n<li><strong>अन्य माप</strong>: भूमि मापने के लिए <strong>आढ़वाप (Adhavapa)</strong>, <strong>द्रोणवाप (Dronavapa)</strong>, <strong>कुल्यवाप (Kulyavapa)</strong> तथा <strong>निवर्तन (Nivartana)</strong> का भी बड़े पैमाने पर प्रयोग किया जाता था।</li>\n</ul>\n<h3>ख. भूमि मापों का पारस्परिक गणितीय संबंध:</h3>\n<p>गुप्तकालीन भूमि मापों के पारस्परिक संबंध को निम्नलिखित मानकीकृत अनुपात द्वारा समझा जा सकता है:</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:center\">क्र. सं.</th>\n  <th style=\"text-align:left\">लघु इकाई (Small Unit)</th>\n  <th style=\"text-align:center\"></th>\n  <th style=\"text-align:left\">मुख्य इकाई (Main Unit)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1</strong></td>\n  <td style=\"text-align:left\"><strong>4 आढ़वाप</strong></td>\n  <td style=\"text-align:center\"><strong>=</strong></td>\n  <td style=\"text-align:left\"><strong>1 द्रोणवाप</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2</strong></td>\n  <td style=\"text-align:left\"><strong>8 द्रोणवाप</strong></td>\n  <td style=\"text-align:center\"><strong>=</strong></td>\n  <td style=\"text-align:left\"><strong>1 कुल्यवाप</strong></td>\n</tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3</strong></td>\n  <td style=\"text-align:left\"><strong>5 कुल्यवाप</strong></td>\n  <td style=\"text-align:center\"><strong>=</strong></td>\n  <td style=\"text-align:left\"><strong>1 पाटक</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>ग. भूमि प्रशासन से जुड़े राजकीय नियम:</h3>\n<ul>\n<li><strong>क्षेत्रकर (Kshetrakara)</strong>: गुप्तकाल में भूमि की पैमाइश (नाप) करने वाले राजकीय अधिकारी को <strong>&quot;क्षेत्रकर&quot;</strong> कहा जाता था।</li>\n<li><strong>भूमि हस्तांतरण/बिक्री के विधिक नियम</strong>: राज्य में किसी भी भूमि की बिक्री (sale) करने से पहले स्थानीय <strong>पुस्तकपाल (Pustakapala)</strong> तथा <strong>विषयपति (Vishayapati - जिला प्रमुख)</strong> से <strong>अनिवार्य रूप से पूर्व अनुमति लेनी पड़ती थी</strong>।</li>\n<li><strong>पशुपालन</strong>: कृषि के अतिरिक्त पशुपालन आजीविका का एक अन्य प्रमुख साधन था। सुप्रसिद्ध संस्कृत ग्रंथ <strong>'अमरकोश'</strong> में तत्कालीन समाज में पाले जाने वाले पालतू पशुओं की एक विस्तृत सूची प्रदान की गई है।</li>\n</ul>\n<h2>2. वस्त्र उद्योग: आर्थिक जीवन का मुख्य आधार (The Textile Industry)</h2>\n<p>वस्त्र निर्माण गुप्त साम्राज्य के आर्थिक जीवन और औद्योगिक विकास का एक प्रमुख स्तंभ था।</p>\n<ul>\n<li><strong>सर्वप्रमुख उद्योग</strong>: <strong>वस्त्र निर्माण (Textile manufacturing)</strong> इस काल का सबसे विकसित और प्रमुख उद्योग था।</li>\n<li><strong>अमरकोश का साक्ष्य</strong>: अमरसिंह कृत <strong>'अमरकोश'</strong> में वस्त्र निर्माण की संपूर्ण प्रक्रिया—जैसे <strong>कताई (spinning)</strong>, <strong>बुनाई (weaving)</strong>, <strong>हथकरघा (handloom)</strong> तथा <strong>धागे (threads)</strong> आदि का अत्यंत विस्तृत तकनीकी उल्लेख मिलता है।</li>\n<li><strong>महीन कपड़ों का प्रचलन</strong>: महाकवि <strong>कालिदास</strong> ने अपने प्रसिद्ध नाटकों में तत्कालीन संभ्रांत समाज द्वारा पहने जाने वाले अत्यंत <strong>महीन (बारीक/उत्कृष्ट) कपड़ों</strong> का गौरवपूर्वक उल्लेख किया है।</li>\n<li><strong>सिले हुए वस्त्र</strong>: भारत में वस्त्रों के ऐतिहासिक क्रमिक विकास के अंतर्गत <strong>कुषाण काल</strong> से ही <strong>सिले हुए कपड़ों (stitched clothes)</strong> का सामान्य प्रचलन प्रारंभ हो चुका था।</li>\n</ul>\n<h2>3. व्यापारिक श्रेणियाँ: स्वरूप, कार्य एवं वित्तीय व्यवस्था (The Guild System)</h2>\n<p>गुप्तकाल में व्यापारिक श्रेणियाँ (Shrenis) केवल व्यापारिक संगठन न होकर अत्यंत शक्तिशाली आर्थिक, सामाजिक और प्रशासनिक स्वायत्त संस्थाएँ थीं।</p>\n<h3>क. मुहरों के पुरातात्विक साक्ष्य:</h3>\n<ul>\n<li><strong>नालंदा</strong> तथा <strong>वैशाली</strong> आदि ऐतिहासिक स्थानों से खुदाई में भारी संख्या में गुप्तकालीन <strong>श्रेणियों, सार्थवाहों तथा प्रथम कुलिकों की मिट्टी की मुहरें (Clay Seals)</strong> प्राप्त हुई हैं।</li>\n<li>ये मुहरें तत्कालीन शिल्पियों, कारीगरों व व्यापारिक श्रेणियों के सुदृढ़ संगठन, उनके पारस्परिक संबंधों तथा उनकी व्यावसायिक गतिविधियों को साक्ष्य सहित प्रदर्शित करती हैं।</li>\n</ul>\n<h3>ख. श्रेणियों के विधिक नियम एवं प्रशासनिक ढांचा:</h3>\n<ul>\n<li><strong>नवीन श्रेणियों का गठन (बृहस्पति स्मृति के अनुसार)</strong>: जब भी किसी नवीन श्रेणी का निर्माण किया जाता था, तो उसके सभी सदस्यों को <strong>कुछ न्यूनतम पूँजी (Funds) जमा करनी पड़ती थी</strong> और एक-दूसरे के प्रति पूर्ण विश्वास व्यक्त करना पड़ता था।</li>\n<li><strong>बहुआयामी भूमिका</strong>: श्रेणियाँ अपने व्यावसायिक और व्यापारिक उत्तरदायित्वों के अतिरिक्त समाज में कई महत्वपूर्ण <strong>सामाजिक कार्य</strong> (Welfare works) भी संपादित करती थीं।</li>\n<li><strong>बैंकिंग संस्था के रूप में कार्य</strong>: गुप्तकाल में श्रेणियाँ आधुनिक <strong>बैंकों की भूमिका</strong> भी निभाती थीं। ये धन जमा करती थीं और व्यापारिक कार्यों के लिए ऋण प्रदान करती थीं।</li>\n<li><strong>नारद व बृहस्पति स्मृति</strong>: इन दोनों स्मृतियों के विधिक ग्रंथों में श्रेणियों के सुव्यवस्थित संचालन के लिए उनकी <strong>प्रशासनिक व्यवस्था</strong> का अत्यंत विशद और स्पष्ट उल्लेख प्राप्त होता है।</li>\n</ul>\n<h3>ग. श्रेणियों के पास वित्तीय जमा और जन-कल्याण (Endowments):</h3>\n<ul>\n<li><strong>स्थायी वित्तीय बंदोबस्त</strong>: तत्कालीन समाज के कुछ धनी लोग श्रेणियों के पास अपनी स्थायी <strong>पूँजी (Fixed deposits) जमा कर देते थे</strong>। श्रेणियाँ इस पूँजी को सुरक्षित रखती थीं और उससे मिलने वाले <strong>ब्याज (Interest)</strong> का उपयोग जमाकर्ता की इच्छानुसार विशिष्ट <strong>धार्मिक और परोपकारी कार्यों</strong> के संपादन के लिए करती थीं।</li>\n<li><strong>चंद्रगुप्त द्वितीय का गढ़वा अभिलेख</strong>: इस अभिलेख से प्रमाणित होता है कि स्वयं गुप्त सम्राट <strong>चंद्रगुप्त द्वितीय</strong> ने धार्मिक पुनीत कार्यों के संपादन हेतु इसी प्रकार की अक्षय पूँजी श्रेणियों के पास जमा कराई थी।</li>\n<li><strong>रेशम बुनकरों (पट्टवाय) की श्रेणी और मंदसौर अभिलेख</strong>:<ul>\n<li>कुमारगुप्त प्रथम के काल के स्थानीय शासक/अधिकारी <strong>बंधुवर्मन के मंदसौर अभिलेख</strong> से श्रेणियों के इतिहास की सबसे महत्वपूर्ण जानकारी मिलती है।</li>\n<li>इसके अनुसार, <strong>रेशम बुनकरों (पट्टवाय)</strong> की एक अत्यंत समृद्ध श्रेणी ने मंदसौर में <strong>437-38 ईस्वी</strong> में एक भव्य <strong>सूर्य मंदिर</strong> का निर्माण कराया था।</li>\n<li>बाद में, <strong>473-74 ईस्वी</strong> में इसी रेशम बुनकर श्रेणी द्वारा इस भव्य सूर्य मंदिर की आवश्यक <strong>मरम्मत (Renovation)</strong> भी कराई गई।</li>\n</ul>\n</li>\n</ul>\n<h3>घ. सिक्कों का प्रचलन एवं स्थानीय स्वायत्तता:</h3>\n<ul>\n<li><strong>सिक्के जारी करने का अधिकार</strong>: अपनी आर्थिक स्वायत्तता और समृद्धि के कारण <strong>तक्षशिला, विदिशा तथा कौशाम्बी</strong> जैसे प्रमुख व्यापारिक नगरों की श्रेणियाँ <strong>अपने स्वतंत्र सिक्के (Coins) जारी करती थीं</strong>।</li>\n<li><strong>नगर निगम शासन (तक्षशिला)</strong>: ऐतिहासिक साक्ष्यों के अनुसार, पश्चिमोत्तर भारत के सुप्रसिद्ध नगर <strong>तक्षशिला का संपूर्ण शासन</strong> स्थानीय व्यापारियों के ही एक <strong>निगम (Merchant Corporation)</strong> द्वारा स्वायत्त रूप से संचालित किया जाता था।</li>\n</ul>\n<hr />\n<h2>4. व्यापारिक संगठनों का वर्गीकरण एवं शब्दावलियाँ (Classification &amp; Key Terminology)</h2>\n<p>गुप्तकालीन आर्थिक इतिहास को समझने के लिए विभिन्न व्यावसायिक समूहों और उनके प्रशासनिक पदों की शब्दावलियों का ज्ञान अत्यंत आवश्यक है:</p>\n<h3>क. व्यावसायिक संगठनों का श्रेणीबद्ध वर्गीकरण:</h3>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:left\">संगठन का नाम (Organization)</th>\n  <th style=\"text-align:left\">संगठनात्मक स्वरूप एवं परिभाषा (Definition)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\"><strong>पूग (Puga)</strong></td>\n  <td style=\"text-align:left\"><strong>एक ही जाति</strong> (Same caste/profession) के व्यापारियों या व्यवसायियों का संगठित समूह।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\"><strong>श्रेणी (Shreni)</strong></td>\n  <td style=\"text-align:left\"><strong>विभिन्न जातियों</strong> (Different castes but same profession) के व्यापारियों या शिल्पकारों का सुसंगठित समूह।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\"><strong>निगम (Nigama)</strong></td>\n  <td style=\"text-align:left\"><strong>एक ही नगर</strong> (Based in the same city/locality) में रहने वाले व्यापारियों का स्थानीय समूह।</td>\n</tr>\n<tr>\n  <td style=\"text-align:left\"><strong>श्रेष्ठिकुलिकनिगम</strong></td>\n  <td style=\"text-align:left\">श्रेष्ठियों (बैंकर्स), शिल्पियों (कारीगरों) तथा व्यापारिक श्रेणियों का एक <strong>केंद्रीय या संयुक्त महासंघ (Central Guild)</strong>।</td>\n</tr>\n</tbody>\n</table>\n<h3>ख. महत्वपूर्ण आर्थिक एवं प्रशासनिक पद:</h3>\n<ul>\n<li><strong>जेठक / जेष्ठक (Jethaka / Jyeshthaka)</strong>: यह श्रेणियों के <strong>सर्वोच्च मुखिया (प्रधान)</strong> को कहा जाता था।<ul>\n<li><strong>साहित्यिक साक्ष्य</strong>: प्राचीन एवं पूर्वमध्यकालीन साहित्य में श्रेणी प्रमुख के लिए <strong>'जेट्ठक'</strong> शब्द का प्रयोग मिलता है।</li>\n<li><strong>अभिलेखीय साक्ष्य</strong>: गुप्तकालीन राजकीय अभिलेखों और शिलालेखों में इसी पद के लिए <strong>'माहर'</strong> या <strong>'महत्तक'</strong> शब्द का सम्मानपूर्वक प्रयोग किया गया है।</li>\n</ul>\n</li>\n<li><strong>निगम</strong>: व्यापारियों की स्थानीय विधिक समिति को <strong>'निगम'</strong> कहा जाता था।</li>\n<li><strong>श्रेष्ठी (Shreshthi)</strong>:<ul>\n<li>यह निगम के <strong>प्रधान (अध्यक्ष)</strong> को कहा जाता था।</li>\n<li>श्रेष्ठी मुख्य रूप से समाज में <strong>बैंकर्स (Bankers) एवं साहूकारों</strong> के रूप में बड़े पैमाने पर वित्तीय कार्य करते थे।</li>\n</ul>\n</li>\n<li><strong>सार्थ (Sartha) एवं सार्थवाह (Sarthavaha)</strong>:<ul>\n<li>दूर-दराज के क्षेत्रों में व्यापार करने वाले व्यापारियों के चलते-फिरते समूह (कारवां) को <strong>'सार्थ'</strong> कहा जाता था।</li>\n<li>इस व्यापारिक कारवां के नेता (प्रमुख मार्गदर्शक) को <strong>'सार्थवाह'</strong> कहा जाता था।</li>\n</ul>\n</li>\n<li><strong>नगर प्रशासन में श्रेष्ठी की भागीदारी</strong>:<ul>\n<li>नगरों के स्थानीय प्रशासन में <strong>नगर श्रेष्ठी (Nagara Shreshthi)</strong> एवं <strong>सार्थवाह</strong> की प्रत्यक्ष प्रशासनिक भागीदारी होती थी।</li>\n<li>इसका सर्वोत्कृष्ट साक्ष्य पूर्वी भारत के उत्तरी बंगाल में स्थित <strong>पुण्ड्रवर्धन (Pundravardhana)</strong> से प्राप्त गुप्तकालीन अभिलेखों में मिलता है, जहाँ नगर परिषद के प्रशासन में इनका स्पष्ट उल्लेख हुआ है।</li>\n</ul>\n</li>\n</ul>\n"}, {"id": "0-15", "title": "गुप्तकालीन सिक्के एवं मुहरें", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन सिक्के एवं मुहरें</h1>\n<hr />\n<h2>1. सिक्कों के ढेर और बयाना संचय (Hoards of Coins)</h2>\n<ul>\n<li><strong>सिक्कों के 16 ढेर</strong>: गुप्त साम्राज्य के विभिन्न भौगोलिक भागों से गुप्तकालीन सिक्कों के कुल <strong>16 ढेर (संचय)</strong> प्राप्त हुए हैं। [1]</li>\n<li><strong>बयाना ढेर</strong>: इन सभी 16 ढेरों में सबसे विशाल, महत्वपूर्ण और प्रसिद्ध ढेर राजस्थान के <strong>बयाना (भरतपुर, राजस्थान)</strong> से प्राप्त हुआ है। [1]</li>\n</ul>\n<hr />\n<h2>2. सोने के सिक्के (स्वर्ण मुद्राएँ: दीनार)</h2>\n<ul>\n<li><strong>सर्वाधिक सोने के सिक्के</strong>: गुप्त शासकों ने प्राचीन भारत के इतिहास में <strong>सर्वाधिक सोने के सिक्के</strong> जारी करने का गौरव हासिल किया। [1]</li>\n<li><strong>'दीनार' (Dinara)</strong>: सोने के इन सिक्कों को गुप्तकालीन अभिलेखों में स्पष्ट रूप से <strong>&quot;दीनार&quot;</strong> कहा गया है। [1]</li>\n<li><strong>लैटिन व्युत्पत्ति</strong>: 'दीनार' शब्द की उत्पत्ति मूलतः लैटिन भाषा के <strong>'डेनेरिश' (Denarius)</strong> शब्द से हुई है। [1]</li>\n<li><strong>स्पष्ट राजचित्र</strong>: गुप्तकालीन स्वर्ण मुद्राओं पर तत्कालीन <strong>राजाओं के अत्यंत स्पष्ट और सुंदर चित्र</strong> अंकित किए गए हैं। [1]</li>\n<li><strong>स्वर्ण मुद्राओं के प्रमुख व्यावहारिक उपयोग</strong>:<ol>\n<li><strong>भूमि का क्रय-विक्रय</strong>: इन दीनार (स्वर्ण मुद्राओं) का उपयोग <strong>भूमि की खरीद और बिक्री</strong> में सबसे अधिक किया जाता था। [1]</li>\n<li><strong>अधिकारियों का वेतन</strong>: सेना और राजकीय प्रशासन के <strong>उच्च अधिकारियों को वेतन</strong> (पारिश्रमिक) के रूप में भी ये स्वर्ण मुद्राएँ प्रदान की जाती थीं। [1]</li>\n</ol>\n</li>\n</ul>\n<hr />\n<h2>3. चाँदी एवं ताँबे के सिक्के (Silver &amp; Copper Coins)</h2>\n<ul>\n<li><strong>चाँदी का सिक्का ('रूपक')</strong>: गुप्तकाल में चाँदी के सिक्कों को <strong>&quot;रूपक&quot;</strong> (रुप्यक) कहा जाता था। [1]</li>\n<li><strong>ताँबे का सिक्का ('माषक')</strong>: ताँबे के बने सिक्कों को इस काल में <strong>&quot;माषक&quot;</strong> कहा जाता था। [1]</li>\n<li><strong>ताँबे के सिक्कों का अभाव</strong>:<ul>\n<li><strong>रामगुप्त</strong> को छोड़कर चन्द्रगुप्त द्वितीय (विक्रमादित्य) से पहले के शासकों के ताँबे के सिक्के भारतीय इतिहास में <strong>नहीं के बराबर (नगण्य)</strong> प्राप्त हुए हैं। [1]</li>\n<li>कुषाण शासकों ने जहाँ जनसामान्य के लिए ताँबे के सिक्के अत्यधिक मात्रा में चलाए थे, वहीं गुप्तों के काल के ताँबे के सिक्के बहुत ही कम (न्यूनतम) मिले हैं। [1]</li>\n</ul>\n</li>\n<li><strong>मुद्रा के प्रचलन में कमी</strong>: ताँबे की मुद्राओं की अत्यधिक कमी के कारण कुषाण काल की तुलना में गुप्तकाल में जनसामान्य (आम जनता) के बीच <strong>मुद्रा का दैनिक प्रयोग काफी कम हो गया</strong> था। [1]</li>\n<li><strong>साधारण लोगों के विनिमय के साधन (फाह्यान के अनुसार)</strong>:<ul>\n<li>चीनी बौद्ध यात्री फाह्यान के यात्रा विवरण के अनुसार, गुप्तकाल में साधारण लोग अपनी दैनिक आवश्यकताओं की वस्तुओं की खरीद के लिए मुख्य रूप से <strong>'वस्तु विनिमय' (Barter system)</strong> का सहारा लेते थे। [1]</li>\n<li>इसके अतिरिक्त, वे दैनिक विनिमय के छोटे-मोटे कार्यों के लिए <strong>'कौड़ियों'</strong> से काम चलाते थे। [1]</li>\n</ul>\n</li>\n</ul>\n<h2>4. चन्द्रगुप्त द्वितीय द्वारा रजत मुद्राओं का सर्वप्रथम प्रचलन</h2>\n<ul>\n<li><strong>सर्वप्रथम चाँदी के सिक्के</strong>: सम्पूर्ण गुप्त राजवंश में सर्वप्रथम चाँदी के सिक्कों का प्रचलन करने का श्रेय <strong>चन्द्रगुप्त द्वितीय (विक्रमादित्य)</strong> को जाता है। [1]</li>\n<li><strong>प्रचलन का कारण और क्षेत्र</strong>: चन्द्रगुप्त द्वितीय ने ये चाँदी के सिक्के <strong>पश्चिमी भारत में शकों के विरुद्ध विजय प्राप्त करने के पश्चात्</strong> शकों के सिक्कों के अनुकरण पर शुरू किए थे। [1]</li>\n<li><strong>चाँदी के सिक्कों का उपयोग</strong>: इन चाँदी के सिक्कों का मुख्य उपयोग <strong>स्थानीय स्तर के लेन-देन</strong> (Local trade) में किया जाता था। [1]</li>\n</ul>\n<hr />\n<h2>5. बसाढ़ (वैशाली) से प्राप्त मिट्टी की मुहरें (Clay Seals of Basarh)</h2>\n<ul>\n<li><strong>बसाढ़ का साक्ष्य</strong>: बिहार में स्थित <strong>बसाढ़ (प्राचीन वैशाली)</strong> से गुप्तकालीन मिट्टी की अनेक मुहरें (Seals) प्राप्त हुई हैं। [1]</li>\n<li><strong>व्यापारिक एवं शिल्प संगठनों का अंकन</strong>: इन मिट्टी की मुहरों पर तत्कालीन व्यापारिक निगमों, शिल्प श्रेणियों और उनके महासंघों के नामों का अंकन मिलता है, जो निम्नलिखित हैं:<ol>\n<li><strong>श्रेणी-सार्थवाह-कुलिक निगम</strong> [1]</li>\n<li><strong>श्रेष्ठि-कुलिक-निगम</strong> [1]</li>\n<li><strong>श्रेष्ठि निगम</strong> [1]</li>\n<li><strong>कुलिक निगम</strong> [1]</li>\n<li><strong>प्रथम कुलिक</strong> [1]</li>\n</ol>\n</li>\n<li><strong>शब्दावलियों का विधिक अर्थ</strong>:<ul>\n<li><strong>प्रथम कुलिक</strong>: इस पद का तात्पर्य तत्कालीन <strong>शिल्पियों (कारीगरों) के प्रधान</strong> से था। [1]</li>\n<li><strong>कुलिक निगम</strong>: इस प्रशासनिक/व्यापारिक संस्था का सीधा तात्पर्य <strong>शिल्पियों के संगठित निगम (Guild)</strong> से था। [1]</li>\n</ul>\n</li>\n</ul>\n"}, {"id": "0-16", "title": "गुप्तकालीन व्यापार एवं नगरीकरण", "file": "history-gupta.md", "html": "<h1>गुप्तकालीन व्यापार एवं नगरीकरण</h1>\n<h2>1. व्यापारिक ह्रास एवं संरचनात्मक परिवर्तन (Decline &amp; Shifts in Trade)</h2>\n<ul>\n<li><strong>लंबी दूरी के व्यापार में गिरावट</strong>: कुषाण काल की समृद्ध व्यापारिक स्थिति की तुलना में गुप्त युग में लंबी दूरी के व्यापार में उल्लेखनीय गिरावट (कमी) आई।</li>\n<li><strong>आत्मनिर्भर ग्रामों का उदय</strong>: इस काल में <strong>ग्राम एक स्वायत्त और आत्मनिर्भर इकाई</strong> के रूप में उभरकर सामने आ रहे थे, जिससे आंतरिक व्यापार संकुचित हो गया।</li>\n<li><strong>मुद्रा प्रणाली का पतन</strong>: पूर्व गुप्तकाल (मौर्योत्तर काल) में सिक्कों की जो विपुल बहुलता और प्रचुरता थी, वह गुप्तकाल में नहीं रही। सिक्कों की प्रचुरता में कमी के कारण मुद्रा प्रणाली के पतन की प्रक्रिया आरंभ हो रही थी।</li>\n<li><strong>पाश्चात्य संपर्कों में कमी</strong>: विदेशी व्यापार के क्षेत्र में पाश्चात्य देशों के साथ भारत के व्यापारिक संबंधों की वह प्राचीन स्थिति नहीं रही जो कुषाण और सातवाहन युग में शिखर पर थी।</li>\n</ul>\n<h2>2. वैश्विक कारक एवं विदेशी प्रतिद्वंद्विता (Global Factors)</h2>\n<ul>\n<li><strong>रोमन साम्राज्य का विभाजन (364 ईस्वी)</strong>: <strong>364 ईस्वी</strong> में विशाल रोमन साम्राज्य का विभाजन हो गया, जिसके प्रत्यक्ष परिणाम के रूप में पाश्चात्य देशों के साथ हो रहे भारतीय व्यापार में भारी गिरावट आई।</li>\n<li><strong>फारसी एकाधिकार</s
