तियाँ:<ul>\n<li><em>आयुर्वेद दीपिका</em> (चरक संहिता पर टीका)</li>\n<li><em>भानुमति</em> (सुश्रुत संहिता पर टीका)</li>\n<li><em>चिकित्सा संग्रह</em> (चक्रदत्त): इसमें रोगों के लक्षण और भस्म तैयार करने की नवीन विधियों का वर्णन है।</li>\n</ul>\n</li>\n</ul>\n<h4><strong>कला और स्थापत्य</strong></h4>\n<ul>\n<li><strong>चित्रकला:</strong> 9वीं सदी के <strong>धीमान</strong> एवं <strong>वीतपाल</strong> पाल शैली के प्रसिद्ध चित्रकार थे। पाल चित्रकला को <strong>'मगध शैली'</strong> भी कहा जाता है।</li>\n</ul>\n<h3>5. प्रशासन और विदेशी विवरण</h3>\n<ul>\n<li><strong>प्रशासनिक इकाई:</strong> प्रशासन में 'विषय' (ज़िला) से नीचे की इकाई को <strong>'पटल'</strong> कहा जाता था।</li>\n<li><strong>अरब यात्री सुलेमान (851 ई.):</strong> सुलेमान के अनुसार, पालों की सेना राष्ट्रकूटों और प्रतिहारों से अधिक शक्तिशाली थी। उसने पाल साम्राज्य को <strong>'रूह्मा'</strong> (धर्म/धर्मा) कहकर संबोधित किया है।</li>\n<li><strong>विदेशी संबंध:</strong> पालों के दक्षिण-पूर्व एशिया के साथ घनिष्ठ व्यापारिक और सांस्कृतिक संबंध थे।</li>\n</ul>\n<h3>6. महत्वपूर्ण ऐतिहासिक स्रोत (एक दृष्टि में)</h3>\n<ul>\n<li><strong>खलीमपुर लेख:</strong> गोपाल के चयन और मत्स्य न्याय का उल्लेख।</li>\n<li><strong>बादल अभिलेख:</strong> देवपाल की विजयों का वर्णन।</li>\n<li><strong>मुंगेर अभिलेख:</strong> देवपाल से संबंधित।</li>\n<li><strong>नालंदा ताम्रपत्र:</strong> सुमात्रा के राजा बालपुत्रदेव और देवपाल के संबंधों का विवरण।</li>\n<li><strong>रामपालचरित:</strong> संध्याकर नंदी द्वारा रचित, रामपाल के जीवन और कैवर्त विद्रोह पर आधारित।</li>\n</ul>\n<hr />\n"}, {"id": "1-3", "title": "गुर्जर-प्रतिहार राजवंश", "file": "history-medieval.md", "html": "<h1>गुर्जर-प्रतिहार राजवंश</h1>\n<h3>1. राजवंश की उत्पत्ति और प्रारंभिक परिचय</h3>\n<ul>\n<li><strong>अग्निकुण्ड सिद्धांत:</strong> गुर्जर-प्रतिहार राजवंश, अग्निकुण्ड से उत्पन्न चार राजपूत वंशों (<strong>प्रतिहार, चालुक्य, चौहान और परमार</strong>) में से सर्वाधिक प्रसिद्ध और शक्तिशाली वंश था।</li>\n<li><strong>गुर्जर जाति का उल्लेख:</strong><ul>\n<li><strong>ऐहोल अभिलेख:</strong> चालुक्य शासक <strong>पुलेकेशिन द्वितीय</strong> के ऐहोल अभिलेख में 'गुर्जर' जाति का सर्वप्रथम उल्लेख मिलता है।</li>\n<li><strong>हर्षचरित:</strong> बाणभट्ट द्वारा रचित 'हर्षचरित' में भी गुर्जर जाति का उल्लेख किया गया है।</li>\n</ul>\n</li>\n<li><strong>जाति और वंश:</strong> <strong>कक्कुका के घटियाला अभिलेख</strong> में प्रतिहारों को <strong>ब्राह्मण</strong> बताया गया है। ग्वालियर प्रशस्ति में इन्हें <strong>लक्ष्मण (सौमित्र)</strong> का वंशज माना गया है, जिसके कारण इन्हें 'प्रतिहार' (द्वारपाल) कहा गया।</li>\n<li><strong>शाखाएं और केंद्र:</strong> प्रतिहारों की कुल <strong>26 शाखाएं</strong> थीं, जिनमें <strong>मण्डोर</strong> के प्रतिहार सबसे प्राचीन थे। उनके सत्ता के केंद्रों का क्रम इस प्रकार रहा:<ol>\n<li>मण्डोर (जोधपुर) - प्रथम केंद्र</li>\n<li>भीनमाल (जालौर)</li>\n<li>उज्जैन</li>\n<li>कन्नौज</li>\n</ol>\n</li>\n</ul>\n<h3>2. आदिपुरुष: हरिश्चंद्र (रोहिल्लद्धि)</h3>\n<ul>\n<li><strong>हरिश्चंद्र</strong> नामक ब्राह्मण को गुर्जर-प्रतिहार वंश का <strong>आदिपुरुष</strong> या संस्थापक माना जाता है।</li>\n<li>इन्हें <strong>'रोहिल्लद्धि'</strong> के नाम से भी जाना जाता था।</li>\n</ul>\n<h3>3. प्रमुख शासक और उनकी उपलब्धियां</h3>\n<h4><strong>नागभट्ट प्रथम (730 - 756 ईस्वी)</strong></h4>\n<p>नागभट्ट प्रथम इस वंश का प्रथम महत्वपूर्ण शासक था। वह प्रतिहारों की <strong>भीनमाल और उज्जैन शाखा</strong> का संस्थापक था।</p>\n<ul>\n<li><strong>राजधानी परिवर्तन:</strong> उसने अपनी राजधानी मण्डोर से <strong>मेड़ता</strong> स्थानांतरित की। उसने मण्डोर को दूसरी और भीनमाल को तीसरी राजधानी बनाया। अंततः <strong>उज्जैन</strong> प्रतिहारों का मुख्य केंद्र बना।</li>\n<li><strong>अरब आक्रमण का प्रतिरोध:</strong> नागभट्ट प्रथम ने <strong>जुनैद</strong> के नेतृत्व में होने वाले अरब आक्रमणों को विफल किया और उन्हें पराजित किया।</li>\n<li><strong>उपाधियाँ और सम्मान:</strong><ul>\n<li><strong>ग्वालियर प्रशस्ति</strong> (मिहिरभोज द्वारा निर्मित) में इसे <strong>&quot;म्लेच्छों (अरबों) का नाशक&quot;</strong> और <strong>&quot;नारायण का अवतार&quot;</strong> कहा गया है।</li>\n<li><strong>संजन ताम्रपत्र</strong> (राष्ट्रकूट नरेश अमोघवर्ष) के अनुसार, राष्ट्रकूट शासक <strong>दन्तिदुर्ग</strong> ने उज्जैन में 'हिरण्य गर्भदान यज्ञ' किया था, जिसमें नागभट्ट प्रथम ने <strong>'प्रतिहार' (द्वारपाल)</strong> की भूमिका निभाई थी।</li>\n</ul>\n</li>\n</ul>\n<h4><strong>वत्सराज (783 - 795 ईस्वी)</strong></h4>\n<p>वत्सराज को प्रतिहार साम्राज्य का <strong>वास्तविक संस्थापक</strong> माना जाता है।</p>\n<ul>\n<li><strong>त्रिपक्षीय संघर्ष:</strong> कन्नौज पर अधिकार के लिए प्रसिद्ध 'त्रिपक्षीय संघर्ष' वत्सराज के समय ही प्रारंभ हुआ था।</li>\n<li><strong>सैन्य अभियान:</strong><ul>\n<li>उसने पाल शासक <strong>धर्मपाल</strong> को <strong>मुंगेर (मुद्गगिरि)</strong> के युद्ध में पराजित किया।</li>\n<li>हालांकि, उसे राष्ट्रकूट शासक <strong>ध्रुव</strong> से पराजित होना पड़ा।</li>\n</ul>\n</li>\n<li><strong>साक्ष्य:</strong> <strong>वाणिडिंडोरी</strong> तथा <strong>राधनपुर</strong> लेखों से ज्ञात होता है कि ध्रुव ने वत्सराज को पराजित कर राजपूताना में शरण लेने को विवश किया और उससे वे दो राजछत्र छीन लिए जो उसने गौड़राज (पाल वंश) से जीते थे।</li>\n</ul>\n<h4><strong>नागभट्ट द्वितीय (795 - 833 ईस्वी)</strong></h4>\n<p>वत्सराज के पुत्र नागभट्ट द्वितीय ने प्रतिहार सत्ता को पुनः सुदृढ़ किया।</p>\n<ul>\n<li><strong>कन्नौज पर अधिकार:</strong> उसने कन्नौज पर पूर्ण अधिकार कर उसे प्रतिहार साम्राज्य की <strong>राजधानी</strong> बनाया।</li>\n<li><strong>संघर्ष:</strong> वह राष्ट्रकूट शासक <strong>गोविन्द तृतीय</strong> से पराजित हुआ, लेकिन ग्वालियर प्रशस्ति के अनुसार उसने <strong>तुरुष्कों (मुसलमानों)</strong> को पराजित किया था।</li>\n<li><strong>उपाधियाँ:</strong> <strong>बकुला (बुचंकला) अभिलेख</strong> में उसे <strong>'परमभट्टारक महाराजाधिराज परमेश्वर'</strong> की उपाधि दी गई है।</li>\n<li><strong>महत्वपूर्ण तथ्य:</strong><ul>\n<li>चंद्रप्रभसूरी की <strong>'प्रभावक प्रशस्ति'</strong> के अनुसार, नागभट्ट द्वितीय ने 833 ईस्वी में <strong>गंगा में जल समाधि</strong> ली थी।</li>\n<li>ग्वालियर लेख के अनुसार, <strong>'अल्ल'</strong> नामक व्यक्ति ने इसके काल में एक विष्णु मंदिर का निर्माण करवाया था।</li>\n</ul>\n</li>\n</ul>\n<h4><strong>मिहिरभोज प्रथम (836 - 885 ईस्वी)</strong></h4>\n<p>रामभद्र के निर्बल शासन के बाद उसका पुत्र मिहिरभोज प्रथम शासक बना, जो इस वंश का <strong>सर्वाधिक प्रतापी और महत्वपूर्ण</strong> राजा था।</p>\n<ul>\n<li><strong>ऐतिहासिक स्रोत:</strong> इसके काल की जानकारी <strong>कल्हण</strong> की राजतरंगिणी और अरब यात्री <strong>सुलेमान</strong> के विवरणों से मिलती है।</li>\n<li><strong>सुलेमान का विवरण:</strong> सुलेमान ने मिहिरभोज के बारे में निम्नलिखित बातें कहीं:<ul>\n<li>मिहिरभोज के पास एक <strong>विशाल अश्वसेना</strong> है।</li>\n<li>वह <strong>'इस्लाम का सबसे बड़ा शत्रु'</strong> है।</li>\n<li>उसका साम्राज्य समृद्ध है और वहां सोने-चांदी की अनेक खानें हैं।</li>\n<li>राज्य चोरी और डकैती से पूरी तरह मुक्त है।</li>\n</ul>\n</li>\n<li><strong>शून्य का प्रमाण:</strong> शून्य (Zero) का प्रथम अभिलेखीय प्रमाण मिहिरभोज के <strong>ग्वालियर अभिलेख</strong> से प्राप्त होता है।</li>\n<li><strong>सैन्य विजय और संघर्ष:</strong><ul>\n<li>प्रारंभ में वह पाल नरेश <strong>देवपाल</strong> और राष्ट्रकूट शासक <strong>ध्रुव</strong> (अमोघवर्ष के सामंत) से पराजित हुआ।</li>\n<li>देवपाल की मृत्यु के बाद उसने उसके उत्तराधिकारियों <strong>विग्रहपाल</strong> और <strong>नारायणपाल</strong> को पराजित किया।</li>\n<li>उसने राष्ट्रकूट शासक <strong>कृष्ण द्वितीय</strong> को <strong>नर्मदा नदी के तट</strong> पर पराजित किया।</li>\n</ul>\n</li>\n<li><strong>धर्म और उपाधियाँ:</strong> मिहिरभोज <strong>वैष्णव धर्म</strong> का अनुयायी था।<ul>\n<li><strong>आदिवराह:</strong> ग्वालियर अभिलेख में उल्लिखित।</li>\n<li><strong>प्रभास:</strong> दौलतपुर अभिलेख में उल्लिखित।</li>\n</ul>\n</li>\n<li><strong>मुद्रा:</strong> उसने <strong>'आदिवराह द्रम्म'</strong> नामक सिक्के चलाए, जिसके एक तरफ <strong>वराह</strong> की आकृति अंकित थी।</li>\n</ul>\n<h3>4. महत्वपूर्ण अभिलेख और साक्ष्य (एक नज़र में)</h3>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>अभिलेख / स्रोत</td>\n  <td>संबंधित शासक / तथ्य</td>\n  <td>मुख्य जानकारी</td>\n</tr>\n<tr>\n  <td><strong>ऐहोल अभिलेख</strong></td>\n  <td>पुलेकेशिन द्वितीय</td>\n  <td>'गुर्जर' जाति का सर्वप्रथम उल्लेख।</td>\n</tr>\n<tr>\n  <td><strong>घटियाला अभिलेख</strong></td>\n  <td>कक्कुका</td>\n  <td>प्रतिहारों को 'ब्राह्मण' बताया गया है।</td>\n</tr>\n<tr>\n  <td><strong>ग्वालियर प्रशस्ति</strong></td>\n  <td>मिहिरभोज प्रथम</td>\n  <td>नागभट्ट I को 'म्लेच्छों का नाशक', शून्य का उल्लेख, 'आदिवराह' उपाधि।</td>\n</tr>\n<tr>\n  <td><strong>संजन ताम्रपत्र</strong></td>\n  <td>अमोघवर्ष (राष्ट्रकूट)</td>\n  <td>नागभट्ट प्रथम का दन्तिदुर्ग के यज्ञ में 'प्रतिहार' बनना।</td>\n</tr>\n<tr>\n  <td><strong>बकुला (बुचंकला) लेख</strong></td>\n  <td>नागभट्ट द्वितीय</td>\n  <td>'परमभट्टारक महाराजाधिराज परमेश्वर' की उपाधि।</td>\n</tr>\n<tr>\n  <td><strong>दौलतपुर अभिलेख</strong></td>\n  <td>मिहिरभोज प्रथम</td>\n  <td>'प्रभास' उपाधि का उल्लेख।</td>\n</tr>\n<tr>\n  <td><strong>वाणिडिंडोरी/राधनपुर</strong></td>\n  <td>ध्रुव (राष्ट्रकूट)</td>\n  <td>वत्सराज की पराजय और राजपूताना में शरण का उल्लेख।</td>\n</tr>\n</tbody>\n</table>\n<h3>5. राजधानियों का क्रम</h3>\n<ol>\n<li><strong>मण्डोर:</strong> आदि केंद्र।</li>\n<li><strong>मेड़ता:</strong> नागभट्ट प्रथम द्वारा स्थानांतरित।</li>\n<li><strong>भीनमाल:</strong> नागभट्ट प्रथम के काल में तीसरी राजधानी।</li>\n<li><strong>उज्जैन:</strong> नागभट्ट प्रथम द्वारा केंद्र के रूप में स्थापित।</li>\n<li><strong>कन्नौज:</strong> नागभट्ट द्वितीय द्वारा साम्राज्य की स्थाई राजधानी घोषित।</li>\n</ol>\n<hr />\n<h2>गुर्जर-प्रतिहार राजवंश: उत्तरकालीन शासक, कला, प्रशासन एवं पतन</h2>\n<h3>1. महेंद्रपाल प्रथम का युग (885-910 ई.)</h3>\n<p><strong>मिहिरभोज</strong> के उपरांत उनके पुत्र <strong>महेंद्रपाल प्रथम</strong> का शासनकाल गुर्जर-प्रतिहार साम्राज्य के भू-राजनीतिक संतुलन और <strong>सांस्कृतिक वर्चस्व</strong> का चरमोत्कर्ष माना जाता है। जहाँ <strong>मिहिरभोज</strong> ने सैन्य विजयों के माध्यम से साम्राज्य की सीमाओं का <strong>साम्राज्यवादी विस्तारवाद</strong> किया, वहीं <strong>महेंद्रपाल प्रथम</strong> ने उन सीमाओं की अक्षुण्णता को बनाए रखते हुए साम्राज्य को एक <strong>सांस्कृतिक संप्रभुता</strong> प्रदान की। यह काल केवल राजनीतिक स्थिरता का ही नहीं, बल्कि उत्तर भारत में प्रतिहारों की 'शाही पहचान' को सुदृढ़ करने का युग था।</p>\n<p><strong>महेंद्रपाल प्रथम</strong> (<strong>885-910 ई.</strong>) न केवल एक कुशल प्रशासक थे, बल्कि कला और साहित्य के महान संरक्षक भी थे। उनके दरबार की सबसे बड़ी विभूति प्रसिद्ध विद्वान और उनके <strong>राजगुरु</strong> <strong>राजशेखर</strong> थे। <strong>महेंद्रपाल</strong> के संरक्षण में प्रतिहार दरबार बौद्धिक विमर्श का केंद्र बन गया, जिसने राजनीतिक स्थिरता को साहित्यिक सृजन के स्वर्णिम युग में परिवर्तित कर दिया।</p>\n<h3>2. राजशेखर: साहित्य, उपाधियाँ और सांस्कृतिक योगदान</h3>\n<p><strong>राजशेखर</strong> केवल एक दरबारी कवि मात्र नहीं थे, बल्कि वे प्रतिहारों के 'सांस्कृतिक इतिहासकार' थे, जिनकी रचनाएँ प्रतिहार अस्मिता को परिभाषित करती हैं। एक उच्च-कोटि के शिक्षाविद के रूप में उनका कार्य तत्कालीन सामाजिक-भौगोलिक संरचना और प्रतिहारों के राजनीतिक दावों को वैधानिकता प्रदान करने का एक महत्वपूर्ण उपकरण है।</p>\n<p><strong>राजशेखर की कालजयी रचनाएँ</strong></p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>रचना का नाम</td>\n  <td>विधा/प्रकार</td>\n  <td>विशेष विवरण/तथ्य</td>\n</tr>\n<tr>\n  <td><strong>कर्पूरमंजरी</strong></td>\n  <td><strong>नाटक</strong></td>\n  <td>यह एकमात्र कृति है जो <strong>प्राकृत</strong> भाषा में रचित है। इसका लेखन राजशेखर ने अपनी पत्नी <strong>अवंतिसुंदरी</strong> के विशेष आग्रह पर किया था।</td>\n</tr>\n<tr>\n  <td><strong>बालरामायण</strong></td>\n  <td><strong>नाटक</strong></td>\n  <td><strong>संस्कृत</strong> भाषा में रचित एक महानाट्य।</td>\n</tr>\n<tr>\n  <td><strong>बालभारत</strong></td>\n  <td><strong>नाटक</strong></td>\n  <td>इसे <strong>प्रचंड पांडव</strong> के नाम से भी जाना जाता है; यह भी <strong>संस्कृत</strong> में है।</td>\n</tr>\n<tr>\n  <td><strong>विद्धशालभंजिका</strong></td>\n  <td><strong>नाटक</strong></td>\n  <td>राजशेखर द्वारा रचित एक महत्वपूर्ण <strong>संस्कृत</strong> नाट्य कृति।</td>\n</tr>\n<tr>\n  <td><strong>काव्यमीमांसा</strong></td>\n  <td><strong>काव्य शास्त्र</strong></td>\n  <td><strong>संस्कृत</strong> साहित्य का एक आधारभूत ग्रंथ, जिसमें काव्य सिद्धांतों का विवेचन है।</td>\n</tr>\n<tr>\n  <td><strong>हरविलास</strong></td>\n  <td><strong>काव्य ग्रंथ</strong></td>\n  <td><strong>संस्कृत</strong> भाषा में रचित काव्य।</td>\n</tr>\n<tr>\n  <td><strong>भुवनकोश</strong></td>\n  <td><strong>काव्य ग्रंथ</strong> (<strong>भूगोल</strong>)</td>\n  <td>यह <strong>काव्यमीमांसा</strong> का <strong>19वाँ अध्याय</strong> है। वर्तमान में यह ग्रंथ <strong>अप्राप्य</strong> (Non-extant) है और इसका मुख्य विषय <strong>भूगोल</strong> है।</td>\n</tr>\n</tbody>\n</table>\n<p><strong>व्यक्तिगत जीवन और उपाधियाँ:</strong> <strong>राजशेखर</strong> स्वयं एक <strong>ब्राह्मण</strong> विद्वान थे, जिन्होंने एक <strong>क्षत्रिय</strong> कुल की कन्या <strong>अवंतिसुंदरी</strong> से विवाह कर तत्कालीन सामाजिक समन्वय का उदाहरण प्रस्तुत किया। उन्होंने अपने आश्रयदाता शासकों को निम्नलिखित गौरवशाली उपाधियाँ प्रदान कीं:</p>\n<ul>\n<li><strong>महेंद्रपाल प्रथम</strong> के लिए: <strong>निर्भयराज</strong>, <strong>रघुकुल तिलक</strong>, और <strong>रघुकुल चूड़ामणि</strong>।</li>\n<li><strong>महिपाल प्रथम</strong> के लिए: <strong>रघुवंश मुकुट मणि</strong> और <strong>रघुकुल मुक्ता मणि</strong>।</li>\n</ul>\n<p>सांस्कृतिक भूगोल की व्याख्या करते हुए राजशेखर ने <strong>नर्मदा नदी</strong> को <strong>आर्यावर्त</strong> और <strong>दक्षिणापथ</strong> के मध्य की विभाजक रेखा के रूप में स्वीकार किया है। साहित्यिक भव्यता और घरेलू स्थिरता के इस युग ने <strong>महिपाल प्रथम</strong> के शासनकाल की पृष्ठभूमि तैयार की, जिसकी शक्ति का लोहा विदेशी पर्यवेक्षकों ने भी माना।</p>\n<h3>3. महिपाल प्रथम (912-944 ई.) और विदेशी विवरण</h3>\n<p><strong>महिपाल प्रथम</strong> का शासनकाल प्रतिहार सत्ता के अंतर्राष्ट्रीय प्रभाव और उसके सैन्य सामर्थ्य के &quot;बाह्य प्रमाणीकरण&quot; (External Validation) का काल है। अरब यात्रियों के वृत्तांत न केवल प्रतिहारों की सैन्य शक्ति की पुष्टि करते हैं, बल्कि वे आंतरिक अभिलेखीय दावों के लिए एक प्राथमिक 'क्रॉस-रेफरेंस' का कार्य भी करते हैं।</p>\n<p><strong>महिपाल प्रथम</strong> (<strong>912-944 ई.</strong>) के काल में भी <strong>राजशेखर</strong> उनके <strong>राजगुरु</strong> के पद पर आसीन रहे। साम्राज्य की क्रमिक गिरावट के संकेतों के बीच शासक की सत्ता को वैधानिकता देने के उद्देश्य से राजशेखर ने उन्हें &quot;<strong>आर्यावर्त का महाराजाधिराज</strong>&quot; और &quot;<strong>रघुकुल मुक्तामणि</strong>&quot; जैसी उपाधियों से अलंकृत किया।</p>\n<p><strong>अल-मसूदी का वृत्तांत:</strong> बगदाद निवासी प्रसिद्ध अरब यात्री <strong>अल-मसूदी</strong> इसी समय भारत आया था।</p>\n<ul>\n<li><strong>ग्रंथ:</strong> उसकी पुस्तक का नाम <strong>'मुरुज-उल-जहब'</strong> (<strong>Muruj-ul-Zahab</strong>) है।</li>\n<li><strong>शब्दावली:</strong> उसने <strong>महिपाल प्रथम</strong> को अपने वृत्तांत में '<strong>बऊरा</strong>' या '<strong>बौरा</strong>' संबोधित किया है।</li>\n</ul>\n<p><strong>अल-मसूदी</strong> के प्रेक्षणों से स्पष्ट होता है कि प्रतिहार राज्य की सीमाएँ और उनका प्रभाव अत्यंत व्यापक था। हालाँकि, इस वैभव के साथ ही साम्राज्य के <strong>प्रशासनिक विकेंद्रीकरण</strong> और पतन की प्रक्रिया भी गुप्त रूप से आरंभ हो गई थी।</p>\n<h3>4. साम्राज्य का विघटन और उत्तराधिकारी (944-1036 ई.)</h3>\n<p>महिपाल प्रथम के पश्चात, आंतरिक उत्तराधिकार के संघर्ष और बाह्य दबावों, विशेषकर दक्षिण के राष्ट्रकूटों के आक्रमणों ने साम्राज्य की नींव हिला दी। <strong>963 ई.</strong> में राष्ट्रकूट शासक <strong>कृष्ण तृतीय</strong> ने प्रतिहार शासकों को निर्णायक रूप से पराजित किया, जिससे साम्राज्य का पतन अवश्यंभावी हो गया।</p>\n<p><strong>महिपाल प्रथम के उत्तराधिकारियों का कालक्रम:</strong></p>\n<ol>\n<li><strong>महेंद्रपाल द्वितीय</strong></li>\n<li><strong>देवपाल</strong></li>\n<li><strong>विनायकपाल</strong></li>\n<li><strong>महिपाल द्वितीय</strong></li>\n<li><strong>विजयपाल</strong></li>\n<li><strong>राज्यपाल</strong></li>\n</ol>\n<p><strong>राजधानी का स्थानांतरण और अंत:</strong></p>\n<ul>\n<li><strong>1018 ई.</strong> में <strong>महमूद गजनवी</strong> ने निर्बल प्रतिहार शासक <strong>राज्यपाल</strong> को पराजित किया।</li>\n<li>सैन्य विवशता के कारण <strong>राज्यपाल</strong> ने अपनी राजधानी <strong>कन्नौज</strong> को त्याग दिया और <strong>बारी</strong> को नया केंद्र बनाया।</li>\n<li><strong>1019 ई.</strong> में गजनवी ने राज्यपाल के पुत्र <strong>त्रिलोचनपाल</strong> को भी परास्त किया।</li>\n<li>इस महान राजवंश का <strong>अंतिम शासक</strong> <strong>यशपाल</strong> (<strong>1036 ई.</strong>) था, जिसके साथ प्रतिहारों का राजनीतिक अस्तित्व समाप्त हो गया।</li>\n</ul>\n<h3>5. सामंतों का उदय और अरब शब्दावली</h3>\n<p>केंद्रीय सत्ता के क्षीण होने के परिणामस्वरूप, प्रतिहारों के प्रति निष्ठावान सामंतों ने अपनी संप्रभुता घोषित कर दी, जिससे उत्तर भारत के राजनीतिक मानचित्र पर नए क्षेत्रीय राज्यों का प्रादुर्भाव हुआ।</p>\n<p><strong>स्वतंत्र हुए प्रमुख सामंत और उनके क्षेत्र</strong></p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>सामंत/राजवंश</td>\n  <td>क्षेत्र/विवरण</td>\n</tr>\n<tr>\n  <td><strong>गुजरात के चालुक्य</strong></td>\n  <td><strong>गुजरात</strong> क्षेत्र में स्वतंत्र सत्ता।</td>\n</tr>\n<tr>\n  <td><strong>जेजाकभुक्ति के चंदेल</strong></td>\n  <td>बुंदेलखंड (<strong>जेजाकभुक्ति</strong>) क्षेत्र।</td>\n</tr>\n<tr>\n  <td><strong>ग्वालियर के कच्छपघात</strong></td>\n  <td><strong>ग्वालियर</strong> और निकटवर्ती क्षेत्र।</td>\n</tr>\n<tr>\n  <td><strong>डाहल के कलचुरी</strong></td>\n  <td><strong>डाहल</strong> मंडल।</td>\n</tr>\n<tr>\n  <td><strong>मालवा के परमार</strong></td>\n  <td><strong>मालवा</strong> क्षेत्र में प्रभुत्व।</td>\n</tr>\n<tr>\n  <td><strong>शाकंभरी के चौहान</strong></td>\n  <td><strong>शाकंभरी</strong> (सांभर) क्षेत्र।</td>\n</tr>\n<tr>\n  <td><strong>गहड़वाल</strong></td>\n  <td>प्रतिहारों के पतन के बाद रिक्त हुए <strong>कन्नौज क्षेत्र</strong> में उदय।</td>\n</tr>\n</tbody>\n</table>\n<p><strong>अरब यात्रियों की शब्दावली:</strong> अरब यात्रियों (जैसे <strong>अल-मसूदी</strong>, <strong>सुलेमान</strong>, और <strong>अबूजैद</strong>) ने गुर्जर-प्रतिहारों के लिए समग्र रूप से '<strong>जुज्र</strong>' शब्द का प्रयोग किया है। <strong>अल-मसूदी</strong> ने विशेष रूप से प्रतिहार राज्यों के लिए '<strong>अल-जुज्र</strong>' शब्द प्रयुक्त किया है। <strong>सुलेमान</strong> ने अपनी पुस्तक <strong>'सिलसिलात-उत-तवारीख'</strong> में प्रतिहार साम्राज्य की समृद्धि और उनकी सैन्य श्रेष्ठता का विवरण दिया है।</p>\n<h3>6. प्रशासन, अभिलेख और सैन्य शक्ति</h3>\n<p>गुर्जर-प्रतिहारों ने एक अत्यंत परिष्कृत <strong>नौकरशाही</strong> और अद्वितीय सैन्य संगठन के माध्यम से उत्तर भारत को स्थायित्व प्रदान किया। उनके शिलालेख तत्कालीन प्रशासनिक और आर्थिक प्रगति के जीवंत साक्ष्य हैं।</p>\n<p><strong>महत्वपूर्ण अभिलेखीय साक्ष्य:</strong></p>\n<ul>\n<li><strong>पेहोवा अभिलेख</strong> (<strong>पंजाब</strong>): यह अभिलेख व्यापारिक इतिहास की दृष्टि से महत्वपूर्ण है, क्योंकि यह घोड़ों के क्रय-विक्रय हेतु लगने वाले एक विशाल <strong>बाजार</strong> का उल्लेख करता है।</li>\n<li><strong>सास-बहू अभिलेख</strong>: यह <strong>955 ई.</strong> का है और <strong>महिपाल द्वितीय</strong> के शासनकाल की जानकारी देता है।</li>\n</ul>\n<p><strong>प्रशासनिक शब्दावली:</strong></p>\n<ul>\n<li><strong>राजपुरुष</strong>: प्रतिहार <strong>अभिलेखों</strong> में राजकीय अधिकारियों और कर्मचारियों के लिए सामान्य रूप से '<strong>राजपुरुष</strong>' शब्द का प्रयोग मिलता है।</li>\n<li><strong>दंडपाशिक</strong>: <strong>893 ई.</strong> के एक प्रतिहार अभिलेख में इस पद का उल्लेख है, जिसे <strong>पुलिस अधिकारी</strong> के रूप में पहचाना गया है; यह गुप्तोत्तर काल से चली आ रही प्रशासनिक निरंतरता को दर्शाता है।</li>\n</ul>\n<p><strong>सैन्य विशेषज्ञता:</strong> गुर्जर-प्रतिहारों की अपराजेयता का मुख्य स्तंभ उनकी <strong>अश्वसेना</strong> (<strong>Cavalry</strong>) थी। साक्ष्यों के अनुसार, प्रतिहारों की अश्वसेना <strong>तत्कालीन भारत में सर्वश्रेष्ठ</strong> मानी जाती थी।</p>\n<p>निष्कर्षतः, गुर्जर-प्रतिहार राजवंश ने न केवल मध्यकालीन कला और साहित्य को पुष्पित किया, बल्कि अपनी सुदृढ़ प्रशासनिक व्यवस्था और अजेय अश्वसेना के माध्यम से सदियों तक उत्तर भारत के 'शाही रक्षक' की भूमिका का निर्वहन किया।</p>\n<hr />\n"}, {"id": "1-4", "title": "चौहान राजवंश: शाकंभरी से अजमेर तक", "file": "history-medieval.md", "html": "<h1>चौहान राजवंश: शाकंभरी से अजमेर तक</h1>\n<h2>1. चौहान वंश की उत्पत्ति और प्रारंभिक भौगोलिक विस्तार</h2>\n<p>चौहान राजवंश का इतिहास भारतीय मध्यकालीन इतिहास के सबसे गौरवशाली अध्यायों में से एक है। इनके उदय और प्रारंभिक स्थिति से संबंधित महत्वपूर्ण तथ्य निम्नलिखित हैं:</p>\n<ul>\n<li><strong>उदय स्थल:</strong> चौहानों का उदय <strong>जांगल देश</strong> में हुआ था।</li>\n<li><strong>सपादलक्ष:</strong> इस क्षेत्र को बाद में <strong>सपादलक्ष</strong> कहा गया, जिसका शाब्दिक अर्थ <strong>'सवा लाख गाँव'</strong> है।</li>\n<li><strong>राजधानी:</strong> इनकी प्रारंभिक राजधानी <strong>अहिच्छत्रपुर</strong> थी।</li>\n<li><strong>स्थापना:</strong> चौहान राज्य की स्थापना <strong>वासुदेव</strong> द्वारा <strong>551 ई.</strong> में <strong>शाकंभरी</strong> में की गई थी।</li>\n</ul>\n<h3>उत्पत्ति के प्रमुख सिद्धांत और साक्ष्य</h3>\n<ul>\n<li><strong>सूर्यवंशी सिद्धांत:</strong> ऐतिहासिक साक्ष्यों के अनुसार चौहानों को <strong>सूर्यवंशी</strong> माना गया है।</li>\n<li><strong>अग्निकुंड सिद्धांत:</strong> प्रसिद्ध विद्वान <strong>चंद्रबरदाई</strong> के अनुसार, चौहानों की उत्पत्ति <strong>अग्निकुंड</strong> से हुई थी।</li>\n<li><strong>ब्राह्मण उत्पत्ति सिद्धांत:</strong> <strong>डॉ. दशरथ शर्मा</strong> चौहानों की उत्पत्ति <strong>ब्राह्मणों</strong> से मानते हैं।</li>\n<li><strong>बिजोलिया शिलालेख (1170 ई.):</strong> इस लेख में वासुदेव के उत्तराधिकारी <strong>सामंतराज</strong> को <strong>वत्सगोत्रीय ब्राह्मण</strong> कहा गया है। साथ ही, इसी लेख में <strong>वासुदेव</strong> को <strong>सांभर झील</strong> का निर्माता बताया गया है।</li>\n<li><strong>वंशानुक्रम साक्ष्य:</strong> <strong>सोमेश्वर</strong> के बिजोलिया शिलालेख (प्रशस्तिकार: <strong>गुणभद्र</strong>) में चौहानों की पूरी वंशावली मिलती है। इसके अतिरिक्त, सीकर (राजस्थान) में स्थित <strong>973 ई.</strong> के <strong>हर्ष अभिलेख</strong> (विग्रहराज द्वितीय के काल का) से भी प्रारंभिक वंशावली की जानकारी प्राप्त होती है।</li>\n</ul>\n<h2>2. प्रारंभिक चौहान शासक और उनकी उपलब्धियां</h2>\n<p>चौहान शासकों ने अपनी शक्ति का विस्तार करने के साथ-साथ कला और धर्म को भी संरक्षण दिया।</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>शासक</td>\n  <td>महत्वपूर्ण कार्य और उपलब्धियां</td>\n  <td>उपाधियाँ / विशेष तथ्य</td>\n</tr>\n<tr>\n  <td><strong>गुवक प्रथम</strong></td>\n  <td>सीकर में <strong>हर्षनाथ मंदिर</strong> का निर्माण करवाया।</td>\n  <td>प्रारंभिक शासक</td>\n</tr>\n<tr>\n  <td><strong>चंदनराज</strong></td>\n  <td>इनकी रानी <strong>रुद्राणी (आत्मप्रभा)</strong> महान शिव भक्त थीं और <strong>योगिनी</strong> के रूप में प्रसिद्ध थीं।</td>\n  <td>रानी ने पुष्कर झील के किनारे <strong>1000 दीपक</strong> एवं शिवलिंग स्थापित किए।</td>\n</tr>\n<tr>\n  <td><strong>वाक्पतिराज प्रथम</strong></td>\n  <td>चौहानों में शक्ति विस्तार की शुरुआत की।</td>\n  <td>सर्वप्रथम <strong>महाराज</strong> की उपाधि धारण की।</td>\n</tr>\n<tr>\n  <td><strong>सिंहराज (सिद्धराज)</strong></td>\n  <td>10वीं शताब्दी में साम्राज्य विस्तार किया और चौहानों को <strong>कन्नौज के प्रतिहारों</strong> की अधीनता से मुक्त किया।</td>\n  <td>सर्वप्रथम <strong>महाराजाधिराज</strong> की उपाधि धारण की।</td>\n</tr>\n<tr>\n  <td><strong>विग्रहराज द्वितीय</strong></td>\n  <td><strong>भृगुंकच्छ (भड़ौच)</strong> में <strong>आशापुरी देवी</strong> के मंदिर का निर्माण करवाया।</td>\n  <td>साम्राज्य का दक्षिण में विस्तार।</td>\n</tr>\n<tr>\n  <td><strong>विग्रहराज तृतीय</strong></td>\n  <td>विग्रहराज द्वितीय के उत्तराधिकारी के रूप में शासन किया।</td>\n  <td>वंशावली के क्रम में महत्वपूर्ण।</td>\n</tr>\n<tr>\n  <td><strong>पृथ्वीराज प्रथम</strong></td>\n  <td>सोमनाथ मंदिर के मार्ग पर <strong>अन्नसत्र (Alms House)</strong> स्थापित किया और <strong>रणथंभौर के जैन मंदिर</strong> पर <strong>स्वर्ण कलश</strong> चढ़ाया।</td>\n  <td><strong>परमभट्टारक महाराजाधिराज परमेश्वर</strong> की उपाधि धारण की।</td>\n</tr>\n</tbody>\n</table>\n<h2>3. अजैराज (1105 - 1133 ईस्वी): साम्राज्य निर्माण का युग</h2>\n<p><strong>अजैराज</strong>, पृथ्वीराज प्रथम के पुत्र थे। उनके शासनकाल को चौहानों के साम्राज्य निर्माण का काल माना जाता है।</p>\n<ul>\n<li><strong>अजमेर की स्थापना:</strong> उन्होंने <strong>1113 ई.</strong> में <strong>अजयमेरु (अजमेर)</strong> नगर की स्थापना की और इसे अपनी राजधानी बनाया।</li>\n<li><strong>स्थापत्य:</strong> अजमेर में <strong>गढ़बीठली (तारागढ़)</strong> दुर्ग की स्थापना की।</li>\n<li><strong>मुद्रा व्यवस्था:</strong> उन्होंने अजमेर में एक विशाल <strong>टकसाल गृह</strong> की स्थापना की।</li>\n<li><strong>रानी सोमल्लदेवी:</strong> उनकी रानी <strong>श्री सोमल्लदेवी</strong> के नाम के <strong>रजत (चांदी) के सिक्के</strong> प्राप्त होते हैं, जो उस समय की आर्थिक संपन्नता और स्त्री सम्मान को दर्शाते हैं।</li>\n</ul>\n<h2>4. अर्णोराज (1133 - 1153 ईस्वी)</h2>\n<p>अजैराज के बाद <strong>अर्णोराज</strong> शासक बने। उनका काल सैन्य विजय और निर्माण कार्यों के लिए जाना जाता है।</p>\n<ul>\n<li><strong>सैन्य विजय:</strong> उन्होंने मालवा के परमार शासक <strong>नरवर्मा</strong> को पराजित किया।</li>\n<li><strong>धार्मिक निर्माण:</strong> पुष्कर में प्रसिद्ध <strong>वराह मंदिर</strong> का निर्माण करवाया।</li>\n<li><strong>आनासागर झील:</strong> अजमेर में <strong>आनासागर झील</strong> का निर्माण उनके प्रमुख कार्यों में से एक है।</li>\n<li><strong>वैवाहिक संबंध:</strong><ul>\n<li>अपनी पुत्री <strong>जल्हण</strong> का विवाह <strong>कुमारपाल</strong> से किया।</li>\n<li>स्वयं जयसिंह सिद्धराज की पुत्री <strong>कांचन देवी</strong> से विवाह किया।</li>\n</ul>\n</li>\n<li><strong>विद्वान:</strong> उनके दरबार में <strong>धर्मबोध सूरि</strong> एवं <strong>देवबोध</strong> नामक प्रसिद्ध विद्वान निवास करते थे।</li>\n</ul>\n<h2>5. विग्रहराज चतुर्थ / बीसलदेव (1153 - 1163 ईस्वी)</h2>\n<p>अजैराज के पौत्र <strong>विग्रहराज चतुर्थ</strong>, जिन्हें <strong>बीसलदेव</strong> के नाम से भी जाना जाता है, चौहान वंश के सर्वाधिक महत्वपूर्ण और शक्तिशाली शासक थे। उनका काल चौहानों का <strong>'स्वर्णकाल'</strong> कहलाता है।</p>\n<h3>साहित्यिक एवं सांस्कृतिक योगदान</h3>\n<ul>\n<li><strong>कविबांधव:</strong> उनकी विद्वत्ता के कारण <strong>जयानक भट्ट</strong> ने उन्हें <strong>'कविबांधव'</strong> की उपाधि दी थी।</li>\n<li><strong>हरकेली नाटक:</strong> उन्होंने स्वयं संस्कृत में <strong>'हरकेली'</strong> नामक नाटक की रचना की। इस नाटक के कुछ अंश आज भी <strong>'अढाई दिन का झोंपड़ा'</strong> की दीवारों पर उत्कीर्ण हैं।</li>\n<li><strong>ललित विग्रहराज:</strong> उनके दरबारी कवि <strong>सोमदेव</strong> ने <strong>'ललित विग्रहराज'</strong> नामक नाटक की रचना की।</li>\n<li><strong>संस्कृत विद्यालय:</strong> अजमेर में एक <strong>संस्कृत विद्यालय</strong> की स्थापना की, जिसकी दीवारों पर 'हरकेली' और 'ललित विग्रहराज' नाटक उत्कीर्ण करवाए गए थे। कालांतर में <strong>इल्तुतमिश</strong> ने इसे तुड़वाकर इसकी सामग्री से <strong>'अढाई दिन का झोंपड़ा'</strong> नामक मस्जिद का निर्माण करवाया।</li>\n</ul>\n<h3>सैन्य और राजनीतिक विजय</h3>\n<ul>\n<li><strong>साम्राज्य विस्तार:</strong> इनके समय चौहान साम्राज्य का सर्वाधिक विस्तार हुआ।</li>\n<li><strong>तुरुष्क-विजित:</strong> उन्होंने तुर्क शासक <strong>खुसरो शाह</strong> को परास्त किया। <strong>'प्रबंधकोश'</strong> में विग्रहराज चतुर्थ को <strong>'तुरुष्क-विजित'</strong> कहा गया है।</li>\n<li><strong>दिल्ली और हांसी पर अधिकार:</strong> उन्होंने तोमर वंश के <strong>तँवर</strong> को पराजित कर <strong>ढिल्लिका (दिल्ली)</strong> एवं <strong>आसिका (हंसी)</strong> पर पूर्ण अधिकार स्थापित किया।</li>\n</ul>\n<h2>6. विग्रहराज चतुर्थ के उत्तराधिकारी</h2>\n<p>विग्रहराज चतुर्थ के बाद चौहान साम्राज्य के क्रमिक उत्तराधिकारी निम्नलिखित थे:</p>\n<ul>\n<li><strong>अपरगांगेय (1164 - 1165 ईस्वी):</strong> विग्रहराज चतुर्थ के बाद अल्पकाल के लिए शासक बने।</li>\n<li><strong>पृथ्वीराज द्वितीय (1165 - 1169 ईस्वी):</strong> अपरगांगेय के पश्चात सत्ता संभाली।</li>\n</ul>\n<h3>महत्वपूर्ण तथ्य तालिका</h3>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>श्रेणी</td>\n  <td>विवरण</td>\n</tr>\n<tr>\n  <td><strong>कुलदेवता</strong></td>\n  <td>हर्षनाथ (सीकर अभिलेख के अनुसार)</td>\n</tr>\n<tr>\n  <td><strong>प्रसिद्ध मंदिर</strong></td>\n  <td>हर्षनाथ (सीकर), आशापुरी माता (भड़ौच), वराह मंदिर (पुष्कर)</td>\n</tr>\n<tr>\n  <td><strong>महत्वपूर्ण जलाशय</strong></td>\n  <td>सांभर झील (वासुदेव), आनासागर झील (अर्णोराज)</td>\n</tr>\n<tr>\n  <td><strong>विदेशी संघर्ष</strong></td>\n  <td>खुसरो शाह के विरुद्ध विजय (विग्रहराज चतुर्थ)</td>\n</tr>\n<tr>\n  <td><strong>प्रमुख शिलालेख</strong></td>\n  <td>बिजोलिया शिलालेख (1170 ई.), हर्ष अभिलेख (973 ई.)</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>चौहान राजवंश - पृथ्वीराज तृतीय, तराइन का युद्ध एवं प्रमुख साहित्यिक साक्ष्य</h2>\n<h3>1. शाकंभरी का चौहान साम्राज्य (सपादलक्ष)</h3>\n<p>चौहानों के मूल स्थान शाकंभरी को ऐतिहासिक रूप से 'सांभर' या 'सपादलक्ष' के नाम से भी जाना जाता है।</p>\n<ul>\n<li><strong>सपादलक्ष का अर्थ:</strong> इस क्षेत्र को 'सपादलक्ष' इसलिए कहा जाता था क्योंकि इसमें <strong>सवा लाख गाँव</strong> सम्मिलित थे।</li>\n</ul>\n<h3>2. सम्राट पृथ्वीराज तृतीय (शासनकाल: 1177 ईस्वी)</h3>\n<p>1177 ईस्वी में सोमेश्वर के पुत्र पृथ्वीराज तृतीय चौहान साम्राज्य के सिंहासन पर बैठे। वे भारतीय इतिहास के अत्यंत प्रभावशाली शासकों में से एक थे।</p>\n<p><strong>उपाधियाँ और परिचय:</strong></p>\n<ul>\n<li><strong>रायपिथौरा:</strong> इतिहास में उन्हें 'रायपिथौरा' के नाम से प्रसिद्धि मिली।</li>\n<li><strong>दलपुंगुल:</strong> उन्होंने 'दलपुंगुल' की उपाधि धारण की, जिसका अर्थ है <strong>'विश्वविजेता'</strong>।</li>\n<li><strong>हिन्दू गौरव का अंतिम सूर्य:</strong> उन्हें 'हिन्दू गौरव का अंतिम सूर्य' के रूप में सम्मानित किया जाता है।</li>\n</ul>\n<p><strong>प्रमुख प्रशासनिक व्यक्तित्व:</strong></p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>पद / संबंध</td>\n  <td>नाम</td>\n  <td>विवरण</td>\n</tr>\n<tr>\n  <td><strong>माता एवं संरक्षिका</strong></td>\n  <td>कर्पूरी देवी</td>\n  <td>त्रिपुरी के कलचुरी राजा अचलराज की पुत्री। पृथ्वीराज के अल्पायु होने पर एक वर्ष तक शासन संभाला।</td>\n</tr>\n<tr>\n  <td><strong>प्रधानमंत्री</strong></td>\n  <td>कदम्बवास / कैम्बास</td>\n  <td>इन्हें 'सभाभ्यास' भी कहा जाता था। इन्होंने शासन संचालन में महत्वपूर्ण भूमिका निभाई।</td>\n</tr>\n<tr>\n  <td><strong>सेनापति</strong></td>\n  <td>भुवनैकमल्ल</td>\n  <td>पृथ्वीराज तृतीय के कुशल और विश्वसनीय सेनापति।</td>\n</tr>\n</tbody>\n</table>\n<h3>3. प्रारंभिक सैन्य अभियान एवं विद्रोह दमन</h3>\n<p>पृथ्वीराज तृतीय ने सत्ता संभालते ही अपने साम्राज्य को सुदृढ़ करने के लिए कई सैन्य अभियान चलाए:</p>\n<ul>\n<li><strong>नागार्जुन का विद्रोह:</strong> पृथ्वीराज ने अपने चचेरे भाई नागार्जुन के विद्रोह को सफलतापूर्वक कुचला। नागार्जुन, विग्रहराज चतुर्थ के पुत्र और अपरगांगेय के छोटे भाई थे।</li>\n<li><strong>भंडानकों का दमन (1182 ईस्वी):</strong> गुड़गाँव-हिसार के आस-पास सक्रिय भंडानक जाति का पूर्णतः दमन किया गया।</li>\n<li><strong>तुमुल का युद्ध (1182 ईस्वी):</strong> इसे 'महोबा का युद्ध' भी कहा जाता है। इसमें पृथ्वीराज ने चन्देल शासक <strong>परमर्दिदेव</strong> को पराजित किया।<ul>\n<li>इस युद्ध में परमर्दिदेव के प्रसिद्ध सेनापति <strong>आल्हा और ऊदल</strong> वीरगति को प्राप्त हुए।</li>\n<li>कवि <strong>जगनिक</strong> ने इनकी वीरता पर 'आल्हा खण्ड' नामक वीर काव्य की रचना की।</li>\n<li>विजय के पश्चात पृथ्वीराज ने <strong>पंजुन राय</strong> को महोबा का अधिकारी नियुक्त किया।</li>\n</ul>\n</li>\n<li><strong>चालुक्य संघर्ष (1187 ईस्वी):</strong> गुजरात के चालुक्य शासक <strong>भीम द्वितीय</strong> के साथ युद्ध हुआ।</li>\n</ul>\n<h3>4. तराइन के युद्ध (1191-1192 ईस्वी)</h3>\n<p>तराइन के युद्ध भारतीय इतिहास की दिशा बदलने वाली घटनाएँ मानी जाती हैं।</p>\n<p><strong>युद्ध पूर्व की स्थिति:</strong> मुहम्मद गोरी ने चौहान साम्राज्य की सीमा पर स्थित <strong>तबरहिन्द (भटिंडा)</strong> दुर्ग पर अधिकार कर लिया था और वहाँ <strong>काजी जियाउद्दीन</strong> को नियुक्त किया था।</p>\n<p><strong>तराइन का प्रथम युद्ध (1191 ईस्वी):</strong></p>\n<ul>\n<li>पृथ्वीराज तृतीय ने मुहम्मद गोरी को बुरी तरह पराजित किया।</li>\n<li>इस युद्ध में पृथ्वीराज के मुख्य सेनापति <strong>खांडेराव</strong> थे।</li>\n<li>पृथ्वीराज <strong>'नाट्यरंभा'</strong> नामक घोड़े पर सवार होकर युद्ध लड़ रहे थे।</li>\n</ul>\n<p><strong>तराइन का द्वितीय युद्ध (1192 ईस्वी):</strong></p>\n<ul>\n<li>युद्ध से पूर्व गोरी ने <strong>'कासिम उल मुल्क रुकनुद्दीन हमजा'</strong> को अपना दूत बनाकर पृथ्वीराज के पास भेजा था।</li>\n<li>इस युद्ध में पृथ्वीराज की पराजय हुई। उन्हें बंदी बनाया गया और कालांतर में उनकी हत्या कर दी गई।</li>\n<li><strong>ऐतिहासिक महत्व:</strong> इस युद्ध के बाद भारत में तुर्की राज्य की नींव पड़ी और राजपूत युग का अंत हुआ।</li>\n</ul>\n<h3>5. पृथ्वीराज तृतीय की मृत्यु से संबंधित विभिन्न मत</h3>\n<p>पृथ्वीराज की मृत्यु के स्थान और समय को लेकर इतिहासकारों और ग्रंथों में भिन्नता है:</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>स्रोत / विद्वान</td>\n  <td>मृत्यु से संबंधित मत</td>\n</tr>\n<tr>\n  <td><strong>चन्दबरदाई और अबुल फजल</strong></td>\n  <td>इनकी मृत्यु गजनी (अफगानिस्तान) में हुई।</td>\n</tr>\n<tr>\n  <td><strong>मिनहाजुद्दीन सिराज</strong></td>\n  <td>इन्हें बंदी बनाने के तुरंत बाद मार दिया गया।</td>\n</tr>\n<tr>\n  <td><strong>हसन निजामी (ताज-उल-मासिर)</strong></td>\n  <td>इन्हें कैद कर अजमेर लाया गया, जहाँ इन्होंने कुछ वर्षों तक गोरी की अधीनता में शासन किया।</td>\n</tr>\n<tr>\n  <td><strong>विरुद्धविधि विध्वंस (संस्कृत ग्रंथ)</strong></td>\n  <td>इनकी मृत्यु युद्ध स्थल पर ही हुई थी।</td>\n</tr>\n</tbody>\n</table>\n<p><em>हसन निजामी के अनुसार, पृथ्वीराज तृतीय समस्त विश्व को जीतने की महत्वाकांक्षा रखते थे।</em></p>\n<h3>6. पृथ्वीराज के बाद की प्रमुख घटनाएँ</h3>\n<ul>\n<li><strong>अजमेर का शासन:</strong> पृथ्वीराज की मृत्यु के बाद मुहम्मद गोरी ने उनके पुत्र <strong>गोविन्द</strong> को अजमेर का शासक नियुक्त किया।</li>\n<li><strong>हरिराज चौहान:</strong> पृथ्वीराज के भाई हरिराज चौहान ने तुर्कों के निरंतर आक्रमणों और परिस्थितियों से हताश होकर आत्महत्या कर ली थी।</li>\n</ul>\n<h3>7. साहित्यिक इतिहास एवं दरबारी विद्वान</h3>\n<p>चौहान वंश के इतिहास को जानने के लिए कई साहित्यिक कृतियाँ अत्यंत महत्वपूर्ण हैं:</p>\n<p><strong>प्रमुख ग्रंथ:</strong></p>\n<ul>\n<li><strong>पृथ्वीराज विजय:</strong> जयानक द्वारा रचित संस्कृत काव्य। (विशेष: इसमें तराइन के युद्ध का वर्णन नहीं मिलता)।</li>\n<li><strong>पृथ्वीराज रासो:</strong> चन्दबरदाई द्वारा रचित महाकाव्य, जो <strong>अपभ्रंश</strong> भाषा में है। चन्दबरदाई पिंगल भाषा के प्रसिद्ध कवि थे।</li>\n<li><strong>हम्मीर महाकाव्य:</strong> नयनचन्द्र सूरि द्वारा रचित ग्रंथ।</li>\n<li><strong>अर्ली चौहान डायनेस्टीज:</strong> आधुनिक इतिहासकार <strong>डॉ. दशरथ शर्मा</strong> द्वारा लिखित एक प्रामाणिक पुस्तक।</li>\n</ul>\n<p><strong>पृथ्वीराज तृतीय के दरबारी विद्वानों की सूची:</strong></p>\n<ol>\n<li>जयानक</li>\n<li>चन्दबरदाई</li>\n<li>विश्वरूप</li>\n<li>विद्यागीश्वर</li>\n<li>जनार्दन</li>\n<li>विद्यापति गौड़</li>\n<li>आशाधर</li>\n<li>पृथ्वीभट्ट</li>\n</ol>\n<hr />\n"}, {"id": "1-5", "title": "गुजरात (अणहिलवाड़ा) के चालुक्य राजवंश", "file": "history-medieval.md", "html": "<h1>गुजरात (अणहिलवाड़ा) के चालुक्य राजवंश</h1>\n<h2>1. राजवंश की स्थापना और प्रारंभिक शासक</h2>\n<p>अणहिलवाड़ा के चालुक्य राजवंश ने मध्यकालीन गुजरात के इतिहास में एक महत्वपूर्ण भूमिका निभाई।</p>\n<ul>\n<li><strong>संस्थापक:</strong> मूलराज प्रथम (942 ई. – 996 ई.)।</li>\n<li><strong>राजधानी:</strong> अणहिलवाड़ा।</li>\n<li><strong>राजधर्म:</strong> इस राजवंश के शासकों ने <strong>'उमापति-वरलब्ध'</strong> की उपाधि धारण की, जो उनके <strong>शैव धर्म</strong> के प्रति अनुयायी होने का प्रमाण है।</li>\n</ul>\n<h2>2. प्रमुख शासक और उनके महत्वपूर्ण घटनाक्रम</h2>\n<h3>भीम प्रथम (1022 ई. – 1064 ई.)</h3>\n<p>भीम प्रथम इस राजवंश का सर्वाधिक शक्तिशाली शासक था। उसके काल की प्रमुख घटनाएँ निम्नलिखित हैं:</p>\n<ul>\n<li><strong>महमूद गजनी का आक्रमण:</strong> 1025 ई. में महमूद गजनी ने प्रसिद्ध <strong>सोमनाथ मंदिर</strong> पर आक्रमण किया और उसे लूटा।</li>\n<li><strong>सैन्य अभियान:</strong> भीम प्रथम ने कलचुरी शासक <strong>कर्ण</strong> के साथ मिलकर परमार शासक <strong>भोज</strong> को पराजित किया और उसकी राजधानी <strong>धारा नगरी</strong> को लूटा।</li>\n<li><strong>स्थापत्य:</strong> भीम प्रथम के मंत्री <strong>विमलशाह</strong> ने 1031 ई. में देलवाड़ा (आबू) में <strong>विमलवसही (आदिनाथ)</strong> मंदिर का निर्माण करवाया। इस मंदिर का शिल्पकार <strong>कीर्तिधर</strong> था।</li>\n</ul>\n<h3>कर्ण (1064 ई. – 1094 ई.)</h3>\n<p>भीम प्रथम के बाद उसका पुत्र कर्ण शासक बना।</p>\n<ul>\n<li><strong>उपाधि:</strong> उसने <strong>'त्रैलोक्यमल्ल'</strong> की उपाधि धारण की।</li>\n</ul>\n<h3>जयसिंह सिद्धराज (1094 ई. – 1143 ई.)</h3>\n<p>जयसिंह सिद्धराज चालुक्य वंश का एक महान और दूरदर्शी शासक था।</p>\n<ul>\n<li><strong>संरक्षिका:</strong> उसकी माता <strong>मयनाल्ला देवी (मैणल देवी)</strong> ने उसकी संरक्षिका के रूप में महत्वपूर्ण भूमिका निभाई।</li>\n<li><strong>सैन्य विजय और उपाधियाँ:</strong> मालवा के परमार शासक <strong>यशोवर्मन</strong> पर विजय प्राप्त करने के उपलक्ष्य में उसने <strong>'अवंतिनाथ'</strong> की उपाधि धारण की। उसने चौहान नरेश <strong>अर्णोराज</strong> को भी पराजित किया, किंतु बाद में अपनी पुत्री <strong>कांचन देवी</strong> का विवाह उससे कर दिया।</li>\n<li><strong>सांस्कृतिक योगदान:</strong><ul>\n<li>उसके दरबार में प्रसिद्ध जैन आचार्य <strong>हेमचंद्र</strong> रहते थे।</li>\n<li>जयसिंह ने सिद्धपुर में <strong>रुद्र महाकाल (रुद्रमहालय)</strong> मंदिर का निर्माण करवाया।</li>\n<li>उसने 1113-14 ई. में <strong>'सिंह संवत'</strong> का प्रारंभ किया।</li>\n</ul>\n</li>\n<li><strong>धार्मिक सहिष्णुता और समाज सुधार:</strong><ul>\n<li>मुस्लिम लेखक <strong>औफी</strong> के अनुसार, जयसिंह ने खंभात में एक मस्जिद के जीर्णोद्धार के लिए अपने निजी कोष से <strong>एक लाख बलौत्र (स्वर्ण मुद्रा)</strong> का दान दिया था।</li>\n<li>उसने सोमनाथ मंदिर के यात्रियों पर लगने वाले <strong>तीर्थयात्रा कर</strong> को समाप्त कर दिया था।</li>\n</ul>\n</li>\n</ul>\n<h3>कुमारपाल (1143 ई. – 1172 ई.)</h3>\n<p>कुमारपाल ने जैन धर्म को राजकीय संरक्षण प्रदान किया।</p>\n<ul>\n<li><strong>धार्मिक परिवर्तन:</strong> जैन आचार्य हेमचंद्र के प्रभाव में आकर उसने शैव धर्म त्यागकर <strong>जैन धर्म</strong> स्वीकार कर लिया। हेमचंद्र ने उसे <strong>'परमार्हत'</strong> की संज्ञा दी।</li>\n<li><strong>सुधार और प्रतिबंध:</strong> उसने अपने राज्य में मदिरा के उत्पादन और बिक्री, जुआ, वेश्यावृत्ति और पशुवध पर पूर्ण प्रतिबंध लगा दिया। कसाइयों को अपना व्यवसाय बंद करने के बदले में उसने तीन वर्ष की आय के बराबर धन क्षतिपूर्ति के रूप में दिया।</li>\n<li><strong>स्थापत्य:</strong> उसने 1169 ई. में <strong>सोमनाथ मंदिर</strong> का अंतिम रूप से पुनर्निर्माण करवाया।</li>\n</ul>\n<h3>अजयपाल (1172 ई. – 1176 ई.)</h3>\n<p>कुमारपाल का उत्तराधिकारी अजयपाल जैन परंपराओं के प्रति अत्यंत कठोर था।</p>\n<ul>\n<li>उसे जैन परंपराओं में <strong>'जैनियों के संत्रासक'</strong> के रूप में वर्णित किया गया है।</li>\n<li>उसने जैन साधुओं की हत्या करवाई और कुमारपाल द्वारा निर्मित कई जैन मंदिरों को तुड़वा दिया। उसने शैवों को उच्च पदों पर नियुक्त किया।</li>\n</ul>\n<h3>मूलराज द्वितीय (1176 ई. – 1178 ई.)</h3>\n<ul>\n<li>उसने 1178 ई. में आबू के निकट <strong>कासह्रद के मैदान</strong> में <strong>मुहम्मद गोरी</strong> को बुरी तरह पराजित किया।</li>\n<li>वास्तव में इस युद्ध का नेतृत्व उसकी माता <strong>नायिकी देवी</strong> ने किया था।</li>\n</ul>\n<h3>भीम द्वितीय (1178 ई. – 1238 ई.)</h3>\n<p>यह इस वंश का अंतिम महान शासक था।</p>\n<ul>\n<li><strong>विदेशी आक्रमण:</strong> 1197 ई. में <strong>कुतुबुद्दीन ऐबक</strong> ने गुजरात पर आक्रमण कर अणहिलवाड़ा को लूटा।</li>\n<li><strong>स्थापत्य:</strong> भीम द्वितीय के शासनकाल के दौरान 1231-32 ई. में वास्तुपाल और तेजपाल ने देलवाड़ा (आबू) में <strong>लूणवसही (नेमिनाथ)</strong> मंदिर का निर्माण करवाया। इसका वास्तुकार <strong>शोभनदेव</strong> था। इस मंदिर को 'देवरानी-जेठानी का मंदिर' भी कहा जाता है।</li>\n</ul>\n<h2>3. महत्वपूर्ण साहित्य और लेखक</h2>\n<p>चालुक्य काल साहित्य और ज्ञान के प्रसार के लिए स्वर्ण युग माना जाता है।</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>लेखक</td>\n  <td>रचना</td>\n  <td>विवरण</td>\n</tr>\n<tr>\n  <td><strong>हेमचंद्र</strong></td>\n  <td>कुमारपालचरित (द्वयाश्रय महाकाव्य)</td>\n  <td>कुमारपाल के जीवन पर आधारित</td>\n</tr>\n<tr>\n  <td><strong>हेमचंद्र</strong></td>\n  <td>सिद्धहेम व्याकरण</td>\n  <td>प्रसिद्ध व्याकरण ग्रंथ</td>\n</tr>\n<tr>\n  <td><strong>हेमचंद्र</strong></td>\n  <td>अष्टादशसहस्री</td>\n  <td>महत्वपूर्ण जैन ग्रंथ</td>\n</tr>\n<tr>\n  <td><strong>हेमचंद्र</strong></td>\n  <td>त्रिषष्टिशलाकापुरुषचरित्र</td>\n  <td>जैन महापुरुषों का वर्णन</td>\n</tr>\n<tr>\n  <td><strong>श्रीपाल</strong></td>\n  <td>वैरोचन पराजय</td>\n  <td>जयसिंह सिद्धराज के दरबारी कवि</td>\n</tr>\n<tr>\n  <td><strong>श्रीपाल</strong></td>\n  <td>वडनगर प्रशस्ति</td>\n  <td>ऐतिहासिक अभिलेख</td>\n</tr>\n<tr>\n  <td><strong>जयसिंह सूरी</strong></td>\n  <td>कुमारपालचरित (कुमारभूपाल चरित)</td>\n  <td>कुमारपाल के काल की रचना</td>\n</tr>\n<tr>\n  <td><strong>सोड्ढल</strong></td>\n  <td>उदयसुंदरीकथा</td>\n  <td>चालुक्य कालीन साहित्य</td>\n</tr>\n<tr>\n  <td><strong>मेरुतुंग</strong></td>\n  <td>प्रबंध चिंतामणि</td>\n  <td>ऐतिहासिक घटनाओं का संकलन</td>\n</tr>\n</tbody>\n</table>\n<h2>4. प्रशासनिक एवं आर्थिक तथ्य</h2>\n<ul>\n<li><strong>कर प्रणाली:</strong> चालुक्य शासकों द्वारा तीर्थ यात्रियों से <strong>'कुट'</strong> नामक कर लिया जाता था (जिसे जयसिंह सिद्धराज ने सोमनाथ के संदर्भ में समाप्त किया था)।</li>\n<li><strong>मुद्रा:</strong> स्वर्ण मुद्राओं को <strong>'बलौत्र'</strong> कहा जाता था।</li>\n<li><strong>बघेल राजवंश का उदय:</strong> भीम द्वितीय के समय में <strong>लवणप्रसाद</strong> और उसका पुत्र <strong>वीरधवल</strong> (बघेल सामंत) राज्य के वास्तविक शासक (<strong>De facto ruler</strong>) बन गए थे। आगे चलकर चालुक्यों के बाद गुजरात पर बघेलों ने शासन किया। लूणवसही मंदिर का निर्माण भी वास्तव में बघेल शासक वीरधवल के समय ही हुआ था।</li>\n</ul>\n<h2>5. स्थापत्य कला का विवरण</h2>\n<p>चालुक्य कालीन स्थापत्य अपनी भव्यता और नक्काशी के लिए प्रसिद्ध है।</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>मंदिर का नाम</td>\n  <td>स्थान</td>\n  <td>निर्माता</td>\n  <td>संबंधित शासक</td>\n</tr>\n<tr>\n  <td><strong>विमलवसही (आदिनाथ)</strong></td>\n  <td>देलवाड़ा (आबू)</td>\n  <td>विमलशाह</td>\n  <td>भीम प्रथम</td>\n</tr>\n<tr>\n  <td><strong>रुद्र महाकाल मंदिर</strong></td>\n  <td>सिद्धपुर</td>\n  <td>जयसिंह सिद्धराज</td>\n  <td>जयसिंह सिद्धराज</td>\n</tr>\n<tr>\n  <td><strong>सोमनाथ मंदिर (पुनर्निर्माण)</strong></td>\n  <td>सोमनाथ</td>\n  <td>कुमारपाल</td>\n  <td>कुमारपाल</td>\n</tr>\n<tr>\n  <td><strong>लूणवसही (नेमिनाथ)</strong></td>\n  <td>देलवाड़ा (आबू)</td>\n  <td>वास्तुपाल एवं तेजपाल</td>\n  <td>भीम द्वितीय (वीरधवल के समय)</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>बादामी के चालुक्य राजवंश</h2>\n<h2>1. चालुक्य राजवंश का परिचय एवं प्रमुख शाखाएँ (Introduction and Major Branches)</h2>\n<p>भारतीय इतिहास के मध्यकाल के संक्रमण काल में, दक्कन के पठार पर <strong>चालुक्य राजवंश</strong> का उदय एक युगांतकारी घटना थी। उत्तर और दक्षिण भारत के भौगोलिक एवं सांस्कृतिक मिलन बिंदु पर स्थित होने के कारण, चालुक्यों ने भारतीय इतिहास में एक महत्वपूर्ण 'सेतु' (Bridge) की भूमिका निभाई। इन्होंने न केवल विंध्य के दक्षिण में एक सुदृढ़ राजनीतिक संरचना स्थापित की, बल्कि कला और स्थापत्य की नई शैलियों को भी जन्म दिया। इनका इतिहास विशेष रूप से <strong>राष्ट्रकूटों</strong> के साथ सत्ता के चक्रीय हस्तांतरण से जुड़ा है; जहाँ <strong>बादामी के चालुक्य</strong> राष्ट्रकूटों के पूर्ववर्ती (Predecessors) थे, वहीं <strong>कल्याणी के चालुक्य</strong> उनके उत्तरवर्ती (Successors) सिद्ध हुए।</p>\n<p><strong>चालुक्य वंश की प्रमुख शाखाएँ</strong></p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>शाखा का नाम</td>\n  <td>समय काल</td>\n  <td>क्षेत्र/विशेष विवरण</td>\n</tr>\n<tr>\n  <td><strong>बादामी (वातापी) के पश्चिमी चालुक्य</strong></td>\n  <td><strong>550 - 750 ई.</strong></td>\n  <td>चालुक्यों की मूल और सबसे प्राचीन शाखा। <strong>राष्ट्रकूटों</strong> के उदय के साथ इनका अवसान हुआ।</td>\n</tr>\n<tr>\n  <td><strong>वेंगी के पूर्वी चालुक्य</strong></td>\n  <td><strong>600 - 1200 ई.</strong></td>\n  <td>पुलेकेशिन द्वितीय के भाई <strong>विष्णुवर्धन</strong> द्वारा स्थापित। यह शाखा आंध्र क्षेत्र में केंद्रित थी।</td>\n</tr>\n<tr>\n  <td><strong>कल्याणी के उत्तरकालीन पश्चिमी चालुक्य</strong></td>\n  <td><strong>950 - 1100 ई.</strong></td>\n  <td><strong>राष्ट्रकूटों</strong> के पतन के पश्चात इस शाखा ने पुनः चालुक्य सत्ता को पुनर्जीवित किया।</td>\n</tr>\n</tbody>\n</table>\n<p>बादामी के चालुक्यों का शासन काल दक्कन में साम्राज्यवाद और सांस्कृतिक चेतना के चरमोत्कर्ष का काल था, जिसकी नींव <strong>वातापी</strong> के दुर्गम धरातल पर रखी गई थी।</p>\n<h2>2. बादामी के चालुक्य: स्थापना और प्रारंभिक शासक (Foundation and Early Rulers)</h2>\n<p>चालुक्यों ने अपनी सामरिक राजधानी के रूप में <strong>वातापी (बादामी)</strong> का चयन किया, जो अपनी प्राकृतिक सुरक्षा और भौगोलिक स्थिति के कारण क्षेत्रीय स्थिरता के लिए आदर्श थी। यहाँ से उन्होंने छठी शताब्दी के मध्य से आठवीं शताब्दी के मध्य तक संपूर्ण 'दक्षिणापथ' की राजनीति को नियंत्रित किया।</p>\n<p>इस राजवंश के वास्तविक सुदृढ़ीकरण का श्रेय <strong>पुलेकेशिन प्रथम (535-566 ई.)</strong> को जाता है। उनके शासनकाल के प्रमुख <strong>अभिलेखीय साक्ष्य</strong> और उपलब्धियाँ निम्नलिखित हैं:</p>\n<ul>\n<li><strong>राजकीय उपाधियाँ:</strong> उन्होंने अपनी संप्रभुता को रेखांकित करने के लिए <strong>श्रीपृथ्वीवल्लभ</strong>, <strong>श्रीवल्लभ</strong> और <strong>महाराजा</strong> जैसी उच्च उपाधियाँ धारण कीं।</li>\n<li><strong>धार्मिक एवं वैदिक योगदान:</strong> अपनी शक्ति के वैधीकरण हेतु उन्होंने <strong>अश्वमेध यज्ञ</strong> का सफलतापूर्वक संपादन किया।</li>\n<li><strong>सामरिक बुनियादी ढाँचा:</strong> उन्होंने रक्षात्मक रणनीति के तहत अभेद्य <strong>वातापी दुर्ग</strong> का निर्माण करवाया।</li>\n<li><strong>सांस्कृतिक संदर्भ:</strong> <strong>महाकूट अभिलेख</strong> के अनुसार, पुलेकेशिन प्रथम की तुलना उनकी वीरता और रक्षक स्वरूप के कारण साक्षात् <strong>भगवान विष्णु</strong> से की गई है।</li>\n</ul>\n<p>पुलेकेशिन प्रथम के पश्चात <strong>कीर्तिवर्मन प्रथम</strong> सिंहासन पर बैठे। उन्हें ऐतिहासिक रूप से &quot;<strong>वातापी का प्रथम निर्माता</strong>&quot; (First Builder of Vatapi) होने का गौरव प्राप्त है, क्योंकि उन्होंने राजधानी के ढांचागत विस्तार और सौंदर्यीकरण पर विशेष बल दिया। उनके बाद यह वंश अपने सबसे प्रतापी शासक के युग में प्रविष्ट हुआ।</p>\n<h2>3. पुलेकेशिन द्वितीय: चालुक्य साम्राज्य का चरमोत्कर्ष (Pulakeshin II: The Zenith of Power)</h2>\n<p><strong>पुलेकेशिन द्वितीय (609-642 ई.)</strong> न केवल इस वंश के, बल्कि दक्षिण भारतीय इतिहास के महानतम सम्राटों में गिने जाते हैं। उनके सत्ताारोहण का मार्ग आंतरिक संघर्षों से भरा था; उन्हें अपने चाचा <strong>मंगलेश</strong> की सैन्य महत्वाकांक्षाओं को चुनौती देकर और उनकी हत्या कर सिंहासन प्राप्त करना पड़ा।</p>\n<h3>ऐहोल अभिलेख (Aihole Inscription): एक ऐतिहासिक साक्ष्य</h3>\n<p>पुलेकेशिन द्वितीय के शासनकाल का मुख्य स्रोत उनके दरबारी कवि <strong>रविकीर्ति</strong> द्वारा रचित प्रसिद्ध <strong>ऐहोल अभिलेख</strong> है:</p>\n<ul>\n<li><strong>साहित्यिक स्वरूप:</strong> यह अभिलेख <strong>संस्कृत</strong> भाषा और <strong>दक्षिणी ब्राह्मी</strong> लिपि में उत्कीर्ण है।</li>\n<li><strong>कवि की तुलना:</strong> इसमें रविकीर्ति ने अपनी काव्य प्रतिभा की तुलना महान कवि <strong>कालिदास</strong> और <strong>भारवि</strong> से की है।</li>\n<li><strong>काल-गणना का महत्व:</strong> UPSC परीक्षा की दृष्टि से यह अत्यंत महत्वपूर्ण है कि इस अभिलेख में ऐतिहासिक तिथियों को <strong>महाभारत युद्ध</strong> की घटना से जोड़कर काल-गणना (Puranic Chronology) की गई है, जो पुरालेखशास्त्र में एक दुर्लभ उदाहरण है।</li>\n</ul>\n<h3>प्रमुख सैन्य विजय और वैश्विक संबंध</h3>\n<ul>\n<li><strong>नर्मदा का युद्ध:</strong> पुलेकेशिन द्वितीय ने <strong>नर्मदा (रेवा) नदी</strong> के तट पर उत्तर भारत के अधिपति <strong>हर्षवर्धन</strong> की सेनाओं को निर्णायक रूप से पराजित किया। इस विजय के पश्चात उन्होंने <strong>परमेश्वर</strong> की उपाधि धारण की, जो उनके अखिल भारतीय प्रभाव को दर्शाती है।</li>\n<li><strong>क्षेत्रीय विस्तार:</strong> उन्होंने <strong>कदम्बों (वनवासी)</strong> की सत्ता को समाप्त किया और <strong>गंग शासक दुर्विनीत</strong> को आत्मसमर्पण के लिए विवश किया। अंततः दुर्विनीत ने अपनी पुत्री का विवाह पुलेकेशिन से कर वैवाहिक गठबंधन स्वीकार किया।</li>\n<li><strong>कूटनीतिक संबंध:</strong> उनका प्रभाव अंतरराष्ट्रीय स्तर पर भी था। <strong>अजंता की प्रथम गुफा</strong> के भित्ति चित्रों में उन्हें फारसी सम्राट <strong>शाह परवेज खुसरो द्वितीय</strong> के राजदूत का स्वागत करते हुए चित्रित किया गया है।</li>\n<li><strong>धार्मिक अनुष्ठान:</strong> उन्होंने <strong>सत्याश्रय</strong> की उपाधि के साथ-साथ <strong>अश्वमेध एवं वाजपेय यज्ञ</strong> संपन्न कर अपनी चक्रवर्ती स्थिति की पुष्टि की।</li>\n</ul>\n<h2>4. पल्लव-चालुक्य संघर्ष और उत्तराधिकार (The Pallava-Chalukya Conflict)</h2>\n<p>पल्लवों और चालुक्यों के बीच का दीर्घकालिक संघर्ष दक्षिण भारतीय राजनीति का एक अनिवार्य अंग था। यह प्रतिद्वंद्विता केवल भू-भाग के लिए नहीं, बल्कि सांस्कृतिक और राजनीतिक श्रेष्ठता के लिए भी थी।</p>\n<ol>\n<li><strong>सामरिक विस्तार:</strong> संघर्ष का प्रारंभ तब हुआ जब पुलेकेशिन द्वितीय ने पल्लव नरेश <strong>महेन्द्रवर्मन प्रथम</strong> के उत्तरी क्षेत्रों को विजित किया। सामरिक दूरदर्शिता का परिचय देते हुए, उन्होंने इस विजित क्षेत्र को अपने भाई <strong>विष्णुवर्धन</strong> को सौंप दिया, जिससे <strong>वेंगी के पूर्वी चालुक्य</strong> शाखा का जन्म हुआ। यह पूर्वी सीमा को सुरक्षित करने का एक रणनीतिक कदम था।</li>\n<li><strong>पल्लवों का प्रतिशोध:</strong> पल्लव शासक <strong>नरसिंहवर्मन प्रथम</strong> ने इस अपमान का बदला लेने हेतु वातापी पर आक्रमण किया। उन्होंने पुलेकेशिन द्वितीय को <strong>परियल, मणिमंगल और शूरमाल</strong> के युद्धों में परास्त किया।</li>\n<li><strong>चालुक्य सत्ता का अस्थायी पतन:</strong> <strong>642 ई.</strong> के आसपास इस संघर्ष में पुलेकेशिन द्वितीय की मृत्यु हो गई। नरसिंहवर्मन प्रथम ने वातापी पर अधिकार कर <strong>'वातापीकोंड'</strong> (वातापी का विजेता) की उपाधि धारण की, जिससे चालुक्य साम्राज्य कुछ समय के लिए राजनीतिक अंधकार में चला गया।</li>\n</ol>\n<h2>5. साम्राज्य का पुनरुत्थान: विक्रमादित्य प्रथम एवं विनयादित्य (Restoration of the Empire)</h2>\n<p>चालुक्य साम्राज्य की पुनःस्थापना का श्रेय <strong>विक्रमादित्य प्रथम (655-680 ई.)</strong> की दृढ़ता को जाता है। उन्होंने बिखरे हुए साम्राज्य को संगठित कर पल्लवों से अपना प्रतिशोध लिया।</p>\n<ul>\n<li><strong>सैन्य पुनरुत्थान:</strong> विक्रमादित्य प्रथम ने <strong>नरसिंहवर्मन प्रथम</strong> की सेनाओं को पराजित कर अपनी पैतृक राजधानी <strong>वातापी</strong> को मुक्त कराया।</li>\n<li><strong>तीनों समुद्रों का स्वामी:</strong> उन्होंने दक्षिण के सुदूर राज्यों—<strong>चोल, चेर और पाण्ड्य</strong>—पर अपनी सर्वोच्चता स्थापित की। इस भौगोलिक विस्तार (अरब सागर, बंगाल की खाड़ी और हिंद महासागर) के कारण उन्हें &quot;<strong>तीनों समुद्रों का स्वामी</strong>&quot; कहा गया।</li>\n<li><strong>प्रशासनिक दूरदर्शिता:</strong> उन्होंने अपने भाई <strong>जयसिंहवर्मन</strong> को गुजरात क्षेत्र का गवर्नर नियुक्त किया, जिससे चालुक्यों की <strong>लाट (गुजरात) शाखा</strong> की नींव पड़ी।</li>\n<li><strong>विनयादित्य (680-696 ई.):</strong> उनके उत्तराधिकारी <strong>विनयादित्य</strong> ने इस विशाल साम्राज्य की सीमाओं को अक्षुण्ण बनाए रखा।</li>\n</ul>\n<h2>6. सांस्कृतिक उत्कर्ष: विजयादित्य और विक्रमादित्य द्वितीय (Cultural Peak and Architecture)</h2>\n<p>आठवीं शताब्दी का प्रारंभ चालुक्य इतिहास में सैन्य विजयों के स्थान पर सांस्कृतिक और कलात्मक सृजन का युग रहा। इस काल में 'वेसर' शैली के प्रारंभिक बीज बोए गए।</p>\n<p><strong>विजयादित्य (696-733 ई.):</strong></p>\n<ul>\n<li>इन्होंने <strong>समस्तभुवनाश्रय</strong> की उपाधि धारण की।</li>\n<li>पट्टडकल में एक <strong>विशाल शिव मंदिर</strong> का निर्माण इनके शासनकाल की प्रमुख उपलब्धि है।</li>\n<li><strong>धार्मिक सहिष्णुता:</strong> इन्होंने <strong>जैन आचार्यों</strong> को ग्राम दान देकर अपनी उदार धार्मिक नीति का परिचय दिया।</li>\n</ul>\n<p><strong>विक्रमादित्य द्वितीय (733-746 ई.):</strong></p>\n<ul>\n<li>इन्होंने पल्लव सम्राट <strong>नंदिवर्मन द्वितीय</strong> को पराजित कर कांची पर अधिकार किया और <strong>कांचिकोंड</strong> की उपाधि ली।</li>\n<li>इस विजय का प्रामाणिक साक्ष्य कांची के <strong>राजसिंहेश्वर मंदिर</strong> में उत्कीर्ण चालुक्य अभिलेख है।</li>\n<li><strong>धार्मिक निरंतरता:</strong> अपने पूर्ववर्ती की भांति इन्होंने भी <strong>जैन आचार्यों</strong> को भूमि और ग्राम दान में दिए।</li>\n</ul>\n<h3>विरुपाक्ष मंदिर (Virupaksha Temple) - पट्टडकल</h3>\n<p>यह मंदिर चालुक्य वास्तुकला का अनुपम रत्न है:</p>\n<ul>\n<li><strong>निर्माण:</strong> इसका निर्माण विक्रमादित्य द्वितीय की पट्टमहिषी (बड़ी रानी) <strong>लोकमहादेवी</strong> ने लगभग <strong>740 ई.</strong> में करवाया था।</li>\n<li><strong>ऐतिहासिक महत्व:</strong> यह मंदिर पल्लवों पर विक्रमादित्य द्वितीय की <strong>तीन लगातार विजयों</strong> के उपलक्ष्य में बनाया गया था, जो दक्षिण भारतीय कला पर पल्लव शैली (द्रविड़) के प्रभाव और चालुक्य नवाचार का मिश्रण है।</li>\n</ul>\n<h2>7. पतन: कीर्तिवर्मन द्वितीय और राष्ट्रकूट उदय (Decline and the Rise of Rashtrakutas)</h2>\n<p>चालुक्य साम्राज्य का अंत किसी बाह्य आक्रमणकारी से नहीं, बल्कि उनके अपने ही सामंतों की बढ़ती शक्ति से हुआ।</p>\n<ul>\n<li><strong>अंतिम शासक:</strong> <strong>कीर्तिवर्मन द्वितीय (746-757 ई.)</strong> बादामी के चालुक्य वंश के अंतिम अधिपति थे।</li>\n<li><strong>सत्ता का हस्तांतरण:</strong> कीर्तिवर्मन द्वितीय <strong>राष्ट्रकूट</strong> शासक (दंतिदुर्ग के नेतृत्व में) के विरुद्ध युद्ध में पराजित हुए और वीरगति को प्राप्त हुए। उनकी मृत्यु के साथ ही वातापी के चालुक्यों का अध्याय समाप्त हो गया।</li>\n</ul>\n<p><strong>निष्कर्ष:</strong> बादामी के चालुक्यों का योगदान भारतीय इतिहास में चिरस्थायी है। उन्होंने न केवल दक्षिण भारत को एक सूत्र में पिरोया, बल्कि ऐहोल और पट्टडकल जैसे केंद्रों के माध्यम से 'वेसर' शैली की वास्तुकला को जन्म दिया, जो उत्तर की नागर और दक्षिण की द्रविड़ शैली के बीच एक कलात्मक सेतु बनी। उनका शासनकाल शक्ति, कूटनीति और कलात्मक उदारता का एक उत्कृष्ट समन्वय था।</p>\n<h2>कल्याणी एवं वेंगी के चालुक्य राजवंश</h2>\n<h2>1. कल्याणी के पश्चिमी चालुक्य (Western Chalukyas of Kalyani)</h2>\n<p>कल्याणी के चालुक्यों का उदय राष्ट्रकूटों के पतन के बाद हुआ। उल्लेखनीय है कि वातापी के चालुक्यों का स्थान पहले राष्ट्रकूटों ने लिया था, और पुनः राष्ट्रकूटों के स्थान पर कल्याणी के चालुक्यों ने अपनी सत्ता स्थापित की।</p>\n<h3>संस्थापक और प्रारंभिक शासक</h3>\n<ul>\n<li><strong>तैलप द्वितीय (973-997 ई.):</strong> यह इस राजवंश का संस्थापक था। उसने राष्ट्रकूट नरेश <strong>कर्क द्वितीय</strong> को गद्दी से हटाकर स्वयं को कल्याणी का स्वतंत्र राजा घोषित किया। मेरुतुंग की प्रसिद्ध कृति <strong>'प्रबन्ध चिंतामणि'</strong> से ज्ञात होता है कि तैलप द्वितीय ने <strong>मुंज परमार</strong> का वध किया था।</li>\n<li><strong>सत्याश्रय (997-1008 ई.):</strong> तैलप द्वितीय के बाद सत्याश्रय शासक बना, जिसे <strong>सत्तिग</strong> या <strong>सत्तिमा</strong> के नाम से भी जाना जाता है। उसने <strong>'आहवमल्ल'</strong> और <strong>'अकलंकचरित'</strong> जैसी प्रतिष्ठित उपाधियाँ धारण कीं। उसने प्रसिद्ध चोल शासक <strong>राजराज चोल</strong> (985-1014 ई.) को पराजित किया था।</li>\n<li><strong>जयसिंह द्वितीय (1015-1043 ई.):</strong> इसने <strong>कल्याणी नगर</strong> की स्थापना की।</li>\n</ul>\n<h3>सोमेश्वर प्रथम (1043-1068 ई.)</h3>\n<p>सोमेश्वर प्रथम इस वंश का एक अत्यंत महत्वपूर्ण शासक था। उसके काल की प्रमुख घटनाएँ निम्नलिखित हैं:</p>\n<ul>\n<li><strong>राजधानी परिवर्तन:</strong> उसने अपनी राजधानी को <strong>मान्यखेत</strong> से स्थानांतरित कर <strong>कल्याणी</strong> में स्थापित किया।</li>\n<li><strong>सैन्य संघर्ष:</strong> सोमेश्वर प्रथम चोल राजा <strong>राजराज द्वितीय</strong> से पराजित हुआ, किंतु उसने <strong>धारा</strong> पर आक्रमण कर <strong>राजा भोज परमार</strong> को परास्त किया।</li>\n<li><strong>प्रशासनिक विवरण:</strong> उसकी रानी <strong>चन्दनकन्वे</strong> बनवासी की गवर्नर (राज्यपाल) के पद पर कार्यरत थी।</li>\n<li><strong>चोल-चालुक्य संघर्ष:</strong> सोमेश्वर प्रथम चोलों से दो महत्वपूर्ण युद्धों में पराजित हुआ:<ol>\n<li><strong>कोप्पम का युद्ध</strong> (1054 ई.)</li>\n<li><strong>कुडल संगम का युद्ध</strong> (1062 ई.)</li>\n</ol>\n</li>\n<li><strong>मृत्यु:</strong> चोलों से बार-बार पराजित होने के कारण ग्लानि में सोमेश्वर प्रथम ने <strong>तुंगभद्रा नदी</strong> में डूबकर आत्महत्या कर ली।</li>\n</ul>\n<h4>सोमेश्वर प्रथम की उपाधियाँ:</h4>\n<ol>\n<li>त्रैलोक्य मल्ल</li>\n<li>सर्वज्ञ चक्रवर्ती</li>\n<li>भूलोक मल्ल</li>\n<li>त्रिभुवन मल्ल</li>\n</ol>\n<h3>विक्रमादित्य षष्ठ (1076-1126 ई.)</h3>\n<p>सोमेश्वर प्रथम के बाद उत्तराधिकार युद्ध छिड़ गया, जिससे चालुक्य वंश अस्थायी रूप से दो भागों में विभाजित हो गया। उत्तरी भाग पर <strong>सोमेश्वर द्वितीय</strong> (1068-1076 ई.) और दक्षिणी भाग पर <strong>विक्रमादित्य षष्ठ</strong> का शासन रहा। अंततः विक्रमादित्य षष्ठ ने अपने बड़े भाई सोमेश्वर द्वितीय का तख्तापलट कर कल्याणी पर पूर्ण नियंत्रण प्राप्त किया।</p>\n<ul>\n<li><strong>ऐतिहासिक महत्व:</strong> वह कल्याणी के चालुक्य वंश का <strong>महानतम शासक</strong> था। उसने <strong>'त्रिभुवन मल्ल'</strong> की उपाधि धारण की।</li>\n<li><strong>पूर्वजों का उल्लेख:</strong> विक्रमादित्य षष्ठ के <strong>कौथेम लेख</strong> में यह दावा किया गया है कि उसके 59 पूर्वज चालुक्य राजाओं ने अयोध्या पर शासन किया था।</li>\n<li><strong>सांस्कृतिक योगदान:</strong> उसके दरबार में विद्वानों को उच्च संरक्षण प्राप्त था:<ul>\n<li><strong>बिल्हण:</strong> कश्मीरी राजकवि जिन्होंने <strong>'विक्रमांकदेवचरित'</strong> और <strong>'चौरपंचाशिका'</strong> की रचना की।</li>\n<li><strong>विज्ञानेश्वर:</strong> प्रसिद्ध कानूनविद जिन्होंने <strong>'मिताक्षरा'</strong> (याज्ञवल्क्य स्मृति पर टीका) लिखी।</li>\n</ul>\n</li>\n<li><strong>चालुक्य-विक्रम संवत:</strong> अपने राज्यारोहण के उपलक्ष्य में उसने <strong>1076 ई.</strong> में 'चालुक्य-विक्रम संवत' का प्रारंभ किया।</li>\n<li><strong>विदेश नीति:</strong> उसने लंका (श्रीलंका) के नरेश <strong>विजयबाहु</strong> के साथ कूटनीतिक संबंध स्थापित किए और 1083 ई. में अपना एक दूत मंडल उनकी सभा में भेजा।</li>\n<li><strong>नगर स्थापना:</strong> उसने <strong>विक्रमपुर</strong> नामक नगर की स्थापना की।</li>\n<li><strong>धार्मिक कार्य:</strong> उसने नर्मदा नदी के तट पर <strong>'तुलापुरुषदान'</strong> यज्ञ संपन्न किया।</li>\n</ul>\n<h3>परवर्ती शासक</h3>\n<ul>\n<li><strong>सोमेश्वर तृतीय (1126-1138 ई.):</strong> विक्रमादित्य षष्ठ का पुत्र। अपनी विद्वत्ता के कारण वह <strong>'सर्वज्ञभूप'</strong> कहलाया।<ul>\n<li><strong>ग्रंथ रचना:</strong> उसने शिल्पशास्त्र के प्रसिद्ध ग्रंथ <strong>'मानसोल्लास'</strong> (जिसे <strong>'अभिलषितार्थ चिंतामणि'</strong> भी कहा जाता है) की रचना की। इस ग्रंथ में सोने के खनन के विषय में जानकारी दी गई है।</li>\n<li>उसने अपने पिता के जीवन पर <strong>'विक्रमांकभ्युदय'</strong> नामक पुस्तक भी लिखी।</li>\n</ul>\n</li>\n<li><strong>सोमेश्वर चतुर्थ:</strong> यह इस राजवंश का <strong>अंतिम शासक</strong> था।</li>\n</ul>\n<h2>2. वेंगी के चालुक्य (Eastern Chalukyas of Vengi)</h2>\n<p>वेंगी का चालुक्य वंश आंध्र प्रदेश के <strong>कृष्णा और गोदावरी नदियों</strong> के मध्य स्थित क्षेत्र में शासन करता था।</p>\n<h3>वेंगी चालुक्यों का इतिहास और चोल संबंध</h3>\n<ul>\n<li><strong>संस्थापक:</strong> इस शाखा का संस्थापक <strong>विष्णुवर्धन</strong> था।</li>\n<li><strong>राजनैतिक संकट:</strong> कुरनूल के राजा <strong>जटाचोड भीम</strong> ने वेंगी के चालुक्य शासक <strong>दानार्णव</strong> की हत्या कर दी। इस संकट के समय दानार्णव के पुत्रों—<strong>शक्तिवर्मन</strong> एवं <strong>विम लादित्य</strong> ने चोल शासक <strong>राजराज प्रथम</strong> की शरण ली।</li>\n<li><strong>चोल संरक्षण और वैवाहिक संबंध:</strong> चोल नरेश राजराज प्रथम ने शक्तिवर्मन को वेंगी का शासक नियुक्त किया और अपनी पुत्री <strong>कुन्दवई</strong> का विवाह विमलादित्य के साथ कर दिया।</li>\n<li><strong>विमलादित्य (1011-1018 ई.):</strong> शक्तिवर्मन के पश्चात शासक बना।</li>\n<li><strong>राजराज द्वितीय (वेंगी राजराज):</strong> विमलादित्य का पुत्र। उसने चोल शासक <strong>राजेंद्र प्रथम</strong> की पुत्री <strong>अमंगा देवी</strong> से विवाह किया (जो उसकी ममेरी बहन भी थी)।</li>\n<li><strong>साम्राज्य का विलय:</strong> राजराज द्वितीय का पुत्र <strong>राजेंद्र द्वितीय</strong>, चोल साम्राज्य के शासक के रूप में <strong>'कुलोत्तुंग प्रथम'</strong> के नाम से आसीन हुआ। इसके परिणामस्वरूप वेंगी के चालुक्यों का चोल साम्राज्य में पूर्णतः विलय हो गया।</li>\n</ul>\n<h2>3. महत्वपूर्ण ग्रंथ और उनके रचयिता</h2>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>ग्रंथ का नाम</td>\n  <td>रचयिता</td>\n  <td>विषय-वस्तु/विशेषता</td>\n</tr>\n<tr>\n  <td><strong>प्रबन्ध चिंतामणि</strong></td>\n  <td>मेरुतुंग</td>\n  <td>मुंज परमार की हत्या का उल्लेख</td>\n</tr>\n<tr>\n  <td><strong>विक्रमांकदेवचरित</strong></td>\n  <td>बिल्हण</td>\n  <td>विक्रमादित्य षष्ठ का जीवन चरित्र</td>\n</tr>\n<tr>\n  <td><strong>चौरपंचाशिका</strong></td>\n  <td>बिल्हण</td>\n  <td>काव्य रचना</td>\n</tr>\n<tr>\n  <td><strong>मिताक्षरा</strong></td>\n  <td>विज्ञानेश्वर</td>\n  <td>याज्ञवल्क्य स्मृति पर प्रसिद्ध टीका</td>\n</tr>\n<tr>\n  <td><strong>मानसोल्लास</strong> (अभिलषितार्थ चिंतामणि)</td>\n  <td>सोमेश्वर तृतीय</td>\n  <td>शिल्पशास्त्र और सोने के खनन की जानकारी</td>\n</tr>\n<tr>\n  <td><strong>विक्रमांकभ्युदय</strong></td>\n  <td>सोमेश्वर तृतीय</td>\n  <td>विक्रमादित्य षष्ठ के जीवन पर आधारित</td>\n</tr>\n</tbody>\n</table>\n<h2>4. महत्वपूर्ण तिथियाँ एवं घटनाएँ</h2>\n<ul>\n<li><strong>973 ई.:</strong> तैलप द्वितीय द्वारा राष्ट्रकूट सत्ता का अंत और कल्याणी चालुक्य वंश की स्थापना।</li>\n<li><strong>1011 ई.:</strong> विमलादित्य का वेंगी का शासक बनना।</li>\n<li><strong>1054 ई.:</strong> कोप्पम का युद्ध।</li>\n<li><strong>1062 ई.:</strong> कुडल संगम का युद्ध।</li>\n<li><strong>1068 ई.:</strong> सोमेश्वर प्रथम की तुंगभद्रा नदी में जल समाधि।</li>\n<li><strong>1076 ई.:</strong> विक्रमादित्य षष्ठ का राज्यारोहण और 'चालुक्य-विक्रम संवत' का प्रारंभ।</li>\n<li><strong>1083 ई.:</strong> विक्रमादित्य षष्ठ द्वारा श्रीलंका (विजयबाहु) को दूत मंडल भेजना।</li>\n</ul>\n<hr />\n"}, {"id": "1-6", "title": "राष्ट्रकूट राजवंश", "file": "history-medieval.md", "html": "<h1>राष्ट्रकूट राजवंश</h1>\n<h3>1. उत्पत्ति और ऐतिहासिक स्रोत</h3>\n<p>राष्ट्रकूटों के इतिहास को समझने के लिए अभिलेखीय साक्ष्य अत्यंत महत्वपूर्ण हैं।</p>\n<ul>\n<li><strong>मूल निवास:</strong> राष्ट्रकूटों के अभिलेखों के अनुसार, उनका मूल निवास स्थान <strong>लात्तूर</strong> (Lattalur) माना गया है।</li>\n<li><strong>अशोक के अभिलेख:</strong> अशोक के शिलालेखों में <strong>'रट्टिकाओं'</strong> (Rattikas) का उल्लेख मिलता है, जिन्हें राष्ट्रकूटों का पूर्वज माना जाता है।</li>\n<li><strong>प्रमुख अभिलेखीय स्रोत:</strong><ul>\n<li>अमोघवर्ष का <strong>संजन ताम्रपत्र लेख</strong>।</li>\n<li>गोविंद चतुर्थ के <strong>कैम्बे</strong> एवं <strong>सांगली</strong> लेख।</li>\n</ul>\n</li>\n</ul>\n<h3>2. राजवंश की स्थापना और प्रारंभिक इतिहास</h3>\n<p>राष्ट्रकूट प्रारंभ में वातापी के चालुक्यों के सामंत थे।</p>\n<ul>\n<li><strong>स्वतंत्रता की स्थापना:</strong> <strong>दन्तिदुर्ग</strong> ने 753 ईस्वी में अंतिम चालुक्य शासक <strong>कीर्तिवर्मन द्वितीय</strong> को पराजित कर 'मान्यखेत' (मालखेत) में स्वतंत्र राष्ट्रकूट राज्य की स्थापना की।</li>\n<li><strong>प्रारंभिक राजधानी:</strong> इस वंश की प्रारंभिक राजधानी <strong>मयूरखण्डी</strong> थी।</li>\n<li><strong>दन्तिदुर्ग की उपलब्धियाँ:</strong><ul>\n<li>अरबों के विरुद्ध चालुक्य नरेश की सहायता करने के कारण चालुक्य शासक विक्रमादित्य द्वितीय ने उसे <strong>'पृथ्वीवल्लभ'</strong> की उपाधि प्रदान की थी।</li>\n<li>उसने एलोरा में <strong>दशावतार मंदिर</strong> (गुफा संख्या 15) का निर्माण करवाया।</li>\n</ul>\n</li>\n</ul>\n<h3>3. प्रमुख शासक और उनके योगदान</h3>\n<h4>कृष्ण प्रथम (756 ईस्वी से)</h4>\n<ul>\n<li>यह दन्तिदुर्ग का चाचा था।</li>\n<li><strong>वास्तुकला:</strong> उसने एलोरा में प्रसिद्ध <strong>कैलाश मंदिर</strong> (गुफा संख्या 16) का निर्माण करवाया। यह एक शैलकृत (monolithic) स्थापत्य का अद्भुत उदाहरण है जिसे एक ही पहाड़ी के पत्थर को काटकर बनाया गया है।</li>\n<li><strong>वास्तुकार:</strong> कैलाश मंदिर के मुख्य वास्तुकार का नाम <strong>कोंकण</strong> था।</li>\n<li><strong>उपाधियाँ:</strong> शुभतुंग, क्षितप्रजाबाहः और कृतप्रजापाल।</li>\n</ul>\n<h4>ध्रुव प्रथम (780 - 793 ईस्वी)</h4>\n<ul>\n<li>वह प्रथम राष्ट्रकूट शासक था जिसने उत्तर भारत के <strong>त्रिकोणीय संघर्ष</strong> (प्रतिहार, पाल और राष्ट्रकूट) में भाग लिया।</li>\n<li><strong>राजचिह्न:</strong> अपनी विजयों के प्रतीक स्वरूप उसने अपने राजचिह्न पर <strong>गंगा और यमुना</strong> की आकृतियों को अंकित करवाया।</li>\n<li><strong>उपाधि:</strong> उसे <strong>'धारावर्ष'</strong> के नाम से भी जाना जाता है।</li>\n</ul>\n<h4>गोविंद तृतीय (793 - 814 ईस्वी)</h4>\n<ul>\n<li>वह राष्ट्रकूट वंश का सबसे प्रतापी शासक सिद्ध हुआ।</li>\n<li>उसने पाल शासक <strong>धर्मपाल</strong> और प्रतिहार शासक <strong>नागभट्ट द्वितीय</strong> को पराजित किया और मालवा पर विजय प्राप्त की।</li>\n<li>उसने श्रीलंका के राजा और उसके मंत्री को बंदी बनाया और वहां के इष्टदेव की दो प्रतिमाओं को लाकर मान्यखेत के शिव मंदिर के सामने विजय स्तंभों के रूप में स्थापित किया।</li>\n</ul>\n<h4>अमोघवर्ष प्रथम (814 - 878 ईस्वी)</h4>\n<ul>\n<li><strong>जन्म:</strong> इनका जन्म एक सैनिक छावनी में हुआ था।</li>\n<li><strong>धर्म और शिक्षा:</strong> वह जैन धर्म का अनुयायी था। उसके गुरु जैन आचार्य <strong>जिनसेन</strong> थे। महावीरचार्य उसे 'स्यादवाद' का अनुयायी बताते हैं।</li>\n<li><strong>साहित्यिक योगदान:</strong> उसने कन्नड़ भाषा के प्रथम काव्य <strong>'कविराजमार्ग'</strong> की रचना की, जो दण्डिन के 'काव्यादर्श' पर आधारित है।</li>\n<li><strong>प्रजा कल्याण:</strong> संजन लेख के अनुसार, प्रजा को महामारी से बचाने के लिए उसने अपने बाएं हाथ की अंगुली काटकर लक्ष्मी देवी को भेंट कर दी थी।</li>\n<li><strong>राजधानी परिवर्तन:</strong> अमोघवर्ष ने अपनी राजधानी मयूरखण्डी से <strong>मान्यखेत</strong> स्थानांतरित की।</li>\n<li><strong>विदेशी विवरण:</strong> अरब यात्री <strong>सुलेमान</strong> ने अमोघवर्ष के राज्य को <strong>'बल्हारा'</strong> कहा और इसे संसार के चार बड़े राजवंशों में से एक बताया।</li>\n<li><strong>पारिवारिक प्रशासन:</strong> उसकी पुत्री <strong>चन्द्रोबलब्बे</strong> (चन्द्रवल्लभी) ने रायचूर दोआब का प्रशासन संभाला था।</li>\n<li><strong>उपाधियाँ:</strong> नृपतुंग और वीरनारायण। उसे संजन लेख में चंद्रगुप्त द्वितीय (साहसांक) से भी महान बताया गया है।</li>\n</ul>\n<h4>इंद्र तृतीय (915 - 927 ईस्वी)</h4>\n<ul>\n<li>उसने प्रतिहार शासक <strong>महिपाल</strong> को पराजित कर <strong>कन्नौज</strong> को लूटा।</li>\n<li>अरब यात्री <strong>अल-मसूरी</strong> ने इंद्र तृतीय (बल्हारा) को भारत का सर्वश्रेष्ठ राजा बताया।</li>\n</ul>\n<h4>कृष्ण तृतीय (939 - 967 ईस्वी)</h4>\n<ul>\n<li><strong>सैनिक अभियान:</strong> उसने 949 ईस्वी में <strong>तक्कोलम के युद्ध</strong> में चोल नरेश <strong>परांतक प्रथम</strong> को पराजित किया।</li>\n<li>उसकी सेनाएं रामेश्वरम तक पहुँचीं, जहाँ उसने एक विजय स्तंभ और <strong>कृष्णेश्वर</strong> एवं <strong>गण्डमार्तण्डादित्य</strong> मंदिरों का निर्माण करवाया।</li>\n<li><strong>कन्नड़ साहित्य:</strong> उसके दरबार में कन्नड़ कवि <strong>पोन्न</strong> निवास करते थे, जिन्होंने 'शांतिपुराण' की रचना की।</li>\n<li><strong>उपाधियाँ:</strong> अकालवर्ष और 'कांचियुम तंजैयुम कोण्ड' (कांची और तंजौर को जीतने वाला)।</li>\n</ul>\n<h3>4. राजवंश का पतन</h3>\n<p>कृष्ण तृतीय की मृत्यु के बाद खोट्टिग शासक बना, जिसके समय परमार राजा <strong>सीयक</strong> ने मान्यखेत में लूटपाट की। अंततः 974-975 ईस्वी में चालुक्य सामंत <strong>तैलप द्वितीय</strong> ने अंतिम राष्ट्रकूट राजा <strong>कर्क द्वितीय</strong> को पराजित कर राष्ट्रकूट सत्ता का अंत किया और <strong>कल्याणी के चालुक्य वंश</strong> की स्थापना की।</p>\n<h3>5. साहित्य और विद्वान</h3>\n<p>राष्ट्रकूट काल साहित्य की दृष्टि से अत्यंत समृद्ध था। प्रमुख रचनाएँ और उनके लेखक निम्नलिखित हैं:</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>लेखक</td>\n  <td>रचना</td>\n  <td>भाषा/विशेष विवरण</td>\n</tr>\n<tr>\n  <td><strong>अमोघवर्ष प्रथम</strong></td>\n  <td>कविराजमार्ग</td>\n  <td>कन्नड़ भाषा का प्रथम काव्य (काव्यादर्श पर आधारित)</td>\n</tr>\n<tr>\n  <td><strong>जिनसेन</strong></td>\n  <td>आदिपुराण, हरिवंश, पार्श्वभ्युदय</td>\n  <td>अमोघवर्ष के गुरु; आदिपुराण को उनके शिष्य गुणचंद्र ने पूर्ण किया</td>\n</tr>\n<tr>\n  <td><strong>महावीराचार्य</strong></td>\n  <td>गणित सार संग्रह</td>\n  <td>अमोघवर्ष की राज्यसभा के विद्वान</td>\n</tr>\n<tr>\n  <td><strong>शकटायन</strong></td>\n  <td>अमोघवृत्ति</td>\n  <td>अमोघवर्ष की राज्यसभा के विद्वान</td>\n</tr>\n<tr>\n  <td><strong>त्रिविक्रम</strong></td>\n  <td>नल चम्पू</td>\n  <td>इंद्र तृतीय के समय रचित</td>\n</tr>\n<tr>\n  <td><strong>हलायुध</strong></td>\n  <td>कवि रहस्य</td>\n  <td>कृष्ण तृतीय के शासनकाल में</td>\n</tr>\n<tr>\n  <td><strong>पम्प</strong></td>\n  <td>आदिपुराण</td>\n  <td>कन्नड़ भाषा के आदि कवि</td>\n</tr>\n<tr>\n  <td><strong>पोन्न</strong></td>\n  <td>शांतिपुराण</td>\n  <td>संस्कृत और कन्नड़ दोनों के कवि (उपाधि: उभय कवि चक्रवर्तिन)</td>\n</tr>\n</tbody>\n</table>\n<h3>6. धर्म, कला और समाज</h3>\n<ul>\n<li><strong>धार्मिक नीति:</strong> राष्ट्रकूट शासकों ने मुख्य रूप से <strong>जैन धर्म</strong> को राजकीय संरक्षण दिया (अमोघवर्ष प्रथम, कृष्ण द्वितीय, इंद्र तृतीय, इंद्र चतुर्थ)। हालांकि, वे अन्य धर्मों के प्रति भी उदार थे। उन्होंने अरब व्यापारियों को बसने, इस्लाम के प्रचार और मस्जिद बनाने की स्वतंत्रता दी थी।</li>\n<li><strong>शिक्षा:</strong> <strong>सतलोगी (Salotgi)</strong> का 'त्रयी पुरुष मंदिर' उच्च शिक्षा का एक प्रमुख केंद्र था। <strong>कन्हेरी बौद्ध विहार</strong> को भी राष्ट्रकूट काल में एक प्रसिद्ध विश्वविद्यालय के रूप में ख्याति मिली।</li>\n<li><strong>वास्तुकला:</strong><ul>\n<li>एलोरा का <strong>कैलाश मंदिर</strong> (शिव मंदिर)।</li>\n<li>एलिफेंटा की <strong>त्रिमूर्ति</strong> (शिव मूर्ति)।</li>\n</ul>\n</li>\n<li><strong>सामाजिक स्थिति:</strong> अरब लेखक <strong>अबू ज़ैद</strong> के अनुसार, राष्ट्रकूट राजवंश की महिलाएँ चेहरे पर पर्दा नहीं करती थीं।</li>\n<li><strong>प्रशासन:</strong> ग्रामीण प्रशासन में <strong>'महाजन'</strong> या <strong>'महत्तर'</strong> (गाँव के बुजुर्ग) गाँव के मुखिया की सहायता करते थे।</li>\n</ul>\n<h3>7. ऐतिहासिक महत्व</h3>\n<p>राष्ट्रकूट दक्षिण भारत की पहली ऐसी शक्ति थे जिन्होंने उत्तर भारत की राजनीति में सक्रिय हस्तक्षेप किया। उनका साम्राज्य न केवल सैन्य दृष्टि से शक्तिशाली था, बल्कि सांस्कृतिक और कलात्मक दृष्टि से भी भारतीय इतिहास का एक स्वर्णिम अध्याय है।</p>\n<hr />\n"}, {"id": "1-7", "title": "पल्लव राजवंश", "file": "history-medieval.md", "html": "<h1>पल्लव राजवंश</h1>\n<h2>1. उत्पत्ति और वंशावली (Origin and Lineage)</h2>\n<p>पल्लव शासकों की उत्पत्ति और उनके प्रारंभिक इतिहास के संदर्भ में निम्नलिखित तथ्य महत्वपूर्ण हैं:</p>\n<ul>\n<li><strong>दैवीय और पौराणिक उत्पत्ति:</strong> पल्लव शासक अपनी उत्पत्ति ब्रह्मा से मानते हैं और स्वयं को अश्वत्थामा का वंशज बताते हैं।</li>\n<li><strong>संस्थापक:</strong> पल्लव वंश की स्थापना <strong>सिंहविष्णु</strong> नामक व्यक्ति ने की थी। उन्होंने <strong>'अवनिसिंह'</strong> की उपाधि धारण की थी।</li>\n<li><strong>राजकीय प्रतीक:</strong> पल्लव राजवंश का राजकीय प्रतीक चिह्न <strong>'सिंह'</strong> (Lion) था।</li>\n<li><strong>साहित्यिक संदर्भ:</strong> संगम साहित्य में पल्लवों को <strong>'तोंडई'</strong> और <strong>'तोंडियर'</strong> के नाम से संबोधित किया गया है।</li>\n<li><strong>प्रारंभिक शासक:</strong> राजवंश के चौथे शासक <strong>विष्णुगोप</strong> थे, जो प्रथम पल्लव शासक के रूप में भी उल्लेखित हैं। इनका विवरण समुद्रगुप्त की <strong>प्रयाग प्रशस्ति</strong> में प्राप्त होता है।</li>\n<li><strong>अभिलेखीय भाषा:</strong> पल्लवों के प्रारंभिक अभिलेख <strong>प्राकृत</strong> भाषा में हैं, जबकि उनके अधिकांश बाद के अभिलेख <strong>संस्कृत</strong> भाषा में मिलते हैं। पल्लव शासकों ने संस्कृत भाषा को राजकीय संरक्षण प्रदान किया था।</li>\n</ul>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>शासक/संबंधित व्यक्ति</td>\n  <td>महत्वपूर्ण तथ्य/उपाधि</td>\n  <td>साहित्यिक योगदान/संदर्भ</td>\n</tr>\n<tr>\n  <td><strong>सिंहविष्णु</strong></td>\n  <td>संस्थापक, 'अवनिसिंह'</td>\n  <td>इनके दरबार में महाकवि भारवि रहते थे।</td>\n</tr>\n<tr>\n  <td><strong>भारवि</strong></td>\n  <td>महाकवि</td>\n  <td>'किरातार्जुनीयम्' (संस्कृत) की रचना की।</td>\n</tr>\n<tr>\n  <td><strong>विष्णुगोप</strong></td>\n  <td>समुद्रगुप्त के समकालीन</td>\n  <td>प्रयाग प्रशस्ति में उल्लेख।</td>\n</tr>\n</tbody>\n</table>\n<h2>2. प्रशासनिक व्यवस्था (Administrative Setup)</h2>\n<p>पल्लव प्रशासन सुव्यवस्थित था और इसमें विभिन्न प्रकार के प्रशासनिक पदों और करों का विवरण मिलता है:</p>\n<ul>\n<li><strong>मंडपिका:</strong> यह शब्द 'चुंगीघर' (Customs House) के लिए प्रयुक्त होता था। ये स्थान स्थानीय व्यापार और विनिमय के केंद्र भी थे।</li>\n<li><strong>मंडवस:</strong> चुंगी अधिकारी को 'मंडवस' कहा जाता था।</li>\n<li><strong>रथिक:</strong> जिला स्तर के अधिकारी को 'रथिक' के नाम से जाना जाता था।</li>\n<li><strong>नौसेना केंद्र:</strong> पल्लवों की नौसेना शक्ति के दो प्रमुख केंद्र <strong>महाबलीपुरम</strong> एवं <strong>नागापट्टिनम</strong> थे।</li>\n<li><strong>राजस्व:</strong> पल्लव अभिलेखों में कुल <strong>18 प्रकार के करों</strong> (Taxes) का उल्लेख मिलता है।</li>\n</ul>\n<h2>3. महेंद्रवर्मन प्रथम (600-630 ई.)</h2>\n<p>महेंद्रवर्मन प्रथम पल्लव वंश के सबसे बहुमुखी प्रतिभा संपन्न शासकों में से एक थे।</p>\n<ul>\n<li><strong>साहित्यिक योगदान:</strong> उन्होंने <strong>'मत्तविलास प्रहसन'</strong> नामक एक हास्य ग्रंथ की रचना की, जिसमें कापालिकों और बौद्ध भिक्षुओं पर व्यंग्य किया गया है। इसके अतिरिक्त उन्होंने <strong>'भगवदज्जुकिय'</strong> नामक प्रहसन की भी रचना की।</li>\n<li><strong>संगीत:</strong> प्रसिद्ध संगीतज्ञ <strong>रुद्राचार्य</strong> उनके संगीत गुरु थे। महेंद्रवर्मन ने <strong>'कुडुमिमालै'</strong> नामक संगीत ग्रंथ की रचना की।</li>\n<li><strong>धार्मिक परिवर्तन:</strong> प्रारंभ में वे जैन धर्मावलंबी थे, किंतु शैव संत <strong>अप्पर</strong> के प्रभाव में आकर उन्होंने शैव धर्म अपना लिया। शैव संत <strong>तिरुज्ञानसंबंधर</strong> उनके समकालीन थे।</li>\n<li><strong>सैन्य संघर्ष:</strong> वे वातापी के चालुक्य राजा <strong>पुलकेशिन द्वितीय</strong> से पराजित हुए थे।</li>\n</ul>\n<p><strong>महेंद्रवर्मन प्रथम की उपाधियाँ:</strong></p>\n<ul>\n<li>मत्तविलास</li>\n<li>विचित्रचित्त</li>\n<li>गुणभर</li>\n<li>चेत्यकारि</li>\n</ul>\n<h2>4. नरसिंहवर्मन प्रथम 'महामल्ल' (630-668 ई.)</h2>\n<p>नरसिंहवर्मन प्रथम पल्लव वंश के सबसे शक्तिशाली शासक थे।</p>\n<ul>\n<li><strong>सैन्य विजय:</strong> 642 ई. में उन्होंने चालुक्य शासक पुलकेशिन द्वितीय को युद्ध में पराजित कर उसका वध कर दिया और बादामी (वातापी) पर अधिकार कर लिया। इस विजय के उपलक्ष्य में उन्होंने <strong>'वातापीकोंड'</strong> की उपाधि धारण की।<ul>\n<li>इस विजय का विवरण बादामी में मल्लिकार्जुन मंदिर के पीछे एक पाषाण पर उत्कीर्ण है।</li>\n</ul>\n</li>\n<li><strong>विदेशी सहायता:</strong> <strong>कसकुडी ताम्रपत्र</strong> के अनुसार, उन्होंने श्रीलंका के राजा <strong>मानवर्मन</strong> को राजुगद्दी प्राप्त करने में सहायता हेतु अपनी सेना भेजी थी।</li>\n<li><strong>स्थापत्य कला:</strong> उन्होंने महाबलीपुरम में <strong>एकाश्म रथ मंदिरों</strong> का निर्माण करवाया। उन्होंने <strong>'मामल्लपुर'</strong> नगर की स्थापना की और <strong>'महामल्ल'</strong> की उपाधि धारण की।</li>\n<li><strong>विदेशी यात्री:</strong> चीनी यात्री <strong>ह्वेनसांग</strong> ने 641 ई. में उनके शासनकाल के दौरान कांची की यात्रा की थी।</li>\n<li><strong>सांस्कृतिक विभूतियाँ:</strong> शैव आचार्य <strong>सुंदरमूर्ति</strong> पल्लव काल में थे। न्याय भाष्य के लेखक <strong>वात्स्यायन</strong> भी पल्लवों की राजधानी कांची के विद्वान थे।</li>\n<li><strong>कांची विश्वविद्यालय:</strong> कांची शिक्षा का एक महान केंद्र था। कदम्ब वंशीय राजकुमार <strong>मयूरशर्मन</strong> यहाँ शिक्षा ग्रहण करने आए थे, किंतु यहाँ अपमानित होने के पश्चात उन्होंने वनवासी में कदम्ब राजवंश की स्थापना की। मयूरशर्मन ने 18 अश्वमेध यज्ञ किए थे।</li>\n</ul>\n<h2>5. मध्यवर्ती शासक</h2>\n<ul>\n<li><strong>महेंद्रवर्मन द्वितीय (668-670 ई.)</strong></li>\n<li><strong>परमेश्वरवर्मन प्रथम (670-700 ई.):</strong> इन्होंने <strong>'विद्याविनीत'</strong> की उपाधि धारण की। इन्हें चालुक्य शासक <strong>विक्रमादित्य प्रथम</strong> ने पराजित किया था।</li>\n</ul>\n<h2>6. नरसिंहवर्मन द्वितीय 'राजसिंह' (700-728 ई.)</h2>\n<p>इनका शासनकाल शांति और सांस्कृतिक उन्नति का काल था।</p>\n<ul>\n<li><strong>स्थापत्य:</strong> उन्होंने कांची के <strong>कैलाशनाथ मंदिर</strong> और महाबलीपुरम के <strong>शोर मंदिर</strong> (तटीय मंदिर) का निर्माण करवाया। उन्होंने मंदिर निर्माण की <strong>'राजसिंह शैली'</strong> का विकास किया।</li>\n<li><strong>साहित्यिक संरक्षण:</strong> उनके दरबार में प्रसिद्ध विद्वान <strong>दण्डिन</strong> रहते थे। दण्डिन को वाल्मीकि और व्यास की कोटि का तीसरा महान कवि माना जाता है।<ul>\n<li><strong>दण्डिन की रचनाएँ:</strong> दशकुमारचरित, अवंतिसुंदरी कथा और काव्यादर्श।</li>\n<li><strong>दशकुमारचरित का विषय:</strong> इसमें पाटलिपुत्र के राजा राजहंस और उनके मंत्रियों के दस पुत्रों के साहसिक जीवन की घटनाओं का वर्णन है।</li>\n</ul>\n</li>\n<li><strong>शिक्षा:</strong> उन्होंने कांची में <strong>'घटिका'</strong> (संस्कृत महाविद्यालय) की स्थापना की। उन्हें 'घटिकाओं का पुनस्र्थापक' कहा जाता है।</li>\n<li><strong>विदेशी संबंध:</strong> उन्होंने चीन में अपना एक दूत मंडल भेजा और चीनी बौद्ध यात्रियों के लिए नागापट्टिनम में एक विहार निर्मित करवाया।</li>\n</ul>\n<p><strong>नरसिंहवर्मन द्वितीय की उपाधियाँ:</strong></p>\n<ul>\n<li>राजसिंह</li>\n<li>शंकरभक्त</li>\n<li>आगमप्रिय</li>\n</ul>\n<h2>7. परवर्ती पल्लव शासक</h2>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th></th>\n  <th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>शासक</td>\n  <td>कार्यकाल</td>\n  <td>प्रमुख उपलब्धियाँ और तथ्य</td>\n</tr>\n<tr>\n  <td><strong>परमेश्वरवर्मन द्वितीय</strong></td>\n  <td>728-731 ई.</td>\n  <td>मनु और बृहस्पति के सिद्धांतों का पालन करने वाला तथा 'कलि' को दंडित करने वाला कहा गया है।</td>\n</tr>\n<tr>\n  <td><strong>नंदिवर्मन द्वितीय (पल्लवमल्ल)</strong></td>\n  <td>731-800 ई.</td>\n  <td>समांतर शाखा का राजकुमार। कांची में <strong>मुक्तेश्वर</strong> और <strong>वैकुंठ पेरुमल</strong> मंदिरों का निर्माण। वैष्णव मत का अनुयायी।</td>\n</tr>\n<tr>\n  <td><strong>दंतिवर्मन</strong></td>\n  <td>800-846 ई.</td>\n  <td><strong>वेलूरपालयम अभिलेख</strong> में इन्हें विष्णु का अवतार कहा गया है।</td>\n</tr>\n<tr>\n  <td><strong>नंदिवर्मन तृतीय</strong></td>\n  <td>846-869 ई.</td>\n  <td>शैव अनुयायी। <strong>'तेल्लारर्रिंद'</strong> की उपाधि। राष्ट्रकूट शासक अमोघवर्ष की पुत्री शंखा से विवाह किया।</td>\n</tr>\n<tr>\n  <td><strong>नृपतुंग वर्मन</strong></td>\n  <td>869-880 ई.</td>\n  <td>नंदिवर्मन तृतीय के उत्तराधिकारी।</td>\n</tr>\n<tr>\n  <td><strong>अपराजित</strong></td>\n  <td>881-903 ई.</td>\n  <td>पल्लव वंश का <strong>अंतिम महत्वपूर्ण शासक</strong>।</td>\n</tr>\n</tbody>\n</table>\n<h3>नंदिवर्मन द्वितीय और तृतीय से संबंधित विशेष तथ्य:</h3>\n<ul>\n<li>नंदिवर्मन द्वितीय ने राष्ट्रकूट शासक दंतिदुर्ग की पुत्री <strong>रेवा</strong> से विवाह किया था। प्रसिद्ध आलवार संत <strong>तिरुमंगई आलवार</strong> उनके समकालीन थे, जिनके गीत वैकुंठ पेरुमल मंदिर की दीवारों पर अंकित हैं। कसकुडी ताम्रपत्र का प्रकाशन इन्हीं के समय हुआ।</li>\n<li>नंदिवर्मन तृतीय के दरबार में तमिल के प्रसिद्ध विद्वान <strong>पेरुंदेवनार</strong> (भारतवेणवा के रचयिता) रहते थे। उन्होंने राजा की प्रशंसा में <strong>'नंदिक्कलम्बकम'</strong> नामक काव्य की रचना की।</li>\n</ul>\n<h2>8. सामाजिक, धार्मिक और शैक्षिक विवरण</h2>\n<ul>\n<li><strong>बौद्ध धर्म:</strong> चौथी शताब्दी में प्रसिद्ध बौद्ध विद्वान <strong>दिग्नाग</strong> शिक्षा ग्रहण करने कांची आए थे।</li>\n<li><strong>धार्मिक स्थिति:</strong> पल्लव शासक मुख्य रूप से <strong>ब्राह्मण धर्म</strong> के अनुयायी थे।</li>\n<li><strong>भक्ति आंदोलन:</strong> पल्लव काल में ही दक्षिण भारत में भक्ति आंदोलन का उदय हुआ। यह आंदोलन <strong>नयनार</strong> (शैव संत) और <strong>आलवार</strong> (वैष्णव संत) संतों द्वारा प्रारंभ किया गया था।</li>\n<li><strong>शिक्षा:</strong> कांची संस्कृत शिक्षा और हिंदू संस्कृति का एक प्रमुख केंद्र बना रहा, जहाँ 'घटिका' जैसी संस्थाएँ सक्रिय थीं।</li>\n</ul>\n<hr />\n"}, {"id": "1-8", "title": "चोल राजवंश", "file": "history-medieval.md", "html": "<h1>चोल राजवंश</h1>\n<h2>1. संस्थापक और प्रारंभिक विकास</h2>\n<h3>विजयालय (850-871 ईस्वी)</h3>\n<p>विजयालय को चोल साम्राज्य के पुनरुत्थान का श्रेय दिया जाता है। वह प्रारंभ में पल्लवों का एक सामंत था, जिसने पल्लवों की अधीनता में ही अपनी शक्ति का विस्तार किया।</p>\n<ul>\n<li><strong>प्रमुख विजय:</strong> उसने पाण्ड्यों को पराजित कर <strong>तंजौर</strong> पर अधिकार किया। इस विजय का उल्लेख <strong>तिरुकोयिलूर लेख</strong> में मिलता है।</li>\n<li><strong>राजधानी:</strong> उसने तंजौर को अपनी राजधानी बनाया।</li>\n<li><strong>धार्मिक निर्माण:</strong> तंजौर में <strong>दुर्गादेवी (निशुंभसूदिनी देवी)</strong> मंदिर का निर्माण करवाया।</li>\n<li><strong>उपाधियाँ:</strong> 'नरकेसरी' एवं 'तंजैकोंड'।</li>\n</ul>\n<h3>आदित्य प्रथम (871-907 ईस्वी)</h3>\n<p>आदित्य प्रथम ने चोलों को पल्लवों की अधीनता से मुक्त कर पूर्ण स्वतंत्रता दिलाई।</p>\n<ul>\n<li><strong>सैन्य उपलब्धियाँ:</strong> उसने अंतिम पल्लव शासक <strong>अपराजित</strong> की हत्या कर दी और <strong>तोंडमंडलम</strong> पर अधिकार कर लिया।</li>\n<li><strong>उपाधियाँ:</strong> 'तोंडेनाडू', 'नरकेसरी' एवं 'कोदंडराम'।</li>\n</ul>\n<h2>2. साम्राज्य विस्तार और चुनौतियाँ</h2>\n<h3>परान्तक प्रथम (907-955 ईस्वी)</h3>\n<p>परान्तक प्रथम के शासनकाल में चोल शक्ति का विस्तार हुआ, लेकिन उसे भारी चुनौतियों का सामना भी करना पड़ा।</p>\n<ul>\n<li><strong>वेल्लूर का युद्ध (915 ई.):</strong> इसमें परान्तक प्रथम ने पाण्ड्य शासक <strong>राजसिंह द्वितीय</strong> और श्रीलंका के शासक <strong>कस्सप पंचम</strong> की संयुक्त सेना को पराजित किया।</li>\n<li><strong>तक्कोलम का युद्ध (949 ई.):</strong> राष्ट्रकूट नरेश <strong>कृष्ण तृतीय</strong> ने पश्चिमी गंगों की सहायता से परान्तक प्रथम को पराजित किया और तोंडमंडलम पर अधिकार कर लिया।</li>\n<
